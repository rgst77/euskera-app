<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Euskara Lantegia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECE6; --panel:#F6F7F3; --ink:#1A211F; --muted:#5B6661; --line:#C9CFC6;
  --nor:#2E5E8C; --nork:#9A2F2F; --nori:#A86A12; --ok:#2C7349; --bad:#A23B2A; --focus:#2E5E8C;
  --nor-bg:#DCE6F0; --nork-bg:#F1DCDA; --nori-bg:#F3E6CF; --ok-bg:#D9EBDF; --bad-bg:#F3DCD6;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141917; --panel:#1C2220; --ink:#E6EAE5; --muted:#9AA59F; --line:#33403B;
    --nor:#8DB6E0; --nork:#E39A93; --nori:#E2B566; --ok:#79C597; --bad:#EE907E; --focus:#8DB6E0;
    --nor-bg:#1E2C3A; --nork-bg:#3A2322; --nori-bg:#3A2E1B; --ok-bg:#1D3326; --bad-bg:#3B241F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1C2220; --ink:#E6EAE5; --muted:#9AA59F; --line:#33403B;
  --nor:#8DB6E0; --nork:#E39A93; --nori:#E2B566; --ok:#79C597; --bad:#EE907E; --focus:#8DB6E0;
  --nor-bg:#1E2C3A; --nork-bg:#3A2322; --nori-bg:#3A2E1B; --ok-bg:#1D3326; --bad-bg:#3B241F;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif}
h1,h2,h3{font-family:"Young Serif",Georgia,serif;font-weight:400;line-height:1.2;margin:0}
h1{font-size:2.1rem} h2{font-size:1.5rem} h3{font-size:1.15rem}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.app>nav{border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:"Young Serif",Georgia,serif;font-size:1.35rem;margin:0 10px 22px;line-height:1.15}
.brand small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-size:.8rem;color:var(--muted);margin-top:4px}
.navbtn{background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column}
.navbtn span{font-size:.8rem;color:var(--muted)}
.navbtn:hover{background:var(--panel)}
.navbtn[aria-current="true"]{background:var(--panel);box-shadow:inset 3px 0 0 var(--ink)}
.navbtn:disabled{cursor:default;opacity:.55}
.navbtn:disabled:hover{background:none}
.navsep{margin:18px 12px 6px;font-size:.8rem;color:var(--muted)}
.sync{margin-top:auto;font-size:.8rem;color:var(--muted);padding:12px}
main{padding:40px clamp(20px,5vw,64px);max-width:980px;width:100%}
.lede{color:var(--muted);max-width:62ch;margin:.5rem 0 1.8rem}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.stat{font-size:2rem;font-family:"Young Serif",Georgia,serif;line-height:1}
.muted{color:var(--muted)}
.small{font-size:.88rem}
/* chips de rol: el color codifica la función gramatical en toda la app */
.chip{display:inline-flex;align-items:baseline;gap:6px;border-radius:6px;padding:3px 9px;font-size:.95rem}
.chip b{font-size:.75rem;letter-spacing:.02em}
.chip.nor{background:var(--nor-bg);color:var(--nor)}
.chip.nork{background:var(--nork-bg);color:var(--nork)}
.chip.nori{background:var(--nori-bg);color:var(--nori)}
.chip.case{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0}
/* práctica */
.drill{margin-top:8px}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:26px}
.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.prompt-roles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.prompt-big{font-family:"Young Serif",Georgia,serif;font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.15;margin:4px 0 8px}
.prompt-hint{color:var(--muted);margin-bottom:22px;max-width:60ch}
.answer{display:flex;gap:10px;flex-wrap:wrap}
.answer input{flex:1;min-width:220px;font-size:1.6rem;padding:12px 16px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-family:"Young Serif",Georgia,serif}
.answer input.ok{border-color:var(--ok);background:var(--ok-bg)}
.answer input.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:18px;padding:14px 16px;border-radius:10px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb .form{font-family:"Young Serif",Georgia,serif;font-size:1.6rem;color:var(--ink)}
.fb .why{color:var(--ink);margin-top:6px;font-size:.95rem}
.kbd{font-size:.8rem;color:var(--muted);margin-top:14px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px;margin:12px 0 20px}
.gopt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel)}
.gopt input{margin-top:5px}
.lvl{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--muted)}
.gopt .bar{height:3px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.gopt .bar i{display:block;height:100%;background:var(--ok)}
/* tablas */
.tablewrap{overflow-x:auto;margin:14px 0 26px}
table{border-collapse:collapse;min-width:100%}
th,td{border:1px solid var(--line);padding:8px 12px;text-align:left;white-space:nowrap}
th{font-weight:700;font-size:.9rem}
th.nor{color:var(--nor);background:var(--nor-bg)} th.nork{color:var(--nork);background:var(--nork-bg)} th.nori{color:var(--nori);background:var(--nori-bg)}
td.f{font-family:"Young Serif",Georgia,serif;font-size:1.1rem}
td.empty{background:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--line) 5px,var(--line) 6px);opacity:.5}
td.hid{cursor:pointer;color:transparent;background:var(--bg)}
td.hid::after{content:"ver";color:var(--muted);font-family:"Atkinson Hyperlegible",sans-serif;font-size:.8rem}
.done-big{font-family:"Young Serif",Georgia,serif;font-size:3rem;line-height:1}
.mistakes li{margin:4px 0}
.mistakes .f{font-family:"Young Serif",Georgia,serif}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px}
.choice{text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-size:1.05rem}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.bad{border-color:var(--bad);background:var(--bad-bg)}
.choice:disabled{cursor:default}
.choice kbd{font-family:inherit;color:var(--muted);font-size:.8rem;margin-right:8px}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:2px 24px;margin:14px 0 24px}
.wrow{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.wrow .eu{font-family:"Young Serif",Georgia,serif;font-size:1.08rem}
.wrow .es{color:var(--muted);flex:1;text-align:right;font-size:.92rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;align-self:center}
.dot.l1{background:var(--nori)} .dot.l2{background:var(--nor)} .dot.l3{background:var(--ok)}
.search{padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);min-width:260px}
.r{border-radius:4px;padding:0 4px}
.r.nor{background:var(--nor-bg);color:var(--nor)} .r.nork{background:var(--nork-bg);color:var(--nork)} .r.nori{background:var(--nori-bg);color:var(--nori)}
.lvlhead{display:flex;align-items:baseline;gap:14px;margin:34px 0 10px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.lcard{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:86px}
.lcard:hover:not(:disabled){border-color:var(--ink)}
.lcard:disabled{cursor:default;background:transparent;border-style:dashed}
.lcard .num{font-size:.8rem;color:var(--muted)}
.lcard .t{font-family:"Young Serif",Georgia,serif;font-size:1.08rem}
.lcard .s{font-size:.85rem;color:var(--muted)}
.lcard.done{box-shadow:inset 0 -3px 0 var(--ok)}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:18px 0 26px;border-bottom:1px solid var(--line)}
.steps button{background:none;border:0;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.steps button[aria-current="true"]{border-bottom-color:var(--ink);font-weight:700}
.steps button .ck{color:var(--ok);margin-left:4px}
.lx h3{margin:26px 0 8px}
.lx p{max-width:68ch}
.exrow{display:flex;gap:16px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.exrow .eu{font-family:"Young Serif",Georgia,serif;font-size:1.12rem;flex:1}
.exrow .es{color:var(--muted);flex:1}
.dline{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.dline .who{font-weight:700}
.dline .eu{font-family:"Young Serif",Georgia,serif;font-size:1.15rem}
.dline .es{color:var(--muted);font-size:.92rem;display:none}
.showes .dline .es{display:block}
.gapq{font-family:"Young Serif",Georgia,serif;font-size:1.6rem;line-height:1.6}
.gapq input{font:inherit;width:7.5em;padding:2px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg)}
.gapq input.ok{border-color:var(--ok);background:var(--ok-bg)} .gapq input.bad{border-color:var(--bad);background:var(--bad-bg)}
.tiles{display:flex;gap:8px;flex-wrap:wrap;min-height:52px;margin:10px 0}
.tile{padding:8px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-family:"Young Serif",Georgia,serif;font-size:1.15rem}
.tile:disabled{opacity:.25;cursor:default}
.built{min-height:58px;border-bottom:2px solid var(--ink);display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:6px 0;font-family:"Young Serif",Georgia,serif;font-size:1.4rem}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px}
.mcols .choice.sel{border-color:var(--ink)}
textarea{width:100%;min-height:140px;padding:14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font:1.15rem/1.5 "Young Serif",Georgia,serif;color:var(--ink)}
.ai{font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.corr{font-family:"Young Serif",Georgia,serif;font-size:1.2rem;background:var(--ok-bg);padding:14px;border-radius:10px;margin:10px 0}
.card-new{border:2px solid var(--ink);border-radius:14px;padding:22px;background:var(--panel)}
.card-new .tag{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.card-new .form{font-family:"Young Serif",Georgia,serif;font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin:6px 0 10px}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer;font:inherit}
.today{display:grid;gap:10px;margin-top:12px}
.tstep{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.tstep .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:.85rem}
.tstep.done .n{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.tstep.done{opacity:.75}
.qa{margin-top:30px;border-top:1px solid var(--line);padding-top:8px}
.qa textarea{min-height:70px;font-family:"Atkinson Hyperlegible",sans-serif;font-size:1rem}
.qa .ans{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px}
select{padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel)}
.note{border-left:3px solid var(--line);padding:4px 0 4px 14px;color:var(--muted);max-width:66ch}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .app>nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;padding:12px}
  .brand,.navsep,.sync{display:none}
  .tstep{grid-template-columns:28px 1fr}
  .tstep .btn{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav aria-label="Secciones">
    <div class="brand">Euskara Lantegia<small>Tu taller de euskera</small></div>
    <button class="navbtn" data-view="home">Hasiera<span>Inicio y progreso</span></button>
    <button class="navbtn" data-view="lessons">Ikasgaiak<span>Lecciones A1–C1</span></button>
    <button class="navbtn" data-view="verbs">Aditzak<span>Verbos y auxiliares</span></button>
    <button class="navbtn" data-view="decl">Deklinabidea<span>Casos y declinación</span></button>
    <button class="navbtn" data-view="words">Hiztegia<span>Vocabulario por temas</span></button>
    <button class="navbtn" data-view="tables">Taulak<span>Tablas de consulta</span></button>
    <div class="sync" id="sync">Cargando progreso…</div>
  </nav>
  <main id="main"></main>
</div>
<script>
/* ============ DATOS: personas y glosas ============ */
const PERS=['ni','zu','hura','gu','zuek','haiek'];
const ERG={ni:'nik',zu:'zuk',hura:'hark',gu:'guk',zuek:'zuek',haiek:'haiek'};
const DAT={ni:'niri',zu:'zuri',hura:'hari',gu:'guri',zuek:'zuei',haiek:'haiei'};
const ES={ni:'yo',zu:'tú',hura:'él/ella',gu:'nosotros',zuek:'vosotros',haiek:'ellos'};
const OBJ={ni:'me',zu:'te',hura:'lo',gu:'nos',zuek:'os',haiek:'los'};
const ICL={ni:'me',zu:'te',hura:'se',gu:'nos',zuek:'os',haiek:'se'};
const IA={ni:'me',zu:'te',hura:'le',gu:'nos',zuek:'os',haiek:'les'};
const TO={hura:' (a él/ella)',haiek:' (a ellos)'};
const C=(arr)=>Object.fromEntries(PERS.map((p,i)=>[p,arr[i]]));
const SP={
  haber:C(['he','has','ha','hemos','habéis','han']), ser:C(['soy','eres','es','somos','sois','son']),
  era:C(['era','eras','era','éramos','erais','eran']), fui:C(['fui','fuiste','fue','fuimos','fuisteis','fueron']), vine:C(['vine','viniste','vino','vinimos','vinisteis','vinieron']),
  vi:C(['vi','viste','vio','vimos','visteis','vieron']), di:C(['di','diste','dio','dimos','disteis','dieron']),
  estar:C(['estoy','estás','está','estamos','estáis','están']), estaba:C(['estaba','estabas','estaba','estábamos','estabais','estaban']),
  ir:C(['voy','vas','va','vamos','vais','van']), iba:C(['iba','ibas','iba','íbamos','ibais','iban']),
  venir:C(['vengo','vienes','viene','venimos','venís','vienen']), venia:C(['venía','venías','venía','veníamos','veníais','venían']),
  andar:C(['ando','andas','anda','andamos','andáis','andan']), tener:C(['tengo','tienes','tiene','tenemos','tenéis','tienen']),
  saber:C(['sé','sabes','sabe','sabemos','sabéis','saben']), decir:C(['digo','dices','dice','decimos','decís','dicen'])
};

/* ============ DATOS: paradigmas verbales (batua) ============ */
// NOR-NORK: tabla[NOR][NORK]
const NN_PRES={
  ni:{zu:'nauzu',hura:'nau',zuek:'nauzue',haiek:'naute'},
  zu:{ni:'zaitut',hura:'zaitu',gu:'zaitugu',haiek:'zaituzte'},
  hura:{ni:'dut',zu:'duzu',hura:'du',gu:'dugu',zuek:'duzue',haiek:'dute'},
  gu:{zu:'gaituzu',hura:'gaitu',zuek:'gaituzue',haiek:'gaituzte'},
  zuek:{ni:'zaituztet',hura:'zaituzte',gu:'zaituztegu',haiek:'zaituztete'},
  haiek:{ni:'ditut',zu:'dituzu',hura:'ditu',gu:'ditugu',zuek:'dituzue',haiek:'dituzte'}
};
const NN_PAST={
  ni:{zu:'ninduzun',hura:'ninduen',zuek:'ninduzuen',haiek:'ninduten'},
  zu:{ni:'zintudan',hura:'zintuen',gu:'zintugun',haiek:'zintuzten'},
  hura:{ni:'nuen',zu:'zenuen',hura:'zuen',gu:'genuen',zuek:'zenuten',haiek:'zuten'},
  gu:{zu:'gintuzun',hura:'gintuen',zuek:'gintuzuen',haiek:'gintuzten'},
  zuek:{ni:'zintuztedan',hura:'zintuzten',gu:'zintuztegun',haiek:'zintuzteten'},
  haiek:{ni:'nituen',zu:'zenituen',hura:'zituen',gu:'genituen',zuek:'zenituzten',haiek:'zituzten'}
};
// NOR-NORI: tabla[NOR(hura|haiek)][NORI]
const NNI_PRES={hura:C(['zait','zaizu','zaio','zaigu','zaizue','zaie']),haiek:C(['zaizkit','zaizkizu','zaizkio','zaizkigu','zaizkizue','zaizkie'])};
const NNI_PAST={hura:C(['zitzaidan','zitzaizun','zitzaion','zitzaigun','zitzaizuen','zitzaien']),haiek:C(['zitzaizkidan','zitzaizkizun','zitzaizkion','zitzaizkigun','zitzaizkizuen','zitzaizkien'])};
// NOR-NORI-NORK: tabla[NORK][NORI]
const NNN_PRES={
  ni:{zu:'dizut',hura:'diot',zuek:'dizuet',haiek:'diet'},
  zu:{ni:'didazu',hura:'diozu',gu:'diguzu',haiek:'diezu'},
  hura:{ni:'dit',zu:'dizu',hura:'dio',gu:'digu',zuek:'dizue',haiek:'die'},
  gu:{zu:'dizugu',hura:'diogu',zuek:'dizuegu',haiek:'diegu'},
  zuek:{ni:'didazue',hura:'diozue',gu:'diguzue',haiek:'diezue'},
  haiek:{ni:'didate',zu:'dizute',hura:'diote',gu:'digute',zuek:'dizuete',haiek:'diete'}
};
const NNN_PRES_PL={
  ni:{zu:'dizkizut',hura:'dizkiot',zuek:'dizkizuet',haiek:'dizkiet'},
  zu:{ni:'dizkidazu',hura:'dizkiozu',gu:'dizkiguzu',haiek:'dizkiezu'},
  hura:{ni:'dizkit',zu:'dizkizu',hura:'dizkio',gu:'dizkigu',zuek:'dizkizue',haiek:'dizkie'},
  gu:{zu:'dizkizugu',hura:'dizkiogu',zuek:'dizkizuegu',haiek:'dizkiegu'},
  zuek:{ni:'dizkidazue',hura:'dizkiozue',gu:'dizkiguzue',haiek:'dizkiezue'},
  haiek:{ni:'dizkidate',zu:'dizkizute',hura:'dizkiote',gu:'dizkigute',zuek:'dizkizuete',haiek:'dizkiete'}
};
const NNN_PAST={
  ni:{zu:'nizun',hura:'nion',zuek:'nizuen',haiek:'nien'},
  zu:{ni:'zenidan',hura:'zenion',gu:'zenigun',haiek:'zenien'},
  hura:{ni:'zidan',zu:'zizun',hura:'zion',gu:'zigun',zuek:'zizuen',haiek:'zien'},
  gu:{zu:'genizun',hura:'genion',zuek:'genizuen',haiek:'genien'},
  zuek:{ni:'zenidaten',hura:'zenioten',gu:'zeniguten',haiek:'zenieten'},
  haiek:{ni:'zidaten',zu:'zizuten',hura:'zioten',gu:'ziguten',zuek:'zizueten',haiek:'zieten'}

function buildVerbItems(){
  const it=[];
  const add=(g,id,form,roles,hint)=>it.push({mod:'v',g,id:'v:'+id,form,roles,hint});
  PERS.forEach(p=>{
    add('nor-pres','izan-pres-'+p,SYN.izan.pres[p],{nor:p},`«(${ES[p]}) ${SP.ser[p]}» · etorri ___ = «${SP.haber[p]} venido»`);
    add('nor-past','izan-past-'+p,SYN.izan.past[p],{nor:p},`«(${ES[p]}) ${SP.era[p]} / ${SP.fui[p]}» · etorri ___ = «${SP.vine[p]}»`);
  });
  for(const nor of PERS) for(const nork of PERS){
    const f1=NN_PRES[nor][nork], f2=NN_PAST[nor][nork]; if(!f1) continue;
    const third=(nor==='hura'||nor==='haiek');
    add(third?'nn-pres-3':'nn-pres-x',`nn-pres-${nor}-${nork}`,f1,{nork,nor},`ikusi ___ → «(${ES[nork]}) ${OBJ[nor]} ${SP.haber[nork]} visto»`);
    add(third?'nn-past-3':'nn-past-x',`nn-past-${nor}-${nork}`,f2,{nork,nor},`ikusi ___ → «(${ES[nork]}) ${OBJ[nor]} ${SP.vi[nork]}»`);
  }
  for(const nor of ['hura','haiek']) for(const nori of PERS){
    const pl=nor==='haiek';
    add('nni-pres',`nni-pres-${nor}-${nori}`,NNI_PRES[nor][nori],{nori,nor},`gustatu ___ → «(a ${ES[nori]==='yo'?'mí':ES[nori]==='tú'?'ti':ES[nori]}) ${IA[nori]} ${pl?'han':'ha'} gustado»`);
    add('nni-past',`nni-past-${nor}-${nori}`,NNI_PAST[nor][nori],{nori,nor},`gustatu ___ → «${IA[nori]} ${pl?'gustaron':'gustó'}»`);
  }
  for(const nork of PERS) for(const nori of PERS){
    const f=NNN_PRES[nork][nori]; if(!f) continue;
    add('nnn-pres',`nnn-pres-${nork}-${nori}`,f,{nork,nori,nor:'hura'},`eman ___ → «(${ES[nork]}) ${ICL[nori]} lo ${SP.haber[nork]} dado${TO[nori]||''}»`);
    add('nnn-pres-pl',`nnn-prespl-${nork}-${nori}`,NNN_PRES_PL[nork][nori],{nork,nori,nor:'haiek'},`eman ___ → «(${ES[nork]}) ${ICL[nori]} los ${SP.haber[nork]} dado${TO[nori]||''}»`);
    add('nnn-past',`nnn-past-${nork}-${nori}`,NNN_PAST[nork][nori],{nork,nori,nor:'hura'},`eman ___ → «(${ES[nork]}) ${ICL[nori]} lo ${SP.di[nork]}${TO[nori]||''}»`);
  }
  for(const [v,d] of Object.entries(SYN)){ if(v==='izan') continue;
    const g=['egon','joan','etorri','ibili'].includes(v)?'syn-pres-1':'syn-pres-2';
    PERS.forEach(p=>{
      const roles=d.erg?{nork:p,verb:v}:{nor:p,verb:v};
      add(g,`syn-pres-${v}-${p}`,d.pres[p],roles,`${v} (${d.es}) → «(${ES[p]}) ${d.erg?'lo ':''}${SP[d.sp][p]}»`);
      if(d.past) add('syn-past',`syn-past-${v}-${p}`,d.past[p],{nor:p,verb:v},`${v} (${d.es}) → «(${ES[p]}) ${SP[d.spp][p]}»`);
    });
  }
  return it;
}

const isV=c=>'aeiou'.includes(c);
function decline(n,kas,num){
  const w=n.w,last=w.slice(-1),vow=isV(last),cs=n.r||w,base=vow?w:cs,def=last==='a'?w.slice(0,-1):base;
  const S={abs:'a',erg:'ak',dat:'ari',gen:'aren',soz:'arekin',des:'arentzat',ins:'az'};
  const P={abs:'ak',erg:'ek',dat:'ei',gen:'en',soz:'ekin',des:'entzat',ins:'ez',ine:'etan',abl:'etatik',adl:'etara',ter:'etaraino',ko:'etako'};
  if(num==='pl') return def+P[kas];
  if(num==='sg'){
    if(S[kas]) return def+S[kas];
    if(kas==='ine') return last==='a'?w+'n':base+(vow?'an':'ean');
    return base+(vow?'':'e')+{abl:'tik',adl:'ra',ter:'raino',ko:'ko'}[kas];
  }
  const I={erg:'k',dat:'i',gen:'en',soz:'ekin',des:'entzat',ins:'z',ine:'tan',abl:'tatik',adl:'tara',ter:'taraino',ko:'tako'};
  if(kas==='abs') return w;
  if(['dat','gen','soz','des'].includes(kas)) return base+(vow?'r':'')+I[kas];
  return base+(vow?'':'e')+I[kas];
}
const contract=s=>s.replace(/\bde el\b/g,'del').replace(/\ba el\b/g,'al');
const bare=s=>s.replace(/^(el|la|los|las) /,'');
function buildDeclItems(){
  const it=[];
  for(const n of NOUNS) for(const c of CASES){ if(c.loc&&n.an) continue;
    for(const num of ['sg','pl','id']){
      const es= num==='id' ? `${c.es(bare(n.es))} — sin artículo (indefinido)` : contract(c.es(num==='sg'?n.es:n.esp));
      it.push({mod:'d',g:c.k,num,id:`d:${n.w}:${c.k}:${num}`,form:decline(n,c.k,num),noun:n,c,es});
    }
  }
  return it;
}

const LVLS=['A1','A2','B1'];
const WORDS=[];
(function(){const seen=new Set();for(const th of VOCAB)for(const seg of th.t.split('|')){const L=seg.slice(0,2);for(const e of seg.slice(3).split(';')){const i=e.indexOf('=');const eu=e.slice(0,i),es=e.slice(i+1);const k=eu+'='+es;if(seen.has(k))continue;seen.add(k);WORDS.push({th:th.id,lvl:L,eu,es,alts:eu.split('/').map(x=>x.trim())})}}})();
function buildWordItems(){const it=[];for(const w of WORDS){
  const base=`w:${w.th}:${w.eu}`;
  it.push({mod:'w',kind:'r',g:w.th,lvl:w.lvl,id:base+':r',form:w.alts.join(' / '),es:w.es,word:w});
  it.push({mod:'w',kind:'p',g:w.th,lvl:w.lvl,id:base+':p',form:w.alts.join(' / '),es:w.es,word:w});
}return it}
const WITEMS=buildWordItems();
// la producción (es→eu) se desbloquea cuando ya reconoces la palabra (caja ≥ 2)
function wordPool(themes,lvls){return WITEMS.filter(i=>themes.includes(i.g)&&lvls.includes(i.lvl)&&(i.kind==='r'||((S.stats[i.id.slice(0,-1)+'r']||{}).b>=2)))}
function wordLevel(w){const r=S.stats[`w:${w.th}:${w.eu}:r`],p=S.stats[`w:${w.th}:${w.eu}:p`];if(p&&p.b>=2)return 3;if(r&&r.b>=2)return 2;if(r)return 1;return 0}
const THEORY_V={
'nor-pres':{t:'izan (ser) en presente',p:['**izan** tiene un solo protagonista: {nor:NOR}, el sujeto. Sirve para dos cosas: como verbo «ser» (**Ikaslea naiz**, soy estudiante) y como auxiliar de los verbos sin objeto, como ir, venir, llegar o nacer (**Etorri naiz**, he venido).','Fíjate en la primera letra, porque te dice la persona: **n-** yo (naiz), **z-** tú y vosotros (zara, zarete), **d-** él/ella y ellos (da, dira), **g-** nosotros (gara). Esta pista de las iniciales se repite en muchísimos verbos.'],ex:[['Ni Ane naiz.','Yo soy Ane.'],['Gu Bilbokoak gara.','Somos de Bilbao.'],['Haiek etorri dira.','Ellos han venido.']]},
'nor-past':{t:'izan en pasado',p:['Las formas son **nintzen, zinen, zen, ginen, zineten, ziren**. Significan «era / fui» y, como auxiliar, forman el pasado de los verbos sin objeto: **Atzo etorri nintzen** (ayer vine).','Se mantienen las iniciales n-, z- y g-, y casi todo acaba en **-en**. Ojo: en pasado la 3.ª persona empieza por **z-** (zen, ziren) y no por d-.'],ex:[['Gaztea nintzen.','Era joven.'],['Atzo etorri ginen.','Ayer vinimos.'],['Hura irakaslea zen.','Él era profesor.']]},
'nn-pres-3':{t:'ukan con objeto «lo / los»',p:['**ukan** es el auxiliar de los verbos con objeto: alguien ({nork:NORK}) hace algo a algo ({nor:NOR}). **Ikusi dut** = lo he visto. Es el auxiliar más usado del euskera.','Si el objeto es una cosa («lo»), la raíz es **du-** y la terminación dice quién lo hace: **-t** yo (dut), **-zu** tú (duzu), nada para él (du), **-gu** nosotros (dugu), **-zue** vosotros (duzue), **-te** ellos (dute).','Si el objeto es plural («los»), se mete **-it-** dentro: d-**it**-u-t → **ditut**. Y algo muy importante: el sujeto de estos verbos lleva **-k**: **nik, zuk, hark** (yo, tú, él).'],ex:[['Nik liburua irakurri dut.','He leído el libro.'],['Zuk kafea edan duzu.','Has bebido el café.'],['Guk etxeak ikusi ditugu.','Hemos visto las casas.']]},
'nn-past-3':{t:'ukan en pasado («lo / los»)',p:['En pasado, la persona que hace la acción ({nork:NORK}) pasa al principio: **n-** yo, **zen-** tú, **z-** él, **gen-** nosotros, **zen-…-te** vosotros, **z-…-te** ellos. Todo acaba en **-en**.','Las formas son **nuen, zenuen, zuen, genuen, zenuten, zuten**. Con objeto plural se añade -it-: **nituen, zenituen, zituen**…'],ex:[['Atzo liburua erosi nuen.','Ayer compré el libro.'],['Zuk ikusi zenuen.','Tú lo viste.'],['Etxeak saldu zituzten.','Vendieron las casas.']]},
'nn-pres-x':{t:'ukan con objeto personal (me, te, nos, os)',p:['Cuando el objeto es una persona, el principio del auxiliar indica a {nor:NOR} y la terminación a {nork:NORK}. **n-au** = «me» + él → **nau** (me ha…). **zait-u-t** = «te» + yo → **zaitut** (te he…).','Inicios de NOR: **n-** me, **zait-** te, **gait-** nos, **zaituzte-** os. Las combinaciones reflexivas (yo → me) no existen: se dicen de otra manera.'],ex:[['Ikusi nauzu.','Me has visto.'],['Ikusi zaitut.','Te he visto.'],['Deitu gaituzte.','Nos han llamado.']]},
'nn-past-x':{t:'ukan en pasado con objeto personal',p:['El inicio marca a {nor:NOR}: **nind-** me, **zint-** te, **gint-** nos, **zintuzte-** os. La terminación marca a {nork:NORK} y todo acaba en **-n**.'],ex:[['Ikusi ninduzun.','Me viste.'],['Ikusi zintudan.','Te vi.'],['Deitu gintuen.','Nos llamó.']]},
'nni-pres':{t:'NOR-NORI: la estructura de «gustar»',p:['Algo ({nor:NOR}) le pasa o le gusta a alguien ({nori:NORI}). Igual que en español «me gusta», la persona va como complemento: **niri, zuri, hari…** (a mí, a ti, a él).','Se forma con **zai-** + la marca de NORI: **-t** a mí, **-zu** a ti, **-o** a él, **-gu** a nosotros, **-zue** a vosotros, **-e** a ellos → zait, zaizu, zaio, zaigu, zaizue, zaie. Si lo que gusta es plural: **zaizki-** (zaizkit).'],ex:[['Euskara gustatu zait.','Me ha gustado el euskera.'],['Giltzak ahaztu zaizkit.','Se me han olvidado las llaves.'],['Zer gertatu zaizu?','¿Qué te ha pasado?']]},
'nni-past':{t:'NOR-NORI en pasado',p:['Se forma con **zitzai-** + la marca de NORI + **-n**: zitzaidan, zitzaizun, zitzaion, zitzaigun, zitzaizuen, zitzaien. Con NOR plural: **zitzaizki-** (zitzaizkidan).'],ex:[['Filma gustatu zitzaidan.','Me gustó la película.'],['Zer gertatu zitzaion?','¿Qué le pasó?']]},

const INTERVALS=[0,10*60e3,24*3600e3,3*24*3600e3,7*24*3600e3,21*24*3600e3,60*24*3600e3];
function record(id,ok){
  const s=S.stats[id]||{b:0,ok:0,ko:0,d:0};
  if(ok){s.ok++;s.b=Math.min(s.b+1,INTERVALS.length-1)}else{s.ko++;s.b=0}
  s.d=Date.now()+INTERVALS[s.b];s.t=Date.now();
  S.stats[id]=s;
  S.log.push([Date.now(),ok?1:0,id.slice(0,1)]);
  save();
}
function pickQueue(pool,n){
  const now=Date.now(), due=[],fresh=[],rest=[];
  for(const it of pool){const s=S.stats[it.id]; if(!s)fresh.push(it); else if(s.d<=now)due.push(it); else rest.push(it)}
  const sh=a=>a.sort(()=>Math.random()-.5);
  due.sort((a,b)=>S.stats[a.id].b-S.stats[b.id].b);
  const q=[...due.slice(0,n)];
  const fr=sh(fresh);const cap=rest.length?Math.ceil(n*0.6):n;q.push(...fr.splice(0,Math.max(0,Math.min(cap,n-q.length))));
  if(q.length<n) q.push(...sh(rest).sort((a,b)=>S.stats[a.id].b-S.stats[b.id].b).slice(0,n-q.length));
  if(q.length<n) q.push(...fr.slice(0,n-q.length));
  return sh(q);
}
function groupProgress(pool){if(!pool.length)return 0;let m=0;for(const it of pool){const s=S.stats[it.id];if(s&&s.b>=2)m++}return m/pool.length}
function dueCount(pool){const now=Date.now();return pool.filter(it=>S.stats[it.id]&&S.stats[it.id].d<=now).length}

/* ============ SESIÓN DE PRÁCTICA ============ */
let D=null;
function startDrill(pool,back,poolFn){
  if(!pool.length)return;
  const n=S.settings.len||Infinity;
  D={pool,poolFn,back,n,queue:pickQueue(pool,Math.min(n===Infinity?20:n,pool.length)),i:0,ok:0,done:0,wrong:[],state:'ask',retry:[]};
  renderItem();
}
function norm(s){return s.trim().toLowerCase().replace(/\s+/g,' ')}
function renderItem(){
  if(D.i>=D.queue.length){
    if(D.n===Infinity){if(D.poolFn)D.pool=D.poolFn();D.queue.push(...pickQueue(D.pool,20))}
    else return renderDone();
  }
  const it=D.queue[D.i];
  const total=D.n===Infinity?null:D.queue.length;
  let head='',big='',hint='';
  if(it.mod==='v'){
    const r=it.roles;
    head=['nork','nori','nor'].filter(k=>r[k]).map(k=>chip(k,r[k])).join('');
    const g=GROUPS.find(x=>x.id===it.g);
    big=r.verb?`${r.verb}`:(g.name.split(' · ')[0]);
    big+=` <span class="muted" style="font-size:.5em">· ${g.name.split(' · ')[1].split(' (')[0]}</span>`;
    hint=it.hint;
  }else if(it.mod==='w'){
    const th=VOCAB.find(t=>t.id===it.g);
    head=`<span class="chip case">${th.eu}</span><span class="chip case">${it.lvl}</span>${S.stats[it.id]?'':'<span class="chip case">nueva</span>'}`;
    if(it.kind==='r'){big=esc(it.form);hint='¿Qué significa?'}
    else{big=esc(it.es);hint='Escríbelo en euskera.'}
  }else{
    head=`<span class="chip case"><b>${it.c.q}?</b>${it.c.eu}</span><span class="chip case">${{sg:'singular',pl:'plural',id:'indefinido'}[it.num]}</span>`;
    big=`${it.noun.w} <span class="muted" style="font-size:.5em">· ${bare(it.noun.es)}</span>`;
    hint=`«${esc(it.es)}»`;
  }
  D.cards=D.cards||new Set();
  const isNew=!S.stats[it.id]&&!D.cards.has(it.id)&&!(it.mod==='w'&&it.kind==='p');
  if(isNew) return renderCard(it,head,total);
  main.innerHTML=`
    <div class="drill">
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="btn ghost small" id="quit">Terminar</button><span class="muted small">${total?`${D.i+1} de ${total}`:`${D.done} hechas · ${D.ok} bien`}</span></div>
      <div class="prog"><i style="width:${total?100*D.i/total:0}%"></i></div>
      <div class="prompt-roles">${head}</div>
      <div class="prompt-big">${big}</div>
      <div class="prompt-hint">${hint}</div>
      ${it.mod==='w'&&it.kind==='r'?choiceHTML(it):`<form class="answer" id="af" autocomplete="off"><input id="ans" name="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Tu respuesta" placeholder="Escribe la respuesta" enterkeyhint="go"><button class="btn" id="chk" type="submit">Comprobar</button></form>`}
      <div class="fb" id="fb" role="status"></div>

  if(T.which==='syn') body=`<div class="tablewrap"><table><thead><tr><th>Persona</th>${Object.keys(SYN).filter(v=>v!=='izan').map(v=>`<th>${v}<br><span class="muted small">${SYN[v].es}</span></th>`).join('')}</tr></thead><tbody>${PERS.map(p=>`<tr><th>${p} / ${ERG[p]}</th>${Object.keys(SYN).filter(v=>v!=='izan').map(v=>`<td class="f ${T.hide?'hid':''}">${SYN[v].pres[p]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <h3>Pasado</h3><div class="tablewrap"><table><thead><tr><th>Persona</th>${['egon','joan','etorri'].map(v=>`<th>${v}</th>`).join('')}</tr></thead><tbody>${PERS.map(p=>`<tr><th>${p}</th>${['egon','joan','etorri'].map(v=>`<td class="f ${T.hide?'hid':''}">${SYN[v].past[p]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(T.which==='decl'){const n=NOUNS.find(x=>x.w===T.noun);
    body=`<div class="row" style="margin:6px 0"><label>Sustantivo <select id="noun">${NOUNS.map(x=>`<option value="${x.w}" ${x.w===T.noun?'selected':''}>${x.w} — ${bare(x.es)}</option>`).join('')}</select></label></div>
    ${n.an?'<p class="note small">Es un ser vivo: los casos de lugar (NON, NORA, NONDIK…) usan otras formas (-rengan, -rengana…) que veremos más adelante.</p>':''}
    <div class="tablewrap"><table><thead><tr><th>Caso</th><th>Singular</th><th>Plural</th><th>Indefinido</th></tr></thead><tbody>${CASES.filter(c=>!(c.loc&&n.an)).map(c=>`<tr><th>${c.eu} <span class="muted small">${c.q}?</span></th>${['sg','pl','id'].map(num=>`<td class="f ${T.hide?'hid':''}">${decline(n,c.k,num)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
  main.innerHTML=`
    <h1>Taulak</h1>
    <p class="lede">Tablas de consulta generadas por el mismo motor que usa la práctica. Activa «Ocultar formas» para repasar: pulsa una casilla para verla.</p>
    <div class="row" style="margin-bottom:8px"><select id="which" aria-label="Tabla">${opts.map(([k,l])=>`<option value="${k}" ${k===T.which?'selected':''}>${l}</option>`).join('')}</select>
    <label class="row small" style="gap:6px"><input type="checkbox" id="hide" ${T.hide?'checked':''}> Ocultar formas</label></div>
    <div class="legend"><span class="chip nor"><b>NOR</b></span><span class="chip nork"><b>NORK</b></span><span class="chip nori"><b>NORI</b></span><span class="muted small">Las casillas rayadas no existen (serían reflexivas: se expresan de otra manera).</span></div>
    ${body}`;
  $('#which').onchange=e=>{T.which=e.target.value;renderTables()};
  $('#hide').onchange=e=>{T.hide=e.target.checked;renderTables()};
  if($('#noun'))$('#noun').onchange=e=>{T.noun=e.target.value;renderTables()};
  document.querySelectorAll('td.hid').forEach(td=>td.onclick=()=>td.classList.remove('hid'));
}

initStore();
</script>
</body>
</html>
