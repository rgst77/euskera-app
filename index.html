<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Euskara Lantegia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECE6; --panel:#F6F7F3; --ink:#1A211F; --muted:#5B6661; --line:#C9CFC6;
  --nor:#2E5E8C; --nork:#9A2F2F; --nori:#A86A12; --ok:#2C7349; --bad:#A23B2A; --focus:#2E5E8C;
  --nor-bg:#DCE6F0; --nork-bg:#F1DCDA; --nori-bg:#F3E6CF; --ok-bg:#D9EBDF; --bad-bg:#F3DCD6;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141917; --panel:#1C2220; --ink:#E6EAE5; --muted:#9AA59F; --line:#33403B;
    --nor:#8DB6E0; --nork:#E39A93; --nori:#E2B566; --ok:#79C597; --bad:#EE907E; --focus:#8DB6E0;
    --nor-bg:#1E2C3A; --nork-bg:#3A2322; --nori-bg:#3A2E1B; --ok-bg:#1D3326; --bad-bg:#3B241F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1C2220; --ink:#E6EAE5; --muted:#9AA59F; --line:#33403B;
  --nor:#8DB6E0; --nork:#E39A93; --nori:#E2B566; --ok:#79C597; --bad:#EE907E; --focus:#8DB6E0;
  --nor-bg:#1E2C3A; --nork-bg:#3A2322; --nori-bg:#3A2E1B; --ok-bg:#1D3326; --bad-bg:#3B241F;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif}
h1,h2,h3{font-family:"Young Serif",Georgia,serif;font-weight:400;line-height:1.2;margin:0}
h1{font-size:2.1rem} h2{font-size:1.5rem} h3{font-size:1.15rem}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.app>nav{border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:"Young Serif",Georgia,serif;font-size:1.35rem;margin:0 10px 22px;line-height:1.15}
.brand small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-size:.8rem;color:var(--muted);margin-top:4px}
.navbtn{background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column}
.navbtn span{font-size:.8rem;color:var(--muted)}
.navbtn:hover{background:var(--panel)}
.navbtn[aria-current="true"]{background:var(--panel);box-shadow:inset 3px 0 0 var(--ink)}
.navbtn:disabled{cursor:default;opacity:.55}
.navbtn:disabled:hover{background:none}
.navsep{margin:18px 12px 6px;font-size:.8rem;color:var(--muted)}
.sync{margin-top:auto;font-size:.8rem;color:var(--muted);padding:12px}
main{padding:40px clamp(20px,5vw,64px);max-width:980px;width:100%}
.lede{color:var(--muted);max-width:62ch;margin:.5rem 0 1.8rem}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.stat{font-size:2rem;font-family:"Young Serif",Georgia,serif;line-height:1}
.muted{color:var(--muted)}
.small{font-size:.88rem}
/* chips de rol: el color codifica la función gramatical en toda la app */
.chip{display:inline-flex;align-items:baseline;gap:6px;border-radius:6px;padding:3px 9px;font-size:.95rem}
.chip b{font-size:.75rem;letter-spacing:.02em}
.chip.nor{background:var(--nor-bg);color:var(--nor)}
.chip.nork{background:var(--nork-bg);color:var(--nork)}
.chip.nori{background:var(--nori-bg);color:var(--nori)}
.chip.case{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0}
/* práctica */
.drill{margin-top:8px}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:26px}
.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.prompt-roles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.prompt-big{font-family:"Young Serif",Georgia,serif;font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.15;margin:4px 0 8px}
.prompt-hint{color:var(--muted);margin-bottom:22px;max-width:60ch}
.answer{display:flex;gap:10px;flex-wrap:wrap}
.answer input{flex:1;min-width:220px;font-size:1.6rem;padding:12px 16px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-family:"Young Serif",Georgia,serif}
.answer input.ok{border-color:var(--ok);background:var(--ok-bg)}
.answer input.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:18px;padding:14px 16px;border-radius:10px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb .form{font-family:"Young Serif",Georgia,serif;font-size:1.6rem;color:var(--ink)}
.fb .why{color:var(--ink);margin-top:6px;font-size:.95rem}
.kbd{font-size:.8rem;color:var(--muted);margin-top:14px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px;margin:12px 0 20px}
.gopt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel)}
.gopt input{margin-top:5px}
.lvl{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--muted)}
.gopt .bar{height:3px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.gopt .bar i{display:block;height:100%;background:var(--ok)}
/* tablas */
.tablewrap{overflow-x:auto;margin:14px 0 26px}
table{border-collapse:collapse;min-width:100%}
th,td{border:1px solid var(--line);padding:8px 12px;text-align:left;white-space:nowrap}
th{font-weight:700;font-size:.9rem}
th.nor{color:var(--nor);background:var(--nor-bg)} th.nork{color:var(--nork);background:var(--nork-bg)} th.nori{color:var(--nori);background:var(--nori-bg)}
td.f{font-family:"Young Serif",Georgia,serif;font-size:1.1rem}
td.empty{background:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--line) 5px,var(--line) 6px);opacity:.5}
td.hid{cursor:pointer;color:transparent;background:var(--bg)}
td.hid::after{content:"ver";color:var(--muted);font-family:"Atkinson Hyperlegible",sans-serif;font-size:.8rem}
.done-big{font-family:"Young Serif",Georgia,serif;font-size:3rem;line-height:1}
.mistakes li{margin:4px 0}
.mistakes .f{font-family:"Young Serif",Georgia,serif}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px}
.choice{text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-size:1.05rem}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.bad{border-color:var(--bad);background:var(--bad-bg)}
.choice:disabled{cursor:default}
.choice kbd{font-family:inherit;color:var(--muted);font-size:.8rem;margin-right:8px}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:2px 24px;margin:14px 0 24px}
.wrow{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.wrow .eu{font-family:"Young Serif",Georgia,serif;font-size:1.08rem}
.wrow .es{color:var(--muted);flex:1;text-align:right;font-size:.92rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;align-self:center}
.dot.l1{background:var(--nori)} .dot.l2{background:var(--nor)} .dot.l3{background:var(--ok)}
.search{padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);min-width:260px}
.r{border-radius:4px;padding:0 4px}
.r.nor{background:var(--nor-bg);color:var(--nor)} .r.nork{background:var(--nork-bg);color:var(--nork)} .r.nori{background:var(--nori-bg);color:var(--nori)}
.lvlhead{display:flex;align-items:baseline;gap:14px;margin:34px 0 10px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.lcard{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:86px}
.lcard:hover:not(:disabled){border-color:var(--ink)}
.lcard:disabled{cursor:default;background:transparent;border-style:dashed}
.lcard .num{font-size:.8rem;color:var(--muted)}
.lcard .t{font-family:"Young Serif",Georgia,serif;font-size:1.08rem}
.lcard .s{font-size:.85rem;color:var(--muted)}
.lcard.done{box-shadow:inset 0 -3px 0 var(--ok)}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:18px 0 26px;border-bottom:1px solid var(--line)}
.steps button{background:none;border:0;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.steps button[aria-current="true"]{border-bottom-color:var(--ink);font-weight:700}
.steps button .ck{color:var(--ok);margin-left:4px}
.lx h3{margin:26px 0 8px}
.lx p{max-width:68ch}
.exrow{display:flex;gap:16px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.exrow .eu{font-family:"Young Serif",Georgia,serif;font-size:1.12rem;flex:1}
.exrow .es{color:var(--muted);flex:1}
.dline{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.dline .who{font-weight:700}
.dline .eu{font-family:"Young Serif",Georgia,serif;font-size:1.15rem}
.dline .es{color:var(--muted);font-size:.92rem;display:none}
.showes .dline .es{display:block}
.gapq{font-family:"Young Serif",Georgia,serif;font-size:1.6rem;line-height:1.6}
.gapq input{font:inherit;width:7.5em;padding:2px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg)}
.gapq input.ok{border-color:var(--ok);background:var(--ok-bg)} .gapq input.bad{border-color:var(--bad);background:var(--bad-bg)}
.tiles{display:flex;gap:8px;flex-wrap:wrap;min-height:52px;margin:10px 0}
.tile{padding:8px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-family:"Young Serif",Georgia,serif;font-size:1.15rem}
.tile:disabled{opacity:.25;cursor:default}
.built{min-height:58px;border-bottom:2px solid var(--ink);display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:6px 0;font-family:"Young Serif",Georgia,serif;font-size:1.4rem}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px}
.mcols .choice.sel{border-color:var(--ink)}
textarea{width:100%;min-height:140px;padding:14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font:1.15rem/1.5 "Young Serif",Georgia,serif;color:var(--ink)}
.ai{font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.corr{font-family:"Young Serif",Georgia,serif;font-size:1.2rem;background:var(--ok-bg);padding:14px;border-radius:10px;margin:10px 0}
.card-new{border:2px solid var(--ink);border-radius:14px;padding:22px;background:var(--panel)}
.card-new .tag{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.card-new .form{font-family:"Young Serif",Georgia,serif;font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin:6px 0 10px}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer;font:inherit}
.today{display:grid;gap:10px;margin-top:12px}
.tstep{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.tstep .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:.85rem}
.tstep.done .n{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.tstep.done{opacity:.75}
.qa{margin-top:30px;border-top:1px solid var(--line);padding-top:8px}
.qa textarea{min-height:70px;font-family:"Atkinson Hyperlegible",sans-serif;font-size:1rem}
.qa .ans{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px}
select{padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel)}
.note{border-left:3px solid var(--line);padding:4px 0 4px 14px;color:var(--muted);max-width:66ch}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .app>nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;padding:12px}
  .brand,.navsep,.sync{display:none}
  .tstep{grid-template-columns:28px 1fr}
  .tstep .btn{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav aria-label="Secciones">
    <div class="brand">Euskara Lantegia<small>Tu taller de euskera</small></div>
    <button class="navbtn" data-view="home">Hasiera<span>Inicio y progreso</span></button>
    <button class="navbtn" data-view="lessons">Ikasgaiak<span>Lecciones A1–C1</span></button>
    <button class="navbtn" data-view="verbs">Aditzak<span>Verbos y auxiliares</span></button>
    <button class="navbtn" data-view="decl">Deklinabidea<span>Casos y declinación</span></button>
    <button class="navbtn" data-view="words">Hiztegia<span>Vocabulario por temas</span></button>
    <button class="navbtn" data-view="tables">Taulak<span>Tablas de consulta</span></button>
    <div class="sync" id="sync">Cargando progreso…</div>
  </nav>
  <main id="main"></main>
</div>
<script>
/* ============ DATOS: personas y glosas ============ */
const PERS=['ni','zu','hura','gu','zuek','haiek'];
const ERG={ni:'nik',zu:'zuk',hura:'hark',gu:'guk',zuek:'zuek',haiek:'haiek'};
const DAT={ni:'niri',zu:'zuri',hura:'hari',gu:'guri',zuek:'zuei',haiek:'haiei'};
const ES={ni:'yo',zu:'tú',hura:'él/ella',gu:'nosotros',zuek:'vosotros',haiek:'ellos'};
const OBJ={ni:'me',zu:'te',hura:'lo',gu:'nos',zuek:'os',haiek:'los'};
const ICL={ni:'me',zu:'te',hura:'se',gu:'nos',zuek:'os',haiek:'se'};
const IA={ni:'me',zu:'te',hura:'le',gu:'nos',zuek:'os',haiek:'les'};
const TO={hura:' (a él/ella)',haiek:' (a ellos)'};
const C=(arr)=>Object.fromEntries(PERS.map((p,i)=>[p,arr[i]]));
const SP={
  haber:C(['he','has','ha','hemos','habéis','han']), ser:C(['soy','eres','es','somos','sois','son']),
  era:C(['era','eras','era','éramos','erais','eran']), fui:C(['fui','fuiste','fue','fuimos','fuisteis','fueron']), vine:C(['vine','viniste','vino','vinimos','vinisteis','vinieron']),
  vi:C(['vi','viste','vio','vimos','visteis','vieron']), di:C(['di','diste','dio','dimos','disteis','dieron']),
  estar:C(['estoy','estás','está','estamos','estáis','están']), estaba:C(['estaba','estabas','estaba','estábamos','estabais','estaban']),
  ir:C(['voy','vas','va','vamos','vais','van']), iba:C(['iba','ibas','iba','íbamos','ibais','iban']),
  venir:C(['vengo','vienes','viene','venimos','venís','vienen']), venia:C(['venía','venías','venía','veníamos','veníais','venían']),
  andar:C(['ando','andas','anda','andamos','andáis','andan']), tener:C(['tengo','tienes','tiene','tenemos','tenéis','tienen']),
  saber:C(['sé','sabes','sabe','sabemos','sabéis','saben']), decir:C(['digo','dices','dice','decimos','decís','dicen'])
};

/* ============ DATOS: paradigmas verbales (batua) ============ */
// NOR-NORK: tabla[NOR][NORK]
const NN_PRES={
  ni:{zu:'nauzu',hura:'nau',zuek:'nauzue',haiek:'naute'},
  zu:{ni:'zaitut',hura:'zaitu',gu:'zaitugu',haiek:'zaituzte'},
  hura:{ni:'dut',zu:'duzu',hura:'du',gu:'dugu',zuek:'duzue',haiek:'dute'},
  gu:{zu:'gaituzu',hura:'gaitu',zuek:'gaituzue',haiek:'gaituzte'},
  zuek:{ni:'zaituztet',hura:'zaituzte',gu:'zaituztegu',haiek:'zaituztete'},
  haiek:{ni:'ditut',zu:'dituzu',hura:'ditu',gu:'ditugu',zuek:'dituzue',haiek:'dituzte'}
};
const NN_PAST={
  ni:{zu:'ninduzun',hura:'ninduen',zuek:'ninduzuen',haiek:'ninduten'},
  zu:{ni:'zintudan',hura:'zintuen',gu:'zintugun',haiek:'zintuzten'},
  hura:{ni:'nuen',zu:'zenuen',hura:'zuen',gu:'genuen',zuek:'zenuten',haiek:'zuten'},
  gu:{zu:'gintuzun',hura:'gintuen',zuek:'gintuzuen',haiek:'gintuzten'},
  zuek:{ni:'zintuztedan',hura:'zintuzten',gu:'zintuztegun',haiek:'zintuzteten'},
  haiek:{ni:'nituen',zu:'zenituen',hura:'zituen',gu:'genituen',zuek:'zenituzten',haiek:'zituzten'}
};
// NOR-NORI: tabla[NOR(hura|haiek)][NORI]
const NNI_PRES={hura:C(['zait','zaizu','zaio','zaigu','zaizue','zaie']),haiek:C(['zaizkit','zaizkizu','zaizkio','zaizkigu','zaizkizue','zaizkie'])};
const NNI_PAST={hura:C(['zitzaidan','zitzaizun','zitzaion','zitzaigun','zitzaizuen','zitzaien']),haiek:C(['zitzaizkidan','zitzaizkizun','zitzaizkion','zitzaizkigun','zitzaizkizuen','zitzaizkien'])};
// NOR-NORI-NORK: tabla[NORK][NORI]
const NNN_PRES={
  ni:{zu:'dizut',hura:'diot',zuek:'dizuet',haiek:'diet'},
  zu:{ni:'didazu',hura:'diozu',gu:'diguzu',haiek:'diezu'},
  hura:{ni:'dit',zu:'dizu',hura:'dio',gu:'digu',zuek:'dizue',haiek:'die'},
  gu:{zu:'dizugu',hura:'diogu',zuek:'dizuegu',haiek:'diegu'},
  zuek:{ni:'didazue',hura:'diozue',gu:'diguzue',haiek:'diezue'},
  haiek:{ni:'didate',zu:'dizute',hura:'diote',gu:'digute',zuek:'dizuete',haiek:'diete'}
};
const NNN_PRES_PL={
  ni:{zu:'dizkizut',hura:'dizkiot',zuek:'dizkizuet',haiek:'dizkiet'},
  zu:{ni:'dizkidazu',hura:'dizkiozu',gu:'dizkiguzu',haiek:'dizkiezu'},
  hura:{ni:'dizkit',zu:'dizkizu',hura:'dizkio',gu:'dizkigu',zuek:'dizkizue',haiek:'dizkie'},
  gu:{zu:'dizkizugu',hura:'dizkiogu',zuek:'dizkizuegu',haiek:'dizkiegu'},
  zuek:{ni:'dizkidazue',hura:'dizkiozue',gu:'dizkiguzue',haiek:'dizkiezue'},
  haiek:{ni:'dizkidate',zu:'dizkizute',hura:'dizkiote',gu:'dizkigute',zuek:'dizkizuete',haiek:'dizkiete'}
};
const NNN_PAST={
  ni:{zu:'nizun',hura:'nion',zuek:'nizuen',haiek:'nien'},
  zu:{ni:'zenidan',hura:'zenion',gu:'zenigun',haiek:'zenien'},
  hura:{ni:'zidan',zu:'zizun',hura:'zion',gu:'zigun',zuek:'zizuen',haiek:'zien'},
  gu:{zu:'genizun',hura:'genion',zuek:'genizuen',haiek:'genien'},
  zuek:{ni:'zenidaten',hura:'zenioten',gu:'zeniguten',haiek:'zenieten'},
  haiek:{ni:'zidaten',zu:'zizuten',hura:'zioten',gu:'ziguten',zuek:'zizueten',haiek:'zieten'}

function buildVerbItems(){
  const it=[];
  const add=(g,id,form,roles,hint)=>it.push({mod:'v',g,id:'v:'+id,form,roles,hint});
  PERS.forEach(p=>{
    add('nor-pres','izan-pres-'+p,SYN.izan.pres[p],{nor:p},`«(${ES[p]}) ${SP.ser[p]}» · etorri ___ = «${SP.haber[p]} venido»`);
    add('nor-past','izan-past-'+p,SYN.izan.past[p],{nor:p},`«(${ES[p]}) ${SP.era[p]} / ${SP.fui[p]}» · etorri ___ = «${SP.vine[p]}»`);
  });
  for(const nor of PERS) for(const nork of PERS){
    const f1=NN_PRES[nor][nork], f2=NN_PAST[nor][nork]; if(!f1) continue;
    const third=(nor==='hura'||nor==='haiek');
    add(third?'nn-pres-3':'nn-pres-x',`nn-pres-${nor}-${nork}`,f1,{nork,nor},`ikusi ___ → «(${ES[nork]}) ${OBJ[nor]} ${SP.haber[nork]} visto»`);
    add(third?'nn-past-3':'nn-past-x',`nn-past-${nor}-${nork}`,f2,{nork,nor},`ikusi ___ → «(${ES[nork]}) ${OBJ[nor]} ${SP.vi[nork]}»`);
  }
  for(const nor of ['hura','haiek']) for(const nori of PERS){
    const pl=nor==='haiek';
    add('nni-pres',`nni-pres-${nor}-${nori}`,NNI_PRES[nor][nori],{nori,nor},`gustatu ___ → «(a ${ES[nori]==='yo'?'mí':ES[nori]==='tú'?'ti':ES[nori]}) ${IA[nori]} ${pl?'han':'ha'} gustado»`);
    add('nni-past',`nni-past-${nor}-${nori}`,NNI_PAST[nor][nori],{nori,nor},`gustatu ___ → «${IA[nori]} ${pl?'gustaron':'gustó'}»`);
  }
  for(const nork of PERS) for(const nori of PERS){
    const f=NNN_PRES[nork][nori]; if(!f) continue;
    add('nnn-pres',`nnn-pres-${nork}-${nori}`,f,{nork,nori,nor:'hura'},`eman ___ → «(${ES[nork]}) ${ICL[nori]} lo ${SP.haber[nork]} dado${TO[nori]||''}»`);
    add('nnn-pres-pl',`nnn-prespl-${nork}-${nori}`,NNN_PRES_PL[nork][nori],{nork,nori,nor:'haiek'},`eman ___ → «(${ES[nork]}) ${ICL[nori]} los ${SP.haber[nork]} dado${TO[nori]||''}»`);
    add('nnn-past',`nnn-past-${nork}-${nori}`,NNN_PAST[nork][nori],{nork,nori,nor:'hura'},`eman ___ → «(${ES[nork]}) ${ICL[nori]} lo ${SP.di[nork]}${TO[nori]||''}»`);
  }
  for(const [v,d] of Object.entries(SYN)){ if(v==='izan') continue;
    const g=['egon','joan','etorri','ibili'].includes(v)?'syn-pres-1':'syn-pres-2';
    PERS.forEach(p=>{
      const roles=d.erg?{nork:p,verb:v}:{nor:p,verb:v};
      add(g,`syn-pres-${v}-${p}`,d.pres[p],roles,`${v} (${d.es}) → «(${ES[p]}) ${d.erg?'lo ':''}${SP[d.sp][p]}»`);
      if(d.past) add('syn-past',`syn-past-${v}-${p}`,d.past[p],{nor:p,verb:v},`${v} (${d.es}) → «(${ES[p]}) ${SP[d.spp][p]}»`);
    });
  }
  return it;
}

const isV=c=>'aeiou'.includes(c);
function decline(n,kas,num){
  const w=n.w,last=w.slice(-1),vow=isV(last),cs=n.r||w,base=vow?w:cs,def=last==='a'?w.slice(0,-1):base;
  const S={abs:'a',erg:'ak',dat:'ari',gen:'aren',soz:'arekin',des:'arentzat',ins:'az'};
  const P={abs:'ak',erg:'ek',dat:'ei',gen:'en',soz:'ekin',des:'entzat',ins:'ez',ine:'etan',abl:'etatik',adl:'etara',ter:'etaraino',ko:'etako'};
  if(num==='pl') return def+P[kas];
  if(num==='sg'){
    if(S[kas]) return def+S[kas];
    if(kas==='ine') return last==='a'?w+'n':base+(vow?'an':'ean');
    return base+(vow?'':'e')+{abl:'tik',adl:'ra',ter:'raino',ko:'ko'}[kas];
  }
  const I={erg:'k',dat:'i',gen:'en',soz:'ekin',des:'entzat',ins:'z',ine:'tan',abl:'tatik',adl:'tara',ter:'taraino',ko:'tako'};
  if(kas==='abs') return w;
  if(['dat','gen','soz','des'].includes(kas)) return base+(vow?'r':'')+I[kas];
  return base+(vow?'':'e')+I[kas];
}
const contract=s=>s.replace(/\bde el\b/g,'del').replace(/\ba el\b/g,'al');
const bare=s=>s.replace(/^(el|la|los|las) /,'');
function buildDeclItems(){
  const it=[];
  for(const n of NOUNS) for(const c of CASES){ if(c.loc&&n.an) continue;
    for(const num of ['sg','pl','id']){
      const es= num==='id' ? `${c.es(bare(n.es))} — sin artículo (indefinido)` : contract(c.es(num==='sg'?n.es:n.esp));
      it.push({mod:'d',g:c.k,num,id:`d:${n.w}:${c.k}:${num}`,form:decline(n,c.k,num),noun:n,c,es});
    }
  }
  return it;
}

const LVLS=['A1','A2','B1'];
const WORDS=[];
(function(){const seen=new Set();for(const th of VOCAB)for(const seg of th.t.split('|')){const L=seg.slice(0,2);for(const e of seg.slice(3).split(';')){const i=e.indexOf('=');const eu=e.slice(0,i),es=e.slice(i+1);const k=eu+'='+es;if(seen.has(k))continue;seen.add(k);WORDS.push({th:th.id,lvl:L,eu,es,alts:eu.split('/').map(x=>x.trim())})}}})();
function buildWordItems(){const it=[];for(const w of WORDS){
  const base=`w:${w.th}:${w.eu}`;
  it.push({mod:'w',kind:'r',g:w.th,lvl:w.lvl,id:base+':r',form:w.alts.join(' / '),es:w.es,word:w});
  it.push({mod:'w',kind:'p',g:w.th,lvl:w.lvl,id:base+':p',form:w.alts.join(' / '),es:w.es,word:w});
}return it}
const WITEMS=buildWordItems();
// la producción (es→eu) se desbloquea cuando ya reconoces la palabra (caja ≥ 2)
function wordPool(themes,lvls){return WITEMS.filter(i=>themes.includes(i.g)&&lvls.includes(i.lvl)&&(i.kind==='r'||((S.stats[i.id.slice(0,-1)+'r']||{}).b>=2)))}
function wordLevel(w){const r=S.stats[`w:${w.th}:${w.eu}:r`],p=S.stats[`w:${w.th}:${w.eu}:p`];if(p&&p.b>=2)return 3;if(r&&r.b>=2)return 2;if(r)return 1;return 0}
const THEORY_V={
'nor-pres':{t:'izan (ser) en presente',p:['**izan** tiene un solo protagonista: {nor:NOR}, el sujeto. Sirve para dos cosas: como verbo «ser» (**Ikaslea naiz**, soy estudiante) y como auxiliar de los verbos sin objeto, como ir, venir, llegar o nacer (**Etorri naiz**, he venido).','Fíjate en la primera letra, porque te dice la persona: **n-** yo (naiz), **z-** tú y vosotros (zara, zarete), **d-** él/ella y ellos (da, dira), **g-** nosotros (gara). Esta pista de las iniciales se repite en muchísimos verbos.'],ex:[['Ni Ane naiz.','Yo soy Ane.'],['Gu Bilbokoak gara.','Somos de Bilbao.'],['Haiek etorri dira.','Ellos han venido.']]},
'nor-past':{t:'izan en pasado',p:['Las formas son **nintzen, zinen, zen, ginen, zineten, ziren**. Significan «era / fui» y, como auxiliar, forman el pasado de los verbos sin objeto: **Atzo etorri nintzen** (ayer vine).','Se mantienen las iniciales n-, z- y g-, y casi todo acaba en **-en**. Ojo: en pasado la 3.ª persona empieza por **z-** (zen, ziren) y no por d-.'],ex:[['Gaztea nintzen.','Era joven.'],['Atzo etorri ginen.','Ayer vinimos.'],['Hura irakaslea zen.','Él era profesor.']]},
'nn-pres-3':{t:'ukan con objeto «lo / los»',p:['**ukan** es el auxiliar de los verbos con objeto: alguien ({nork:NORK}) hace algo a algo ({nor:NOR}). **Ikusi dut** = lo he visto. Es el auxiliar más usado del euskera.','Si el objeto es una cosa («lo»), la raíz es **du-** y la terminación dice quién lo hace: **-t** yo (dut), **-zu** tú (duzu), nada para él (du), **-gu** nosotros (dugu), **-zue** vosotros (duzue), **-te** ellos (dute).','Si el objeto es plural («los»), se mete **-it-** dentro: d-**it**-u-t → **ditut**. Y algo muy importante: el sujeto de estos verbos lleva **-k**: **nik, zuk, hark** (yo, tú, él).'],ex:[['Nik liburua irakurri dut.','He leído el libro.'],['Zuk kafea edan duzu.','Has bebido el café.'],['Guk etxeak ikusi ditugu.','Hemos visto las casas.']]},
'nn-past-3':{t:'ukan en pasado («lo / los»)',p:['En pasado, la persona que hace la acción ({nork:NORK}) pasa al principio: **n-** yo, **zen-** tú, **z-** él, **gen-** nosotros, **zen-…-te** vosotros, **z-…-te** ellos. Todo acaba en **-en**.','Las formas son **nuen, zenuen, zuen, genuen, zenuten, zuten**. Con objeto plural se añade -it-: **nituen, zenituen, zituen**…'],ex:[['Atzo liburua erosi nuen.','Ayer compré el libro.'],['Zuk ikusi zenuen.','Tú lo viste.'],['Etxeak saldu zituzten.','Vendieron las casas.']]},
'nn-pres-x':{t:'ukan con objeto personal (me, te, nos, os)',p:['Cuando el objeto es una persona, el principio del auxiliar indica a {nor:NOR} y la terminación a {nork:NORK}. **n-au** = «me» + él → **nau** (me ha…). **zait-u-t** = «te» + yo → **zaitut** (te he…).','Inicios de NOR: **n-** me, **zait-** te, **gait-** nos, **zaituzte-** os. Las combinaciones reflexivas (yo → me) no existen: se dicen de otra manera.'],ex:[['Ikusi nauzu.','Me has visto.'],['Ikusi zaitut.','Te he visto.'],['Deitu gaituzte.','Nos han llamado.']]},
'nn-past-x':{t:'ukan en pasado con objeto personal',p:['El inicio marca a {nor:NOR}: **nind-** me, **zint-** te, **gint-** nos, **zintuzte-** os. La terminación marca a {nork:NORK} y todo acaba en **-n**.'],ex:[['Ikusi ninduzun.','Me viste.'],['Ikusi zintudan.','Te vi.'],['Deitu gintuen.','Nos llamó.']]},
'nni-pres':{t:'NOR-NORI: la estructura de «gustar»',p:['Algo ({nor:NOR}) le pasa o le gusta a alguien ({nori:NORI}). Igual que en español «me gusta», la persona va como complemento: **niri, zuri, hari…** (a mí, a ti, a él).','Se forma con **zai-** + la marca de NORI: **-t** a mí, **-zu** a ti, **-o** a él, **-gu** a nosotros, **-zue** a vosotros, **-e** a ellos → zait, zaizu, zaio, zaigu, zaizue, zaie. Si lo que gusta es plural: **zaizki-** (zaizkit).'],ex:[['Euskara gustatu zait.','Me ha gustado el euskera.'],['Giltzak ahaztu zaizkit.','Se me han olvidado las llaves.'],['Zer gertatu zaizu?','¿Qué te ha pasado?']]},
'nni-past':{t:'NOR-NORI en pasado',p:['Se forma con **zitzai-** + la marca de NORI + **-n**: zitzaidan, zitzaizun, zitzaion, zitzaigun, zitzaizuen, zitzaien. Con NOR plural: **zitzaizki-** (zitzaizkidan).'],ex:[['Filma gustatu zitzaidan.','Me gustó la película.'],['Zer gertatu zitzaion?','¿Qué le pasó?']]},

const INTERVALS=[0,10*60e3,24*3600e3,3*24*3600e3,7*24*3600e3,21*24*3600e3,60*24*3600e3];
function record(id,ok){
  const s=S.stats[id]||{b:0,ok:0,ko:0,d:0};
  if(ok){s.ok++;s.b=Math.min(s.b+1,INTERVALS.length-1)}else{s.ko++;s.b=0}
  s.d=Date.now()+INTERVALS[s.b];s.t=Date.now();
  S.stats[id]=s;
  S.log.push([Date.now(),ok?1:0,id.slice(0,1)]);
  save();
}
function pickQueue(pool,n){
  const now=Date.now(), due=[],fresh=[],rest=[];
  for(const it of pool){const s=S.stats[it.id]; if(!s)fresh.push(it); else if(s.d<=now)due.push(it); else rest.push(it)}
  const sh=a=>a.sort(()=>Math.random()-.5);
  due.sort((a,b)=>S.stats[a.id].b-S.stats[b.id].b);
  const q=[...due.slice(0,n)];
  const fr=sh(fresh);const cap=rest.length?Math.ceil(n*0.6):n;q.push(...fr.splice(0,Math.max(0,Math.min(cap,n-q.length))));
  if(q.length<n) q.push(...sh(rest).sort((a,b)=>S.stats[a.id].b-S.stats[b.id].b).slice(0,n-q.length));
  if(q.length<n) q.push(...fr.slice(0,n-q.length));
  return sh(q);
}
function groupProgress(pool){if(!pool.length)return 0;let m=0;for(const it of pool){const s=S.stats[it.id];if(s&&s.b>=2)m++}return m/pool.length}
function dueCount(pool){const now=Date.now();return pool.filter(it=>S.stats[it.id]&&S.stats[it.id].d<=now).length}

/* ============ SESIÓN DE PRÁCTICA ============ */
let D=null;
function startDrill(pool,back,poolFn){
  if(!pool.length)return;
  const n=S.settings.len||Infinity;
  D={pool,poolFn,back,n,queue:pickQueue(pool,Math.min(n===Infinity?20:n,pool.length)),i:0,ok:0,done:0,wrong:[],state:'ask',retry:[]};
  renderItem();
}
function norm(s){return s.trim().toLowerCase().replace(/\s+/g,' ')}
function renderItem(){
  if(D.i>=D.queue.length){
    if(D.n===Infinity){if(D.poolFn)D.pool=D.poolFn();D.queue.push(...pickQueue(D.pool,20))}
    else return renderDone();
  }
  const it=D.queue[D.i];
  const total=D.n===Infinity?null:D.queue.length;
  let head='',big='',hint='';
  if(it.mod==='v'){
    const r=it.roles;
    head=['nork','nori','nor'].filter(k=>r[k]).map(k=>chip(k,r[k])).join('');
    const g=GROUPS.find(x=>x.id===it.g);
    big=r.verb?`${r.verb}`:(g.name.split(' · ')[0]);
    big+=` <span class="muted" style="font-size:.5em">· ${g.name.split(' · ')[1].split(' (')[0]}</span>`;
    hint=it.hint;
  }else if(it.mod==='w'){
    const th=VOCAB.find(t=>t.id===it.g);
    head=`<span class="chip case">${th.eu}</span><span class="chip case">${it.lvl}</span>${S.stats[it.id]?'':'<span class="chip case">nueva</span>'}`;
    if(it.kind==='r'){big=esc(it.form);hint='¿Qué significa?'}
    else{big=esc(it.es);hint='Escríbelo en euskera.'}
  }else{
    head=`<span class="chip case"><b>${it.c.q}?</b>${it.c.eu}</span><span class="chip case">${{sg:'singular',pl:'plural',id:'indefinido'}[it.num]}</span>`;
    big=`${it.noun.w} <span class="muted" style="font-size:.5em">· ${bare(it.noun.es)}</span>`;
    hint=`«${esc(it.es)}»`;
  }
  D.cards=D.cards||new Set();
  const isNew=!S.stats[it.id]&&!D.cards.has(it.id)&&!(it.mod==='w'&&it.kind==='p');
  if(isNew) return renderCard(it,head,total);
  main.innerHTML=`
    <div class="drill">
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="btn ghost small" id="quit">Terminar</button><span class="muted small">${total?`${D.i+1} de ${total}`:`${D.done} hechas · ${D.ok} bien`}</span></div>
      <div class="prog"><i style="width:${total?100*D.i/total:0}%"></i></div>
      <div class="prompt-roles">${head}</div>
      <div class="prompt-big">${big}</div>
      <div class="prompt-hint">${hint}</div>
      ${it.mod==='w'&&it.kind==='r'?choiceHTML(it):`<form class="answer" id="af" autocomplete="off"><input id="ans" name="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Tu respuesta" placeholder="Escribe la respuesta" enterkeyhint="go"><button class="btn" id="chk" type="submit">Comprobar</button></form>`}
      <div class="fb" id="fb" role="status"></div>

function check(){
  const it=D.queue[D.i],inp=$('#ans'),fb=$('#fb');
  const ok=it.mod==='w'?it.word.alts.some(a=>normW(a)===normW(inp.value)):norm(inp.value)===it.form;
  record(it.id,ok);D.done++;if(ok)D.ok++;else D.wrong.push({it,given:inp.value.trim()});
  if(!ok && D.n!==Infinity && !D.retry.includes(it.id)){D.retry.push(it.id);D.queue.splice(Math.min(D.queue.length,D.i+4),0,it)}
  inp.classList.add(ok?'ok':'bad');inp.readOnly=true;
  const why=it.mod==='v'?WHY[it.g]:it.mod==='w'?`${it.form} = ${it.es}`:it.c.rule;
  fb.className='fb show '+(ok?'ok':'bad');
  fb.innerHTML=ok?`<strong>Ondo!</strong> <span class="form">${it.form}</span>`
    :`<strong>${inp.value.trim()?'No es así.':'La respuesta es:'}</strong> <span class="form">${it.form}</span><div class="why">${esc(why)}</div>`;
  $('#chk').textContent='Siguiente';
  D.state='shown';
}
function next(){D.i++;renderItem()}
function normW(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,]/g,'').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim()}
function choiceHTML(it){
  const same=WORDS.filter(w=>w.th===it.g&&w.es!==it.es),pool=same.length>=3?same:WORDS.filter(w=>w.es!==it.es);
  const opts=[it.es];while(opts.length<4){const c=pool[Math.floor(Math.random()*pool.length)].es;if(!opts.includes(c))opts.push(c)}
  opts.sort(()=>Math.random()-.5);D.opts=opts;
  return `<div class="choices">${opts.map((o,i)=>`<button class="choice" data-i="${i}"><kbd>${i+1}</kbd>${esc(o)}</button>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn ghost" id="chk">No lo sé</button></div>`;
}
function bindChoices(it){
  const pick=i=>{if(D.state!=='ask'){next();return}
    const ok=i!==null&&D.opts[i]===it.es;record(it.id,ok);D.done++;if(ok)D.ok++;else D.wrong.push({it,given:i===null?'':D.opts[i]});
    if(!ok&&D.n!==Infinity&&!D.retry.includes(it.id)){D.retry.push(it.id);D.queue.splice(Math.min(D.queue.length,D.i+4),0,it)}
    document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;const o=D.opts[+b.dataset.i];if(o===it.es)b.classList.add('ok');else if(+b.dataset.i===i)b.classList.add('bad')});
    const fb=$('#fb');fb.className='fb show '+(ok?'ok':'bad');fb.innerHTML=`<strong>${ok?'Ondo!':'Era:'}</strong> <span class="form">${esc(it.form)}</span> = ${esc(it.es)}`;
    $('#chk').textContent='Siguiente';$('#chk').className='btn';D.state='shown';};
  document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  $('#chk').onclick=()=>pick(null);
  document.onkeydown=e=>{if(view!=='drill-w'&&!document.querySelector('.choices'))return;if(e.key>='1'&&e.key<='4'&&D.state==='ask'){e.preventDefault();pick(+e.key-1)}else if(e.key==='Enter'){e.preventDefault();if(D.state==='ask')pick(null);else next()}};
}

let LESSONS={"a1-01":{"id":"a1-01","lvl":"A1","n":1,"title":"Soinuak","es":"Cómo suena el euskera","goal":"Leer cualquier palabra en euskera con una pronunciación reconocible.","explain":[{"h":"Antes de empezar","p":"Si es tu primer contacto con el euskera, esta lección no te pide memorizar nada: solo te enseña a leer en voz alta. El euskera usa el mismo alfabeto que el español, pero sus palabras propias no llevan c, q, v, w ni y, y tiene algunas combinaciones de letras nuevas (tx, tz, ts). En cuanto conozcas esas pocas diferencias, podrás leer cualquier frase de las lecciones siguientes."},{"h":"Una buena noticia","p":"El euskera se escribe casi como se pronuncia: cada letra suena siempre igual. Si aprendes una docena de reglas, puedes leer en voz alta cualquier texto desde hoy."},{"h":"Las letras que cambian respecto al español","table":{"head":["Letra","Suena como…","Ejemplo"],"rows":[["tx","la «ch» de «chico»","**tx**akur (perro), e**tx**e (casa)"],["x","«sh», como en inglés «show»","kai**x**o (hola)"],["z","una «s» suave, con la punta de la lengua abajo (como la «s» andaluza o latinoamericana)","**z**ortzi (ocho), **z**u (tú)"],["s","la «s» castellana, con la punta de la lengua arriba","**s**ei (seis), **s**agar (manzana)"],["tz","«ts» suave: t + z","hi**tz** (palabra), zor**tz**i (ocho)"],["ts","«ts» fuerte: t + s","o**ts**o (lobo), i**ts**aso (mar)"],["j","en batua se acepta como la «y» o como la «j» española","**j**an (comer)"],["h","normalmente muda","**h**amar (diez) suena «amar»"],["g","siempre dura, también delante de e/i","**g**ela (habitación), **g**izon (hombre)"],["k","sustituye a «c» y «qu»: el euskera no usa c ni q","**k**ale (calle), **k**afe (café)"]]}},{"h":"Los diptongos","p":"**ai, ei, oi, au, eu** se pronuncian en una sola sílaba y cada vocal se oye: **eu**skara (e-u), **au**to, **ai**ta (padre). La «r» simple entre vocales es suave (ere); la doble **rr** es fuerte (txakurra)."},{"h":"El acento","p":"El euskera no marca acentos gráficos y su acento es suave. Lo más importante es no exagerarlo: muchos estudiantes «españolizan» las palabras con un golpe de voz muy marcado, y suena robótico. En batua, una pauta segura es un acento ligero en la segunda sílaba: etxéa, gizóna, euskára. Escuchar mucho euskera real (radio, EITB, podcasts) es lo que más ayuda aquí."},{"h":"Paso a paso: leer una palabra nueva","p":"Toma **zortzi** (ocho): 1) busca las combinaciones especiales: **tz**; 2) lee el resto como en español: **z-o-r-tz-i**; 3) recuerda que la **z** es una «s» suave; 4) da un acento ligero, sin golpe de voz: «sór-tsi». Haz lo mismo con **etxea**: e-**tx**-e-a → «e-ché-a»."},{"h":"Errores típicos","p":"Leer la **z** como la «z» castellana (como en «zapato»): en euskera nunca suena así. Pronunciar la **h** como una «j». Leer la **x** como «ks»: kaixo es «kai-sho». Marcar un acento fuerte como en español."},{"h":"Resumen","p":"**tx** = ch · **x** = sh · **z** = s suave · **tz / ts** = ts · **h** muda · **g** siempre dura · **k** en lugar de c/q · acento suave."}],"examples":[["kaixo","hola"],["etxea","la casa"],["zortzi","ocho"],["hitza","la palabra"],["txakurra","el perro"],["euskara","el euskera"],["hamaika","once"],["gizona","el hombre"]],"dialog":{"title":"Un saludo en la calle","lines":[["Ane","Kaixo, Mikel!","¡Hola, Mikel!"],["Mikel","Kaixo, Ane! Zer moduz?","¡Hola, Ane! ¿Qué tal?"],["Ane","Ondo, eskerrik asko. Eta zu?","Bien, muchas gracias. ¿Y tú?"],["Mikel","Ni ere ondo.","Yo también bien."],["Ane","Gero arte!","¡Hasta luego!"],["Mikel","Agur!","¡Adiós!"]]},"exercises":[{"type":"choice","q":"¿Cómo suena «tx» en txakur?","options":["Como «ch» en «chico»","Como «ts»","Como «sh»"],"a":0,"why":"tx = «ch» española."},{"type":"choice","q":"¿Qué palabra tiene el sonido «sh»?","options":["kaixo","zortzi","sagar"],"a":0,"why":"La x de kaixo suena «sh»."},{"type":"choice","q":"¿Cómo se pronuncia hamar (diez)?","options":["«amar», la h es muda","«jamar»","«hamar» con h aspirada fuerte"],"a":0,"why":"En la mayoría de hablantes la h es muda."},{"type":"choice","q":"¿Cómo suena la g de gela (habitación)?","options":["Dura, como en «gato»","Como la j de «jefe»","Como la y"],"a":0,"why":"La g siempre es dura en euskera."},{"type":"choice","q":"¿Cómo se escribe «café» en euskera?","options":["kafe","cafe","qafe"],"a":0,"why":"El euskera usa k en lugar de c y qu."},{"type":"choice","q":"¿Cuántas sílabas tiene euskara?","options":["Tres: eus-ka-ra","Cuatro: e-us-ka-ra","Dos: eus-kara"],"a":0,"why":"eu es un diptongo: se pronuncia en una sola sílaba."},{"type":"match","pairs":[["tx","«ch»"],["x","«sh»"],["tz","«ts» suave"],["h","muda"],["k","«c» de casa"]]}],"create":{"prompt":"Escribe un mini diálogo de saludo de 4 líneas usando lo que has visto (kaixo, zer moduz, ondo, eskerrik asko, agur…).","focus":"saludos básicos y ortografía (tx, x, z, k)"},"links":{"verbs":[],"cases":[],"themes":["agurrak","zenbakiak"]}},"a1-02":{"id":"a1-02","lvl":"A1","n":2,"title":"Kaixo!","es":"Presentarse","goal":"Decir quién eres, de dónde eres y a qué te dedicas.","explain":[{"h":"Antes de empezar","p":"No necesitas saber nada de euskera para esta lección. Vas a aprender un solo verbo, **izan** (ser), y tres trucos para presentarte. Piensa en el verbo como en una pieza que casi siempre va al final de la frase: primero dices de quién hablas y qué es, y al final pones la pieza que significa «soy», «eres» o «es»."},{"h":"El verbo izan (ser) en presente","p":"Es el primer verbo que necesitas. Cambia según quién es el sujeto, que en euskera se llama {nor:NOR}.","table":{"head":["NOR","izan","Español"],"rows":[["ni","{nor:naiz}","yo soy"],["zu","{nor:zara}","tú eres"],["hura","{nor:da}","él / ella es"],["gu","{nor:gara}","nosotros somos"],["zuek","{nor:zarete}","vosotros sois"],["haiek","{nor:dira}","ellos son"]]}},{"h":"El verbo va al final","p":"El orden normal es sujeto + lo que dices de él + verbo: **Ni Mikel naiz** (yo soy Mikel). El pronombre se puede omitir, porque el verbo ya indica la persona: **Mikel naiz** también es correcto."},{"h":"Profesiones: con artículo","p":"En español decimos «soy profesor», sin artículo. En euskera hace falta el artículo **-a** (o **-ak** en plural): **Irakaslea naiz** (soy profesor), **Ikasleak gara** (somos estudiantes). Es un error muy típico de los hispanohablantes."},{"h":"De dónde eres: -ko + -a","p":"Para decir de dónde eres se añade **-koa** al lugar (**-koak** en plural): **Bilbokoa naiz** (soy de Bilbao), **Donostiakoa naiz** (soy de San Sebastián), **Gasteizkoa naiz** (soy de Vitoria-Gasteiz). Detrás de n o l se usa **-goa**: **Madrilgoa naiz**. La pregunta es **Nongoa zara?** (¿de dónde eres?)."},{"h":"Paso a paso: «Soy de Bilbao»","p":"1) Toma el lugar: **Bilbo**. 2) Añade **-ko** («de»): **Bilboko**. 3) Añade el artículo **-a**: **Bilbokoa**. 4) Termina con el verbo de «yo»: **Bilbokoa naiz**. Para «somos de Bilbao» cambia el artículo a plural y el verbo a «nosotros»: **Bilbokoak gara**."},{"h":"Errores típicos","p":"*Irakasle naiz* → **Irakaslea naiz** (las profesiones llevan artículo). *Naiz Mikel* → **Mikel naiz** (el verbo va al final). *Bilbon naiz* para «soy de Bilbao» → **Bilbokoa naiz** (Bilbon significa «en Bilbao»)."},{"h":"Resumen","p":"ni **naiz** · zu **zara** · hura **da** · gu **gara** · zuek **zarete** · haiek **dira**. Profesión + **-a**: irakaslea naiz. Origen: lugar + **-koa**: Donostiakoa naiz. Pregunta: **Nongoa zara?**"}],"examples":[["Ni Mikel naiz.","Yo soy Mikel."],["Zu nor zara?","¿Tú quién eres?"],["Donostiakoa naiz.","Soy de San Sebastián."],["Ane irakaslea da.","Ane es profesora."],["Gu ikasleak gara.","Nosotros somos estudiantes."],["Haiek Bilbokoak dira.","Ellos son de Bilbao."],["Zuek nongoak zarete?","¿Vosotros de dónde sois?"]],"dialog":{"title":"El primer día en el euskaltegi","lines":[["Mikel","Kaixo! Ni Mikel naiz. Zu nor zara?","¡Hola! Yo soy Mikel. ¿Tú quién eres?"],["Ane","Kaixo, Mikel! Ni Ane naiz.","¡Hola, Mikel! Yo soy Ane."],["Mikel","Nongoa zara, Ane?","¿De dónde eres, Ane?"],["Ane","Donostiakoa naiz. Eta zu?","Soy de San Sebastián. ¿Y tú?"],["Mikel","Ni Bilbokoa naiz. Ikaslea zara?","Yo soy de Bilbao. ¿Eres estudiante?"],["Ane","Ez, irakaslea naiz!","¡No, soy profesora!"],["Mikel","Ondo! Ni ikaslea naiz.","¡Bien! Yo soy estudiante."]]},"exercises":[{"type":"gap","q":"Ni Ane ___.","es":"Yo soy Ane.","a":["naiz"],"hint":"Mira quién es el sujeto y busca su forma: ni → naiz, zu → zara, hura (o un nombre) → da, gu → gara, zuek → zarete, haiek → dira."},{"type":"gap","q":"Zu nor ___?","es":"¿Tú quién eres?","a":["zara"],"hint":"Mira quién es el sujeto y busca su forma: ni → naiz, zu → zara, hura (o un nombre) → da, gu → gara, zuek → zarete, haiek → dira."},{"type":"gap","q":"Mikel ikaslea ___.","es":"Mikel es estudiante.","a":["da"],"hint":"Mira quién es el sujeto y busca su forma: ni → naiz, zu → zara, hura (o un nombre) → da, gu → gara, zuek → zarete, haiek → dira."},{"type":"gap","q":"Gu Bilbokoak ___.","es":"Nosotros somos de Bilbao.","a":["gara"],"hint":"Mira quién es el sujeto y busca su forma: ni → naiz, zu → zara, hura (o un nombre) → da, gu → gara, zuek → zarete, haiek → dira."},{"type":"gap","q":"Zuek nongoak ___?","es":"¿Vosotros de dónde sois?","a":["zarete"],"hint":"Mira quién es el sujeto y busca su forma: ni → naiz, zu → zara, hura (o un nombre) → da, gu → gara, zuek → zarete, haiek → dira."},{"type":"gap","q":"Haiek irakasleak ___.","es":"Ellos son profesores.","a":["dira"],"hint":"Mira quién es el sujeto y busca su forma: ni → naiz, zu → zara, hura (o un nombre) → da, gu → gara, zuek → zarete, haiek → dira."},{"type":"choice","q":"«Soy profesor»","options":["Irakaslea naiz.","Irakasle naiz.","Irakaslea da."],"a":0,"why":"Las profesiones llevan artículo (-a) y «yo soy» es naiz."},{"type":"choice","q":"«Soy de Vitoria-Gasteiz»","options":["Gasteizkoa naiz.","Gasteiz naiz.","Gasteizen naiz."],"a":0,"why":"Origen: lugar + -koa. Gasteizen significa «en Gasteiz»."},{"type":"choice","q":"«Somos estudiantes»","options":["Ikasleak gara.","Ikaslea gara.","Ikasleak dira."],"a":0,"why":"Plural: -ak con gara (nosotros)."},{"type":"order","words":["Donostiakoa","naiz","Ni"],"a":["Ni Donostiakoa naiz","Donostiakoa naiz ni"],"es":"Yo soy de San Sebastián.","hint":"El verbo (naiz, zara, gara…) va al final; el pronombre suele ir al principio."},{"type":"order","words":["ikasleak","gara","Gu"],"a":["Gu ikasleak gara","Ikasleak gara gu"],"es":"Nosotros somos estudiantes.","hint":"El verbo (naiz, zara, gara…) va al final; el pronombre suele ir al principio."},{"type":"order","words":["zara","nor","Zu"],"a":["Zu nor zara","Nor zara zu"],"es":"¿Tú quién eres?","hint":"El verbo (naiz, zara, gara…) va al final; el pronombre suele ir al principio."},{"type":"match","pairs":[["naiz","yo soy"],["zara","tú eres"],["da","él / ella es"],["gara","somos"],["zarete","sois"],["dira","son"]]}],"create":{"prompt":"Preséntate en 3 o 4 frases: tu nombre, de dónde eres y a qué te dedicas (busca tu profesión en Hiztegia › Lana si la necesitas).","focus":"izan en presente (naiz, zara, da…), origen con -koa, profesiones con artículo"},"links":{"verbs":["nor-pres"],"cases":["abs"],"themes":["agurrak","pertsonak","lana"]}},"a1-03":{"id":"a1-03","lvl":"A1","n":3,"title":"Hau zer da?","es":"El artículo y los demostrativos","goal":"Nombrar cosas y personas, y señalar «esto, eso, aquello».","explain":[{"h":"Antes de empezar","p":"El euskera no tiene palabras sueltas como «el, la, un». Lo que hace es **pegar trozos al final de las palabras**. Esta idea es la clave de todo el idioma: más adelante verás que también «en», «a», «con» o «para» se pegan al final. Hoy la descubres con lo más sencillo: el artículo."},{"h":"El artículo va pegado al final","p":"El euskera no tiene «el, la, los, las» delante de la palabra: los añade al final. **-a** para el singular y **-ak** para el plural. Y no hay género: lo mismo sirve para «el» que para «la».","table":{"head":["Palabra","Singular","Plural"],"rows":[["etxe (casa)","etxe**a** (la casa)","etxe**ak** (las casas)"],["gizon (hombre)","gizon**a** (el hombre)","gizon**ak** (los hombres)"],["neska (chica)","neska (la chica)","neska**k** (las chicas)"],["txakur (perro)","txakur**ra** (el perro)","txakur**rak** (los perros)"]]}},{"h":"Dos detalles","p":"Si la palabra ya acaba en **-a**, esa a hace de artículo: **neska** es «chica» y también «la chica». Algunas palabras acabadas en -r doblan la r: **txakurra**, **lurra**. Para decir «un / una» se añade **bat** detrás y sin artículo: **etxe bat** (una casa)."},{"h":"Este, ese, aquel","table":{"head":["","Singular","Plural"],"rows":[["cerca de mí (este)","**hau**","**hauek**"],["cerca de ti (ese)","**hori**","**horiek**"],["lejos (aquel)","**hura**","**haiek**"]]},"p":"Van **detrás** del nombre, y entonces el artículo desaparece: **etxe hau** (esta casa), nunca *etxea hau*. Solos funcionan como pronombres: **Hau zer da?** (¿qué es esto?)."},{"h":"El adjetivo también va detrás","p":"El adjetivo sigue al nombre y el artículo se pone al final del grupo entero: **etxe handia** (la casa grande), **etxe handiak** (las casas grandes), **etxe handi hau** (esta casa grande)."},{"h":"Paso a paso: «esta casa grande»","p":"1) El nombre: **etxe**. 2) El adjetivo detrás: **etxe handi**. 3) El demostrativo al final: **etxe handi hau**. No se pone artículo, porque **hau** ya hace ese papel. Si en lugar de «esta» fuera «la», el artículo se pegaría al final del grupo: **etxe handia**."},{"h":"Errores típicos","p":"*etxea hau* → **etxe hau** (con demostrativo no hay artículo). *handia etxea* → **etxe handia** (el adjetivo va detrás). *etxea bat* → **etxe bat** («un/una» va sin artículo). *neskaa* → **neska** (si la palabra ya acaba en -a, no se añade otra)."},{"h":"Resumen","p":"Singular **-a**, plural **-ak**. Sin género. **bat** = un/una, detrás y sin artículo. **hau / hori / hura** (este / ese / aquel) y sus plurales **hauek / horiek / haiek**, siempre detrás del nombre. Orden del grupo: nombre + adjetivo + artículo o demostrativo."}],"examples":[["Hau etxea da.","Esto es la casa."],["Etxe hau handia da.","Esta casa es grande."],["Hori txakurra da.","Eso es un perro."],["Liburu hauek berriak dira.","Estos libros son nuevos."],["Mahai bat.","Una mesa."],["Neska hori Ane da.","Esa chica es Ane."],["Hura mendia da.","Aquello es el monte."]],"dialog":{"title":"En un piso nuevo","lines":[["Jon","Hau zer da?","¿Esto qué es?"],["Miren","Hori egongela da. Handia da, ezta?","Eso es el salón. Es grande, ¿no?"],["Jon","Bai, oso handia! Eta hura?","¡Sí, muy grande! ¿Y aquello?"],["Miren","Hura sukaldea da.","Aquello es la cocina."],["Jon","Leiho hauek berriak dira?","¿Estas ventanas son nuevas?"],["Miren","Bai, eta oso politak dira.","Sí, y son muy bonitas."]]},"exercises":[{"type":"gap","q":"etxe → «la casa»: etxe___","es":"la casa","a":["a"],"full":true,"hint":"Recuerda: -a para «el/la», -ak para «los/las». hau = este. Si el sujeto es singular, el verbo es da; si es plural, dira."},{"type":"gap","q":"liburu → «los libros»: liburu___","es":"los libros","a":["ak"],"full":true,"hint":"Recuerda: -a para «el/la», -ak para «los/las». hau = este. Si el sujeto es singular, el verbo es da; si es plural, dira."},{"type":"gap","q":"Etxe ___ handia da.","es":"Esta casa es grande.","a":["hau"],"hint":"Recuerda: -a para «el/la», -ak para «los/las». hau = este. Si el sujeto es singular, el verbo es da; si es plural, dira."},{"type":"gap","q":"Hori zer ___?","es":"¿Eso qué es?","a":["da"],"hint":"Recuerda: -a para «el/la», -ak para «los/las». hau = este. Si el sujeto es singular, el verbo es da; si es plural, dira."},{"type":"gap","q":"Hauek zer ___?","es":"¿Estos qué son?","a":["dira"],"hint":"Recuerda: -a para «el/la», -ak para «los/las». hau = este. Si el sujeto es singular, el verbo es da; si es plural, dira."},{"type":"choice","q":"«Esta casa»","options":["etxe hau","etxea hau","hau etxea"],"a":0,"why":"El demostrativo va detrás y sustituye al artículo."},{"type":"choice","q":"«Una mesa»","options":["mahai bat","mahaia bat","bat mahai"],"a":0,"why":"bat va detrás y sin artículo."},{"type":"choice","q":"«La chica»","options":["neska","neskaa","neskak"],"a":0,"why":"neska ya acaba en -a: la misma forma es «la chica». neskak es plural."},{"type":"choice","q":"«La casa grande»","options":["etxe handia","etxea handia","handia etxea"],"a":0,"why":"Adjetivo detrás y artículo al final del grupo."},{"type":"order","words":["handia","da","Etxe","hau"],"a":["Etxe hau handia da"],"es":"Esta casa es grande.","hint":"Orden del grupo: nombre + demostrativo (Etxe hau…). El verbo da o dira al final."},{"type":"order","words":["berriak","Liburu","dira","hauek"],"a":["Liburu hauek berriak dira"],"es":"Estos libros son nuevos.","hint":"Orden del grupo: nombre + demostrativo (Etxe hau…). El verbo da o dira al final."},{"type":"order","words":["zer","Hau","da"],"a":["Hau zer da","Zer da hau"],"es":"¿Esto qué es?","hint":"Orden del grupo: nombre + demostrativo (Etxe hau…). El verbo da o dira al final."},{"type":"match","pairs":[["hau","este / esto"],["hori","ese / eso"],["hura","aquel / aquello"],["hauek","estos"],["horiek","esos"],["haiek","aquellos"]]}],"create":{"prompt":"Mira a tu alrededor y describe 3 objetos con frases como «Hau … da» o «… hau handia / txikia / berria da». Puedes usar Hiztegia › Etxea, Koloreak y Adjektiboak.","focus":"artículo -a/-ak, demostrativos detrás del nombre, adjetivo detrás"},"links":{"verbs":["nor-pres"],"cases":["abs"],"themes":["etxea","koloreak","adjektiboak"]}},"a1-04":{"id":"a1-04","lvl":"A1","n":4,"title":"Galderak","es":"Hacer preguntas","goal":"Preguntar quién, qué, dónde, cómo y cuánto, y entender las respuestas.","explain":[{"h":"Antes de empezar","p":"Preguntar es lo que más vas a necesitar al principio, y en euskera es muy regular. No tienes que cambiar el verbo para hacer una pregunta: solo colocas la palabra interrogativa en su sitio, que es **justo antes del verbo**."},{"h":"La regla de oro","p":"La palabra interrogativa va **justo delante del verbo**, sin nada entre medias: **Non bizi zara?** (¿dónde vives?). Decir *Non zara bizi?* es incorrecto. Esta regla se mantiene en todo el euskera: lo que preguntas, o lo que quieres destacar, se coloca inmediatamente antes del verbo."},{"h":"Las palabras para preguntar","table":{"head":["Euskera","Español"],"rows":[["nor","quién"],["zer","qué"],["non","dónde"],["nora","adónde"],["nondik","de dónde"],["noiz","cuándo"],["nola","cómo"],["zergatik","por qué"],["zenbat","cuánto / cuántos"],["zein","cuál"]]}},{"h":"Preguntas de sí o no","p":"Se forman igual que la afirmación, solo cambia la entonación: **Ikaslea zara?** (¿eres estudiante?). Se responde **Bai** (sí) o **Ez** (no), y lo natural es repetir el verbo: **Bai, ikaslea naiz.**"},{"h":"Frases hechas útiles","p":"Algunas preguntas usan verbos que verás más adelante. De momento apréndelas como bloques: **Non bizi zara?** (¿dónde vives?) → **Bilbon bizi naiz** (vivo en Bilbao). **Nola zaude?** (¿cómo estás?) → **Ondo nago** (estoy bien). **Zein da zure izena?** (¿cuál es tu nombre?)."},{"h":"Paso a paso: «¿De dónde eres?»","p":"1) Piensa en la respuesta modelo: **Bilbokoa naiz**. 2) Sustituye la información que no sabes por la palabra interrogativa: Bilbokoa → **Nongoa**. 3) Cambia la persona del verbo: naiz → **zara**. 4) Resultado: **Nongoa zara?** La interrogativa y el verbo quedan juntos."},{"h":"Errores típicos","p":"*Non zara bizi?* → **Non bizi zara?** (bizi va pegado al verbo, y la pregunta justo delante). *Zer hau da?* → **Zer da hau?** o **Hau zer da?** *Nor zu zara?* → **Nor zara (zu)?**"},{"h":"Resumen","p":"**nor** quién · **zer** qué · **non** dónde · **nora** adónde · **nondik** de dónde · **noiz** cuándo · **nola** cómo · **zergatik** por qué · **zenbat** cuánto · **zein** cuál. Regla: interrogativa + verbo, juntos. Las preguntas de sí o no solo cambian la entonación."}],"examples":[["Nor da hura?","¿Quién es aquel?"],["Hura Mikel da.","Aquel es Mikel."],["Zer da hau?","¿Qué es esto?"],["Non bizi zara?","¿Dónde vives?"],["Gasteizen bizi naiz.","Vivo en Vitoria-Gasteiz."],["Nola zaude?","¿Cómo estás?"],["Ondo nago, eskerrik asko.","Estoy bien, gracias."],["Zein da zure izena?","¿Cuál es tu nombre?"]],"dialog":{"title":"En una cafetería","lines":[["Nerea","Kaixo! Zein da zure izena?","¡Hola! ¿Cuál es tu nombre?"],["Jon","Jon. Eta zurea?","Jon. ¿Y el tuyo?"],["Nerea","Nerea. Non bizi zara, Jon?","Nerea. ¿Dónde vives, Jon?"],["Jon","Gasteizen bizi naiz. Eta zu?","Vivo en Vitoria-Gasteiz. ¿Y tú?"],["Nerea","Ni Bilbon bizi naiz. Nor da hura?","Yo vivo en Bilbao. ¿Quién es aquella?"],["Jon","Hura Ane da, irakaslea.","Aquella es Ane, la profesora."],["Nerea","Eta nongoa da?","¿Y de dónde es?"],["Jon","Donostiakoa da.","Es de San Sebastián."]]},"exercises":[{"type":"gap","q":"___ da hau?","es":"¿Qué es esto?","a":["zer"],"hint":"qué = zer · dónde = non · quién = nor · cómo = nola · cuánto(s) = zenbat."},{"type":"gap","q":"___ bizi zara?","es":"¿Dónde vives?","a":["non"],"hint":"qué = zer · dónde = non · quién = nor · cómo = nola · cuánto(s) = zenbat."},{"type":"gap","q":"___ da hura?","es":"¿Quién es aquel?","a":["nor"],"hint":"qué = zer · dónde = non · quién = nor · cómo = nola · cuánto(s) = zenbat."},{"type":"gap","q":"___ zaude?","es":"¿Cómo estás?","a":["nola"],"hint":"qué = zer · dónde = non · quién = nor · cómo = nola · cuánto(s) = zenbat."},{"type":"gap","q":"___ dira?","es":"¿Cuántos son?","a":["zenbat"],"hint":"qué = zer · dónde = non · quién = nor · cómo = nola · cuánto(s) = zenbat."},{"type":"choice","q":"«¿Dónde vives?»","options":["Non bizi zara?","Non zara bizi?","Bizi non zara?"],"a":0,"why":"La interrogativa va justo antes del verbo (bizi zara)."},{"type":"choice","q":"«¿Quién es aquel?»","options":["Nor da hura?","Hura da nor?","Nor hura da?"],"a":0,"why":"Nor + verbo juntos. Hura nor da? también sería correcto, pero no está entre las opciones."},{"type":"choice","q":"Respuesta natural a «Ikaslea zara?»","options":["Bai, ikaslea naiz.","Bai, ikaslea da.","Bai, naiz."],"a":0,"why":"Se responde repitiendo el verbo en la persona correcta."},{"type":"order","words":["bizi","zara","Non"],"a":["Non bizi zara"],"es":"¿Dónde vives?","hint":"La palabra interrogativa va justo antes del verbo, y bizi va pegado a naiz/zara."},{"type":"order","words":["hura","Nor","da"],"a":["Nor da hura","Hura nor da"],"es":"¿Quién es aquel?","hint":"La palabra interrogativa va justo antes del verbo, y bizi va pegado a naiz/zara."},{"type":"order","words":["Gasteizen","naiz","bizi"],"a":["Gasteizen bizi naiz"],"es":"Vivo en Vitoria-Gasteiz.","hint":"La palabra interrogativa va justo antes del verbo, y bizi va pegado a naiz/zara."},{"type":"match","pairs":[["nor","quién"],["zer","qué"],["non","dónde"],["noiz","cuándo"],["nola","cómo"],["zergatik","por qué"]]}],"create":{"prompt":"Escribe 4 preguntas que le harías a alguien que acabas de conocer y respóndelas tú como si fueras esa persona.","focus":"interrogativas justo antes del verbo, izan en presente, frases hechas (bizi naiz, nago)"},"links":{"verbs":["nor-pres"],"cases":["ine"],"themes":["galderak","agurrak"]}},"a1-05":{"id":"a1-05","lvl":"A1","n":5,"title":"Ez!","es":"La negación","goal":"Decir que algo no es así, responder que no y decir «yo también» o «yo tampoco».","explain":[{"h":"Antes de empezar","p":"Para negar en euskera basta con una palabra: **ez** (no). Lo interesante es que, al negar, **el verbo se mueve**: deja de ir al final y pasa a ir justo detrás de **ez**. Es el segundo gran cambio de orden que aprendes, después de las preguntas."},{"h":"La regla","p":"Afirmativa: **Irakaslea naiz** (soy profesor), con el verbo al final. Negativa: **Ez naiz irakaslea** (no soy profesor). **ez + verbo** van juntos y delante, y el resto de la frase va detrás. Si hay sujeto, se queda al principio: **Ni ez naiz irakaslea**."},{"h":"Con verbos de dos piezas","p":"En frases como **Bilbon bizi naiz** (vivo en Bilbao), el verbo tiene dos piezas: **bizi** y **naiz**. Al negar, solo **naiz** se va con ez, y **bizi** se queda al final: **Ez naiz Bilbon bizi**. Este patrón se repetirá con todos los tiempos compuestos que aprendas más adelante (ikusi dut → ez dut ikusi).","table":{"head":["Afirmativa","Negativa"],"rows":[["Irakaslea naiz.","**Ez naiz** irakaslea."],["Bilbokoak gara.","**Ez gara** Bilbokoak."],["Etxean nago.","**Ez nago** etxean."],["Bilbon bizi naiz.","**Ez naiz** Bilbon bizi."]]}},{"h":"Respuestas cortas","p":"**Bai** (sí) y **Ez** (no). Para «yo también»: **Ni ere bai**. Para «yo tampoco»: **Ni ere ez**. Para pedir confirmación, «¿verdad?»: **ezta?** al final (Bilbokoa zara, ezta?). Al hablar, **ez da** suena casi como «ezta», pero se escribe separado."},{"h":"Paso a paso: «No soy de Bilbao»","p":"1) Frase afirmativa: **Bilbokoa naiz**. 2) Pon **ez** delante del verbo: ez naiz. 3) Lleva ese bloque al principio: **Ez naiz**. 4) Añade el resto detrás: **Ez naiz Bilbokoa**."},{"h":"Errores típicos","p":"*Ez irakaslea naiz* → **Ez naiz irakaslea** (ez y el verbo van juntos). *Ez naiz bizi Bilbon* → **Ez naiz Bilbon bizi** (bizi se queda al final). *Ni ez ere* → **Ni ere ez**."},{"h":"Resumen","p":"Negar = **ez + verbo** delante, y el resto detrás. Con dos piezas (bizi naiz), solo la segunda se mueve. **Ni ere bai** (yo también), **Ni ere ez** (yo tampoco), **ezta?** (¿verdad?)."}],"examples":[["Ez naiz Mikel.","No soy Mikel."],["Hau ez da eskola.","Esto no es la escuela."],["Gu ez gara Bilbokoak.","No somos de Bilbao."],["Ez naiz Gasteizen bizi.","No vivo en Vitoria-Gasteiz."],["Ez nago ondo.","No estoy bien."],["Ikaslea zara, ezta?","Eres estudiante, ¿verdad?"],["Ni ere ez.","Yo tampoco."]],"dialog":{"title":"Una confusión","lines":[["Jon","Kaixo! Zu Ane zara?","¡Hola! ¿Tú eres Ane?"],["Miren","Ez, ez naiz Ane. Miren naiz.","No, no soy Ane. Soy Miren."],["Jon","Barkatu! Bilbokoa zara?","¡Perdona! ¿Eres de Bilbao?"],["Miren","Ez, ez naiz Bilbokoa. Gasteizkoa naiz.","No, no soy de Bilbao. Soy de Vitoria-Gasteiz."],["Jon","Eta irakaslea zara, ezta?","Y eres profesora, ¿verdad?"],["Miren","Ez, ez naiz irakaslea. Ikaslea naiz.","No, no soy profesora. Soy estudiante."],["Jon","Ni ere bai!","¡Yo también!"]]},"exercises":[{"type":"gap","q":"Ez ___ irakaslea.","es":"No soy profesor.","a":["naiz"],"hint":"Primero piensa en la forma afirmativa del verbo (naiz, zara, da, gara, zarete, dira); en negativa es la misma forma, solo que va detrás de ez."},{"type":"gap","q":"Gu ez ___ Bilbokoak.","es":"No somos de Bilbao.","a":["gara"],"hint":"Primero piensa en la forma afirmativa del verbo (naiz, zara, da, gara, zarete, dira); en negativa es la misma forma, solo que va detrás de ez."},{"type":"gap","q":"Hau ez ___ eskola.","es":"Esto no es la escuela.","a":["da"],"hint":"Primero piensa en la forma afirmativa del verbo (naiz, zara, da, gara, zarete, dira); en negativa es la misma forma, solo que va detrás de ez."},{"type":"gap","q":"Zuek ez ___ ikasleak.","es":"Vosotros no sois estudiantes.","a":["zarete"],"hint":"Primero piensa en la forma afirmativa del verbo (naiz, zara, da, gara, zarete, dira); en negativa es la misma forma, solo que va detrás de ez."},{"type":"gap","q":"___ nago etxean.","es":"No estoy en casa.","a":["ez"],"hint":"Primero piensa en la forma afirmativa del verbo (naiz, zara, da, gara, zarete, dira); en negativa es la misma forma, solo que va detrás de ez."},{"type":"choice","q":"«No soy profesor»","options":["Ez naiz irakaslea.","Ez irakaslea naiz.","Naiz ez irakaslea."],"a":0,"why":"ez y el verbo van juntos, delante del resto."},{"type":"choice","q":"«No vivo en Bilbao»","options":["Ez naiz Bilbon bizi.","Ez Bilbon bizi naiz.","Ez naiz bizi Bilbon."],"a":0,"why":"Solo naiz se va con ez; bizi se queda al final."},{"type":"choice","q":"«Yo tampoco»","options":["Ni ere ez.","Ni ere bai.","Ni ez ere."],"a":0,"why":"ere bai = también; ere ez = tampoco."},{"type":"choice","q":"«Eres de Bilbao, ¿verdad?»","options":["Bilbokoa zara, ezta?","Ez zara Bilbokoa, bai?","Bilbokoa ez zara?"],"a":0,"why":"ezta? al final pide confirmación."},{"type":"order","words":["naiz","Ez","irakaslea"],"a":["Ez naiz irakaslea"],"es":"No soy profesor.","hint":"ez + verbo van juntos y delante; lo demás va detrás. Si hay pronombre, va al principio."},{"type":"order","words":["naiz","Ez","Bilbon","bizi"],"a":["Ez naiz Bilbon bizi"],"es":"No vivo en Bilbao.","hint":"ez + verbo van juntos y delante; lo demás va detrás. Si hay pronombre, va al principio."},{"type":"order","words":["gara","ez","Gu","Bilbokoak"],"a":["Gu ez gara Bilbokoak"],"es":"Nosotros no somos de Bilbao.","hint":"ez + verbo van juntos y delante; lo demás va detrás. Si hay pronombre, va al principio."},{"type":"match","pairs":[["bai","sí"],["ez","no"],["ni ere bai","yo también"],["ni ere ez","yo tampoco"],["ezta?","¿verdad?"],["ez dakit","no lo sé"]]}],"create":{"prompt":"Escribe 4 frases falsas sobre ti y corrígelas, por ejemplo: «Ez naiz Mikel. Ane naiz.» Usa nombre, origen, profesión y dónde vives.","focus":"negación: ez + verbo delante, bizi naiz → ez naiz … bizi"},"links":{"verbs":["nor-pres"],"cases":[],"themes":["agurrak","lokailuak"]}},"a1-06":{"id":"a1-06","lvl":"A1","n":6,"title":"Zenbakiak","es":"Números, edad y hora","goal":"Contar hasta cien, decir tu edad y preguntar y decir la hora.","explain":[{"h":"Antes de empezar","p":"Los números vascos tienen una particularidad preciosa: se cuenta **de veinte en veinte**, como en el francés «quatre-vingts». Cuarenta es «dos veintes», sesenta «tres veintes»… Una vez entiendes la lógica, ya no hace falta memorizar listas."},{"h":"Del 1 al 20","table":{"head":["1–10","11–20"],"rows":[["1 bat · 2 bi · 3 hiru · 4 lau · 5 bost","11 hamaika · 12 hamabi · 13 hamahiru · 14 hamalau · 15 hamabost"],["6 sei · 7 zazpi · 8 zortzi · 9 bederatzi · 10 hamar","16 hamasei · 17 hamazazpi · 18 hemezortzi · 19 hemeretzi · 20 hogei"]]}},{"h":"De veinte en veinte","p":"**hogei** = 20, **berrogei** = 40 (2×20), **hirurogei** = 60 (3×20), **laurogei** = 80 (4×20). Para sumar se añade **-ta** («y»): **hogeita bat** = 21 (20 y 1), **hogeita hamar** = 30 (20 y 10), **berrogeita bost** = 45 (40 y 5), **laurogeita hemeretzi** = 99. Después: **ehun** = 100, **mila** = 1000."},{"h":"Dónde va el número","p":"**bat** (uno) va **detrás** del nombre: **etxe bat** (una casa). Todos los demás van **delante** y el nombre va sin artículo: **bi etxe** (dos casas), **hiru liburu** (tres libros)."},{"h":"La edad","p":"En euskera, como en español, la edad se «tiene»: **Zenbat urte dituzu?** (¿cuántos años tienes?) → **Hogeita bost urte ditut** (tengo 25 años). De momento apréndelo como bloque: **ditut** (tengo), **dituzu** (tienes), **ditu** (tiene). Es el verbo ukan con objeto plural, que ya ves en Aditzak."},{"h":"La hora","p":"**Zer ordu da?** (¿qué hora es?). La una es **Ordu bata da**; a partir de las dos se usa plural: **Ordu biak dira**, **Hirurak dira**, **Laurak dira**… (fíjate en la -r de hirurak y laurak). **eta erdi** = y media, **eta laurden** = y cuarto, **laurden gutxi** = menos cuarto: **Bostak eta erdi dira** (son las cinco y media), **Seiak laurden gutxi dira** (son las seis menos cuarto)."},{"h":"Paso a paso: 47","p":"1) ¿Cuántos veintes caben? Dos: **berrogei** (40). 2) ¿Cuánto falta? Siete: **zazpi**. 3) Une con -ta: **berrogeita zazpi**. Para 75: tres veintes (**hirurogei**) + quince (**hamabost**) → **hirurogeita hamabost**."},{"h":"Errores típicos","p":"*hiru liburuak* para «tres libros» → **hiru liburu** (sin artículo). *bat etxe* → **etxe bat**. *trenta / hiru hamar* → **hogeita hamar**. *Ordu bi da* → **Ordu biak dira** (plural desde las dos)."},{"h":"Resumen","p":"Base 20: **hogei, berrogei, hirurogei, laurogei**, más **-ta** para sumar. **bat** detrás; el resto delante y sin artículo. Edad: **… urte ditut**. Hora: **Ordu bata da / Ordu biak dira**, **eta erdi**, **eta laurden**, **laurden gutxi**."}],"examples":[["Bi liburu.","Dos libros."],["Etxe bat.","Una casa."],["Zenbat urte dituzu?","¿Cuántos años tienes?"],["Hogeita bost urte ditut.","Tengo veinticinco años."],["Zer ordu da?","¿Qué hora es?"],["Ordu bata da.","Es la una."],["Hirurak eta erdi dira.","Son las tres y media."]],"dialog":{"title":"En la parada del autobús","lines":[["Ane","Barkatu, zer ordu da?","Perdona, ¿qué hora es?"],["Iker","Bostak eta erdi dira.","Son las cinco y media."],["Ane","Eskerrik asko! Berandu da!","¡Gracias! ¡Es tarde!"],["Iker","Bai. Zu ikaslea zara?","Sí. ¿Tú eres estudiante?"],["Ane","Bai, hemezortzi urte ditut. Eta zuk zenbat urte dituzu?","Sí, tengo dieciocho años. ¿Y tú cuántos tienes?"],["Iker","Nik hogeita hamabi.","Yo treinta y dos."]]},"exercises":[{"type":"gap","q":"hogei___ bat","es":"21","a":["ta"],"hint":"Para sumar a un veinte se añade -ta («y»)."},{"type":"gap","q":"Zenbat urte ___?","es":"¿Cuántos años tienes?","a":["dituzu"],"hint":"ditut = tengo, dituzu = tienes, ditu = tiene."},{"type":"gap","q":"Hogeita bost urte ___.","es":"Tengo veinticinco años.","a":["ditut"],"hint":"ditut = tengo, dituzu = tienes, ditu = tiene."},{"type":"gap","q":"Ordu ___ da.","es":"Es la una.","a":["bata"],"hint":"La una es ordu bata; desde las dos se usa plural (biak, hirurak…)."},{"type":"gap","q":"Hirurak eta ___ dira.","es":"Son las tres y media.","a":["erdi"],"hint":"y media = eta erdi · y cuarto = eta laurden."},{"type":"choice","q":"30","options":["hogeita hamar","hiru hamar","hogeita hiru"],"a":0,"why":"30 = 20 + 10 → hogei-ta hamar. hogeita hiru es 23."},{"type":"choice","q":"45","options":["berrogeita bost","laurogeita bost","lau hamar eta bost"],"a":0,"why":"45 = 40 (berrogei) + 5. laurogeita bost es 85."},{"type":"choice","q":"«tres libros»","options":["hiru liburu","liburu hiru","hiru liburuak"],"a":0,"why":"El número va delante y el nombre sin artículo."},{"type":"choice","q":"«un libro»","options":["liburu bat","bat liburu","liburua bat"],"a":0,"why":"bat va detrás y sin artículo."},{"type":"choice","q":"«Son las dos»","options":["Ordu biak dira.","Ordu bi da.","Bi ordu dira."],"a":0,"why":"Desde las dos: plural (biak) y dira."},{"type":"order","words":["urte","ditut","Hogeita","hamar"],"a":["Hogeita hamar urte ditut"],"es":"Tengo treinta años.","hint":"Número + urte + ditut."},{"type":"order","words":["eta","dira","erdi","Laurak"],"a":["Laurak eta erdi dira"],"es":"Son las cuatro y media.","hint":"Hora + eta erdi + dira."},{"type":"match","pairs":[["hogei","20"],["berrogei","40"],["hirurogei","60"],["laurogei","80"],["ehun","100"],["mila","1000"]]}],"create":{"prompt":"Escribe tu edad y la de dos personas de tu familia (por ejemplo «Nik 40 urte ditut. Amak 68 urte ditu.»), y qué hora es ahora.","focus":"números en base 20, edad con ditut/ditu, la hora (ordu bata da / …-ak dira)"},"links":{"verbs":["nn-pres-3"],"cases":[],"themes":["zenbakiak","denbora"]}},"a1-07":{"id":"a1-07","lvl":"A1","n":7,"title":"Non zaude?","es":"egon y el caso NON","goal":"Decir dónde estás, cómo estás y qué hay en un lugar.","explain":[{"h":"Antes de empezar","p":"Igual que el español, el euskera distingue entre **ser** y **estar**. Ya conoces izan (ser). Hoy aprendes **egon** (estar), que sirve para el lugar y para los estados de ánimo. Y aprendes tu primer caso de lugar: la terminación que significa «en»."},{"h":"egon en presente","p":"Es un verbo sintético: se conjuga solo, sin auxiliar. Fíjate en que se repiten las iniciales de siempre (n-, z-, d-, g-).","table":{"head":["NOR","egon","Español"],"rows":[["ni","{nor:nago}","estoy"],["zu","{nor:zaude}","estás"],["hura","{nor:dago}","está / hay"],["gu","{nor:gaude}","estamos"],["zuek","{nor:zaudete}","estáis"],["haiek","{nor:daude}","están / hay"]]}},{"h":"NON: «en» se pega al final","p":"Con nombres comunes se añade **-an** a la palabra: **etxe → etxean** (en casa), **mendi → mendian** (en el monte), **kale → kalean**. Si la palabra acaba en -a, solo **-n**: **eskola → eskolan**. Si acaba en consonante, **-ean**: **zuhaitz → zuhaitzean**. En plural, **-etan**: **etxeetan** (en las casas).","table":{"head":["Palabra","NON (singular)","NON (plural)"],"rows":[["etxe","etxe**an**","etxe**etan**"],["eskola","eskola**n**","eskol**etan**"],["zuhaitz","zuhaitz**ean**","zuhaitz**etan**"]]}},{"h":"Con nombres de lugar","p":"Los nombres de ciudades y países no llevan artículo: se añade **-n** si acaban en vocal (**Bilbon**, **Donostian**) y **-en** si acaban en consonante (**Gasteizen**, **Madrilen**)."},{"h":"«Hay» también es egon","p":"Para decir que hay algo en un lugar se usa **dago** (singular) o **daude** (plural): **Gelan ordenagailu bat dago** (en la habitación hay un ordenador). **Kalean jende asko dago** (en la calle hay mucha gente)."},{"h":"Estados: cómo estás","p":"**Ondo nago** (estoy bien), **gaizki nago** (estoy mal), **nekatuta nago** (estoy cansado), **pozik nago** (estoy contento), **urduri nago** (estoy nervioso)."},{"h":"-ko: «de» un lugar","p":"Ya viste **Bilbokoa naiz**. La misma terminación **-ko** sirve para decir de qué lugar es algo: **etxeko giltza** (la llave de casa), **Bilboko kaleak** (las calles de Bilbao), **mendiko bidea** (el camino del monte). Va delante del nombre."},{"h":"Paso a paso: «Estoy en la escuela»","p":"1) El lugar: **eskola**. 2) Añade «en»: acaba en -a, así que solo **-n** → **eskolan**. 3) El verbo estar para «yo»: **nago**. 4) **Eskolan nago**. Para negarlo, recuerda la lección 5: **Ez nago eskolan**."},{"h":"Errores típicos","p":"*Etxean naiz* → **Etxean nago** (para el lugar se usa egon, no izan). *Bilbon naiz* para «estoy en Bilbao» → **Bilbon nago**. *Eskolaan* → **eskolan**. *Gelan ordenagailu bat da* para «hay» → **dago**."},{"h":"Resumen","p":"**nago, zaude, dago, gaude, zaudete, daude**. NON = **-an / -n / -ean**, plural **-etan**; ciudades **-n / -en**. «Hay» = **dago / daude**. **-ko** = de un lugar (etxeko giltza)."}],"examples":[["Etxean nago.","Estoy en casa."],["Non zaude?","¿Dónde estás?"],["Ane eskolan dago.","Ane está en la escuela."],["Gu Bilbon gaude.","Estamos en Bilbao."],["Liburuak gelan daude.","Los libros están en la habitación."],["Kalean jende asko dago.","En la calle hay mucha gente."],["Nekatuta nago.","Estoy cansado."],["Etxeko giltza.","La llave de casa."]],"dialog":{"title":"Por teléfono","lines":[["Miren","Kaixo, Jon! Non zaude?","¡Hola, Jon! ¿Dónde estás?"],["Jon","Kaixo! Etxean nago. Eta zu?","¡Hola! Estoy en casa. ¿Y tú?"],["Miren","Ni Donostian nago, hondartzan.","Yo estoy en San Sebastián, en la playa."],["Jon","Zer moduz zaude?","¿Qué tal estás?"],["Miren","Oso ondo nago! Hondartzan jende asko dago. Eta zu?","¡Muy bien! En la playa hay mucha gente. ¿Y tú?"],["Jon","Ni nekatuta nago. Hemen euria ari du.","Yo estoy cansado. Aquí está lloviendo."]]},"exercises":[{"type":"gap","q":"Etxe___ nago.","es":"Estoy en casa.","a":["an"],"hint":"Palabra acabada en vocal (no -a): se añade -an."},{"type":"gap","q":"Non ___ zu?","es":"¿Dónde estás tú?","a":["zaude"],"hint":"egon: nago, zaude, dago, gaude, zaudete, daude."},{"type":"gap","q":"Ane eskolan ___.","es":"Ane está en la escuela.","a":["dago"],"hint":"egon: nago, zaude, dago, gaude, zaudete, daude."},{"type":"gap","q":"Gu Bilbo___ gaude.","es":"Estamos en Bilbao.","a":["n"],"hint":"Nombres de ciudad acabados en vocal: solo -n."},{"type":"gap","q":"Liburuak gelan ___.","es":"Los libros están en la habitación.","a":["daude"],"hint":"Sujeto plural (liburuak): daude."},{"type":"gap","q":"Nekatuta ___.","es":"Estoy cansado.","a":["nago"],"hint":"Los estados usan egon: yo = nago."},{"type":"choice","q":"«Estoy en la calle»","options":["Kalean nago.","Kalean naiz.","Kalea nago."],"a":0,"why":"Lugar: egon (nago) + NON (kalean)."},{"type":"choice","q":"«Estoy en Bilbao»","options":["Bilbon nago.","Bilbokoa naiz.","Bilbon naiz."],"a":0,"why":"Bilbokoa naiz significa «soy de Bilbao»."},{"type":"choice","q":"«Hay un libro en la mesa»","options":["Mahaian liburu bat dago.","Mahaian liburu bat da.","Mahaia liburu bat dago."],"a":0,"why":"«Hay» = dago, y «en la mesa» = mahaian."},{"type":"choice","q":"«En las casas»","options":["etxeetan","etxean","etxeakan"],"a":0,"why":"Plural de NON: -etan."},{"type":"choice","q":"«La llave de casa»","options":["etxeko giltza","giltza etxeko","etxean giltza"],"a":0,"why":"-ko va delante del nombre: etxeko giltza."},{"type":"order","words":["zaude","Non","zu"],"a":["Non zaude zu","Zu non zaude"],"es":"¿Dónde estás tú?","hint":"La interrogativa va justo antes del verbo."},{"type":"order","words":["daude","gelan","Liburuak"],"a":["Liburuak gelan daude"],"es":"Los libros están en la habitación.","hint":"Sujeto + lugar + verbo."},{"type":"match","pairs":[["nago","estoy"],["zaude","estás"],["dago","está / hay"],["gaude","estamos"],["zaudete","estáis"],["daude","están / hay (plural)"]]}],"create":{"prompt":"Escribe dónde estás ahora y cómo estás, dónde están dos personas de tu entorno, y dos cosas que hay en tu habitación (… dago / … daude).","focus":"egon en presente, caso NON (-an, -n, -ean, -etan), «hay» = dago/daude"},"links":{"verbs":["syn-pres-1"],"cases":["ine","ko"],"themes":["etxea","hiria","norabideak"]}},"a1-08":{"id":"a1-08","lvl":"A1","n":8,"title":"Nora zoaz?","es":"joan, etorri, NORA y NONDIK","goal":"Decir adónde vas y de dónde vienes.","explain":[{"h":"Antes de empezar","p":"En la lección anterior aprendiste «en» (**etxean**). Hoy completas el trío de los lugares con «a» (**etxera**) y «desde» (**etxetik**), y con los dos verbos de movimiento más usados: **joan** (ir) y **etorri** (venir). Con esto ya puedes moverte por cualquier conversación básica."},{"h":"joan y etorri en presente","p":"Son sintéticos, como egon. Se usan para lo que ocurre ahora mismo (voy, vengo). Para hábitos («voy todos los días») se usa otra forma que verás en la lección 11.","table":{"head":["NOR","joan (ir)","etorri (venir)"],"rows":[["ni","{nor:noa}","{nor:nator}"],["zu","{nor:zoaz}","{nor:zatoz}"],["hura","{nor:doa}","{nor:dator}"],["gu","{nor:goaz}","{nor:gatoz}"],["zuek","{nor:zoazte}","{nor:zatozte}"],["haiek","{nor:doaz}","{nor:datoz}"]]}},{"h":"NORA: «a, hacia»","p":"Se añade **-ra** si la palabra acaba en vocal y **-era** si acaba en consonante: **etxera** (a casa), **eskolara** (a la escuela), **Bilbora**, **Gasteizera**, **Madrilera**. En plural, **-etara**: **mendietara** (a los montes)."},{"h":"NONDIK: «desde, de» (procedencia)","p":"Se añade **-tik** si acaba en vocal y **-etik** si acaba en consonante: **etxetik** (de casa), **lanetik** (del trabajo), **Bilbotik**, **zuhaitzetik**. En plural, **-etatik**.","table":{"head":["","NON (en)","NORA (a)","NONDIK (desde)"],"rows":[["etxe","etxe**an**","etxe**ra**","etxe**tik**"],["eskola","eskola**n**","eskola**ra**","eskola**tik**"],["lan","lan**ean**","lan**era**","lan**etik**"],["Bilbo","Bilbo**n**","Bilbo**ra**","Bilbo**tik**"]]}},{"h":"Preguntas","p":"**Nora zoaz?** (¿adónde vas?) → **Lanera noa** (voy al trabajo). **Nondik zatoz?** (¿de dónde vienes?) → **Etxetik nator** (vengo de casa). Recuerda la regla de oro: la interrogativa justo delante del verbo."},{"h":"Paso a paso: «Vamos al monte»","p":"1) El lugar: **mendi**. 2) «a»: acaba en vocal → **mendira**. 3) ir, «nosotros»: **goaz**. 4) **Mendira goaz**. Y para «venimos del monte»: mendi + **-tik** → **menditik**, y venir, «nosotros» → **Menditik gatoz**."},{"h":"Errores típicos","p":"*Etxean noa* → **Etxera noa** (con movimiento se usa NORA, no NON). *Gasteizra* → **Gasteizera** (tras consonante, -era). *Nondik zoaz?* para «¿adónde vas?» → **Nora zoaz?** (nondik es «de dónde»)."},{"h":"Resumen","p":"**noa, zoaz, doa, goaz, zoazte, doaz** · **nator, zatoz, dator, gatoz, zatozte, datoz**. NON **-an** (en) · NORA **-ra / -era** (a) · NONDIK **-tik / -etik** (desde)."}],"examples":[["Etxera noa.","Voy a casa."],["Nora zoaz?","¿Adónde vas?"],["Lanetik nator.","Vengo del trabajo."],["Mikel Bilbora doa.","Mikel va a Bilbao."],["Gu mendira goaz.","Vamos al monte."],["Nondik zatozte?","¿De dónde venís?"],["Haiek hondartzatik datoz.","Ellos vienen de la playa."]],"dialog":{"title":"Un encuentro por la calle","lines":[["Iker","Kaixo, Miren! Nora zoaz?","¡Hola,
