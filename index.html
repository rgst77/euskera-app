a de la noticia"},"links":{"verbs":[],"cases":[],"themes":["lokailuak","teknologia"]}},"c1-09":{"id":"c1-09","lvl":"C1","n":9,"title":"Literatura","es":"Leer literatura vasca","goal":"Leer narrativa y poesía en euskera con estrategias, reconocer sus rasgos y hablar de lo leído.","explain":[{"h":"Antes de empezar","p":"La literatura vasca contemporánea es rica y está muy traducida: Bernardo Atxaga, Kirmen Uribe, Harkaitz Cano, Miren Agur Meabe, Ramon Saizarbitoria o Joseba Sarrionandia son buenos puntos de partida. Leer en euskera literario es el paso que convierte el idioma en algo propio. Esta lección te prepara para hacerlo sin frustrarte."},{"h":"Rasgos del texto literario","p":"1) **Pasado narrativo**: casi todo va en pasado puntual y habitual (**joan zen, joaten zen**). 2) **Diálogos con raya (—)** y, a veces, con **hika** (el tratamiento íntimo de B2-13), que reconocerás por formas como *duk / dun*. 3) **Vocabulario dialectal o poco frecuente** para dar color. 4) **Orden de palabras más libre** y recursos expresivos (metáforas, repeticiones). No hace falta dominarlo todo: basta con reconocerlo."},{"h":"Vocabulario para hablar de libros","table":{"head":["Euskera","Español"],"rows":[["eleberria","la novela"],["ipuina","el cuento"],["olerkia, poema","el poema"],["pertsonaia","el personaje"],["narratzailea","el narrador"],["gaia","el tema"],["giroa","el ambiente"],["amaiera","el final"]]}},{"h":"Estrategias de lectura","p":"1) Empieza por **cuentos** o novelas cortas, mejor si conoces la historia o hay traducción. 2) Lee **por bloques**: no busques cada palabra; subraya solo las que se repiten. 3) Usa el método de C1-04 en las frases difíciles. 4) Después, **resume** cada capítulo en dos frases (lo trabajarás en la lección 14). Para empezar, la colección de lecturas graduadas de los euskaltegis es una buena opción."},{"h":"Comentar lo leído","p":"**Eleberria … -ri buruzkoa da** (la novela trata de…), **Pertsonaia nagusia … da**, **Giroa ilun / alaia da** (el ambiente es oscuro / alegre), **Amaierak harritu nau** (el final me ha sorprendido), **Gomendatuko nuke … delako** (lo recomendaría porque…)."},{"h":"Errores típicos","p":"Intentar traducir palabra por palabra un texto literario: se pierde el ritmo y el sentido. Abandonar por no entender una palabra dialectal: casi siempre el contexto basta. Confundir **ipuina** (cuento) con **eleberria** (novela)."},{"h":"Resumen","p":"Rasgos: pasado narrativo, diálogos con raya (a veces con hika), léxico dialectal, orden libre. Vocabulario: **eleberria, ipuina, olerkia, pertsonaia, narratzailea, gaia, giroa, amaiera**. Estrategia: textos cortos, lectura por bloques, resumen."}],"examples":[["Eleberri hau maitasunari buruzkoa da.","Esta novela trata del amor."],["Pertsonaia nagusia arrantzale zahar bat da.","El personaje principal es un viejo pescador."],["Giroa iluna eta tristea da.","El ambiente es oscuro y triste."],["Amaierak asko harritu nau.","El final me ha sorprendido mucho."],["Ipuin laburrak irakurtzen hasi naiz.","He empezado a leer cuentos cortos."],["Gomendatuko nuke, oso ondo idatzita dagoelako.","Lo recomendaría, porque está muy bien escrito."]],"dialog":{"title":"Un pasaje de estilo literario (escrito para el curso)","lines":[["Narratzailea","Itsasoa grisa zegoen goiz hartan, zerua bezala.","El mar estaba gris aquella mañana, como el cielo."],["Narratzailea","Mikel zaharra portura jaitsi zen, egunero egiten zuen bezala.","El viejo Mikel bajó al puerto, como hacía cada día."],["Narratzailea","Ez zuen inorekin hitz egin; itsasoari begiratzen zion, isilik.","No habló con nadie; miraba al mar, en silencio."],["Narratzailea","—Gaur ez da arrantzarako eguna —esan zion bere buruari.","—Hoy no es día de pesca —se dijo a sí mismo."],["Narratzailea","Eta, hala ere, txalupa askatu zuen.","Y, sin embargo, desató la barca."]]},"exercises":[{"type":"gap","q":"Eleberri hau maitasunari ___ da.","es":"Esta novela trata del amor.","a":["buruzkoa"],"hint":"tratar de = -ri buruzkoa izan."},{"type":"gap","q":"Pertsonaia ___ arrantzale zahar bat da.","es":"El personaje principal es un viejo pescador.","a":["nagusia"],"hint":"principal = nagusia."},{"type":"gap","q":"___ iluna eta tristea da.","es":"El ambiente es oscuro y triste.","a":["giroa"],"hint":"ambiente = giroa."},{"type":"gap","q":"Amaierak asko harritu ___.","es":"El final me ha sorprendido mucho.","a":["nau"],"hint":"NOR-NORK: él → me."},{"type":"gap","q":"___ laburrak irakurtzen hasi naiz.","es":"He empezado a leer cuentos cortos.","a":["ipuin"],"hint":"cuento = ipuin(a)."},{"type":"gap","q":"Itsasoa grisa ___ goiz hartan.","es":"El mar estaba gris aquella mañana.","a":["zegoen"],"hint":"egon en pasado (narrativo)."},{"type":"choice","q":"«La novela»","options":["eleberria","ipuina","olerkia"],"a":0,"why":"ipuina = cuento; olerkia = poema."},{"type":"choice","q":"En un diálogo literario, la raya (—) indica…","options":["que habla un personaje","una pregunta","el final del capítulo"],"a":0,"why":"Como en español."},{"type":"choice","q":"Si en un diálogo ves «duk» o «dun», probablemente es…","options":["hika","un error de imprenta","inglés"],"a":0,"why":"Formas del tratamiento íntimo hi."},{"type":"choice","q":"Mejor estrategia ante una palabra dialectal desconocida:","options":["seguir leyendo y deducirla por el contexto","abandonar el libro","traducir todo el párrafo palabra por palabra"],"a":0,"why":"El contexto suele bastar."},{"type":"choice","q":"«El final me ha sorprendido»","options":["Amaierak harritu nau.","Amaiera harritu naiz.","Amaierak harritu dut."],"a":0,"why":"Sujeto con -k y auxiliar nau (me)."},{"type":"order","words":["da","buruzkoa","maitasunari","Eleberria"],"a":["Eleberria maitasunari buruzkoa da"],"es":"La novela trata del amor.","hint":"Sujeto + -ri buruzkoa + da."},{"type":"order","words":["nau","harritu","Amaierak"],"a":["Amaierak harritu nau"],"es":"El final me ha sorprendido.","hint":"Sujeto con -k + verbo + nau."},{"type":"order","words":["zen","jaitsi","portura","zaharra","Mikel"],"a":["Mikel zaharra portura jaitsi zen"],"es":"El viejo Mikel bajó al puerto.","hint":"Sujeto + lugar + verbo + auxiliar."},{"type":"match","pairs":[["eleberria","la novela"],["ipuina","el cuento"],["olerkia","el poema"],["pertsonaia","el personaje"],["narratzailea","el narrador"],["giroa","el ambiente"]]}],"create":{"prompt":"Escribe un breve comentario (6 a 8 frases) sobre un libro o película que te haya gustado: de qué trata, cómo es el personaje principal, el ambiente, qué te pareció el final y si lo recomendarías.","focus":"rasgos literarios, vocabulario de la lectura, comentar una obra (… buruzkoa da, pertsonaia nagusia, giroa, amaiera)"},"links":{"verbs":[],"cases":[],"themes":["aisialdia","ikasketak"]}},"c1-10":{"id":"c1-10","lvl":"C1","n":10,"title":"Ahozkoa eta idatzia","es":"La lengua oral frente a la escrita","goal":"Entender el euskera hablado real, con sus partículas y simplificaciones, y saber cuándo usar el registro escrito.","explain":[{"h":"Antes de empezar","p":"Has aprendido el euskera batua tal como se escribe. Al hablar con vascohablantes notarás diferencias: partículas, contracciones, frases incompletas y, según la zona, formas dialectales. No hace falta que hables así, pero sí que lo entiendas. Esta lección es un puente entre el euskera del curso y el de la calle."},{"h":"Partículas del habla","table":{"head":["Partícula","Uso","Ejemplo"],"rows":[["ba / bada","énfasis, «pues»","Ez dakit **ba**! / **Bada**, ni ez noa."],["ea","«a ver», también pregunta","**Ea**, zer daukagu hemen?"],["ezta?","«¿verdad?»","Bilbokoa zara, **ezta**?"],["beno / tira","«bueno», resignación","**Beno**, ados. / **Tira**, goazen."],["e?","confirmación al final","Bihar etorriko zara, **e**?"],["ene! / jo!","sorpresa","**Ene**, zer ordu da!"]]}},{"h":"Rasgos del habla","p":"1) **Respuestas sin auxiliar**: — Etorriko zara? — **Etorriko!** 2) **Pronunciación encadenada**: *ez da* suena «ezta», *ez dut* suena «eztut». 3) **Orden más libre** y repeticiones. 4) **Frases cortas** unidas con **eta**. En el escrito, en cambio, se completan las frases y se usan conectores variados (B2-12)."},{"h":"Formas dialectales que oirás","p":"Según la zona, algunos auxiliares suenan distinto. Por ejemplo, en Bizkaia es frecuente **dot** por *dut* y **naz** por *naiz*; en Gipuzkoa, **det** por *dut*. Son formas legítimas de los dialectos (euskalkiak). Basta con reconocerlas: el batua que has aprendido se entiende en todas partes."},{"h":"Paso a paso: de oral a escrito","p":"Oral: «Beno, ba, ez dakit… etorriko naiz, e? Baina berandu, eh, lana daukat eta.» Escrito: **Etorriko naiz, baina berandu, lana daukadalako.** Se eliminan las partículas, se completa la estructura y se elige el conector adecuado."},{"h":"Errores típicos","p":"Escribir partículas orales (*ba, e?, beno*) en un texto formal. Pensar que las formas dialectales son errores. Intentar imitar un dialecto sin dominarlo: mejor un batua natural."},{"h":"Resumen","p":"Oral: partículas (**ba, ea, ezta?, beno, tira, e?**), respuestas sin auxiliar, pronunciación encadenada, formas dialectales (**dot, naz, det**). Escrito: frases completas y conectores. Entiende el primero; usa el segundo cuando escribes."}],"examples":[["Ez dakit ba!","¡Pues no lo sé!"],["Ea, zer daukagu hemen?","A ver, ¿qué tenemos aquí?"],["Bihar etorriko zara, e?","Mañana vendrás, ¿eh?"],["Etorriko zara? Etorriko!","¿Vendrás? ¡Sí!"],["Tira, goazen.","Bueno, vámonos."],["Beno, ados.","Bueno, de acuerdo."]],"dialog":{"title":"En la cuadrilla","lines":[["Jon","Aupa! Bihar mendira, e?","¡Hola! Mañana al monte, ¿eh?"],["Miren","Beno… ez dakit ba. Lan pila daukat.","Bueno… pues no sé. Tengo un montón de trabajo."],["Jon","Jo, Miren! Beti berdin. Etorriko zara?","¡Jo, Miren! Siempre igual. ¿Vendrás?"],["Miren","Tira… etorriko!","Bueno… ¡vendré!"],["Jon","Primeran! Zortzietan plazan, ezta?","¡Estupendo! A las ocho en la plaza, ¿verdad?"],["Miren","Ados, ados.","Vale, vale."]]},"exercises":[{"type":"gap","q":"Ez dakit ___!","es":"¡Pues no lo sé!","a":["ba"],"hint":"Partícula de énfasis: ba."},{"type":"gap","q":"___, zer daukagu hemen?","es":"A ver, ¿qué tenemos aquí?","a":["ea"],"hint":"«a ver» = ea."},{"type":"gap","q":"Bilbokoa zara, ___?","es":"Eres de Bilbao, ¿verdad?","a":["ezta"],"hint":"¿verdad? = ezta?"},{"type":"gap","q":"___, goazen.","es":"Bueno, vámonos.","a":["tira"],"hint":"Resignación: tira."},{"type":"gap","q":"Etorriko zara? — ___!","es":"¿Vendrás? — ¡Sí!","a":["etorriko"],"hint":"Respuesta oral sin auxiliar."},{"type":"gap","q":"___, ados.","es":"Bueno, de acuerdo.","a":["beno"],"hint":"«bueno» = beno."},{"type":"choice","q":"En un correo formal, «Ez dakit ba» debería ser…","options":["Ez dakit.","Ba ez dakit.","Ez dakit ba, e?"],"a":0,"why":"Se eliminan las partículas orales."},{"type":"choice","q":"Si oyes «dot» en Bizkaia, equivale a…","options":["dut","dute","dago"],"a":0,"why":"Forma dialectal de dut."},{"type":"choice","q":"«Ez da» en la pronunciación rápida suena…","options":["«ezta»","«eda»","«ezda»"],"a":0,"why":"Encadenamiento de z + d."},{"type":"choice","q":"Respuesta oral típica a «Etorriko zara?»","options":["Etorriko!","Etorriko naizela.","Etorri naiz."],"a":0,"why":"En la conversación se omite el auxiliar."},{"type":"choice","q":"Versión escrita de «Berandu, lana daukat eta»","options":["Berandu, lana daukadalako.","Berandu lana daukat eta e.","Lana daukat eta berandu ba."],"a":0,"why":"Conector de causa en lugar de la construcción oral."},{"type":"order","words":["dakit","ba","Ez"],"a":["Ez dakit ba"],"es":"Pues no lo sé.","hint":"Ez dakit + ba."},{"type":"order","words":["daukagu","zer","Ea","hemen"],"a":["Ea zer daukagu hemen"],"es":"A ver qué tenemos aquí.","hint":"Ea + pregunta."},{"type":"order","words":["goazen","Tira"],"a":["Tira goazen"],"es":"Bueno, vámonos.","hint":"Partícula + verbo."},{"type":"match","pairs":[["ba","pues (énfasis)"],["ea","a ver"],["ezta?","¿verdad?"],["tira","bueno (resignación)"],["dot","dut (Bizkaia)"],["det","dut (Gipuzkoa)"]]}],"create":{"prompt":"Escribe un pequeño diálogo oral entre amigos (6 líneas) con partículas del habla, y después reescribe su contenido como un mensaje formal de 3 frases.","focus":"partículas orales (ba, ea, ezta?, beno, tira, e?), respuestas sin auxiliar, formas dialectales, paso a registro escrito"},"links":{"verbs":[],"cases":[],"themes":["agurrak","lokailuak"]}},"c1-11":{"id":"c1-11","lvl":"C1","n":11,"title":"Hitz-ordena estilistikoa","es":"Orden de palabras y estilo","goal":"Usar el orden de palabras para dar ritmo, énfasis y claridad a lo que dices y escribes.","explain":[{"h":"Antes de empezar","p":"En B2 aprendiste la regla del foco: lo destacado va justo antes del verbo. Más allá de esa regla, el euskera permite mover los elementos con bastante libertad, y los buenos hablantes y escritores lo aprovechan para el ritmo, el énfasis y la claridad. Esta lección te enseña los recursos más habituales."},{"h":"El orden neutro y sus variaciones","p":"Orden neutro: **sujeto – objeto – verbo** (**Mikelek liburua erosi du**). A partir de ahí: 1) **Tema al principio**: **Liburua, Mikelek erosi du** (el libro, lo compró Mikel). 2) **Foco antes del verbo** (B2-10). 3) **Elementos detrás del verbo**: información secundaria o añadida al final: **Erosi du liburua, azkenean** (ha comprado el libro, por fin)."},{"h":"Verbo al principio","p":"En la narración y en el habla, empezar por el verbo da dinamismo y pone el acento en la acción: **Joan zen etxera, atea itxi zuen eta ez zuen ezer esan** (se fue a casa, cerró la puerta y no dijo nada). Es un recurso frecuente en la literatura y en los relatos orales."},{"h":"Aligerar lo que va delante del verbo","p":"Cuando hay mucha información antes del verbo, la frase pesa. Una solución estilística es pasar los complementos largos **detrás del verbo**: en lugar de *Bileraren amaieran, denok nekatuta geundenean, zuzendariak gauza harrigarri bat esan zuen*, mejor **Zuzendariak gauza harrigarri bat esan zuen bileraren amaieran, denok nekatuta geundenean**."},{"h":"Paso a paso: tres versiones de la misma frase","p":"Neutra: **Anek Bilbon lana aurkitu du.** Foco en el lugar: **Anek lana Bilbon aurkitu du** (ha sido en Bilbao). Narrativa, con verbo delante: **Aurkitu du lana Anek, Bilbon, azkenean!** (¡por fin ha encontrado trabajo Ane, en Bilbao!)."},{"h":"Errores típicos","p":"Poner siempre el verbo al final, aunque la frase sea larguísima. Separar la interrogativa del verbo (*Nork liburua erosi du?*). Abusar del verbo inicial en textos formales, donde suena demasiado narrativo."},{"h":"Resumen","p":"Neutro: **S – O – V**. Tema al principio, foco antes del verbo, añadidos detrás del verbo. Verbo inicial para dinamismo narrativo. Para aligerar, pasa los complementos largos detrás del verbo."}],"examples":[["Liburua, Mikelek erosi du.","El libro, lo ha comprado Mikel."],["Erosi du liburua, azkenean.","Ha comprado el libro, por fin."],["Joan zen etxera, atea itxi zuen eta ez zuen ezer esan.","Se fue a casa, cerró la puerta y no dijo nada."],["Anek lana Bilbon aurkitu du.","Ane ha encontrado trabajo en Bilbao (allí precisamente)."],["Zuzendariak gauza harrigarri bat esan zuen bileraren amaieran.","El director dijo algo sorprendente al final de la reunión."],["Ikusi dut, bai, zure mezua.","Lo he visto, sí, tu mensaje."]],"dialog":{"title":"Contando una historia","lines":[["Iker","Zer gertatu zen atzo bileran?","¿Qué pasó ayer en la reunión?"],["Ane","Hasi zen bilera, eta zuzendariak ez zuen ezer esan.","Empezó la reunión, y el director no dijo nada."],["Iker","Eta gero?","¿Y luego?"],["Ane","Altxatu zen, leihora joan zen eta, azkenean, berri harrigarri bat eman zigun.","Se levantó, fue a la ventana y, al final, nos dio una noticia sorprendente."],["Iker","Zer berri?","¿Qué noticia?"],["Ane","Erretiratu egingo dela, datorren urtean.","Que se jubilará, el año que viene."]]},"exercises":[{"type":"gap","q":"Erosi du liburua, ___.","es":"Ha comprado el libro, por fin.","a":["azkenean"],"hint":"Añadido detrás del verbo: azkenean."},{"type":"gap","q":"___ zen etxera eta ez zuen ezer esan.","es":"Se fue a casa y no dijo nada.","a":["joan"],"hint":"Narración con verbo inicial."},{"type":"gap","q":"Anek lana ___ aurkitu du.","es":"Ane ha encontrado trabajo en Bilbao (allí precisamente).","a":["bilbon"],"hint":"Foco: el lugar, justo antes del verbo."},{"type":"gap","q":"Zuzendariak gauza harrigarri bat esan ___ bileraren amaieran.","es":"El director dijo algo sorprendente al final de la reunión.","a":["zuen"],"hint":"Verbo antes del complemento largo."},{"type":"gap","q":"Ikusi dut, ___, zure mezua.","es":"Lo he visto, sí, tu mensaje.","a":["bai"],"hint":"Inciso detrás del verbo."},{"type":"gap","q":"Hasi ___ bilera, eta zuzendariak ez zuen ezer esan.","es":"Empezó la reunión, y el director no dijo nada.","a":["zen"],"hint":"Verbo inicial narrativo."},{"type":"choice","q":"Orden neutro en euskera:","options":["sujeto – objeto – verbo","verbo – sujeto – objeto","objeto – verbo – sujeto"],"a":0,"why":"S – O – V."},{"type":"choice","q":"Para dar dinamismo a una narración se puede…","options":["empezar por el verbo","separar la interrogativa del verbo","poner todo antes del verbo"],"a":0,"why":"Verbo inicial: recurso narrativo."},{"type":"choice","q":"Una frase con muchos complementos delante del verbo resulta…","options":["pesada: conviene pasar algunos detrás","más clara","obligatoria en euskera"],"a":0,"why":"Aligerar = complementos largos detrás."},{"type":"choice","q":"«Anek lana Bilbon aurkitu du» destaca…","options":["el lugar (Bilbao)","el sujeto (Ane)","el trabajo"],"a":0,"why":"Lo que va justo antes del verbo es el foco."},{"type":"choice","q":"En un texto formal, el verbo inicial…","options":["se usa con moderación","es obligatorio","está prohibido"],"a":0,"why":"Es un recurso más narrativo que formal."},{"type":"order","words":["du","azkenean","liburua","Erosi"],"a":["Erosi du liburua azkenean"],"es":"Ha comprado el libro, por fin.","hint":"Verbo + objeto + añadido."},{"type":"order","words":["etxera","zen","Joan"],"a":["Joan zen etxera"],"es":"Se fue a casa.","hint":"Verbo inicial + lugar."},{"type":"order","words":["aurkitu","du","Bilbon","lana","Anek"],"a":["Anek lana Bilbon aurkitu du"],"es":"Ane ha encontrado trabajo en Bilbao.","hint":"Sujeto + objeto + foco + verbo."},{"type":"match","pairs":[["mintzagaia","tema (al principio)"],["galdegaia","foco (antes del verbo)"],["aditza hasieran","verbo al principio (narración)"],["aditzaren ondoren","información añadida"],["ordena neutroa","S – O – V"],["erritmoa","ritmo"]]}],"create":{"prompt":"Escribe un relato breve (6 a 8 frases) de algo que te pasó, combinando frases con verbo inicial, frases con foco marcado y algún añadido detrás del verbo.","focus":"orden neutro, tema, foco, verbo inicial narrativo, complementos detrás del verbo"},"links":{"verbs":[],"cases":[],"themes":["lokailuak"]}},"c1-12":{"id":"c1-12","lvl":"C1","n":12,"title":"Puntuazioa eta estiloa","es":"Puntuación y convenciones de escritura","goal":"Escribir con la puntuación y las convenciones del euskera: comas, signos de pregunta, comillas, mayúsculas, fechas y guiones.","explain":[{"h":"Antes de empezar","p":"La puntuación vasca se parece a la española, pero tiene diferencias que delatan enseguida a un hispanohablante. La más visible: **no hay signos de apertura** (¿ ¡). En C1 se espera que escribas con las convenciones correctas, así que esta lección es una revisión práctica de todas ellas."},{"h":"Signos de interrogación y exclamación","p":"Solo al final: **Non bizi zara?** **Zer polita!** Nunca *¿Non bizi zara?*. Dentro del texto, la pregunta se reconoce por la palabra interrogativa y la entonación."},{"h":"La coma","p":"1) **Tras una subordinada que va delante**: **Etxera iristen naizenean, afaltzen dut**. 2) **Con conectores**: **Hala ere, joango naiz**; **Getxo, aldiz, txikia da**. 3) **En incisos y aposiciones**: **Mikel, nire laguna, medikua da**. 4) **No** entre sujeto y verbo, ni antes del último **eta** de una enumeración: **ogia, esnea eta arrautzak**."},{"h":"Otras convenciones","table":{"head":["Convención","Ejemplo"],"rows":[["Comillas angulares para citas","«Bihar etorriko naiz», esan zuen."],["Raya para el diálogo","—Kaixo —esan zuen Anek."],["Dos puntos tras el saludo de una carta","Andre agurgarria:"],["Días y meses en minúscula","astelehena, urria"],["Fecha: año -ko, mes en genitivo, día -an","2026ko urriaren 23an"],["Guion en compuestos","kale-erabilera, neba-ahizpak"],["Abreviatura de «etcétera»","etab."]]}},{"h":"Paso a paso: corregir una frase","p":"Con errores: *¿Sabes que Mikel, ha llegado el Lunes?* → En euskera, sin la coma entre sujeto y verbo, sin signo de apertura y con el día en minúscula: **Badakizu Mikel astelehenean iritsi dela?**"},{"h":"Errores típicos","p":"Escribir **¿** o **¡** al principio. Poner coma entre sujeto y verbo (*Mikelek, liburua erosi du*). Escribir los meses con mayúscula (*Urria*). Usar comillas inglesas en lugar de las angulares en textos cuidados."},{"h":"Resumen","p":"Pregunta y exclamación **solo al final**. Coma tras subordinada antepuesta, con conectores e incisos; **nunca** entre sujeto y verbo. **« »** para citas, **—** para diálogos, **:** tras el saludo. Días y meses en minúscula. Fecha: **2026ko urriaren 23an**."}],"examples":[["Non bizi zara?","¿Dónde vives?"],["Etxera iristen naizenean, afaltzen dut.","Cuando llego a casa, ceno."],["Hala ere, joango naiz.","Sin embargo, iré."],["Ogia, esnea eta arrautzak erosi ditut.","He comprado pan, leche y huevos."],["«Bihar etorriko naiz», esan zuen.","«Mañana vendré», dijo."],["Astelehenean, urriaren 23an, bilera izango da.","El lunes, 23 de octubre, habrá reunión."]],"dialog":{"title":"Revisando un texto","lines":[["Nerea","Begiratu nire testua: «¿Non dago Mikel?» idatzi dut.","Mira mi texto: he escrito «¿Non dago Mikel?»."],["Jon","Euskaraz ez dago hasierako galdera-ikurrik. Nahikoa da amaierakoa: «Non dago Mikel?».","En euskera no hay signo de interrogación inicial. Basta con el final: «Non dago Mikel?»."],["Nerea","Eta «Urriaren 23an» letra larriz?","¿Y «Urriaren 23an» con mayúscula?"],["Jon","Ez, hilabeteak letra xehez idazten dira, esaldiaren hasieran ez badaude.","No, los meses se escriben con minúscula, si no están al principio de la frase."],["Nerea","Eskerrik asko! Orain zuzentzen dut.","¡Gracias! Ahora lo corrijo."]]},"exercises":[{"type":"gap","q":"Galdera-ikurra esaldiaren ___ bakarrik jartzen da.","es":"El signo de interrogación solo se pone al final de la frase.","a":["amaieran"],"hint":"al final = amaieran."},{"type":"gap","q":"Hilabeteak letra ___ idazten dira.","es":"Los meses se escriben con minúscula.","a":["xehez"],"hint":"minúscula = letra xehe(z)."},{"type":"gap","q":"Euskaraz ez dago hasierako galdera-___.","es":"En euskera no hay signo de interrogación inicial.","a":["ikurrik"],"hint":"signo = ikur(rik)."},{"type":"gap","q":"2026ko urriaren 23___","es":"a 23 de octubre de 2026","a":["an"],"hint":"Día con -an."},{"type":"gap","q":"Kale-___ txikia da.","es":"El uso del euskera en la calle es pequeño.","a":["erabilera"],"hint":"Compuesto con guion: kale-erabilera."},{"type":"gap","q":"Liburuak, aldizkariak, ___. (abreviatura de «etcétera»)","es":"Libros, revistas, etc.","a":["etab"],"hint":"etcétera = etab."},{"type":"choice","q":"¿Cuál es correcta?","options":["Non bizi zara?","¿Non bizi zara?","¿Non bizi zara"],"a":0,"why":"Solo signo final."},{"type":"choice","q":"¿Dónde va la coma?","options":["Etxera iristen naizenean, afaltzen dut.","Etxera, iristen naizenean afaltzen dut.","Etxera iristen naizenean afaltzen, dut."],"a":0,"why":"Tras la subordinada antepuesta."},{"type":"choice","q":"¿Cuál es correcta?","options":["Mikelek liburua erosi du.","Mikelek, liburua erosi du.","Mikelek liburua, erosi du."],"a":0,"why":"Sin coma entre sujeto y verbo."},{"type":"choice","q":"¿Cómo se escribe el mes?","options":["urria","Urria","URRIA"],"a":0,"why":"Meses en minúscula."},{"type":"choice","q":"Comillas preferidas en textos cuidados:","options":["« »","\" \"","' '"],"a":0,"why":"Comillas angulares."},{"type":"order","words":["afaltzen","dut","naizenean","iristen","Etxera"],"a":["Etxera iristen naizenean afaltzen dut"],"es":"Cuando llego a casa, ceno.","hint":"Subordinada + principal (con coma al escribir)."},{"type":"order","words":["naiz","joango","ere","Hala"],"a":["Hala ere joango naiz"],"es":"Sin embargo, iré.","hint":"Conector + frase (con coma al escribir)."},{"type":"order","words":["arrautzak","eta","esnea","Ogia"],"a":["Ogia esnea eta arrautzak"],"es":"Pan, leche y huevos.","hint":"Enumeración: sin coma antes de eta."},{"type":"match","pairs":[["galdera-ikurra","signo de interrogación"],["koma","coma"],["puntu eta koma","punto y coma"],["marra","raya"],["komatxoak","comillas"],["letra xehea","minúscula"]]}],"create":{"prompt":"Escribe un texto de 6 a 8 frases (un correo o una pequeña crónica) que incluya una pregunta, una cita entre comillas, una fecha, una enumeración y al menos dos subordinadas antepuestas, cuidando la puntuación.","focus":"puntuación vasca: signos solo al final, comas, comillas « », raya, minúsculas en días y meses, fecha, guion"},"links":{"verbs":[],"cases":[],"themes":["lokailuak","denbora"]}},"c1-13":{"id":"c1-13","lvl":"C1","n":13,"title":"Atsotitzak","es":"Refranes y expresiones de la tradición","goal":"Conocer los refranes vascos más usados, entender su estructura y usarlos con oportunidad.","explain":[{"h":"Antes de empezar","p":"Los refranes (atsotitzak) condensan siglos de experiencia en pocas palabras y aparecen en conversaciones, titulares y discursos. Saber reconocerlos y usar alguno en el momento justo es una marca de dominio del idioma. Muchos tienen un equivalente en español, aunque con imágenes distintas."},{"h":"Refranes frecuentes","table":{"head":["Atsotitza","Literalmente","Equivalente español"],"rows":[["Ez dago bi gabe hiru.","No hay dos sin tres.","No hay dos sin tres."],["Hitzak haizeak eramaten ditu.","Las palabras se las lleva el viento.","Las palabras se las lleva el viento."],["Zahar hitz, zuhur hitz.","Palabra de viejo, palabra sabia.","Más sabe el diablo por viejo…"],["Txakur zaunkaria, gutxi hozkaria.","Perro ladrador, poco mordedor.","Perro ladrador, poco mordedor."],["Hobe berandu, inoiz ez baino.","Mejor tarde que nunca.","Más vale tarde que nunca."],["Nolako zura, halako ezpala.","Como la madera, así la astilla.","De tal palo, tal astilla."],["Ur handitan, arrain handiak.","En aguas grandes, peces grandes.","A gran río, gran pez."],["Begiak ikusten ez duena, bihotzak ez du sentitzen.","Lo que el ojo no ve, el corazón no lo siente.","Ojos que no ven, corazón que no siente."],["Poliki-poliki, urrutira.","Despacio, despacio, lejos.","Poco a poco se llega lejos."]]}},{"h":"Su estructura","p":"Los refranes usan una gramática muy compacta: **paralelismos** (Nolako…, halako…), **elipsis del verbo** (Zahar hitz, zuhur hitz), **repeticiones** (Poliki-poliki) y, a veces, formas antiguas o dialectales. Fíjate en el juego de palabras de **zahar / zuhur** y en la rima de **zaunkaria / hozkaria**: son pensados para recordarse."},{"h":"Cómo usarlos","p":"Se introducen con **Esaera zaharrak dioen bezala…** (como dice el refrán…) o **Zaharrek zioten bezala…** (como decían los mayores…), o se sueltan sin más, como en español. Úsalos con moderación: uno bien colocado vale más que cinco seguidos."},{"h":"Paso a paso: usar un refrán en una conversación","p":"Situación: un amigo llega por fin a la cita con una hora de retraso. Respuesta: **Tira, esaera zaharrak dioen bezala, hobe berandu, inoiz ez baino!** (Bueno, como dice el refrán, ¡más vale tarde que nunca!)."},{"h":"Errores típicos","p":"Traducir literalmente un refrán español que no existe en euskera: queda raro. Cambiar palabras de un refrán (*Txakur zaunkaria, gutxi kosk egilea*): los refranes son fórmulas fijas. Abusar de ellos en un texto formal."},{"h":"Resumen","p":"Refranes clave: **Ez dago bi gabe hiru · Hitzak haizeak eramaten ditu · Zahar hitz, zuhur hitz · Txakur zaunkaria, gutxi hozkaria · Hobe berandu, inoiz ez baino · Nolako zura, halako ezpala**. Introducción: **Esaera zaharrak dioen bezala…**."}],"examples":[["Ez dago bi gabe hiru.","No hay dos sin tres."],["Hitzak haizeak eramaten ditu.","Las palabras se las lleva el viento."],["Txakur zaunkaria, gutxi hozkaria.","Perro ladrador, poco mordedor."],["Hobe berandu, inoiz ez baino.","Más vale tarde que nunca."],["Nolako zura, halako ezpala.","De tal palo, tal astilla."],["Esaera zaharrak dioen bezala, poliki-poliki, urrutira.","Como dice el refrán, poco a poco se llega lejos."]],"dialog":{"title":"Hablando de un niño","lines":[["Ane","Begira Iker txikiari: aita bezala, beti futbolean!","Mira al pequeño Iker: como su padre, ¡siempre jugando al fútbol!"],["Jon","Nolako zura, halako ezpala!","¡De tal palo, tal astilla!"],["Ane","Eta bere aitak bezala, asko hitz egiten du, baina gero…","Y como su padre, habla mucho, pero luego…"],["Jon","Txakur zaunkaria, gutxi hozkaria.","Perro ladrador, poco mordedor."],["Ane","Hori da! Zahar hitz, zuhur hitz.","¡Eso es! Palabra de viejo, palabra sabia."]]},"exercises":[{"type":"gap","q":"Ez dago bi gabe ___.","es":"No hay dos sin tres.","a":["hiru"],"hint":"Refrán fijo."},{"type":"gap","q":"Hitzak ___ eramaten ditu.","es":"Las palabras se las lleva el viento.","a":["haizeak"],"hint":"El viento (sujeto con -k): haizeak."},{"type":"gap","q":"Txakur zaunkaria, gutxi ___.","es":"Perro ladrador, poco mordedor.","a":["hozkaria"],"hint":"Rima: zaunkaria / hozkaria."},{"type":"gap","q":"Hobe berandu, inoiz ez ___.","es":"Más vale tarde que nunca.","a":["baino"],"hint":"Comparación: baino."},{"type":"gap","q":"Nolako zura, ___ ezpala.","es":"De tal palo, tal astilla.","a":["halako"],"hint":"Paralelismo: nolako… halako…"},{"type":"gap","q":"Esaera zaharrak ___ bezala…","es":"Como dice el refrán…","a":["dioen"],"hint":"esan sintético (dio) + relativo: dioen."},{"type":"choice","q":"«De tal palo, tal astilla»","options":["Nolako zura, halako ezpala.","Ur handitan, arrain handiak.","Ez dago bi gabe hiru."],"a":0,"why":"zura = madera; ezpala = astilla."},{"type":"choice","q":"«Ojos que no ven, corazón que no siente»","options":["Begiak ikusten ez duena, bihotzak ez du sentitzen.","Hitzak haizeak eramaten ditu.","Zahar hitz, zuhur hitz."],"a":0,"why":"Refrán con begiak y bihotzak."},{"type":"choice","q":"«Zahar hitz, zuhur hitz» significa…","options":["la palabra de los mayores es sabia","las palabras viejas no sirven","hay que hablar poco"],"a":0,"why":"zuhur = sabio, prudente."},{"type":"choice","q":"Fórmula para introducir un refrán:","options":["Esaera zaharrak dioen bezala…","Nire ustez, dudarik gabe…","Laburbilduz…"],"a":0,"why":"«Como dice el refrán…»."},{"type":"choice","q":"Un refrán en euskera debe…","options":["usarse tal cual, como fórmula fija","traducirse siempre desde el español","adaptarse cambiando palabras"],"a":0,"why":"Los refranes son fórmulas fijas."},{"type":"order","words":["hiru","gabe","bi","dago","Ez"],"a":["Ez dago bi gabe hiru"],"es":"No hay dos sin tres.","hint":"Refrán fijo."},{"type":"order","words":["baino","ez","inoiz","berandu","Hobe"],"a":["Hobe berandu inoiz ez baino"],"es":"Más vale tarde que nunca.","hint":"Refrán fijo."},{"type":"order","words":["ezpala","halako","zura","Nolako"],"a":["Nolako zura halako ezpala"],"es":"De tal palo, tal astilla.","hint":"Nolako… halako…"},{"type":"match","pairs":[["Ez dago bi gabe hiru","no hay dos sin tres"],["Hobe berandu, inoiz ez baino","más vale tarde que nunca"],["Nolako zura, halako ezpala","de tal palo, tal astilla"],["Txakur zaunkaria, gutxi hozkaria","perro ladrador, poco mordedor"],["Ur handitan, arrain handiak","a gran río, gran pez"],["Poliki-poliki, urrutira","poco a poco se llega lejos"]]}],"create":{"prompt":"Escribe tres situaciones breves (2 o 3 frases cada una) que terminen con un refrán de la lección usado con oportunidad.","focus":"atsotitzak frecuentes, su estructura (paralelismo, elipsis, rima) y cómo introducirlos"},"links":{"verbs":[],"cases":[],"themes":["lokailuak"]}},"c1-14":{"id":"c1-14","lvl":"C1","n":14,"title":"Laburpenak","es":"Resumir y sintetizar","goal":"Resumir un texto o una exposición con tus propias palabras, de forma fiel y concisa.","explain":[{"h":"Antes de empezar","p":"Resumir es una de las tareas más exigentes y más evaluadas del C1: demuestra que entiendes un texto y que puedes reformularlo. No se trata de copiar frases, sino de extraer lo esencial y expresarlo con tus palabras, en un registro neutro y sin añadir opiniones."},{"h":"El método en cinco pasos","p":"1) **Lee el texto entero** una vez sin detenerte. 2) **Identifica la idea principal** (ideia nagusia) y las secundarias. 3) **Subraya palabras clave** (hitz gakoak). 4) **Reescribe con tus palabras**, más corto (entre un tercio y un cuarto del original). 5) **Revisa**: ¿falta algo esencial? ¿hay opiniones tuyas? Si las hay, elimínalas."},{"h":"Fórmulas para resumir","table":{"head":["Función","Fórmula"],"rows":[["Presentar el tema","Testuak … du hizpide. / Testuak … aztertzen du."],["Atribuir al autor","Egileak dio … -la. / Egilearen ustez, …"],["Ordenar","Lehenik, … Ondoren, … Azkenik, …"],["Idea principal","Testuaren ideia nagusia … da."],["Concluir","Laburbilduz, egileak … defendatzen du."]]}},{"h":"Técnicas de condensación","p":"Generalizar (en lugar de enumerar «pan, leche, huevos» → **elikagaiak**), **nominalizar** (C1-05: *prezioak igo dira* → **prezioen igoera**), suprimir ejemplos y repeticiones, y usar el estilo indirecto (B2-05) para lo que dice el autor."},{"h":"Un ejemplo","p":"Texto (resumido aquí): un artículo explica que cada vez más adultos aprenden euskera, que muchos lo hacen por trabajo o por sus hijos, y que los euskaltegis ofrecen ahora más cursos en línea. Resumen: **Testuak helduen euskara-ikaskuntza du hizpide. Egilearen arabera, gero eta heldu gehiagok ikasten dute euskara, batez ere lanagatik edo seme-alabengatik, eta euskaltegiek sareko eskaintza handitu dute.**"},{"h":"Errores típicos","p":"Copiar frases enteras del original. Añadir opiniones propias (*nire ustez…*) en un resumen. Mantener los ejemplos y detalles secundarios. Hacer un resumen casi tan largo como el texto."},{"h":"Resumen","p":"Método: leer → idea principal → palabras clave → reescribir con tus palabras → revisar. Fórmulas: **Testuak … du hizpide**, **Egileak dio … -la**, **ideia nagusia**, **laburbilduz**. Técnicas: generalizar, nominalizar, suprimir ejemplos, estilo indirecto."}],"examples":[["Testuak helduen euskara-ikaskuntza du hizpide.","El texto trata del aprendizaje del euskera por parte de adultos."],["Egileak dio gero eta heldu gehiagok ikasten dutela euskara.","El autor dice que cada vez más adultos aprenden euskera."],["Testuaren ideia nagusia hau da: euskara ikasteko arrazoiak aldatu egin dira.","La idea principal del texto es esta: las razones para aprender euskera han cambiado."],["Lehenik, egileak datuak aurkezten ditu; ondoren, arrazoiak aztertzen ditu.","Primero, el autor presenta los datos; después, analiza las razones."],["Laburbilduz, egileak euskaltegien lana defendatzen du.","En resumen, el autor defiende el trabajo de los euskaltegis."]],"dialog":{"title":"Preparando un resumen","lines":[["Ane","Nola egingo dut testu honen laburpena?","¿Cómo haré el resumen de este texto?"],["Iker","Lehenik, irakurri osorik eta bilatu ideia nagusia.","Primero, léelo entero y busca la idea principal."],["Ane","Uste dut ideia nagusia hau dela: heldu gehiagok ikasten dutela euskara.","Creo que la idea principal es esta: que más adultos aprenden euskera."],["Iker","Ondo. Orain idatzi zure hitzekin, eta kendu adibideak.","Bien. Ahora escríbelo con tus palabras, y quita los ejemplos."],["Ane","Eta nire iritzia?","¿Y mi opinión?"],["Iker","Laburpen batean, ez! Iritzia beste ariketa bat da.","¡En un resumen, no! La opinión es otro ejercicio."]]},"exercises":[{"type":"gap","q":"Testuak helduen euskara-ikaskuntza du ___.","es":"El texto trata del aprendizaje del euskera por parte de adultos.","a":["hizpide"],"hint":"tratar de = … du hizpide."},{"type":"gap","q":"Egileak ___ gero eta heldu gehiagok ikasten dutela.","es":"El autor dice que cada vez más adultos aprenden.","a":["dio"],"hint":"esan sintético: dio."},{"type":"gap","q":"Testuaren ideia ___ hau da.","es":"La idea principal del texto es esta.","a":["nagusia"],"hint":"principal = nagusia."},{"type":"gap","q":"Lehenik, datuak aurkezten ditu; ___, arrazoiak aztertzen ditu.","es":"Primero presenta los datos; después, analiza las razones.","a":["ondoren"],"hint":"después = ondoren."},{"type":"gap","q":"___, egileak euskaltegien lana defendatzen du.","es":"En resumen, el autor defiende el trabajo de los euskaltegis.","a":["laburbilduz"],"hint":"en resumen = laburbilduz."},{"type":"gap","q":"Hitz ___ azpimarratu.","es":"Subraya las palabras clave.","a":["gakoak"],"hint":"palabras clave = hitz gakoak."},{"type":"choice","q":"¿Qué NO debe tener un resumen?","options":["opiniones propias","la idea principal","las palabras clave"],"a":0,"why":"El resumen es fiel y neutro."},{"type":"choice","q":"«El texto trata de…»","options":["Testuak … du hizpide.","Testuak … du hitza.","Testua … da hizpide."],"a":0,"why":"Fórmula fija."},{"type":"choice","q":"Longitud recomendada de un resumen:","options":["entre un tercio y un cuarto del original","igual que el original","una sola palabra"],"a":0,"why":"Condensar sin perder lo esencial."},{"type":"choice","q":"Técnica para condensar «pan, leche, huevos»:","options":["generalizar: elikagaiak","repetir la lista","añadir más ejemplos"],"a":0,"why":"Generalizar con un hiperónimo."},{"type":"choice","q":"«Según el autor…»","options":["Egilearen ustez…","Nire ustez…","Zure ustez…"],"a":0,"why":"Se atribuye la opinión al autor."},{"type":"order","words":["du","hizpide","ikaskuntza","Testuak"],"a":["Testuak ikaskuntza du hizpide"],"es":"El texto trata del aprendizaje.","hint":"Testuak + tema + du hizpide."},{"type":"order","words":["da","hau","nagusia","ideia","Testuaren"],"a":["Testuaren ideia nagusia hau da"],"es":"La idea principal del texto es esta.","hint":"Testuaren ideia nagusia + hau da."},{"type":"order","words":["defendatzen","du","egileak","Laburbilduz"],"a":["Laburbilduz egileak defendatzen du"],"es":"En resumen, el autor defiende…","hint":"Conector + sujeto + verbo."},{"type":"match","pairs":[["laburpena","el resumen"],["ideia nagusia","la idea principal"],["hitz gakoak","las palabras clave"],["egilea","el autor"],["hizpide","tema (… du hizpide)"],["azpimarratu","subrayar"]]}],"create":{"prompt":"Elige una lección anterior de este curso (por ejemplo, B1-15 o C1-08) y escribe un resumen de su explicación en 5 o 6 frases, usando las fórmulas de la lección y sin copiar frases literales.","focus":"método de resumen, fórmulas (… du hizpide, egileak dio … -la, ideia nagusia, laburbilduz), técnicas de condensación"},"links":{"verbs":[],"cases":[],"themes":["ikasketak","lokailuak"]}},"c1-15":{"id":"c1-15","lvl":"C1","n":15,"title":"Argudio-testuak","es":"Textos argumentativos","goal":"Escribir un texto argumentativo sólido: tesis, argumentos, contraargumentos, refutación y conclusión.","explain":[{"h":"Antes de empezar","p":"El texto argumentativo es la prueba de escritura por excelencia del C1: defender una postura de forma razonada y convincente. Ya tienes todas las herramientas (opinión, conectores, causa y consecuencia, concesión, estilo nominal). En esta lección las organizas en una estructura que funciona siempre."},{"h":"La estructura","table":{"head":["Parte","Euskera","Qué hacer"],"rows":[["Introducción","sarrera","presentar el tema y tu tesis"],["Argumentos","argudioak","dos o tres razones, cada una en un párrafo"],["Contraargumento","kontrargudioa","reconocer la postura contraria"],["Refutación","gezurtapena","responder a esa postura"],["Conclusión","ondorioa","reafirmar la tesis y cerrar"]]}},{"h":"Fórmulas de afirmación y refutación","p":"Afirmar con fuerza: **Argi dago … -la** (está claro que…), **Zalantzarik gabe, …** (sin duda…), **Ezin da ukatu … -la** (no se puede negar que…). Presentar la postura contraria: **Batzuek diote … -la** (algunos dicen que…). Refutar: **Hala ere, …**, **Nik, ordea, uste dut … -la**, **Argudio horrek ez du kontuan hartzen … -la** (ese argumento no tiene en cuenta que…)."},{"h":"Recursos persuasivos","p":"1) **Datos y ejemplos**: **Datuen arabera, …**, **adibidez**. 2) **Preguntas retóricas**: **Nork ez du inoiz …?** (¿quién no ha… alguna vez?). 3) **Concesión estratégica**: **Egia da … -la, baina…** (reconocer algo del otro lado refuerza tu credibilidad)."},{"h":"Paso a paso: un párrafo de refutación","p":"**Batzuek diote telelanak bakardadea dakarrela.** (Postura contraria.) **Egia da arrisku hori badagoela; hala ere, argudio horrek ez du kontuan hartzen telelanak familiarekin denbora gehiago ematen duela.** (Concesión + refutación.) **Beraz, abantailak handiagoak dira.** (Conclusión parcial.)"},{"h":"Errores típicos","p":"Enumerar opiniones sin argumentos. Ignorar la postura contraria (el texto parece parcial). Usar el registro coloquial. Cambiar de tesis a mitad del texto. Terminar sin conclusión."},{"h":"Resumen","p":"Estructura: **sarrera (tesis) → argudioak → kontrargudioa → gezurtapena → ondorioa**. Fórmulas: **argi dago, zalantzarik gabe, ezin da ukatu, batzuek diote … -la, hala ere, argudio horrek ez du kontuan hartzen**. Recursos: datos, preguntas retóricas, concesión."}],"examples":[["Argi dago euskarak etorkizuna duela.","Está claro que el euskera tiene futuro."],["Zalantzarik gabe, hizkuntzak ikasteak burua aberasten du.","Sin duda, aprender idiomas enriquece la mente."],["Ezin da ukatu teknologiak gure bizitza aldatu duela.","No se puede negar que la tecnología ha cambiado nuestra vida."],["Batzuek diote telelanak bakardadea dakarrela.","Algunos dicen que el teletrabajo trae soledad."],["Argudio horrek ez du kontuan hartzen familiarekin denbora gehiago dagoela.","Ese argumento no tiene en cuenta que hay más tiempo con la familia."],["Nork ez du inoiz hizkuntza bat ikasi nahi izan?","¿Quién no ha querido alguna vez aprender un idioma?"]],"dialog":{"title":"Debate escrito: ¿apps para aprender idiomas?","lines":[["Tesia","Nire ustez, aplikazioak lagungarriak dira, baina ez dira nahikoak hizkuntza bat ikasteko.","En mi opinión, las aplicaciones son útiles, pero no son suficientes para aprender un idioma."],["Argudioa","Alde batetik, edonon eta edonoiz erabil daitezke.","Por un lado, se pueden usar en cualquier lugar y momento."],["Kontrargudioa","Batzuek diote aplikazioekin bakarrik hizkuntza bat ikas daitekeela.","Algunos dicen que se puede aprender un idioma solo con aplicaciones."],["Gezurtapena","Hala ere, argudio horrek ez du kontuan hartzen hitz egiteko pertsonak behar direla.","Sin embargo, ese argumento no tiene en cuenta que para hablar hacen falta personas."],["Ondorioa","Beraz, aplikazioak tresna ona dira, baina benetako elkarrizketak ezinbestekoak dira.","Por lo tanto, las aplicaciones son una buena herramienta, pero las conversaciones reales son imprescindibles."]]},"exercises":[{"type":"gap","q":"___ dago euskarak etorkizuna duela.","es":"Está claro que el euskera tiene futuro.","a":["argi"],"hint":"está claro que = argi dago … -la."},{"type":"gap","q":"Zalantzarik ___, hizkuntzak ikasteak burua aberasten du.","es":"Sin duda, aprender idiomas enriquece la mente.","a":["gabe"],"hint":"sin duda = zalantzarik gabe."},{"type":"gap","q":"Ezin da ___ teknologiak gure bizitza aldatu duela.","es":"No se puede negar que la tecnología ha cambiado nuestra vida.","a":["ukatu"],"hint":"negar = ukatu."},{"type":"gap","q":"___ diote telelanak bakardadea dakarrela.","es":"Algunos dicen que el teletrabajo trae soledad.","a":["batzuek"],"hint":"algunos (sujeto) = batzuek."},{"type":"gap","q":"Argudio horrek ez du ___ hartzen…","es":"Ese argumento no tiene en cuenta…","a":["kontuan"],"hint":"tener en cuenta = kontuan hartu ,"¿Y ahora? ¿Qué vas a hacer?"],["Ikaslea","C1 azterketa egitekoa naiz, eta mintzalagun talde batean hasiko naiz.","Tengo previsto hacer el examen C1, y empezaré en un grupo de conversación."],["Irakaslea","Primeran. Gogoratu: poliki-poliki, urrutira!","Estupendo. Recuerda: ¡poco a poco se llega lejos!"],["Ikaslea","Bai! Eta orain esan dezaket: euskalduna naiz!","¡Sí! Y ahora puedo decir: ¡soy vascohablante!"]]},"exercises":[{"type":"gap","q":"___ ariketan testu errealak irakurri eta ulertu behar dira.","es":"En la prueba de comprensión lectora hay que leer y entender textos reales.","a":["irakurmen","irakurmena"],"hint":"comprensión lectora = irakurmena (aquí sin artículo, delante de ariketan)."},{"type":"gap","q":"Beno, ikus ___…","es":"Bueno, veamos…","a":["dezagun"],"hint":"Subjuntivo exhortativo, nosotros: dezagun."},{"type":"gap","q":"Nola esango ___…","es":"Cómo lo diría…","a":["nuke"],"hint":"Condicional, yo: nuke."},{"type":"gap","q":"Egunero euskaraz zerbait ___ dut.","es":"Cada día escucho algo en euskera.","a":["entzuten"],"hint":"Habitual: entzuten."},{"type":"gap","q":"C1 azterketa egite___ naiz.","es":"Tengo previsto hacer el examen C1.","a":["koa"],"hint":"Intención: -tzekoa izan."},{"type":"gap","q":"Ez nuen uste hona iritsiko ___.","es":"No creía que fuera a llegar hasta aquí.","a":["nintzenik"],"hint":"Tras negación: -nik (pasado)."},{"type":"choice","q":"Destreza de expresión oral:","options":["mintzamena","entzumena","irakurmena"],"a":0,"why":"entzumena = comprensión oral; irakurmena = comprensión lectora."},{"type":"choice","q":"Primer punto de la lista de revisión:","options":["los auxiliares","la letra de la portada","el número de palabras exacto"],"a":0,"why":"La familia del auxiliar es el error más grave."},{"type":"choice","q":"Si no recuerdas una palabra en la prueba oral…","options":["parafrasea","quédate en silencio","cambia al castellano"],"a":0,"why":"Parafrasear demuestra recursos."},{"type":"choice","q":"Antes de prepararte para una prueba oficial…","options":["consulta la convocatoria oficial vigente","memoriza textos enteros","estudia solo gramática"],"a":0,"why":"El formato puede cambiar."},{"type":"choice","q":"La mejor forma de mantener el nivel después del curso:","options":["usar el euskera a diario: escuchar, leer y hablar","dejar de estudiar tras aprobar","repasar solo las tablas"],"a":0,"why":"El uso real es la clave."},{"type":"order","words":["dezagun","ikus","Beno"],"a":["Beno ikus dezagun"],"es":"Bueno, veamos.","hint":"Muletilla oral útil."},{"type":"order","words":["naiz","Euskalduna"],"a":["Euskalduna naiz"],"es":"Soy vascohablante.","hint":"Predicado + naiz."},{"type":"order","words":["urrutira","Poliki-poliki"],"a":["Poliki-poliki urrutira"],"es":"Poco a poco se llega lejos.","hint":"Refrán."},{"type":"match","pairs":[["irakurmena","comprensión lectora"],["entzumena","comprensión oral"],["idazmena","expresión escrita"],["mintzamena","expresión oral"],["hizkuntza-erabilera","uso de la lengua"],["mintzalaguna","compañero de conversación"]]}],"create":{"prompt":"Escribe tu plan personal para los próximos seis meses en euskera (8 a 10 frases): qué escucharás, leerás y hablarás, con qué frecuencia, si te presentarás a una prueba y por qué quieres seguir.","focus":"destrezas del examen, lista de revisión, estrategias orales, plan de aprendizaje autónomo"},"links":{"verbs":[],"cases":[],"themes":["ikasketak","lokailuak"]}}};let SAMPLE=null;
async function loadLessons(db){
  try{const q=await db.collection('lessons').get();const m={};q.docs.forEach(d=>{if(d.exists)m[d.id]=JSON.parse(JSON.stringify(d.data()))});LESSONS=m;try{localStorage.setItem('eus-lessons',JSON.stringify(m))}catch(e){}}
  catch(e){}
}
function fmt(t){return esc(t||'').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\{(nor|nork|nori):(.+?)\}/g,'<span class="r $1">$2</span>')}
function lid(L,i){return L.toLowerCase()+'-'+String(i+1).padStart(2,'0')}
function LP(id){return (S.lessons=S.lessons||{})[id]||(S.lessons[id]={})}
let LS={id:null,step:0};
function renderLessons(){
  const next=nextLesson();
  main.innerHTML=`<h1>Ikasgaiak</h1>
  <p class="lede">80 lecciones, 16 por nivel, del A1 al C1. Cada una tiene cinco pasos: entender, ver un diálogo, practicar, escribir tú y añadirlo al repaso.</p>
  ${next?`<div class="panel row" style="justify-content:space-between;margin-bottom:6px"><div><div class="muted small">Siguiente lección</div><div style="font-family:'Young Serif',Georgia,serif;font-size:1.3rem">${esc(LESSONS[next].lvl)} · ${LESSONS[next].n}. ${esc(LESSONS[next].title)}</div></div><button class="btn" data-l="${next}">Abrir</button></div>`:''}
  ${Object.entries(SYLLABUS).map(([L,arr])=>{const done=arr.filter((_,i)=>LP(lid(L,i)).done).length;return `<div class="lvlhead"><h2>${L}</h2><span class="muted small">${done} de 16 completadas</span></div>
  <div class="lgrid">${arr.map(([t,es],i)=>{const id=lid(L,i),has=!!LESSONS[id],p=LP(id);return `<button class="lcard ${p.done?'done':''}" data-l="${id}" ${has?'':'disabled'} title="${CINFO[id]?esc(CINFO[id].introduce.join(', ')):''}"><span class="num">${i+1}${has?'':' · en preparación'}${p.done?' · completada':''}</span><span class="t">${esc(t)}</span><span class="s">${esc(es)}</span></button>`}).join('')}</div>`}).join('')}`;
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>openLesson(b.dataset.l));
}
function nextLesson(){for(const [L,arr] of Object.entries(SYLLABUS))for(let i=0;i<arr.length;i++){const id=lid(L,i);if(LESSONS[id]&&!LP(id).done)return id}return null}
function openLesson(id){LS={id,step:LP(id).step||0,ex:null};view='lesson';render()}
const STEPS=['Ulertu','Ikusi','Landu','Sortu','Errepasatu'];
const STEPS_ES=['Entender','Diálogo','Practicar','Escribir','Repasar'];
function renderLesson(){
  const l=LESSONS[LS.id];if(!l){view='lessons';return render()}
  const p=LP(LS.id);
  const body=[stepExplain,stepDialog,stepPractice,stepCreate,stepReview][LS.step](l,p);
  main.innerHTML=`<button class="btn ghost small" id="bk">Todas las lecciones</button>
  <div class="muted" style="margin-top:20px">${l.lvl} · Lección ${l.n}</div>
  <h1>${esc(l.title)}</h1><p class="lede" style="margin-bottom:0">${esc(l.es)}. ${esc(l.goal)}</p>${CINFO[l.id]?`<p class="muted small" style="margin:8px 0 0">En esta lección: ${CINFO[l.id].introduce.map(esc).join(', ')}.</p>`:''}
  <div class="steps" role="navigation" aria-label="Pasos">${STEPS.map((s,i)=>`<button data-s="${i}" aria-current="${i===LS.step}">${s} <span class="muted small">${STEPS_ES[i]}</span>${(p.seen||[]).includes(i)?'<span class="ck" aria-label="hecho">✓</span>':''}</button>`).join('')}</div>
  <div class="lx" id="lx">${body}</div>
  <div class="row" style="margin-top:30px;justify-content:space-between">${LS.step>0?'<button class="btn ghost" id="prev">Anterior</button>':'<span></span>'}${LS.step<4?'<button class="btn" id="nxt">Siguiente paso</button>':''}</div>`;
  $('#bk').onclick=()=>{view='lessons';render()};
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>goStep(+b.dataset.s));
  if($('#prev'))$('#prev').onclick=()=>goStep(LS.step-1);
  if($('#nxt'))$('#nxt').onclick=()=>goStep(LS.step+1);
  [bindExplain,bindDialog,bindPractice,bindCreate,bindReview][LS.step]?.(l,p);
  window.scrollTo?.(0,0);
}
function goStep(i){const p=LP(LS.id);p.seen=[...new Set([...(p.seen||[]),LS.step])];if(LS.step===2&&!p.ex)p.seen=p.seen.filter(x=>x!==2);p.step=i;LS.step=i;save();renderLesson()}
function stepExplain(l){
  return l.explain.map(b=>`${b.h?`<h3>${esc(b.h)}</h3>`:''}${b.p?`<p>${fmt(b.p)}</p>`:''}${b.table?`<div class="tablewrap"><table><thead><tr>${b.table.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.table.rows.map(r=>`<tr>${r.map((c,j)=>`<td ${j===1?'class="f"':''}>${fmt(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}`).join('')
   +`<h3>Ejemplos</h3>${l.examples.map(([eu,es])=>`<div class="exrow"><span class="eu">${esc(eu)}</span><span class="es">${esc(es)}</span></div>`).join('')}`
   +(SAMPLE?`<div class="qa"><h3>¿Te ha quedado alguna duda?</h3><p class="muted small">Pregunta lo que quieras sobre esta lección, o pide que te lo expliquen de otra forma. <span class="ai">IA</span></p><textarea id="qq" placeholder="Por ejemplo: ¿por qué irakaslea lleva -a? / Explícamelo como si no supiera nada"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="qgo">Preguntar</button><button class="btn ghost" id="qsimple">Explícamelo más fácil</button></div><div id="qout"></div></div>`:'');
}
function bindExplain(l){
  if(!$('#qgo'))return;
  const ask=async q=>{const out=$('#qout');out.innerHTML='<p class="muted">Pensando… (la primera vez se te pedirá permiso para usar Claude)</p>';$('#qgo').disabled=$('#qsimple').disabled=true;
    const theory=l.explain.map(b=>[b.h,b.p,b.table?b.table.rows.map(r=>r.join(' | ')).join('; '):''].filter(Boolean).join(': ')).join('\n');
    const prompt=`Eres un profesor de euskera batua para un hispanohablante que empieza de cero y aprende solo. Responde en español, claro y cercano, con ejemplos cortos en euskera traducidos. Máximo 220 palabras. No uses formato markdown ni listas con asteriscos; usa frases y saltos de línea. Sé preciso: no inventes reglas.
Lección ${l.lvl}-${l.n} «${l.title}» (${l.es}). Teoría de la lección:
${theory}
Pregunta del alumno: ${q}`;
    try{await SAMPLE(prompt,{cache:false,onText:({text})=>{out.innerHTML=`<div class="ans">${esc(text)}</div>`}})}
    catch(e){out.innerHTML=`<p class="muted">${e.code==='not_granted'?'No se ha dado permiso para usar Claude en esta página.':e.code==='rate_limited'?'Demasiadas peticiones seguidas. Espera un minuto.':'No se pudo responder. Vuelve a intentarlo.'}</p>`}
    finally{$('#qgo').disabled=$('#qsimple').disabled=false}};
  $('#qgo').onclick=()=>{const q=$('#qq').value.trim();if(q)ask(q.slice(0,800))};
  $('#qsimple').onclick=()=>ask('Explícame esta lección de forma más sencilla y paso a paso, como si no supiera nada de euskera, con 3 ejemplos nuevos muy simples.');
}
function stepDialog(l){return `<h3>${esc(l.dialog.title)}</h3><p class="muted small">Léelo en voz alta. Intenta entenderlo antes de mostrar la traducción.</p><label class="row small" style="gap:6px;margin:8px 0"><input type="checkbox" id="tr"> Mostrar traducción</label><div id="dl">${l.dialog.lines.map(([w,eu,es])=>`<div class="dline"><span class="who">${esc(w)}</span><div><div class="eu">${esc(eu)}</div><div class="es">${esc(es)}</div></div></div>`).join('')}</div>`}
function bindDialog(){$('#tr').onchange=e=>$('#dl').classList.toggle('showes',e.target.checked)}

function stepPractice(l,p){
  if(!LS.ex){LS.ex={list:l.exercises.map(e=>({...e})),i:0,ok:0,ai:false};}
  const E=LS.ex;
  if(E.i>=E.list.length){
    const pct=Math.round(100*E.ok/E.list.length);
    return `<div class="done-big">${E.ok}/${E.list.length}</div><p class="lede">${pct>=80?'Muy bien. Puedes pasar al siguiente paso.':'Repasa la explicación y vuelve a intentarlo cuando quieras.'}</p>
    <div class="row"><button class="btn ghost" id="redo">Repetir ejercicios</button>${SAMPLE?'<button class="btn ghost" id="more">Más ejercicios nuevos <span class="ai">IA</span></button>':''}</div><div id="morest" class="muted small" style="margin-top:10px"></div>`;
  }
  const e=E.list[E.i];
  let h=`<div class="row" style="justify-content:space-between"><span class="muted small">Ejercicio ${E.i+1} de ${E.list.length}${E.ai?' <span class="ai">generado por IA</span>':''}</span><span class="muted small">${E.ok} bien</span></div><div class="prog" style="margin:8px 0 22px"><i style="width:${100*E.i/E.list.length}%"></i></div>`;
  if(e.type==='choice'){const ord=e._ord||(e._ord=e.options.map((_,i)=>i).sort(()=>Math.random()-.5));h+=`<div class="prompt-big" style="font-size:1.6rem">${fmt(e.q)}</div><div class="choices">${ord.map((oi,k)=>`<button class="choice" data-o="${oi}"><kbd>${k+1}</kbd>${esc(e.options[oi])}</button>`).join('')}</div>`}
  if(e.type==='gap'){const [a,b]=e.q.split('___');h+=`<form id="gf" autocomplete="off"><div class="gapq">${esc(a)}<input id="gi" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Hueco" enterkeyhint="go">${esc(b||'')}</div><div class="prompt-hint" style="margin-top:8px">«${esc(e.es)}»</div><button class="btn" id="gchk" type="submit">Comprobar</button></form>`}
  if(e.type==='order'){e._sh=e._sh||[...e.words].sort(()=>Math.random()-.5);e._b=e._b||[];h+=`<div class="prompt-hint">Ordena las palabras: «${esc(e.es)}»</div><div class="built" id="built">${e._b.map(i=>esc(e._sh[i])).join(' ')}</div><div class="tiles">${e._sh.map((w,i)=>`<button class="tile" data-t="${i}" ${e._b.includes(i)?'disabled':''}>${esc(w)}</button>`).join('')}</div><div class="row"><button class="btn ghost" id="oclr">Borrar</button><button class="btn" id="ochk">Comprobar</button></div>`}
  if(e.type==='match'){e._r=e._r||e.pairs.map((_,i)=>i).sort(()=>Math.random()-.5);e._done=e._done||[];h+=`<div class="prompt-hint">Empareja cada elemento con su significado.</div><div class="mcols"><div style="display:grid;gap:8px">${e.pairs.map((pr,i)=>`<button class="choice ${e._done.includes(i)?'ok':''}" data-ml="${i}" ${e._done.includes(i)?'disabled':''}>${esc(pr[0])}</button>`).join('')}</div><div style="display:grid;gap:8px">${e._r.map(i=>`<button class="choice ${e._done.includes(i)?'ok':''}" data-mr="${i}" ${e._done.includes(i)?'disabled':''}>${esc(e.pairs[i][1])}</button>`).join('')}</div></div>`}
  return h+`<div class="row" style="margin-top:12px"><button class="linkbtn small" id="hintb">Necesito una pista</button></div><div id="hintt" class="note small" style="display:none;margin-top:8px"></div><div class="fb" id="fb" role="status"></div><div class="row" style="margin-top:14px"><button class="btn" id="exn" style="display:none">Siguiente ejercicio</button></div>`;
}
function exResult(ok,msg){document.onkeydown=null;const E=LS.ex;if(ok)E.ok++;const fb=$('#fb');fb.className='fb show '+(ok?'ok':'bad');fb.innerHTML=msg;$('#exn').style.display='';$('#exn').focus();$('#exn').onclick=()=>{E.i++;if(E.i>=E.list.length)finishEx();renderLesson()}}
function finishEx(){const p=LP(LS.id),E=LS.ex;if(!E.ai){p.ex={ok:E.ok,n:E.list.length,t:Date.now()};p.seen=[...new Set([...(p.seen||[]),2])]}save()}
function bindPractice(l){
  const E=LS.ex;
  if(E.i>=E.list.length){$('#redo').onclick=()=>{LS.ex=null;renderLesson()};if($('#more'))$('#more').onclick=()=>moreExercises(l);return}
  const e=E.list[E.i];
  if(e.type==='choice'){const pick=o=>{document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(+b.dataset.o===e.a)b.classList.add('ok');else if(+b.dataset.o===o)b.classList.add('bad')});exResult(o===e.a,`${o===e.a?'<strong>Ondo!</strong>':'<strong>No es así.</strong>'} ${fmt(e.why||'')}`)};
    document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>pick(+b.dataset.o))}
  $('#hintb').onclick=()=>{const t=$('#hintt');t.style.display='block';t.innerHTML=e.hint?fmt(e.hint):'Vuelve al paso «Ulertu» y busca la tabla o la regla que trata esto. No pasa nada por mirar: así es como se aprende.'};
  if(e.type==='gap'){const gi=$('#gi');setTimeout(()=>gi.focus(),30);const chk=()=>{if(gi.readOnly)return;const ok=e.a.some(a=>normW(a)===normW(gi.value));gi.readOnly=true;gi.classList.add(ok?'ok':'bad');$('#gchk').disabled=true;exResult(ok,ok?`<strong>Ondo!</strong> ${esc(e.q.replace('___',e.a[0]))}`:`<strong>La respuesta es:</strong> <span class="form">${esc(e.a[0])}</span> · ${esc(e.q.replace('___',e.a[0]))}${e.why?`<div class="why">${fmt(e.why)}</div>`:''}`)};
    $('#gf').onsubmit=ev=>{ev.preventDefault();gi.readOnly?$('#exn').click():chk()};
    document.onkeydown=ev=>{if((ev.key==='Enter'||ev.keyCode===13)&&!ev.target.closest?.('#gf')&&!ev.target.closest?.('button')){ev.preventDefault();gi.readOnly?$('#exn').click():chk()}}}
  if(e.type==='order'){document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{e._b.push(+b.dataset.t);renderLesson()});$('#oclr').onclick=()=>{e._b=[];renderLesson()};
    $('#ochk').onclick=()=>{const got=e._b.map(i=>e._sh[i]).join(' ');const ok=e.a.some(a=>normW(a)===normW(got));$('#ochk').disabled=true;$('#oclr').disabled=true;document.querySelectorAll('.tile').forEach(t=>t.disabled=true);exResult(ok,ok?`<strong>Ondo!</strong> ${esc(e.a[0])}.`:`<strong>Una respuesta correcta:</strong> <span class="form">${esc(e.a[0])}</span>${e.a.length>1?`<div class="why">También vale: ${e.a.slice(1).map(esc).join(' · ')}</div>`:''}`)}}
  if(e.type==='match'){let sel=null;e._err=e._err||0;
    document.querySelectorAll('[data-ml]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-ml]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.ml});
    document.querySelectorAll('[data-mr]').forEach(b=>b.onclick=()=>{if(sel===null)return;const r=+b.dataset.mr;if(r===sel){e._done.push(r);if(e._done.length===e.pairs.length){renderLesson();exResult(e._err===0,e._err===0?'<strong>Ondo!</strong> Todas a la primera.':`<strong>Completado</strong> con ${e._err} ${e._err===1?'fallo':'fallos'}. Repásalas en la tabla de la explicación.`)}else renderLesson()}else{e._err++;b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),500)}})}
}
async function moreExercises(l){
  const st=$('#morest');$('#more').disabled=true;st.textContent='Pensando… (la primera vez se te pedirá permiso para usar Claude)';
  const prompt=`Eres profesor de euskera batua para hispanohablantes. Crea 6 ejercicios NUEVOS de nivel ${l.lvl} para la lección «${l.title}» (${l.es}). Enfoque gramatical: ${l.create.focus}. Usa solo gramática de esta lección o anterior y vocabulario muy frecuente. Ejemplos de la lección: ${l.examples.map(x=>x[0]).join(' | ')}.
Revisa cada frase con cuidado: deben ser 100 % correctas en euskera batua estándar.
Responde SOLO con un array JSON, sin texto alrededor. Mezcla estos dos formatos:
{"type":"gap","q":"frase en euskera con ___ en el hueco","es":"traducción al español","a":["respuesta","otra respuesta válida si la hay"]}
{"type":"choice","q":"enunciado en español","options":["opción correcta","incorrecta","incorrecta"],"a":0,"why":"explicación breve en español"}`;
  try{const r=await SAMPLE.json(prompt,{cache:false});
    const list=(Array.isArray(r)?r:[]).filter(e=>(e.type==='gap'&&typeof e.q==='string'&&e.q.includes('___')&&Array.isArray(e.a)&&e.a.length)||(e.type==='choice'&&Array.isArray(e.options)&&e.options.length>=2&&Number.isInteger(e.a)&&e.options[e.a]!==undefined));
    if(!list.length)throw {code:'empty'};
    LS.ex={list,i:0,ok:0,ai:true};renderLesson();
  }catch(e){st.textContent=e.code==='not_granted'?'No se ha dado permiso para usar Claude en esta página.':e.code==='rate_limited'?'Demasiadas peticiones seguidas. Espera un minuto y vuelve a probar.':'No se pudieron generar ejercicios. Vuelve a intentarlo.';$('#more').disabled=false}
}
/* --- escribir --- */
function stepCreate(l,p){
  return `<h3>Tu turno</h3><p>${fmt(l.create.prompt)}</p><textarea id="ta" placeholder="Idatzi hemen…">${esc(p.text||'')}</textarea>
  <div class="row" style="margin-top:12px">${SAMPLE?'<button class="btn" id="fix">Corregir mi texto <span class="ai" style="color:inherit">IA</span></button>':'<span class="muted small">La corrección automática no está disponible en esta vista. Puedes pegar tu texto en el chat con Claude para que te lo corrija.</span>'}</div>
  <div id="fixout" style="margin-top:16px">${p.fix?fixHTML(p.fix):''}</div>`;
}
function fixHTML(f){return `<div class="muted small">Versión corregida</div><div class="corr">${esc(f.correccion||'')}</div>${(f.notas||[]).length?`<h3>Observaciones</h3><ul>${f.notas.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}${f.animo?`<p class="muted">${esc(f.animo)}</p>`:''}<p class="muted small">Corrección generada por IA: ante la duda, contrástala con la explicación de la lección.</p>`}
function bindCreate(l,p){
  const ta=$('#ta');ta.oninput=()=>{p.text=ta.value;save()};
  if(!$('#fix'))return;
  $('#fix').onclick=async()=>{
    if(!ta.value.trim()){$('#fixout').innerHTML='<p class="muted">Escribe algo primero.</p>';return}
    $('#fix').disabled=true;$('#fixout').innerHTML='<p class="muted">Pensando… (la primera vez se te pedirá permiso para usar Claude)</p>';
    const prompt=`Eres un profesor de euskera batua, paciente y preciso, para un hispanohablante de nivel ${l.lvl}. Lección: «${l.title}» (${l.es}). Enfoque: ${l.create.focus}.
Tarea del alumno: ${l.create.prompt}
Texto del alumno:
"""${ta.value.slice(0,1500)}"""
Corrige el texto en euskera batua estándar, cambiando lo mínimo necesario. Explica en español cada error (sobre todo auxiliares, casos, artículo y orden de palabras), de forma breve y concreta. Si todo está bien, dilo. No inventes errores.
Responde SOLO con JSON: {"correccion":"texto corregido completo","notas":["explicación breve de cada error"],"animo":"una frase breve de ánimo en español"}`;
    try{const f=await SAMPLE.json(prompt,{cache:false,modelTier:'default'});p.fix={correccion:String(f.correccion||''),notas:Array.isArray(f.notas)?f.notas.map(String):[],animo:String(f.animo||'')};p.seen=[...new Set([...(p.seen||[]),3])];save();$('#fixout').innerHTML=fixHTML(p.fix)}
    catch(e){$('#fixout').innerHTML=`<p class="muted">${e.code==='not_granted'?'No se ha dado permiso para usar Claude en esta página.':e.code==='rate_limited'?'Demasiadas peticiones seguidas. Espera un minuto.':'No se pudo corregir. Vuelve a intentarlo.'}</p>`}
    finally{$('#fix').disabled=false}
  };
}
/* --- repasar --- */
function stepReview(l,p){
  const k=l.links||{};const gv=(k.verbs||[]).map(id=>GROUPS.find(g=>g.id===id)?.name).filter(Boolean);const gc=(k.cases||[]).map(id=>CASES.find(c=>c.k===id)?.eu).filter(Boolean);const gt=(k.themes||[]).map(id=>VOCAB.find(t=>t.id===id)?.eu).filter(Boolean);
  const nx=nextAfter(l.id);
  return `<h3>Llévatelo al repaso</h3><p>Al terminar, estos bloques se añaden a tus selecciones de práctica para que el repaso espaciado los mantenga vivos.</p>
  ${gv.length?`<p><strong>Verbos:</strong> ${gv.map(esc).join(', ')}</p>`:''}${gc.length?`<p><strong>Casos:</strong> ${gc.map(esc).join(', ')}</p>`:''}${gt.length?`<p><strong>Vocabulario:</strong> ${gt.map(esc).join(', ')}</p>`:''}
  <p class="muted small">${p.ex?`Ejercicios: ${p.ex.ok}/${p.ex.n}.`:'Aún no has hecho los ejercicios.'} ${p.fix?'Texto corregido.':'Aún no has escrito tu texto.'}</p>
  <div class="row"><button class="btn" id="fin">${nx&&LESSONS[nx]?(p.done?`Ir a la lección ${LESSONS[nx].n}: ${esc(LESSONS[nx].title)}`:`Completar y pasar a la lección ${LESSONS[nx].n}`):(p.done?'Lección completada':'Completar lección')}</button><button class="btn ghost" id="home2">Volver al inicio</button></div><div id="finmsg" class="muted small" style="margin-top:10px">${nx&&!LESSONS[nx]?'La siguiente lección aún está en preparación.':''}</div>`;
}
function nextAfter(id){const L=id.slice(0,2).toUpperCase(),n=+id.slice(3);if(n<16)return lid(L,n);const lv=Object.keys(SYLLABUS);const j=lv.indexOf(L);return j<lv.length-1?lid(lv[j+1],0):null}
function bindReview(l,p){
  $('#fin').onclick=()=>{const k=l.links||{};const u=(a,b)=>[...new Set([...(a||[]),...(b||[])])];
    S.settings.vgroups=u(S.settings.vgroups,k.verbs);S.settings.dcases=u(S.settings.dcases,k.cases);S.settings.wthemes=u(S.settings.wthemes,k.themes);
    p.done=true;p.seen=[...new Set([...(p.seen||[]),4])];save();
    const nx=nextAfter(l.id);
    if(nx&&LESSONS[nx])openLesson(nx);else{$('#finmsg').textContent='Lección completada. Sus bloques ya están en tu práctica.';$('#fin').textContent='Lección completada'}};
  $('#home2').onclick=()=>{view='home';render()};
}

/* ============ SESIÓN GUIADA ============ */
function todayKey(){return new Date().toDateString()}
function T0(){if(!S.today||S.today.d!==todayKey())S.today={d:todayKey(),s:[]};return S.today}
function allDue(){const now=Date.now();return [...VITEMS,...DITEMS,...WITEMS].filter(i=>S.stats[i.id]&&S.stats[i.id].d<=now)}
function learnedPool(){const done=Object.keys(LESSONS).filter(id=>LP(id).done);const v=new Set(),c=new Set(),t=new Set();done.forEach(id=>{const k=LESSONS[id].links||{};(k.verbs||[]).forEach(x=>v.add(x));(k.cases||[]).forEach(x=>c.add(x));(k.themes||[]).forEach(x=>t.add(x))});
  return [...VITEMS.filter(i=>v.has(i.g)),...DITEMS.filter(i=>c.has(i.g)&&['sg','pl'].includes(i.num)),...wordPool([...t],['A1','A2','B1'].slice(0,1+['A2','B1'].filter(L=>Object.keys(LESSONS).some(id=>id.startsWith(L.toLowerCase())&&LP(id).done)).length))]}
function todayHTML(){
  const t=T0(),due=allDue().length,nx=nextLesson(),lp=learnedPool().length;
  const steps=[
    ['rep','Repasa lo pendiente',due?`${due} elementos esperan repaso. Unos 5 minutos.`:'No tienes nada pendiente. Puedes saltar este paso.',due?'Repasar':null],
    ['les','Avanza en el temario',nx?`${LESSONS[nx].lvl} · ${LESSONS[nx].n}. ${esc(LESSONS[nx].title)}: haz uno o dos pasos, o la lección entera si tienes tiempo.`:'Has completado todas las lecciones disponibles.',nx?'Abrir lección':null],
    ['new','Practica lo aprendido',lp?'Ejercicios de los verbos, casos y vocabulario de las lecciones que ya has completado. Lo nuevo se te enseña antes de preguntarlo.':'Se activa cuando completes tu primera lección.',lp?'Practicar':null]];
  return `<div class="panel" style="margin-bottom:22px"><h2 style="margin-bottom:4px">Gaurko saioa</h2><p class="muted small" style="margin:0">La sesión de hoy, en este orden. Si solo tienes 10 minutos, haz el paso 1 y un paso de la lección.</p>
  <div class="today">${steps.map(([k,ti,d,b],i)=>`<div class="tstep ${t.s.includes(k)?'done':''}"><span class="n">${t.s.includes(k)?'✓':i+1}</span><div><strong>${ti}</strong><div class="muted small">${d}</div></div>${b?`<button class="btn ${t.s.includes(k)?'ghost':''} small" data-today="${k}">${b}</button>`:''}</div>`).join('')}</div></div>`;
}
function markToday(k){const t=T0();if(!t.s.includes(k))t.s.push(k);save()}
function bindToday(){document.querySelectorAll('[data-today]').forEach(b=>b.onclick=()=>{const k=b.dataset.today;
  if(k==='rep'){const d=allDue();markToday('rep');startDrill(d,'home')}
  if(k==='les'){markToday('les');openLesson(nextLesson())}
  if(k==='new'){markToday('new');const fn=learnedPool;startDrill(fn(),'home',fn)}})}

/* ============ TABLAS ============ */
let T={which:'nn-pres',hide:false,noun:'etxe'};
function matrix(rows,cols,get,rowRole,colRole,rowLab,colLab){
  return `<div class="tablewrap"><table><thead><tr><th>${rowRole.toUpperCase()} ↓ · ${colRole.toUpperCase()} →</th>${cols.map(c=>`<th class="${colRole}">${colLab(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><th class="${rowRole}">${rowLab(r)}</th>${cols.map(c=>{const f=get(r,c);return f?`<td class="f ${T.hide?'hid':''}">${f}</td>`:'<td class="empty" aria-label="no existe"></td>'}).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function simpleCol(title,obj,role){return `<div class="tablewrap"><table><thead><tr><th class="${role}">${role.toUpperCase()}</th><th>${title}</th></tr></thead><tbody>${PERS.map(p=>`<tr><th class="${role}">${role==='nork'?ERG[p]:p}</th><td class="f ${T.hide?'hid':''}">${obj[p]}</td></tr>`).join('')}</tbody></table></div>`}
function renderTables(){
  const opts=[['nor','NOR (izan)'],['nn-pres','NOR-NORK presente'],['nn-past','NOR-NORK pasado'],['nni','NOR-NORI'],['nnn-pres','NOR-NORI-NORK presente'],['nnn-past','NOR-NORI-NORK pasado'],['syn','Verbos sintéticos'],['decl','Declinación de un sustantivo']];
  let body='';
  const id=x=>x, er=p=>ERG[p], da=p=>DAT[p];
  if(T.which==='nor') body=`<div class="grid2">${simpleCol('Presente',SYN.izan.pres,'nor')}${simpleCol('Pasado',SYN.izan.past,'nor')}</div>`;
  if(T.which==='nn-pres') body=matrix(PERS,PERS,(nor,nork)=>NN_PRES[nor][nork],'nor','nork',id,er);
  if(T.which==='nn-past') body=matrix(PERS,PERS,(nor,nork)=>NN_PAST[nor][nork],'nor','nork',id,er);
  if(T.which==='nni') body=`<h3>Presente</h3>${matrix(['hura','haiek'],PERS,(nor,nori)=>NNI_PRES[nor][nori],'nor','nori',id,da)}<h3>Pasado</h3>${matrix(['hura','haiek'],PERS,(nor,nori)=>NNI_PAST[nor][nori],'nor','nori',id,da)}`;
  if(T.which==='nnn-pres') body=`<h3>NOR hura (lo)</h3>${matrix(PERS,PERS,(nork,nori)=>NNN_PRES[nork][nori],'nork','nori',er,da)}<h3>NOR haiek (los)</h3>${matrix(PERS,PERS,(nork,nori)=>NNN_PRES_PL[nork][nori],'nork','nori',er,da)}`;
  if(T.which==='nnn-past') body=`<h3>NOR hura (lo)</h3>${matrix(PERS,PERS,(nork,nori)=>NNN_PAST[nork][nori],'nork','nori',er,da)}`;
  if(T.which==='syn') body=`<div class="tablewrap"><table><thead><tr><th>Persona</th>${Object.keys(SYN).filter(v=>v!=='izan').map(v=>`<th>${v}<br><span class="muted small">${SYN[v].es}</span></th>`).join('')}</tr></thead><tbody>${PERS.map(p=>`<tr><th>${p} / ${ERG[p]}</th>${Object.keys(SYN).filter(v=>v!=='izan').map(v=>`<td class="f ${T.hide?'hid':''}">${SYN[v].pres[p]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <h3>Pasado</h3><div class="tablewrap"><table><thead><tr><th>Persona</th>${['egon','joan','etorri'].map(v=>`<th>${v}</th>`).join('')}</tr></thead><tbody>${PERS.map(p=>`<tr><th>${p}</th>${['egon','joan','etorri'].map(v=>`<td class="f ${T.hide?'hid':''}">${SYN[v].past[p]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(T.which==='decl'){const n=NOUNS.find(x=>x.w===T.noun);
    body=`<div class="row" style="margin:6px 0"><label>Sustantivo <select id="noun">${NOUNS.map(x=>`<option value="${x.w}" ${x.w===T.noun?'selected':''}>${x.w} — ${bare(x.es)}</option>`).join('')}</select></label></div>
    ${n.an?'<p class="note small">Es un ser vivo: los casos de lugar (NON, NORA, NONDIK…) usan otras formas (-rengan, -rengana…) que veremos más adelante.</p>':''}
    <div class="tablewrap"><table><thead><tr><th>Caso</th><th>Singular</th><th>Plural</th><th>Indefinido</th></tr></thead><tbody>${CASES.filter(c=>!(c.loc&&n.an)).map(c=>`<tr><th>${c.eu} <span class="muted small">${c.q}?</span></th>${['sg','pl','id'].map(num=>`<td class="f ${T.hide?'hid':''}">${decline(n,c.k,num)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
  main.innerHTML=`
    <h1>Taulak</h1>
    <p class="lede">Tablas de consulta generadas por el mismo motor que usa la práctica. Activa «Ocultar formas» para repasar: pulsa una casilla para verla.</p>
    <div class="row" style="margin-bottom:8px"><select id="which" aria-label="Tabla">${opts.map(([k,l])=>`<option value="${k}" ${k===T.which?'selected':''}>${l}</option>`).join('')}</select>
    <label class="row small" style="gap:6px"><input type="checkbox" id="hide" ${T.hide?'checked':''}> Ocultar formas</label></div>
    <div class="legend"><span class="chip nor"><b>NOR</b></span><span class="chip nork"><b>NORK</b></span><span class="chip nori"><b>NORI</b></span><span class="muted small">Las casillas rayadas no existen (serían reflexivas: se expresan de otra manera).</span></div>
    ${body}`;
  $('#which').onchange=e=>{T.which=e.target.value;renderTables()};
  $('#hide').onchange=e=>{T.hide=e.target.checked;renderTables()};
  if($('#noun'))$('#noun').onchange=e=>{T.noun=e.target.value;renderTables()};
  document.querySelectorAll('td.hid').forEach(td=>td.onclick=()=>td.classList.remove('hid'));
}

initStore();
</script>
</body>
</html>
