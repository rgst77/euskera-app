"},{"type":"order","words":["ona","da","proiektua","Laburbilduz"],"a":["Laburbilduz proiektua ona da"],"es":"En resumen, el proyecto es bueno.","hint":"Conector + frase."},{"type":"order","words":["uste","ordea","Nik","dut","ez"],"a":["Nik ordea ez dut uste"],"es":"Yo, sin embargo, no lo creo.","hint":"Primer elemento + ordea + resto."},{"type":"match","pairs":[["lehenik","en primer lugar"],["gainera","además"],["aldiz","en cambio"],["ordea","sin embargo"],["esaterako","por ejemplo"],["laburbilduz","en resumen"]]}],"create":{"prompt":"Escribe una redacción breve (8 a 10 frases) sobre las ventajas y desventajas de aprender idiomas con apps, con introducción, desarrollo y conclusión, usando al menos seis conectores distintos.","focus":"conectores de orden, adición, contraste, ejemplo, explicación y conclusión; estructura de redacción"},"links":{"verbs":[],"cases":[],"themes":["lokailuak","ikasketak"]}},"b2-13":{"id":"b2-13","lvl":"B2","n":13,"title":"Erregistroak","es":"Registro formal, neutro y coloquial","goal":"Adaptar tu euskera a la situación: una oficina, un correo, un bar con amigos.","explain":[{"h":"Antes de empezar","p":"Hablar bien no es hablar siempre igual. Con un funcionario, en un correo de trabajo o con tus amigos en el bar se usan palabras y giros distintos. Esta lección te da las claves para reconocer cada registro y moverte entre ellos sin sonar ni demasiado rígido ni demasiado informal."},{"h":"La cortesía en euskera","p":"El euskera no tiene un «usted» distinto de «tú»: **zu** sirve para las dos cosas. La cortesía se marca con otros recursos: el **potencial hipotético** (**Esan zenezake non dagoen geltokia?**, ¿podría decirme dónde está la estación?), el **condicional** (**Kafe bat nahi nuke**, quisiera un café), **mesedez** y fórmulas como **Ahal baduzu…** (si puede…)."},{"h":"Registro formal: vocabulario","table":{"head":["Neutro","Formal","Significado"],"rows":[["egin","burutu, gauzatu","realizar, llevar a cabo"],["eman","eskaini","dar / ofrecer"],["esan","adierazi","decir / manifestar"],["hasi","abiatu","empezar / iniciar"],["lortu","eskuratu","conseguir / obtener"],["buruz","-ri buruz, … inguruan","sobre, acerca de"]]}},{"h":"Registro coloquial","p":"En conversación oirás **ze** por **zer** (**Ze moduz?**), **Nik ze dakit!** (¡yo qué sé!), **ea** (a ver: **Ea, zer daukagu hemen?**), **ba** como partícula de énfasis (**Ez dakit ba!**), **Aupa!** (¡hola!), **Ondo ibili!** (¡que te vaya bien!), **Ene!** o **Jo!** (¡vaya!), **Primeran!** (¡estupendo!)."},{"h":"Una nota sobre hika","p":"Entre amigos íntimos y en algunas zonas se usa un tratamiento más familiar que «zu», llamado **hika** (pronombre **hi**), con formas verbales propias. Forma parte del euskera, pero su uso es limitado y requiere un aprendizaje aparte; este curso trabaja con **zu**, que es correcto en cualquier situación."},{"h":"Paso a paso: la misma petición en dos registros","p":"Con un amigo: **Ea, esango didazu zer ordu den?** (a ver, ¿me dices qué hora es?). Con un desconocido en una oficina: **Barkatu, esan zenezake zer ordu den, mesedez?** (perdone, ¿podría decirme qué hora es, por favor?). Mismo significado, distinto tono."},{"h":"Errores típicos","p":"Usar *ze* o *Nik ze dakit* en un correo formal. Pensar que hace falta un «usted»: con **zu** y una forma cortés basta. Usar vocabulario formal (*burutu, adierazi*) en una conversación de bar suena artificial."},{"h":"Resumen","p":"Cortesía: **zu** + potencial hipotético (**zenezake**) o condicional (**nahi nuke**) + **mesedez**. Formal: **burutu, eskaini, adierazi, abiatu, eskuratu**. Coloquial: **ze, ea, ba, aupa, ondo ibili, primeran**."}],"examples":[["Esan zenezake non dagoen geltokia?","¿Podría decirme dónde está la estación?"],["Kafe bat nahi nuke, mesedez.","Quisiera un café, por favor."],["Ze moduz? Ondo, eta zu?","¿Qué tal? Bien, ¿y tú?"],["Nik ze dakit!","¡Yo qué sé!"],["Ea, zer daukagu hemen?","A ver, ¿qué tenemos aquí?"],["Proiektua datorren urtean burutuko da.","El proyecto se llevará a cabo el año que viene."],["Udalak laguntza eskaintzen du.","El ayuntamiento ofrece ayuda."]],"dialog":{"title":"Dos conversaciones","lines":[["Ane","Barkatu, esan zenezake non dagoen zuzendariaren bulegoa?","Perdone, ¿podría decirme dónde está el despacho del director?"],["Langilea","Bai, noski. Bigarren solairuan dago, eskuinera.","Sí, claro. Está en el segundo piso, a la derecha."],["Ane","Aupa, Iker! Ze moduz?","¡Hola, Iker! ¿Qué tal?"],["Iker","Hemen, lanean, betiko moduan. Eta zu?","Aquí, trabajando, como siempre. ¿Y tú?"],["Ane","Ni ere bai. Ea, kafe bat hartuko dugu gero?","Yo también. A ver, ¿tomamos un café luego?"],["Iker","Primeran! Ondo ibili!","¡Estupendo! ¡Que te vaya bien!"]]},"exercises":[{"type":"gap","q":"Esan ___ non dagoen geltokia?","es":"¿Podría decirme dónde está la estación?","a":["zenezake"],"hint":"Cortesía: potencial hipotético."},{"type":"gap","q":"Kafe bat nahi ___, mesedez.","es":"Quisiera un café, por favor.","a":["nuke"],"hint":"Cortesía: condicional."},{"type":"gap","q":"___ moduz?","es":"¿Qué tal? (coloquial)","a":["ze"],"hint":"Coloquial de zer: ze."},{"type":"gap","q":"Nik ze ___!","es":"¡Yo qué sé!","a":["dakit"],"hint":"Expresión coloquial fija."},{"type":"gap","q":"Proiektua datorren urtean ___ da.","es":"El proyecto se llevará a cabo el año que viene.","a":["burutuko"],"hint":"Formal de egin: burutu."},{"type":"gap","q":"Udalak laguntza ___ du.","es":"El ayuntamiento ofrece ayuda.","a":["eskaintzen"],"hint":"Formal de eman: eskaini."},{"type":"choice","q":"Forma cortés de pedir indicaciones:","options":["Esan zenezake non dagoen?","Esan non dago!","Non dago, esan."],"a":0,"why":"Potencial hipotético: zenezake."},{"type":"choice","q":"Equivalente formal de «egin»:","options":["burutu","ibili","atera"],"a":0,"why":"burutu = realizar, llevar a cabo."},{"type":"choice","q":"Equivalente formal de «esan»:","options":["adierazi","galdetu","ulertu"],"a":0,"why":"adierazi = manifestar."},{"type":"choice","q":"«¡Yo qué sé!» (coloquial)","options":["Nik ze dakit!","Nik badakit!","Ez dakizu!"],"a":0,"why":"Expresión coloquial fija."},{"type":"choice","q":"¿Tiene el euskera un «usted» distinto de «tú»?","options":["No: zu sirve para ambos; la cortesía se marca con otras formas.","Sí: se usa siempre «hura».","Sí: se usa «zuek» para una persona."],"a":0,"why":"zu es neutro y cortés a la vez."},{"type":"order","words":["zenezake","Esan","dagoen","non","geltokia"],"a":["Esan zenezake non dagoen geltokia"],"es":"¿Podría decirme dónde está la estación?","hint":"Esan zenezake + interrogativa indirecta."},{"type":"order","words":["nuke","nahi","bat","Kafe"],"a":["Kafe bat nahi nuke"],"es":"Quisiera un café.","hint":"Objeto + nahi nuke."},{"type":"order","words":["dakit","ze","Nik"],"a":["Nik ze dakit"],"es":"Yo qué sé.","hint":"Expresión fija."},{"type":"match","pairs":[["zenezake","podría(s) (cortés)"],["nahi nuke","quisiera"],["ze","qué (coloquial)"],["burutu","realizar"],["eskaini","ofrecer"],["adierazi","manifestar"]]}],"create":{"prompt":"Escribe la misma situación en dos registros (4 líneas cada uno): pedir información sobre un horario a un desconocido en una oficina y a un amigo por mensaje.","focus":"cortesía con zenezake/nahi nuke, vocabulario formal, expresiones coloquiales"},"links":{"verbs":[],"cases":[],"themes":["agurrak","lokailuak"]}},"b2-14":{"id":"b2-14","lvl":"B2","n":14,"title":"Gutun formalak","es":"Cartas y correos formales","goal":"Escribir un correo o una carta formal completa: saludo, motivo, petición, adjuntos y despedida.","explain":[{"h":"Antes de empezar","p":"Escribir a una institución, a una empresa o a un euskaltegi es una de las tareas más prácticas (y más evaluadas) del nivel B2. La buena noticia es que el género formal es muy previsible: con una docena de fórmulas fijas puedes escribir correos correctos y elegantes."},{"h":"Saludo y despedida","table":{"head":["Situación","Saludo","Despedida"],"rows":[["Formal, destinatario desconocido","**Jaun / Andre agurgarria:**","**Adeitasunez,**"],["Formal, a un cargo","**Arduradun agurgarria:**","**Begirunez,**"],["Neutro (correo de trabajo)","**Egun on, Ane:**","**Agur bero bat,**"],["Informal","**Kaixo, Ane!**","**Laster arte! / Musu bat!**"]]}},{"h":"Fórmulas para el cuerpo","p":"Motivo: **Idazten dizut … -tzeko** (le escribo para…): **Idazten dizut informazioa eskatzeko**. Petición cortés: **… eskatu nahi nuke** (quisiera solicitar…), **Jakin nahi nuke …-n** (quisiera saber…). Comunicar: **Honen bidez jakinarazi nahi dizut … -la** (por la presente le comunico que…). Adjuntos: **Erantsita bidaltzen dizut …** (le envío adjunto…). Ofrecer contacto: **Zalantzarik izanez gero, jar zaitez nirekin harremanetan** (en caso de duda, póngase en contacto conmigo). Agradecer: **Aldez aurretik eskerrik asko** (gracias de antemano)."},{"h":"Lugar y fecha","p":"Se escribe con el año en -ko y el mes en genitivo: **Donostian, 2026ko urriaren 23an** (en San Sebastián, a 23 de octubre de 2026)."},{"h":"Paso a paso: estructura completa","p":"1) Saludo: **Andre agurgarria:**. 2) Motivo: **Idazten dizut … -tzeko**. 3) Petición concreta (con -n indirecto o nahi nuke). 4) Adjuntos o datos. 5) Ofrecimiento: **Zalantzarik izanez gero…**. 6) Agradecimiento y despedida: **Aldez aurretik eskerrik asko. Adeitasunez,** + nombre."},{"h":"Errores típicos","p":"*Kaixo andrea:* en una carta formal → **Andre agurgarria:**. *Ondo izan* como despedida formal → **Adeitasunez**. *Zalantzarik gabe* (sin duda) en lugar de **zalantzarik izanez gero** (en caso de duda). *23 urria 2026* → **2026ko urriaren 23an**."},{"h":"Resumen","p":"**Jaun / Andre agurgarria:** · **Idazten dizut … -tzeko** · **… eskatu / jakin nahi nuke** · **Erantsita bidaltzen dizut** · **Zalantzarik izanez gero, jar zaitez harremanetan** · **Aldez aurretik eskerrik asko** · **Adeitasunez,**."}],"examples":[["Jaun agurgarria:","Estimado señor:"],["Idazten dizut informazioa eskatzeko.","Le escribo para solicitar información."],["Erantsita bidaltzen dizut curriculuma.","Le envío adjunto el currículum."],["Zalantzarik izanez gero, jar zaitez nirekin harremanetan.","En caso de duda, póngase en contacto conmigo."],["Aldez aurretik eskerrik asko.","Gracias de antemano."],["Adeitasunez,","Atentamente,"],["Donostian, 2026ko urriaren 23an.","En San Sebastián, a 23 de octubre de 2026."]],"dialog":{"title":"Un correo al euskaltegi","lines":[["","Andre agurgarria:","Estimada señora:"],["","Idazten dizut euskara ikastaroari buruzko informazioa eskatzeko.","Le escribo para solicitar información sobre el curso de euskera."],["","Jakin nahi nuke noiz hasten den ikastaroa eta zenbat balio duen.","Quisiera saber cuándo empieza el curso y cuánto cuesta."],["","Erantsita bidaltzen dizut izen-emate orria.","Le envío adjunta la hoja de inscripción."],["","Aldez aurretik eskerrik asko.","Gracias de antemano."],["","Adeitasunez, Iker Goñi","Atentamente, Iker Goñi"]]},"exercises":[{"type":"gap","q":"Jaun ___:","es":"Estimado señor:","a":["agurgarria"],"hint":"Saludo formal: agurgarria."},{"type":"gap","q":"Idazten dizut informazioa eskatze___.","es":"Le escribo para solicitar información.","a":["ko"],"hint":"Motivo: -tzeko."},{"type":"gap","q":"___ bidaltzen dizut curriculuma.","es":"Le envío adjunto el currículum.","a":["erantsita"],"hint":"adjunto = erantsita."},{"type":"gap","q":"Zalantzarik izanez ___, jar zaitez harremanetan.","es":"En caso de duda, póngase en contacto.","a":["gero"],"hint":"en caso de = -z gero."},{"type":"gap","q":"Aldez ___ eskerrik asko.","es":"Gracias de antemano.","a":["aurretik"],"hint":"de antemano = aldez aurretik."},{"type":"gap","q":"___, Iker Goñi","es":"Atentamente, Iker Goñi","a":["adeitasunez"],"hint":"Despedida formal: adeitasunez."},{"type":"choice","q":"«Estimada señora:»","options":["Andre agurgarria:","Kaixo andrea:","Agur andrea:"],"a":0,"why":"Saludo formal fijo."},{"type":"choice","q":"«Atentamente,»","options":["Adeitasunez,","Ondo izan,","Musu bat,"],"a":0,"why":"Despedida formal."},{"type":"choice","q":"«En caso de duda»","options":["zalantzarik izanez gero","zalantza baduzu ere","zalantzarik gabe"],"a":0,"why":"Zalantzarik gabe significa «sin duda»."},{"type":"choice","q":"«Le envío adjunto»","options":["erantsita bidaltzen dizut","bidali dizut erantsi","erantsitako bidaltzen dut"],"a":0,"why":"Fórmula fija."},{"type":"choice","q":"«a 23 de octubre de 2026»","options":["2026ko urriaren 23an","urriak 23 2026an","23 urria 2026"],"a":0,"why":"Año en -ko + mes en genitivo + día en -an."},{"type":"order","words":["eskerrik","aurretik","asko","Aldez"],"a":["Aldez aurretik eskerrik asko"],"es":"Gracias de antemano.","hint":"Fórmula fija."},{"type":"order","words":["dizut","Idazten","eskatzeko","informazioa"],"a":["Idazten dizut informazioa eskatzeko","Informazioa eskatzeko idazten dizut"],"es":"Le escribo para solicitar información.","hint":"Idazten dizut + motivo con -tzeko."},{"type":"order","words":["bidaltzen","dizut","Erantsita","curriculuma"],"a":["Erantsita bidaltzen dizut curriculuma"],"es":"Le envío adjunto el currículum.","hint":"Erantsita bidaltzen dizut + objeto."},{"type":"match","pairs":[["agurgarria","estimado/a"],["adeitasunez","atentamente"],["agur bero bat","un cordial saludo"],["erantsita","adjunto"],["izanez gero","en caso de"],["aldez aurretik","de antemano"]]}],"create":{"prompt":"Escribe un correo formal completo (8 a 10 líneas) a un ayuntamiento o una empresa: preséntate, explica el motivo, haz dos preguntas, menciona un adjunto y despídete correctamente.","focus":"fórmulas de carta formal: saludo, -tzeko, nahi nuke, erantsita, izanez gero, despedida, fecha"},"links":{"verbs":[],"cases":[],"themes":["lana","teknologia"]}},"b2-15":{"id":"b2-15","lvl":"B2","n":15,"title":"Esamoldeak","es":"Expresiones idiomáticas","goal":"Entender y usar expresiones frecuentes que no se traducen palabra por palabra.","explain":[{"h":"Antes de empezar","p":"Las expresiones idiomáticas son lo que hace que una lengua suene viva. Muchas no se pueden deducir de sus palabras: «quedarse con la boca llena de dientes» en euskera significa quedarse boquiabierto. Esta lección recoge las más frecuentes del habla diaria, agrupadas por situación."},{"h":"En el día a día","table":{"head":["Expresión","Literalmente","Significado"],"rows":[["buruz ikasi","aprender por la cabeza","aprender de memoria"],["hanka sartu","meter la pierna","meter la pata"],["hitza eman","dar la palabra","prometer"],["begi bistakoa","a la vista del ojo","evidente"],["buruhausteak","roturas de cabeza","quebraderos de cabeza"],["gutxi gorabehera","poco arriba y abajo","más o menos"]]}},{"h":"Emociones y reacciones","table":{"head":["Expresión","Significado"],"rows":[["ahoa bete hortz geratu","quedarse boquiabierto"],["Adore!","¡ánimo!"],["Kontuz!","¡cuidado!"],["Ene! / Jo!","¡vaya!"],["bihotz-bihotzez","de todo corazón"],["Mila esker!","¡mil gracias!"]]}},{"h":"Cómo aprenderlas","p":"Las expresiones idiomáticas se fijan mejor dentro de una frase que en una lista. Por eso cada ejemplo de esta lección es una frase completa que puedes reutilizar. Cuando escuches o leas euskera real, apunta las expresiones nuevas con su contexto: es la mejor forma de ampliar este repertorio. Los refranes (atsotitzak) los verás en C1."},{"h":"Paso a paso: «Te prometo que lo aprenderé de memoria»","p":"1) «te prometo» = **hitza ematen dizut**. 2) «que lo aprenderé de memoria»: **buruz ikasiko dudala** (-la). → **Hitza ematen dizut buruz ikasiko dudala**."},{"h":"Errores típicos","p":"Traducir literalmente del castellano: *ahoa irekita geratu* se entiende, pero lo idiomático es **ahoa bete hortz geratu**. *Burutik ikasi* → **buruz ikasi**. *Hanka atera* → **hanka sartu** (meter la pata)."},{"h":"Resumen","p":"**buruz ikasi, hanka sartu, hitza eman, begi bistakoa, gutxi gorabehera, ahoa bete hortz geratu, bihotz-bihotzez, Adore!**. Apréndelas siempre dentro de una frase."}],"examples":[["Poema buruz ikasi dut.","Me he aprendido el poema de memoria."],["Hanka sartu dut!","¡He metido la pata!"],["Ahoa bete hortz geratu nintzen.","Me quedé boquiabierto."],["Hitza ematen dizut.","Te lo prometo."],["Begi bistakoa da.","Es evidente."],["Bihotz-bihotzez eskerrik asko.","Gracias de todo corazón."],["Gutxi gorabehera ordubete behar da.","Hace falta más o menos una hora."]],"dialog":{"title":"Después del examen","lines":[["Nerea","Zer moduz azterketa?","¿Qué tal el examen?"],["Iker","Ez dakit… Hanka sartu dut galdera batean.","No sé… He metido la pata en una pregunta."],["Nerea","Lasai! Ziur ondo atera dela. Gaia buruz ikasi zenuen.","¡Tranquilo! Seguro que ha salido bien. Te aprendiste el tema de memoria."],["Iker","Bai, egia da. Eskerrik asko, bihotz-bihotzez.","Sí, es verdad. Gracias, de todo corazón."],["Nerea","Adore! Eta emaitza jakiten duzunean, ospatuko dugu. Hitza ematen dizut.","¡Ánimo! Y cuando sepas el resultado, lo celebraremos. Te lo prometo."]]},"exercises":[{"type":"gap","q":"Poema ___ ikasi dut.","es":"Me he aprendido el poema de memoria.","a":["buruz"],"hint":"de memoria = buruz."},{"type":"gap","q":"Hanka ___ dut!","es":"¡He metido la pata!","a":["sartu"],"hint":"meter la pata = hanka sartu."},{"type":"gap","q":"Ahoa bete ___ geratu nintzen.","es":"Me quedé boquiabierto.","a":["hortz"],"hint":"Expresión fija: ahoa bete hortz."},{"type":"gap","q":"Hitza ___ dizut.","es":"Te lo prometo.","a":["ematen"],"hint":"prometer = hitza eman."},{"type":"gap","q":"Begi ___ da.","es":"Es evidente.","a":["bistakoa"],"hint":"evidente = begi bistakoa."},{"type":"gap","q":"Gutxi ___ ordubete behar da.","es":"Hace falta más o menos una hora.","a":["gorabehera"],"hint":"más o menos = gutxi gorabehera."},{"type":"choice","q":"«Meter la pata»","options":["hanka sartu","hanka atera","burua sartu"],"a":0,"why":"Expresión fija: hanka sartu."},{"type":"choice","q":"«De memoria»","options":["buruz","bihotzez","begiz"],"a":0,"why":"buruz ikasi = aprender de memoria."},{"type":"choice","q":"«Prometer»","options":["hitza eman","hitz egin","hitza hartu"],"a":0,"why":"Hitz egin es «hablar»."},{"type":"choice","q":"«¡Ánimo!»","options":["Adore!","Kontuz!","Ene!"],"a":0,"why":"Kontuz = cuidado; Ene = vaya."},{"type":"choice","q":"«Más o menos»","options":["gutxi gorabehera","gutxiago","gehiegi"],"a":0,"why":"Expresión fija."},{"type":"order","words":["dut","sartu","Hanka"],"a":["Hanka sartu dut"],"es":"He metido la pata.","hint":"Hanka sartu + dut."},{"type":"order","words":["dizut","ematen","Hitza"],"a":["Hitza ematen dizut"],"es":"Te lo prometo.","hint":"Hitza ematen + dizut."},{"type":"order","words":["geratu","nintzen","hortz","bete","Ahoa"],"a":["Ahoa bete hortz geratu nintzen"],"es":"Me quedé boquiabierto.","hint":"Expresión + geratu nintzen."},{"type":"match","pairs":[["buruz ikasi","aprender de memoria"],["hanka sartu","meter la pata"],["hitza eman","prometer"],["begi bistakoa","evidente"],["ahoa bete hortz","boquiabierto"],["bihotz-bihotzez","de todo corazón"]]}],"create":{"prompt":"Cuenta en 5 o 6 frases una anécdota en la que metiste la pata o te quedaste boquiabierto, usando al menos cuatro expresiones de la lección.","focus":"expresiones idiomáticas: buruz ikasi, hanka sartu, hitza eman, begi bistakoa, ahoa bete hortz…"},"links":{"verbs":[],"cases":[],"themes":["lokailuak","agurrak"]}},"b2-16":{"id":"b2-16","lvl":"B2","n":16,"title":"Eztabaidan","es":"Argumentar y debatir","goal":"Participar en un debate oral: pedir la palabra, interrumpir con cortesía, conceder, rebatir y concluir.","explain":[{"h":"Antes de empezar","p":"Última lección del B2. En B1 aprendiste a dar tu opinión; ahora vas a defenderla en un debate real, donde hay que tomar la palabra, reaccionar a lo que dicen otros y llegar a una conclusión. Es la prueba oral más típica del B2 y, sobre todo, lo que te permitirá participar de verdad en conversaciones entre hablantes."},{"h":"Gestionar la conversación","p":"Pedir la palabra: **Hitza eskatu nahi nuke** (quisiera pedir la palabra). Interrumpir con cortesía: **Barkatu, eten dezaket?** (perdona, ¿puedo interrumpir?). Pedir aclaración: **Zer esan nahi duzu horrekin?** (¿qué quieres decir con eso?). Retomar: **Lehen esan dudanera itzuliz…** (volviendo a lo que he dicho antes…)."},{"h":"Reaccionar","table":{"head":["Función","Expresión"],"rows":[["Acuerdo total","Guztiz ados nago."],["Acuerdo parcial","Neurri batean ados nago."],["Conceder","Onartzen dut … -la, baina…"],["Rebatir","Ez da horrela. / Hori ez da egia."],["Aportar datos","Datuek argi erakusten dute … -la."],["Matizar","Bai, baina kontuan hartu behar da … -la."]]}},{"h":"Concluir","p":"**Laburbilduz…** (en resumen…), **Azken batean…** (al fin y al cabo…), **Nire ustez, onena … litzateke** (en mi opinión, lo mejor sería…), y para cerrar una intervención pública: **Eskerrik asko zuen arretagatik** (gracias por vuestra atención)."},{"h":"Paso a paso: conceder y rebatir","p":"1) Recoge el argumento contrario: **Onartzen dut airea garbiagoa izango litzatekeela**. 2) Introduce tu objeción: **baina dendentzat arazo handia izango litzateke**. 3) Apóyala: **Datuek argi erakusten dute bezeroak gutxitzen direla**."},{"h":"Errores típicos","p":"*Hitza eman nahi nuke* para «pedir la palabra» → **Hitza eskatu nahi nuke** (hitza eman es «prometer»). *Eten naiteke?* → **Eten dezaket?** (interrumpir algo → ukan). *Onartzen dut … -n* → **-la**. Interrumpir sin fórmula de cortesía: en euskera, como en español, suena brusco."},{"h":"Resumen","p":"Tomar la palabra: **Hitza eskatu nahi nuke**, **Barkatu, eten dezaket?**. Reaccionar: **guztiz / neurri batean ados nago**, **onartzen dut … -la, baina**, **ez da horrela**. Concluir: **laburbilduz**, **eskerrik asko zuen arretagatik**. Con esta lección has completado el B2. Zorionak!"}],"examples":[["Hitza eskatu nahi nuke.","Quisiera pedir la palabra."],["Barkatu, eten dezaket?","Perdona, ¿puedo interrumpir?"],["Neurri batean ados nago zurekin.","En parte estoy de acuerdo contigo."],["Onartzen dut garestia dela, baina beharrezkoa da.","Admito que es caro, pero es necesario."],["Zer esan nahi duzu horrekin?","¿Qué quieres decir con eso?"],["Datuek argi erakusten dute arazoa handia dela.","Los datos muestran claramente que el problema es grande."],["Eskerrik asko zuen arretagatik.","Gracias por vuestra atención."]],"dialog":{"title":"Debate: un centro sin coches","lines":[["Moderatzailea","Gaurko gaia: autorik gabeko hirigunea. Ane, zure iritzia?","El tema de hoy: un centro urbano sin coches. Ane, ¿tu opinión?"],["Ane","Nire ustez, ideia bikaina da. Airea garbiagoa izango litzateke.","En mi opinión, es una idea excelente. El aire estaría más limpio."],["Iker","Barkatu, eten dezaket? Onartzen dut airea garbiagoa izango litzatekeela, baina dendentzat arazo handia izango litzateke.","Perdona, ¿puedo interrumpir? Admito que el aire estaría más limpio, pero para las tiendas sería un gran problema."],["Ane","Neurri batean ados nago. Hala ere, beste hirietako datuek kontrakoa erakusten dute.","En parte estoy de acuerdo. Sin embargo, los datos de otras ciudades muestran lo contrario."],["Moderatzailea","Ondo. Laburbilduz: abantailak argiak dira, baina dendentzat irtenbideak bilatu beharko lirateke.","Bien. En resumen: las ventajas están claras, pero habría que buscar soluciones para las tiendas."]]},"exercises":[{"type":"gap","q":"Hitza eskatu nahi ___.","es":"Quisiera pedir la palabra.","a":["nuke"],"hint":"quisiera = nahi nuke."},{"type":"gap","q":"Barkatu, eten ___?","es":"Perdona, ¿puedo interrumpir?","a":["dezaket"],"hint":"Interrumpir (algo) → potencial con ukan."},{"type":"gap","q":"Neurri ___ ados nago.","es":"En parte estoy de acuerdo.","a":["batean"],"hint":"en parte = neurri batean."},{"type":"gap","q":"Onartzen dut garestia ___, baina beharrezkoa da.","es":"Admito que es caro, pero es necesario.","a":["dela"],"hint":"Onartzen dut + -la."},{"type":"gap","q":"Zer esan ___ duzu?","es":"¿Qué quieres decir?","a":["nahi"],"hint":"querer decir = esan nahi."},{"type":"gap","q":"Eskerrik asko zuen ___.","es":"Gracias por vuestra atención.","a":["arretagatik"],"hint":"por la atención: arreta + -gatik."},{"type":"choice","q":"«Quisiera pedir la palabra»","options":["Hitza eskatu nahi nuke.","Hitza eman nahi nuke.","Hitz egin nahi nuen."],"a":0,"why":"Hitza eman es «prometer»."},{"type":"choice","q":"«¿Puedo interrumpir?»","options":["Eten dezaket?","Eten naiteke?","Eten dut?"],"a":0,"why":"Interrumpir (la conversación) → dezaket."},{"type":"choice","q":"«En parte estoy de acuerdo»","options":["Neurri batean ados nago.","Neurri bat ados naiz.","Zati batean ados dut."],"a":0,"why":"Expresión fija con egon."},{"type":"choice","q":"«Admito que…, pero…»","options":["Onartzen dut … -la, baina…","Onartzen dut … -n, baina…","Onartzen nago …, baina…"],"a":0,"why":"Completiva con -la."},{"type":"choice","q":"«¿Qué quieres decir?»","options":["Zer esan nahi duzu?","Zer esaten nahi duzu?","Zer esan duzu nahi?"],"a":0,"why":"esan nahi izan = querer decir."},{"type":"order","words":["nuke","nahi","eskatu","Hitza"],"a":["Hitza eskatu nahi nuke"],"es":"Quisiera pedir la palabra.","hint":"Hitza eskatu + nahi nuke."},{"type":"order","words":["nago","ados","batean","Neurri"],"a":["Neurri batean ados nago"],"es":"En parte estoy de acuerdo.","hint":"Neurri batean + ados nago."},{"type":"order","words":["duzu","nahi","esan","Zer"],"a":["Zer esan nahi duzu"],"es":"¿Qué quieres decir?","hint":"Zer + esan nahi + duzu."},{"type":"match","pairs":[["hitza eskatu","pedir la palabra"],["eten","interrumpir"],["neurri batean","en parte"],["onartzen dut","admito"],["guztiz ados","totalmente de acuerdo"],["arretagatik","por la atención"]]}],"create":{"prompt":"Prepara tu intervención en un debate (8 a 10 frases) sobre un tema que te interese: presenta tu postura, recoge un argumento contrario, concédelo en parte, rebátelo con un dato o ejemplo y concluye.","focus":"gestión del debate: hitza eskatu, eten dezaket, neurri batean ados, onartzen dut … -la baina, laburbilduz"},"links":{"verbs":[],"cases":[],"themes":["lokailuak"]}},"c1-01":{"id":"c1-01","lvl":"C1","n":1,"title":"Paradigmen errepasoa","es":"Repaso completo de paradigmas","goal":"Tener una visión de conjunto de todo el sistema verbal y elegir la forma correcta con rapidez.","explain":[{"h":"Antes de empezar","p":"Bienvenido al C1. Has aprendido el sistema verbal pieza a pieza durante cuatro niveles. Antes de completarlo con las últimas formas, conviene verlo entero de una vez, como un mapa. Esta lección no introduce nada nuevo: te da un método para elegir cualquier forma en tres preguntas."},{"h":"Las tres preguntas","p":"1) **¿Quién participa?** Solo un sujeto sin objeto → {nor:NOR} (izan). Sujeto + objeto → {nork:NOR-NORK} (ukan). Algo le pasa a alguien → {nori:NOR-NORI}. Alguien da algo a alguien → NOR-NORI-NORK. 2) **¿Qué tiempo o modo?** Presente, pasado, condicional, potencial, subjuntivo o imperativo. 3) **¿Qué personas?** Las marcas de siempre: n- / -t (yo), z- / -zu (tú), g- / -gu (nosotros)…"},{"h":"El mapa (forma de «yo» como ejemplo)","table":{"head":["","NOR","NOR-NORK (lo)","NOR-NORI (a mí)","NOR-NORI-NORK (yo → a él)"],"rows":[["Presente","naiz","dut","zait","diot"],["Pasado","nintzen","nuen","zitzaidan","nion"],["Condicional","nintzateke","nuke","litzaidake","(nioke)"],["Potencial","naiteke","dezaket","—","(diezaioket, lección 3)"],["Subjuntivo","nadin","dezadan","—","(diezaiodan, lección 2)"],["Imperativo (tú)","zaitez","ezazu","—","iezaiozu"]]}},{"h":"La otra mitad: el verbo principal","p":"El auxiliar va siempre con una forma del verbo principal que marca el aspecto: **participio** (ikusi: acción acabada), **-tzen** (ikusten: habitual o en curso), **-ko** (ikusiko: futuro o hipotético) y **raíz** (ikus: subjuntivo, imperativo y potencial cuidado). **Ikusi dut / ikusten dut / ikusiko dut / ikus dezadan**."},{"h":"Paso a paso: «Si me lo hubieras dicho, habría venido»","p":"1) Condición: decir, tú → a mí; hipotético pasado: **esan izan bazenit**. 2) Consecuencia: venir, sin objeto (NOR), condicional pasado, yo: **etorriko nintzatekeen**. → **Esan izan bazenit, etorriko nintzatekeen**. Con las tres preguntas, incluso esta frase se construye sola."},{"h":"Errores típicos","p":"Elegir el auxiliar por la traducción española en lugar de por los participantes: «me gusta» no es *gustatzen dut* sino **zait**; «te ayudo» no es *laguntzen dizut* sino **zaitut**. Confundir aspecto: *ikusten dut* (veo) frente a **ikusi dut** (he visto)."},{"h":"Resumen","p":"Tres preguntas: **participantes → tiempo/modo → personas**. Cuatro familias (NOR, NOR-NORK, NOR-NORI, NOR-NORI-NORK) y cuatro formas del verbo principal (participio, -tzen, -ko, raíz)."}],"examples":[["Etorri naiz.","He venido."],["Atzo ikusi zintudan.","Ayer te vi."],["Pelikula gustatu zitzaidan.","Me gustó la película."],["Opari bat eman diot.","Le he dado un regalo."],["Denbora banu, etorriko nintzateke.","Si tuviera tiempo, vendría."],["Bihar etorri naiteke.","Mañana puedo venir."],["Eser zaitez!","¡Siéntate!"]],"dialog":{"title":"Un repaso rápido","lines":[["Irakaslea","«Te vi ayer»: nola esaten da?","«Te vi ayer»: ¿cómo se dice?"],["Ikaslea","Atzo ikusi zintudan.","Atzo ikusi zintudan."],["Irakaslea","Ondo! Eta «me gustó»?","¡Bien! ¿Y «me gustó»?"],["Ikaslea","Gustatu zitzaidan.","Gustatu zitzaidan."],["Irakaslea","Eta «si tuviera tiempo, vendría»?","¿Y «si tuviera tiempo, vendría»?"],["Ikaslea","Denbora banu, etorriko nintzateke.","Denbora banu, etorriko nintzateke."],["Irakaslea","Primeran! Paradigma nagusiak menderatzen dituzu.","¡Estupendo! Dominas los paradigmas principales."]]},"exercises":[{"type":"gap","q":"Atzo ikusi ___.","es":"Ayer te vi.","a":["zintudan"],"hint":"NOR-NORK pasado, yo → te."},{"type":"gap","q":"Pelikula gustatu ___.","es":"Me gustó la película.","a":["zitzaidan"],"hint":"NOR-NORI pasado, a mí."},{"type":"gap","q":"Opari bat eman ___.","es":"Le he dado un regalo.","a":["diot"],"hint":"NOR-NORI-NORK presente, yo → a él."},{"type":"gap","q":"Denbora banu, etorriko ___.","es":"Si tuviera tiempo, vendría.","a":["nintzateke"],"hint":"NOR condicional, yo."},{"type":"gap","q":"Bihar etorri ___.","es":"Mañana puedo venir.","a":["naiteke"],"hint":"NOR potencial, yo."},{"type":"gap","q":"Eser ___!","es":"¡Siéntate!","a":["zaitez"],"hint":"NOR imperativo, tú."},{"type":"choice","q":"«Se me ha olvidado»: ¿qué familia?","options":["NOR-NORI (zait)","NOR-NORK (dut)","NOR (naiz)"],"a":0,"why":"Algo le pasa a alguien: NOR-NORI."},{"type":"choice","q":"«Le he dado el libro»: ¿qué familia?","options":["NOR-NORI-NORK (diot)","NOR-NORK (dut)","NOR-NORI (zaio)"],"a":0,"why":"Alguien da algo a alguien."},{"type":"choice","q":"«Podría venir»","options":["ninteke","naiteke","nintzateke"],"a":0,"why":"Potencial hipotético. Naiteke = puedo; nintzateke = vendría."},{"type":"choice","q":"«Para que vengas»","options":["etor zaitezen","etortzeko zu","etor zaitez"],"a":0,"why":"Subjuntivo: raíz + zaitezen. Etor zaitez es imperativo."},{"type":"choice","q":"«Me viste»","options":["ninduzun","zintudan","nauzu"],"a":0,"why":"NOR-NORK pasado, tú → me. Nauzu es presente."},{"type":"order","words":["zintudan","ikusi","Atzo"],"a":["Atzo ikusi zintudan"],"es":"Ayer te vi.","hint":"Tiempo + participio + auxiliar."},{"type":"order","words":["nintzateke","etorriko","banu","Denbora"],"a":["Denbora banu etorriko nintzateke","Etorriko nintzateke denbora banu"],"es":"Si tuviera tiempo, vendría.","hint":"Condición + consecuencia."},{"type":"order","words":["zitzaidan","Pelikula","gustatu"],"a":["Pelikula gustatu zitzaidan"],"es":"Me gustó la película.","hint":"Sujeto + participio + auxiliar."},{"type":"match","pairs":[["naiz","NOR"],["dut","NOR-NORK"],["zait","NOR-NORI"],["diot","NOR-NORI-NORK"],["nintzateke","condicional"],["naiteke","potencial"]]}],"create":{"prompt":"Escribe 6 frases, una con cada familia de auxiliar y en tiempos distintos, y explica entre paréntesis por qué has elegido cada auxiliar.","focus":"repaso del sistema: las tres preguntas (participantes, tiempo/modo, personas) y las cuatro formas del verbo principal"},"links":{"verbs":["nor-pres","nn-past-x","nni-past","nnn-pres"],"cases":[],"themes":["aditzak"]}},"c1-02":{"id":"c1-02","lvl":"C1","n":2,"title":"Subjuntibo osoa","es":"El subjuntivo completo","goal":"Expresar deseos, peticiones y finalidades con todas las personas: «quiero que me digas», «le llamé para que viniera».","explain":[{"h":"Antes de empezar","p":"En B1 aprendiste el subjuntivo para la finalidad (**uler dezazun**, para que lo entiendas). En C1 lo completas: lo usarás con **nahi** para expresar deseos sobre otros, en pasado y con tres protagonistas. Es el modo que más distingue un euskera avanzado."},{"h":"Deseos sobre otra persona","p":"Cuando quieres que **otra persona** haga algo, se usa **nahi** + subjuntivo: **Nahi dut etor zaitezen** (quiero que vengas). Compara: **Etorri nahi dut** (quiero venir, yo mismo). **Nahi dut egia esan diezadazun** (quiero que me digas la verdad)."},{"h":"Con tres protagonistas","table":{"head":["Para que… (presente)","Forma","Ejemplo"],"rows":[["tú → a mí","{nori:diezadazun}","Nahi dut egia **esan diezadazun**."],["tú → a él / ella","{nori:diezaiozun}","Aneri **eman diezaiozun** erosi dut."],["él → a mí","{nori:diezadan}","Idatzi diot, egia **esan diezadan**."],["él → a ti","{nori:diezazun}","Deituko diot, laguntza **eman diezazun**."],["yo → a él","{nori:diezaiodan}","Bere helbidea behar dut, gutuna **bidal diezaiodan**."],["él → a ellos","{nori:diezaien}","Idatziko diot, berri **eman diezaien**."]]}},{"h":"En pasado","p":"Si el verbo principal está en pasado, el subjuntivo también: **dadin → zedin**, **dezan → zezan**. **Deitu nion, etor zedin** (le llamé para que viniera). **Dirua utzi nion, liburua eros zezan** (le dejé dinero para que comprara el libro). **Nahi nuen egia esan ziezadan** (quería que me dijera la verdad). Serie completa sin objeto: **nendin, zintezen, zedin, gintezen, zintezten, zitezen**; con objeto: **nezan, zenezan, zezan, genezan, zenezaten, zezaten**."},{"h":"Paso a paso: «Le escribí para que me enviara las fotos»","p":"1) Principal en pasado: **idatzi nion**. 2) Subordinada: raíz de bidali → **bidal**; él → a mí, objeto plural, pasado → en habla cuidada **ziezazkidan**, pero en un registro más sencillo basta con -tzeko: **Argazkiak bidaltzeko idatzi nion**. Cuando la forma es muy compleja, -tzeko es una alternativa natural y correcta."},{"h":"Errores típicos","p":"*Nahi dut zu etortzea* para «quiero que vengas» → **Nahi dut etor zaitezen**. *Deitu nion, etor dadin* → **zedin** (concordancia temporal). *Esan diezazun* para «que me diga» → **diezadan**. *Nahi dut egia esan didazula* → **diezadazun**."},{"h":"Resumen","p":"Deseo sobre otro: **nahi dut + subjuntivo** (etor zaitezen). Tres protagonistas: **diezadazun, diezaiozun, diezadan, diezazun…**. Pasado: **zedin, zezan, ziezadan**. Alternativa sencilla cuando el sujeto lo permite: **-tzeko**."}],"examples":[["Nahi dut etor zaitezen.","Quiero que vengas."],["Nahi dut egia esan diezadazun.","Quiero que me digas la verdad."],["Opari hau erosi dut, Aneri eman diezaiozun.","He comprado este regalo para que se lo des a Ane."],["Idatzi diot, egia esan diezadan.","Le he escrito para que me diga la verdad."],["Deitu nion, etor zedin.","Le llamé para que viniera."],["Dirua utzi nion, liburua eros zezan.","Le dejé dinero para que comprara el libro."],["Nahi nuen egia esan ziezadan.","Quería que me dijera la verdad."]],"dialog":{"title":"Preparando la reunión","lines":[["Nerea","Zergatik deitu diozu Mikeli?","¿Por qué has llamado a Mikel?"],["Jon","Bihar etor dadin. Nahi dut bileran egon dadin.","Para que venga mañana. Quiero que esté en la reunión."],["Nerea","Eta txostena?","¿Y el informe?"],["Jon","Bidali diot, irakur dezan eta iritzia eman diezadan.","Se lo he enviado, para que lo lea y me dé su opinión."],["Nerea","Ondo. Atzo ere deitu nion, lehenago etor zedin, baina ez zuen erantzun.","Bien. Ayer también le llamé, para que viniera antes, pero no contestó."]]},"exercises":[{"type":"gap","q":"Nahi dut etor ___.","es":"Quiero que vengas.","a":["zaitezen"],"hint":"Deseo sobre otro: subjuntivo, tú."},{"type":"gap","q":"Nahi dut egia esan ___.","es":"Quiero que me digas la verdad.","a":["diezadazun"],"hint":"tú → a mí: diezadazun."},{"type":"gap","q":"Opari hau erosi dut, Aneri eman ___.","es":"…para que se lo des a Ane.","a":["diezaiozun"],"hint":"tú → a él/ella: diezaiozun."},{"type":"gap","q":"Idatzi diot, egia esan ___.","es":"Le he escrito para que me diga la verdad.","a":["diezadan"],"hint":"él → a mí: diezadan."},{"type":"gap","q":"Deitu nion, etor ___.","es":"Le llamé para que viniera.","a":["zedin"],"hint":"Pasado, sin objeto: zedin."},{"type":"gap","q":"Dirua utzi nion, liburua eros ___.","es":"Le dejé dinero para que comprara el libro.","a":["zezan"],"hint":"Pasado, con objeto: zezan."},{"type":"choice","q":"«Quiero que vengas»","options":["Nahi dut etor zaitezen.","Nahi dut etortzea zu.","Nahi dut etorriko zarela."],"a":0,"why":"Deseo sobre otra persona: subjuntivo."},{"type":"choice","q":"«Para que me lo diga (él)»","options":["esan diezadan","esan diezazun","esan dezan"],"a":0,"why":"él → a mí: diezadan."},{"type":"choice","q":"«Le llamé para que viniera»","options":["Deitu nion, etor zedin.","Deitu nion, etor dadin.","Deitu nion, etorriko zela."],"a":0,"why":"Concordancia temporal: pasado → zedin."},{"type":"choice","q":"«Para que se lo des (tú a él)»","options":["eman diezaiozun","eman diezadazun","eman dezazun"],"a":0,"why":"tú → a él: diezaiozun."},{"type":"choice","q":"«Quería que me dijera la verdad»","options":["Nahi nuen egia esan ziezadan.","Nahi nuen egia esan diezadan.","Nahi dut egia esan ziezadan."],"a":0,"why":"Principal en pasado → subjuntivo en pasado."},{"type":"order","words":["zaitezen","etor","dut","Nahi"],"a":["Nahi dut etor zaitezen"],"es":"Quiero que vengas.","hint":"Nahi dut + raíz + subjuntivo."},{"type":"order","words":["diezadazun","esan","egia","dut","Nahi"],"a":["Nahi dut egia esan diezadazun"],"es":"Quiero que me digas la verdad.","hint":"Nahi dut + objeto + raíz + subjuntivo."},{"type":"order","words":["zedin","etor","nion","Deitu"],"a":["Deitu nion etor zedin"],"es":"Le llamé para que viniera.","hint":"Principal en pasado + subjuntivo en pasado."},{"type":"match","pairs":[["dadin","para que (él) … (presente, sin objeto)"],["zedin","para que (él) … (pasado, sin objeto)"],["dezan","para que (él) … (presente, con objeto)"],["zezan","para que (él) … (pasado, con objeto)"],["diezadan","para que (él) me lo…"],["diezaiozun","para que (tú) se lo…"]]}],"create":{"prompt":"Escribe 5 frases sobre lo que quieres que hagan otras personas (Nahi dut … zaitezen / diezadazun…) y 2 frases en pasado sobre algo que hiciste para que otro hiciera algo.","focus":"nahi + subjuntivo, subjuntivo NOR-NORI-NORK, subjuntivo en pasado (zedin, zezan)"},"links":{"verbs":[],"cases":[],"themes":["aditzak"]}},"c1-03":{"id":"c1-03","lvl":"C1","n":3,"title":"Ahalera osoa","es":"El potencial completo","goal":"Ofrecer, pedir y preguntar con las formas potenciales de personas y de tres protagonistas: «puedo ayudarte», «¿podría decirme…?».","explain":[{"h":"Antes de empezar","p":"Conoces el potencial con NOR y NOR-NORK de objeto «lo» (**naiteke, dezaket**) y su forma hipotética (**ninteke, nezake**). Faltan las formas con personas («puedo ayudarte») y con tres protagonistas («¿me lo puedes dar?»). Son menos frecuentes, pero la fórmula de cortesía **Esan zeniezadake…?** (¿podría decirme…?) es de las más útiles del C1."},{"h":"Con personas: zaitzaket, nazakezu","p":"Mismo principio que en presente (el inicio indica a quién): **Lagun zaitzaket** (puedo ayudarte), **Lagun nazakezu?** (¿puedes ayudarme?), **Ikus gaitzakezu?** (¿puedes vernos?). Fíjate en la raíz (**lagun**, de lagundu), habitual en el potencial cuidado."},{"h":"Con tres protagonistas","table":{"head":["Puedo / puedes…","Forma","Ejemplo"],"rows":[["yo → a él","{nori:diezaioket}","Liburua **eman diezaioket** (puedo dárselo)."],["yo → a ti","{nori:diezazuket}","Egia **esan diezazuket** (te puedo decir la verdad)."],["tú → a mí","{nori:diezadakezu}","Mezua **bidal diezadakezu?** (¿me lo puedes enviar?)"],["tú → a él","{nori:diezaiokezu}","**Eraman diezaiokezu?** (¿se lo puedes llevar?)"],["él → a él","{nori:diezaioke}","Hark **eman diezaioke** (él puede dárselo)."]]}},{"h":"La forma hipotética: cortesía máxima","p":"**zeniezadake** (tú → a mí, «podrías»): **Esan zeniezadake non dagoen geltokia?** (¿podría decirme dónde está la estación?). Es la forma más cortés para pedir algo a un desconocido. Otras: **niezaioke** (yo → a él: **Nik esan niezaioke**, yo podría decírselo), **ziezadake** (él → a mí)."},{"h":"Paso a paso: «¿Podrías enviarme el informe?»","p":"1) Raíz de bidali → **bidal**. 2) tú → a mí, hipotético → **zeniezadake**. 3) **Txostena bidal zeniezadake?** Más directo, con potencial presente: **Txostena bidal diezadakezu?** (¿puedes enviarme el informe?)."},{"h":"Errores típicos","p":"*Lagun dezaket zu* → **Lagun zaitzaket**. *Eman dezakezu niri?* se entiende, pero lo correcto es **Eman diezadakezu?** (el auxiliar debe marcar «a mí»). *Esan zenezake niri…* → en registro cuidado, **Esan zeniezadake…**."},{"h":"Resumen","p":"Con personas: **zaitzaket, nazakezu, gaitzakezu**. Tres protagonistas: **diezaioket, diezazuket, diezadakezu, diezaiokezu**. Cortesía: **Esan zeniezadake…?**. Con estas formas tienes todo el potencial del euskera."}],"examples":[["Lagun zaitzaket.","Puedo ayudarte."],["Lagun nazakezu?","¿Puedes ayudarme?"],["Egia esan diezazuket.","Te puedo decir la verdad."],["Liburua eman diezaioket.","Puedo dárselo (el libro, a él)."],["Mezua bidal diezadakezu?","¿Me puedes enviar el mensaje?"],["Esan zeniezadake non dagoen geltokia?","¿Podría decirme dónde está la estación?"],["Nik esan niezaioke.","Yo podría decírselo."]],"dialog":{"title":"En la calle","lines":[["Ane","Barkatu, esan zeniezadake non dagoen liburutegia?","Perdone, ¿podría decirme dónde está la biblioteca?"],["Gizona","Bai, lagun zaitzaket. Zuzen joan eta bigarren kalean, ezkerrera.","Sí, puedo ayudarle. Vaya recto y en la segunda calle, a la izquierda."],["Ane","Eskerrik asko. Eta liburu hau eraman diezaiokezu Mireni? Liburutegian egiten du lan.","Gracias. ¿Y le puede llevar este libro a Miren? Trabaja en la biblioteca."],["Gizona","Bai, noski. Eraman diezaioket; gaur han izango naiz.","Sí, claro. Puedo llevárselo; hoy estaré allí."]]},"exercises":[{"type":"gap","q":"Lagun ___.","es":"Puedo ayudarte.","a":["zaitzaket"],"hint":"yo → te, potencial."},{"type":"gap","q":"Lagun ___?","es":"¿Puedes ayudarme?","a":["nazakezu"],"hint":"tú → me, potencial."},{"type":"gap","q":"Egia esan ___.","es":"Te puedo decir la verdad.","a":["diezazuket"],"hint":"yo → a ti, potencial."},{"type":"gap","q":"Liburua eman ___.","es":"Puedo dárselo (a él).","a":["diezaioket"],"hint":"yo → a él, potencial."},{"type":"gap","q":"Mezua bidal ___?","es":"¿Me puedes enviar el mensaje?","a":["diezadakezu"],"hint":"tú → a mí, potencial."},{"type":"gap","q":"Esan ___ non dagoen?","es":"¿Podría decirme dónde está?","a":["zeniezadake"],"hint":"tú → a mí, hipotético (cortesía)."},{"type":"choice","q":"«Puedo ayudarte»","options":["Lagun zaitzaket.","Lagun dezaket zu.","Lagun naiteke."],"a":0,"why":"Objeto personal (te): zaitzaket."},{"type":"choice","q":"«¿Me lo puedes dar?»","options":["Eman diezadakezu?","Eman diezazuket?","Eman nazakezu?"],"a":0,"why":"tú → a mí: diezadakezu. Diezazuket es «yo a ti»."},{"type":"choice","q":"«¿Podría decirme…?» (muy cortés)","options":["Esan zeniezadake…?","Esan ziezadake…?","Esan niezaioke…?"],"a":0,"why":"tú → a mí, hipotético: zeniezadake."},{"type":"choice","q":"«Puedo decírselo (a él)»","options":["Esan diezaioket.","Esan diezazuket.","Esan dezaket hari."],"a":0,"why":"El auxiliar debe marcar «a él»: diezaioket."},{"type":"choice","q":"«¿Me puedes ayudar?»","options":["Lagun nazakezu?","Lagun zaitzaket?","Lagun dezakezu?"],"a":0,"why":"tú → me: nazakezu."},{"type":"order","words":["zaitzaket","Lagun"],"a":["Lagun zaitzaket"],"es":"Puedo ayudarte.","hint":"Raíz + potencial."},{"type":"order","words":["diezaioket","eman","Liburua"],"a":["Liburua eman diezaioket"],"es":"Puedo dárselo.","hint":"Objeto + verbo + potencial."},{"type":"order","words":["zeniezadake","Esan","dagoen","non"],"a":["Esan zeniezadake non dagoen"],"es":"¿Podría decirme dónde está?","hint":"Esan zeniezadake + indirecta."},{"type":"match","pairs":[["zaitzaket","(yo) te puedo…"],["nazakezu","(tú) me puedes…"],["diezaioket","(yo) se lo puedo…"],["diezadakezu","(tú) me lo puedes…"],["zeniezadake","(tú) me lo podrías…"],["niezaioke","(yo) se lo podría…"]]}],"create":{"prompt":"Escribe 5 peticiones u ofrecimientos corteses en distintas situaciones (en una tienda, al teléfono, en el trabajo), usando las formas de esta lección.","focus":"potencial con personas (zaitzaket, nazakezu) y NOR-NORI-NORK (diezaioket, diezadakezu), zeniezadake"},"links":{"verbs":[],"cases":[],"themes":["aditzak"]}},"c1-04":{"id":"c1-04","lvl":"C1","n":4,"title":"Perpaus konplexuak","es":"Oraciones complejas","goal":"Leer y construir frases con varias subordinadas sin perderte, y usar conectores avanzados.","explain":[{"h":"Antes de empezar","p":"En los textos reales de C1 es normal encontrar frases con tres o cuatro subordinadas encadenadas. Como en euskera las subordinadas suelen ir **antes** de lo que modifican, al principio pueden parecer un laberinto. Esta lección te da un método para desenredarlas y algunos conectores nuevos muy frecuentes en la escritura."},{"h":"El método en tres pasos","p":"1) **Busca el verbo principal**: el auxiliar que **no** lleva terminación de subordinada (-n, -la, -nean, -lako, -nez…). 2) **Encuentra su sujeto y su objeto**: a menudo son grupos largos con relativos delante. 3) **Lee cada subordinada desde dentro**, empezando por la más cercana al verbo principal."},{"h":"Un ejemplo desmontado","p":"**Atzo ezagutu nuen idazleak esan zidan liburua idazten ari zenean ez zekiela nola amaitu.** Verbo principal: **esan zidan** (me dijo). ¿Quién? **atzo ezagutu nuen idazleak** (el escritor que conocí ayer). ¿Qué? **ez zekiela nola amaitu** (que no sabía cómo terminarlo). ¿Cuándo? **liburua idazten ari zenean** (cuando estaba escribiendo el libro)."},{"h":"Conectores avanzados","table":{"head":["Estructura","Significado","Ejemplo"],"rows":[["-n heinean","a medida que","**Ikasten duzun heinean**, errazagoa da."],["-n neurrian","en la medida en que","**Behar duzun neurrian** lagunduko zaitut."],["-teko moduan","de modo que","**Ulertzeko moduan** azaldu zuen."],["-(e)la eta","como, ya que (habla)","**Nekatuta nagoela eta**, ez naiz aterako."]]}},{"h":"Construir sin perder claridad","p":"Al escribir, no amontones más de dos subordinadas delante del verbo principal. Si la frase crece, pasa parte de la información a otra frase o detrás del verbo con un relativo explicativo (lección B2-09). En euskera, la claridad se considera buen estilo."},{"h":"Errores típicos","p":"Traducir palabra por palabra desde el principio de la frase: en euskera casi siempre conviene empezar por el verbo principal. Confundir el verbo principal con un auxiliar subordinado: **ezagutu nuen** aquí es un relativo (sin -n visible porque el pasado ya acaba en -n). *Nekatuta nago eta* (coloquial «como estoy cansado») → **nagoela eta**."},{"h":"Resumen","p":"Método: **verbo principal → sujeto y objeto → subordinadas desde dentro**. Conectores: **-n heinean** (a medida que), **-n neurrian** (en la medida en que), **-teko moduan** (de modo que), **-(e)la eta** (como, ya que)."}],"examples":[["Ikasten duzun heinean, errazagoa iruditzen zaizu.","A medida que estudias, te parece más fácil."],["Lan egiten dudan enpresak esan dit hurrengo urtean Bilbora joan beharko dudala.","La empresa en la que trabajo me ha dicho que el año que viene tendré que ir a Bilbao."],["Etxera iritsi nintzenean, amak esan zidan Mikel etorri zela.","Cuando llegué a casa, mi madre me dijo que Mikel había venido."],["Nekatuta nagoela eta, ez naiz aterako.","Como estoy cansado, no saldré."],["Ulertzeko moduan azaldu zuen.","Lo explicó de modo que se entendiera."],["Behar duzun neurrian lagunduko zaitut.","Te ayudaré en la medida en que lo necesites."]],"dialog":{"title":"Una frase difícil","lines":[["Ane","Esaldi hau ez dut ulertzen: «Atzo ezagutu nuen idazleak esan zidan liburua idazten ari zenean ez zekiela nola amaitu».","No entiendo esta frase: «Atzo ezagutu nuen idazleak esan zidan liburua idazten ari zenean ez zekiela nola amaitu»."],["Iker","Lehenik, bilatu aditz nagusia: «esan zidan». Nork esan zizun? Idazleak.","Primero, busca el verbo principal: «esan zidan». ¿Quién te lo dijo? El escritor."],["Ane","Zein idazlek? Atzo ezagutu nuenak.","¿Qué escritor? El que conocí ayer."],["Iker","Hori da. Eta zer esan zizun? «Ez zekiela nola amaitu». Noiz? «Liburua idazten ari zenean».","Eso es. ¿Y qué te dijo? «Que no sabía cómo terminarlo». ¿Cuándo? «Cuando estaba escribiendo el libro»."],["Ane","Orain argi dago!","¡Ahora está claro!"]]},"exercises":[{"type":"gap","q":"Ikasten duzun ___, errazagoa da.","es":"A medida que estudias, es más fácil.","a":["heinean"],"hint":"a medida que = -n heinean."},{"type":"gap","q":"Nekatuta nagoela ___, ez naiz aterako.","es":"Como estoy cansado, no saldré.","a":["eta"],"hint":"como (coloquial) = -la eta."},{"type":"gap","q":"Ulertzeko ___ azaldu zuen.","es":"Lo explicó de modo que se entendiera.","a":["moduan"],"hint":"de modo que = -teko moduan."},{"type":"gap","q":"Behar duzun ___ lagunduko zaitut.","es":"Te ayudaré en la medida en que lo necesites.","a":["neurrian"],"hint":"en la medida en que = -n neurrian."},{"type":"gap","q":"Idazleak esan zidan ez ___ nola amaitu.","es":"El escritor me dijo que no sabía cómo terminarlo.","a":["zekiela"],"hint":"jakin pasado (zekien) + -la."},{"type":"gap","q":"Atzo ezagutu ___ idazleak esan zidan…","es":"El escritor que conocí ayer me dijo…","a":["nuen"],"hint":"Relativo en pasado: nuen."},{"type":"choice","q":"Verbo principal de «Atzo ezagutu nuen idazleak esan zidan ez zekiela nola amaitu»:","options":["esan zidan","ezagutu nuen","ez zekiela"],"a":0,"why":"Es el único auxiliar sin función de subordinada."},{"type":"choice","q":"«A medida que»","options":["-n heinean","-n arren","-n bezala"],"a":0,"why":"-n arren = aunque; -n bezala = como."},{"type":"choice","q":"«Como estoy cansado» (coloquial)","options":["nekatuta nagoela eta","nekatuta nago eta","nekatuta nagoen eta"],"a":0,"why":"-la + eta."},{"type":"choice","q":"«De modo que se entienda»","options":["ulertzeko moduan","ulertzen moduan","ulertu moduan"],"a":0,"why":"-teko moduan."},{"type":"choice","q":"Primer paso para leer una frase compleja:","options":["buscar el verbo principal","traducir palabra por palabra","empezar por el final siempre"],"a":0,"why":"El verbo principal organiza toda la frase."},{"type":"order","words":["heinean","duzun","Ikasten"],"a":["Ikasten duzun heinean"],"es":"A medida que estudias.","hint":"Verbo + relativo + heinean."},{"type":"order","words":["moduan","Ulertzeko","zuen","azaldu"],"a":["Ulertzeko moduan azaldu zuen"],"es":"Lo explicó de modo que se entendiera.","hint":"-teko moduan + verbo."},{"type":"order","words":["aterako","naiz","ez","eta","nagoela","Nekatuta"],"a":["Nekatuta nagoela eta ez naiz aterako"],"es":"Como estoy cansado, no saldré.","hint":"Causa con -la eta + principal."},{"type":"match","pairs":[["-n heinean","a medida que"],["-n neurrian","en la medida en que"],["-teko moduan","de modo que"],["-(e)la eta","como, ya que (coloquial)"],["aditz nagusia","verbo principal"],["menpeko perpausa","oración subordinada"]]}],"create":{"prompt":"Escribe 3 frases complejas (con al menos dos subordinadas cada una) sobre tu experiencia aprendiendo euskera, y después desmonta una de ellas siguiendo el método de la lección.","focus":"análisis de frases complejas, -n heinean, -n neurrian, -teko moduan, -(e)la eta"},"links":{"verbs":[],"cases":[],"themes":["lokailuak","ikasketak"]}},"c1-05":{"id":"c1-05","lvl":"C1","n":5,"title":"Nominalizazio aurreratua","es":"El estilo nominal","goal":"Entender y usar el estilo nominal propio de la prensa y los textos formales: «la subida de los precios», «como consecuencia de aprobar la ley».","explain":[{"h":"Antes de empezar","p":"En la conversación decimos «los precios han subido y la gente está preocupada». En un periódico se lee «la subida de los precios ha generado preocupación». Ese **estilo nominal**, que convierte acciones en nombres, domina la prensa, la administración y los textos académicos. Reconocerlo es imprescindible para leer en C1."},{"h":"Nombres que vienen de verbos","table":{"head":["Sufijo","Ejemplos"],"rows":[["-era","igo → **igoera** (subida), jaitsi → **jaitsiera** (bajada), ibili → **ibilera** (marcha)"],["-kuntza","hobetu → **hobekuntza** (mejora), aurkitu → **aurkikuntza** (descubrimiento), irakatsi → **irakaskuntza** (enseñanza)"],["-keta","aldatu → **aldaketa** (cambio), azterketa (examen, análisis)"],["-pen / -men","itxaropen (esperanza), ulermen (comprensión), oroimen (memoria)"],["-tza","ezagutu → **ezagutza** (conocimiento)"]]}},{"h":"El verbo como nombre en frases largas","p":"El **-tzea** de B1 permite construir sujetos y complementos complejos: **Legea onartzearen ondorioz, zergak jaitsi dira** (como consecuencia de aprobar la ley, han bajado los impuestos). Estructuras muy frecuentes: **-tzearen ondorioz** (como consecuencia de), **-tzearen alde / kontra** (a favor / en contra de), **-tzeko asmoa** (intención de), **-tzeko aukera** (posibilidad de)."},{"h":"De verbal a nominal","p":"Verbal: **Etxeen prezioak asko igo dira eta jendea kezkatuta dago.** Nominal: **Etxeen prezioen igoerak kezka sortu du.** La versión nominal es más corta y densa, ideal para titulares e informes; la verbal es más natural al hablar. Un buen escritor elige según el registro."},{"h":"Paso a paso: «Han mejorado la enseñanza del euskera y eso ha sido positivo»","p":"1) Acción → nombre: hobetu → **hobekuntza**. 2) Lo mejorado en genitivo: **euskararen irakaskuntzaren hobekuntza**. 3) Predicado: **positiboa izan da**. → **Euskararen irakaskuntzaren hobekuntza positiboa izan da**."},{"h":"Errores típicos","p":"*Prezioak igotzen kezka sortu du* → **Prezioen igoerak**. *Legea onartu ondorioz* → **onartzearen ondorioz**. *Hobetasuna* para «mejora» → **hobekuntza** (hobetasun no se usa así). Abusar del estilo nominal en una conversación: suena rígido."},{"h":"Resumen","p":"Nombres deverbales: **-era, -kuntza, -keta, -pen / -men, -tza**. Estructuras: **-tzearen ondorioz, -tzearen alde, -tzeko asmoa, -tzeko aukera**. Estilo nominal para prensa e informes; verbal para hablar."}],"examples":[["Prezioen igoerak kezka sortu du.","La subida de los precios ha generado preocupación."],["Legea onartzearen ondorioz, zergak jaitsi dira.","Como consecuencia de aprobar la ley, han bajado los impuestos."],["Euskararen irakaskuntza hobetu da.","La enseñanza del euskera ha mejorado."],["Langabeziaren jaitsiera albiste ona da.","La bajada del paro es una buena noticia."],["Proiektua amaitzeko asmoa dugu.","Tenemos intención de terminar el proyecto."],["Aurkikuntza garrantzitsua egin dute.","Han hecho un descubrimiento importante."],["Euskara ikasteko aukera eman digute.","Nos han dado la posibilidad de aprender euskera."]],"dialog":{"title":"Editando titulares","lines":[["Nerea","Izenburu hau luzeegia da: «Etxeen prezioak asko igo dira eta jendea kezkatuta dago».","Este titular es demasiado largo: «Los precios de las casas han subido mucho y la gente está preocupada»."],["Jon","Estilo nominala erabil dezakegu: «Etxeen prezioen igoerak kezka sortu du».","Podemos usar el estilo nominal: «La subida de los precios de las casas ha generado preocupación»."],["Nerea","Hobeto! Eta beste hau: «Gobernuak legea onartu du, eta ondorioz zergak jaitsi dira»?","¡Mejor! ¿Y este otro: «El Gobierno ha aprobado la ley, y en consecuencia han bajado los impuestos»?"],["Jon","«Legea onartzearen ondorioz, zergak jaitsi dira».","«Como consecuencia de aprobar la ley, han bajado los impuestos»."],["Nerea","Laburragoa eta argiagoa.","Más corto y más claro."]]},"exercises":[{"type":"gap","q":"Prezioen igo___ kezka sortu du.","es":"La subida de los precios ha generado preocupación.","a":["erak"],"hint":"igoera (subida) + -k (sujeto)."},{"type":"gap","q":"Legea onartzea___ ondorioz, zergak jaitsi dira.","es":"Como consecuencia de aprobar la ley…","a":["ren"],"hint":"-tzearen ondorioz."},{"type":"gap","q":"Euskararen irakas___ hobetu da.","es":"La enseñanza del euskera ha mejorado.","a":["kuntza"],"hint":"irakatsi → irakaskuntza."},{"type":"gap","q":"Langabeziaren jaitsi___ albiste ona da.","es":"La bajada del paro es una buena noticia.","a":["era"],"hint":"jaitsi → jaitsiera."},{"type":"gap","q":"Proiektua amaitzeko ___ dugu.","es":"Tenemos intención de terminar el proyecto.","a":["asmoa"],"hint":"intención de = -tzeko asmoa."},{"type":"gap","q":"Aurki___ garrantzitsua egin dute.","es":"Han hecho un descubrimiento importante.","a":["kuntza"],"hint":"aurkitu → aurkikuntza."},{"type":"choice","q":"«La subida de los precios»","options":["prezioen igoera","prezio igotzen","igoera prezioena"],"a":0,"why":"Genitivo + nombre deverbal."},{"type":"choice","q":"«Como consecuencia de aprobar la ley»","options":["legea onartzearen ondorioz","legea onartu ondorioz","legea onartzeko ondorioz"],"a":0,"why":"-tzearen ondorioz."},{"type":"choice","q":"«Mejora»","options":["hobekuntza","hobetasuna","hobeketa"],"a":0,"why":"hobetu → hobekuntza."},{"type":"choice","q":"«Tenemos intención de terminarlo»","options":["amaitzeko asmoa dugu","amaitzea asmoa dugu","amaitu asmoa dugu"],"a":0,"why":"-tzeko asmoa."},{"type":"choice","q":"El estilo nominal es típico de…","options":["la prensa y los textos formales","las conversaciones con amigos","los mensajes coloquiales"],"a":0,"why":"En la conversación se prefiere el estilo verbal."},{"type":"order","words":["du","sortu","kezka","igoerak","Prezioen"],"a":["Prezioen igoerak kezka sortu du"],"es":"La subida de los precios ha generado preocupación.","hint":"Sujeto nominal + objeto + verbo."},{"type":"order","words":["dugu","asmoa","amaitzeko","Proiektua"],"a":["Proiektua amaitzeko asmoa dugu"],"es":"Tenemos intención de terminar el proyecto.","hint":"Objeto + -tzeko asmoa + dugu."},{"type":"order","words":["ondorioz","onartzearen","Legea"],"a":["Legea onartzearen ondorioz"],"es":"Como consecuencia de aprobar la ley.","hint":"Objeto + -tzearen ondorioz."},{"type":"match","pairs":[["igoera","subida"],["jaitsiera","bajada"],["hobekuntza","mejora"],["aurkikuntza","descubrimiento"],["irakaskuntza","enseñanza"],["-tzearen ondorioz","como consecuencia de"]]}],"create":{"prompt":"Transforma en estilo nominal 4 frases verbales sobre noticias inventadas (por ejemplo, «El ayuntamiento ha abierto una biblioteca nueva» → «Liburutegi berriaren irekierak…») y escribe un titular para cada una.","focus":"nombres deverbales (-era, -kuntza, -keta, -pen, -tza) y estructuras con -tzea (-tzearen ondorioz, -tzeko asmoa)"},"links":{"verbs":[],"cases":[],"themes":["lokailuak"]}},"c1-06":{"id":"c1-06","lvl":"C1","n":6,"title":"Idazkera akademikoa","es":"Escribir textos académicos","goal":"Redactar un trabajo o informe con estructura, tono e hipótesis propios del registro académico.","explain":[{"h":"Antes de empezar","p":"Un trabajo académico o un informe profesional en euskera sigue convenciones bastante fijas: una estructura reconocible, un tono impersonal y prudente, y fórmulas para citar fuentes y matizar afirmaciones. Con ellas, tus textos sonarán serios y rigurosos, que es justo lo que se pide en C1."},{"h":"La estructura","table":{"head":["Apartado","Euskera","Qué contiene"],"rows":[["Introducción","sarrera","tema y motivación"],["Objetivos","helburuak","qué se quiere averiguar"],["Metodología","metodologia","cómo se ha hecho"],["Resultados","emaitzak","qué se ha encontrado"],["Discusión","eztabaida","qué significan los resultados"],["Conclusiones","ondorioak","resumen y propuestas"],["Bibliografía","bibliografia","fuentes citadas"]]}},{"h":"Tono impersonal","p":"Se usa la forma impersonal (lección B1-12) o la primera persona del plural: **Lan honetan euskararen erabilera aztertzen da** (en este trabajo se analiza el uso del euskera), **Atal honetan emaitzak aurkeztuko ditugu** (en este apartado presentaremos los resultados)."},{"h":"Prudencia: matizar las afirmaciones","p":"En lugar de afirmar categóricamente, se matiza: **Badirudi … -la** (parece que…), **Esan daiteke … -la** (puede decirse que…), **Litekeena da … -tzea** (es probable que…), **Datuen arabera, …** (según los datos…). Compara: *Gazteek euskara gehiago erabiltzen dute* → **Badirudi gazteek euskara gehiago erabiltzen dutela**."},{"h":"Citar y remitir","p":"**X-ren arabera** (según X), **X-k dioen bezala** (como dice X), **aipatu bezala** (como se ha mencionado), **ikus 3. atala** (véase el apartado 3), **ondorio gisa** (como conclusión)."},{"h":"Paso a paso: un resultado bien redactado","p":"Afirmación directa: *Jendeak euskara gutxi erabiltzen du kalean.* Versión académica: **Inkestaren datuen arabera, badirudi euskararen kale-erabilera oraindik txikia dela.** Fíjate en la fuente (inkestaren datuen arabera), la prudencia (badirudi) y el estilo nominal (kale-erabilera)."},{"h":"Errores típicos","p":"Usar el registro coloquial (*ze, ba, primeran*) en un texto académico. Afirmar sin fuente ni matiz. *Iruditzen zait* (muy personal) → en un trabajo, **badirudi** o **esan daiteke**. *Laburbilduz* en la introducción → va en las conclusiones."},{"h":"Resumen","p":"Estructura: **sarrera, helburuak, metodologia, emaitzak, eztabaida, ondorioak**. Tono: impersonal (**aztertzen da**) o «nosotros». Prudencia: **badirudi, esan daiteke, litekeena da**. Citas: **-ren arabera, aipatu bezala, ondorio gisa**."}],"examples":[["Lan honetan euskararen erabilera aztertzen da.","En este trabajo se analiza el uso del euskera."],["Badirudi gazteek euskara gehiago erabiltzen dutela.","Parece que los jóvenes usan más el euskera."],["Esan daiteke emaitzak positiboak direla.","Puede decirse que los resultados son positivos."],["Litekeena da joera hori aldatzea.","Es probable que esa tendencia cambie."],["Egileen arabera, arazoa konplexua da.","Según los autores, el problema es complejo."],["Aipatu bezala, datuak 2025ekoak dira.","Como se ha mencionado, los datos son de 2025."],["Ondorio gisa, ikerketa gehiago behar dira.","Como conclusión, hacen falta más investigaciones."]],"dialog":{"title":"Con la tutora","lines":[["Ikaslea","Nola hasi behar dut lanaren sarrera?","¿Cómo tengo que empezar la introducción del trabajo?"],["Irakaslea","Lehenik, lanaren helburua azaldu: «Lan honetan … aztertzen da».","Primero, explica el objetivo del trabajo: «En este trabajo se analiza…»."],["Ikaslea","Eta emaitzetan «Gazteek euskara gehiago erabiltzen dute» idatzi dut.","Y en los resultados he escrito «Los jóvenes usan más el euskera»."],["Irakaslea","Zuhurragoa izan: «Badirudi gazteek euskara gehiago erabiltzen dutela», edo «Datuen arabera, …».","Sé más prudente: «Parece que los jóvenes usan más el euskera», o «Según los datos, …»."],["Ikaslea","Ulertuta. Eta amaieran, «Ondorio gisa…».","Entendido. Y al final, «Como conclusión…»."]]},"exercises":[{"type":"gap","q":"Lan honetan euskararen erabilera ___ da.","es":"En este trabajo se analiza el uso del euskera.","a":["aztertzen"],"hint":"Impersonal: aztertzen da."},{"type":"gap","q":"___ gazteek euskara gehiago erabiltzen dutela.","es":"Parece que los jóvenes usan más el euskera.","a":["badirudi"],"hint":"parece que = badirudi … -la."},{"type":"gap","q":"Esan ___ emaitzak positiboak direla.","es":"Puede decirse que los resultados son positivos.","a":["daiteke"],"hint":"se puede = daiteke."},{"type":"gap","q":"___ da joera hori aldatzea.","es":"Es probable que esa tendencia cambie.","a":["litekeena"],"hint":"es probable = litekeena da."},{"type":"gap","q":"Egileen ___, arazoa konplexua da.","es":"Según los autores, el problema es complejo.","a":["arabera"],"hint":"según = -ren arabera."},{"type":"gap","q":"Ondorio ___, ikerketa gehiago behar dira.","es":"Como conclusión, hacen falta más investigaciones.","a":["gisa"],"hint":"como conclusión = ondorio gisa."},{"type":"choice","q":"«Parece que…» en un texto académico","options":["Badirudi … -la","Iruditzen zait … -la","Dirudi … -n"],"a":0,"why":"Iruditzen zait es más personal; badirudi es impersonal."},{"type":"choice","q":"«Según los autores»","options":["egileen arabera","egileekin","egileentzat"],"a":0,"why":"-ren arabera."},{"type":"choice","q":"«Es probable que cambie»","options":["litekeena da aldatzea","liteke aldatuko da","litekeena aldatzen da"],"a":0,"why":"litekeena da + -tzea."},{"type":"choice","q":"Apartado final de un trabajo:","options":["ondorioak","sarrera","metodologia"],"a":0,"why":"ondorioak = conclusiones."},{"type":"choice","q":"«Como se ha mencionado»","options":["aipatu bezala","aipatu arren","aipatzeko"],"a":0,"why":"aipatu bezala."},{"type":"order","words":["aztertzen","da","erabilera","euskararen","honetan","Lan"],"a":["Lan honetan euskararen erabilera aztertzen da"],"es":"En este trabajo se analiza el uso del euskera.","hint":"Lan honetan + objeto + aztertzen da."},{"type":"order","words":["konplexua","da","arazoa","arabera","Egileen"],"a":["Egileen arabera arazoa konplexua da"],"es":"Según los autores, el problema es complejo.","hint":"Fuente + afirmación."},{"type":"order","words":["direla","positiboak","emaitzak","daiteke","Esan"],"a":["Esan daiteke emaitzak positiboak direla"],"es":"Puede decirse que los resultados son positivos.","hint":"Esan daiteke + -la."},{"type":"match","pairs":[["sarrera","introducción"],["helburua","objetivo"],["emaitzak","resultados"],["eztabaida","discusión"],["ondorioak","conclusiones"],["-ren arabera","según"]]}],"create":{"prompt":"Escribe el resumen (abstract) de un trabajo imaginario sobre los hábitos de lectura en tu ciudad en 6 a 8 frases: objetivo, método, un resultado matizado y una conclusión.","focus":"estructura académica, impersonal, badirudi / esan daiteke / litekeena da, -ren arabera, ondorio gisa"},"links":{"verbs":[],"cases":[],"themes":["ikasketak","lokailuak"]}},"c1-07":{"id":"c1-07","lvl":"C1","n":7,"title":"Lexiko abstraktua","es":"El vocabulario abstracto","goal":"Manejar el vocabulario de la sociedad, los cambios y el análisis, con sus combinaciones habituales.","explain":[{"h":"Antes de empezar","p":"En C1 se habla y se escribe sobre temas abstractos: la sociedad, la tecnología, el medio ambiente, la igualdad. El vocabulario de estos temas es limitado y se repite mucho, pero hay que aprenderlo **con sus combinaciones**: no basta saber que *erronka* es «reto», hay que saber que se dice **erronkari aurre egin** (hacer frente a un reto)."},{"h":"Sociedad","table":{"head":["Euskera","Español"],"rows":[["gizartea","la sociedad"],["herritarrak","la ciudadanía"],["berdintasuna","la igualdad"],["aniztasuna","la diversidad"],["nortasuna","la identidad, la personalidad"],["bizikidetza","la convivencia"]]}},{"h":"Cambio y análisis","table":{"head":["Euskera","Español"],"rows":[["garapena","el desarrollo"],["joera","la tendencia"],["erronka","el reto"],["aukera","la oportunidad"],["eragina","la influencia, el impacto"],["ikuspegia","la perspectiva"],["irizpidea","el criterio"],["baliabideak","los recursos"],["ingurumena","el medio ambiente"],["jasangarritasuna","la sostenibilidad"]]}},{"h":"Combinaciones clave","p":"**eragina izan (-n)**: tener influencia (en): **Teknologiak eragin handia du gizartean**. **erronkari aurre egin**: hacer frente a un reto: **Erronka horri aurre egin behar diogu**. **joera izan (-tzeko)**: tener tendencia (a): **Gazteek sare sozialak erabiltzeko joera dute**. **kontuan hartu**: tener en cuenta. **garrantzia eman**: dar importancia. **ondorioak izan**: tener consecuencias. **ikuspegi horretatik**: desde esa perspectiva."},{"h":"Paso a paso: «El cambio climático es un gran reto que debemos afrontar»","p":"1) **Klima-aldaketa erronka handia da**. 2) «que debemos afrontar»: relativo con aurre egin + NORI → **aurre egin behar diogun erronka**. → **Klima-aldaketa aurre egin behar diogun erronka handia da**."},{"h":"Errores típicos","p":"*Erronka aurrean egin* → **erronkari aurre egin** (con dativo). *Kontuz hartu* → **kontuan hartu** (kontuz es «cuidado»). *Eragina eman* → **eragina izan**. Confundir **jasangarria** (sostenible) con **jasangarritasuna** (sostenibilidad)."},{"h":"Resumen","p":"Aprende el léxico abstracto en combinaciones: **eragina izan, erronkari aurre egin, joera izan, kontuan hartu, garrantzia eman, ondorioak izan, ikuspegi horretatik**."}],"examples":[["Teknologiak eragin handia du gizartean.","La tecnología tiene una gran influencia en la sociedad."],["Erronka horri aurre egin behar diogu.","Tenemos que hacer frente a ese reto."],["Gazteek sare sozialak erabiltzeko joera dute.","Los jóvenes tienen tendencia a usar las redes sociales."],["Kontuan hartu behar da ingurumena.","Hay que tener en cuenta el medio ambiente."],["Aniztasuna aberastasuna da.","La diversidad es una riqueza."],["Garapen jasangarria lortu behar dugu.","Tenemos que conseguir un desarrollo sostenible."],["Ikuspegi horretatik, arazoa ezberdina da.","Desde esa perspectiva, el problema es diferente."]],"dialog":{"title":"Tecnología y sociedad","lines":[["Ane","Zure ustez, teknologiak zer eragin du gizartean?","En tu opinión, ¿qué influencia tiene la tecnología en la sociedad?"],["Iker","Eragin handia, baina bi ikuspegi daude. Alde batetik, aukera berriak ematen ditu.","Una gran influencia, pero hay dos perspectivas. Por un lado, ofrece nuevas oportunidades."],["Ane","Eta bestetik?","¿Y por otro?"],["Iker","Erronka berriak sortzen ditu: bizikidetza, berdintasuna… Horiei aurre egin behar diegu.","Crea nuevos retos: la convivencia, la igualdad… Tenemos que hacerles frente."],["Ane","Ados. Ingurumena ere kontuan hartu behar dugu.","De acuerdo. También tenemos que tener en cuenta el medio ambiente."]]},"exercises":[{"type":"gap","q":"Teknologiak ___ handia du gizartean.","es":"La tecnología tiene una gran influencia en la sociedad.","a":["eragin"],"hint":"influencia = eragin(a)."},{"type":"gap","q":"Erronka horri aurre ___ behar diogu.","es":"Tenemos que hacer frente a ese reto.","a":["egin"],"hint":"hacer frente = aurre egin."},{"type":"gap","q":"Gazteek sare sozialak erabiltzeko ___ dute.","es":"Los jóvenes tienen tendencia a usar las redes sociales.","a":["joera"],"hint":"tendencia = joera."},{"type":"gap","q":"___ hartu behar da ingurumena.","es":"Hay que tener en cuenta el medio ambiente.","a":["kontuan"],"hint":"tener en cuenta = kontuan hartu."},{"type":"gap","q":"Aniztasuna ___ da.","es":"La diversidad es una riqueza.","a":["aberastasuna"],"hint":"riqueza = aberastasuna."},{"type":"gap","q":"Ikuspegi ___, arazoa ezberdina da.","es":"Desde esa perspectiva, el problema es diferente.","a":["horretatik"],"hint":"desde esa perspectiva = ikuspegi horretatik."},{"type":"choice","q":"«Hacer frente a un reto»","options":["erronkari aurre egin","erronka aurrean egin","erronkarekin egin"],"a":0,"why":"aurre egin pide dativo: erronkari."},{"type":"choice","q":"«Tener en cuenta»","options":["kontuan hartu","kontuz hartu","kontua eman"],"a":0,"why":"kontuz = cuidado."},{"type":"choice","q":"«Sostenibilidad»","options":["jasangarritasuna","jasangarria","jasanezina"],"a":0,"why":"jasangarria = sostenible."},{"type":"choice","q":"«Convivencia»","options":["bizikidetza","bizitza","bizilaguna"],"a":0,"why":"bizitza = vida; bizilaguna = vecino."},{"type":"choice","q":"«Influencia, impacto»","options":["eragina","erronka","irizpidea"],"a":0,"why":"erronka = reto; irizpidea = criterio."},{"type":"order","words":["du","handia","eragin","Teknologiak"],"a":["Teknologiak eragin handia du"],"es":"La tecnología tiene una gran influencia.","hint":"Sujeto + eragin handia + du."},{"type":"order","words":["diogu","behar","egin","aurre","horri","Erronka"],"a":["Erronka horri aurre egin behar diogu"],"es":"Tenemos que hacer frente a ese reto.","hint":"Dativo + aurre egin + behar diogu."},{"type":"order","words":["da","aberastasuna","Aniztasuna"],"a":["Aniztasuna aberastasuna da"],"es":"La diversidad es una riqueza.","hint":"Sujeto + predicado + da."},{"type":"match","pairs":[["gizartea","la sociedad"],["berdintasuna","la igualdad"],["aniztasuna","la diversidad"],["erronka","el reto"],["joera","la tendencia"],["ingurumena","el medio ambiente"]]}],"create":{"prompt":"Escribe un párrafo de 6 a 8 frases sobre un reto social actual (la vivienda, el cambio climático, la soledad…) usando al menos seis palabras y tres combinaciones de la lección.","focus":"léxico abstracto y colocaciones: eragina izan, erronkari aurre egin, joera izan, kontuan hartu"},"links":{"verbs":[],"cases":[],"themes":["lokailuak","natura"]}},"c1-08":{"id":"c1-08","lvl":"C1","n":8,"title":"Prentsa","es":"Leer y comentar prensa","goal":"Entender noticias en euskera: titulares, atribución de fuentes y estructura, y comentar lo leído.","explain":[{"h":"Antes de empezar","p":"Leer prensa en euskera (Berria, EITB, los diarios locales) es una de las mejores formas de mantener y ampliar el nivel. El lenguaje periodístico tiene rasgos propios: titulares sin auxiliar, mucho estilo nominal y fórmulas fijas para indicar la fuente. En esta lección los aprendes con una noticia breve escrita para el curso."},{"h":"Titulares","p":"Los titulares suelen **omitir el auxiliar**: **Gobernuak zerga berria onartu** (el Gobierno aprueba un nuevo impuesto), en lugar de *onartu du*. También usan el participio como nombre: **Hiru zauritu istripu batean** (tres heridos en un accidente). Y mucho estilo nominal (lección 5): **Langabeziaren jaitsiera**."},{"h":"Atribuir la información","table":{"head":["Fórmula","Significado"],"rows":[["… -ren arabera","según…"],["… jakinarazi duenez","según ha informado…"],["… adierazi du … -la","… ha declarado que…"],["iturri ofizialek baieztatu dutenez","según han confirmado fuentes oficiales"],["… nabarmendu du","… ha destacado"]]}},{"h":"Cómo leer una noticia","p":"1) **Titular**: el tema. 2) **Primer párrafo**: responde a **nor, zer, non, noiz, zergatik** (quién, qué, dónde, cuándo, por qué). 3) **Cuerpo**: busca las cifras y las fuentes. No intentes entender cada palabra: con el verbo principal de cada frase y las fórmulas de fuente captarás lo esencial. Cifras: **%15** se lee **ehuneko hamabost**."},{"h":"Comentar una noticia","p":"Para dar tu opinión sobre lo leído, combina lo que ya sabes: **Albistearen arabera, … ; nire ustez, …**, **Datu hauek erakusten dute … -la**, **Harrigarria iruditzen zait … -la** (me parece sorprendente que…)."},{"h":"Errores típicos","p":"Leer los titulares como frases incompletas: el auxiliar omitido se sobreentiende. Confundir **jakinarazi duenez** (según ha informado) con **jakinarazi duela** (que ha informado). *Inguru 5.000 pertsona* → **5.000 pertsona inguru** (inguru va detrás)."},{"h":"Resumen","p":"Titulares sin auxiliar (**onartu**) y con participio nominal (**zauritu**). Fuentes: **-ren arabera, jakinarazi duenez, adierazi du … -la, baieztatu dutenez**. Lectura: titular → primer párrafo (nor, zer, non, noiz, zergatik) → cifras y fuentes."}],"examples":[["Hiru zauritu istripu batean.","Tres heridos en un accidente (titular)."],["Gobernuak zerga berria onartu.","El Gobierno aprueba un nuevo impuesto (titular)."],["Udalak jakinarazi duenez, ekitaldia arazorik gabe amaitu zen.","Según ha informado el ayuntamiento, el acto terminó sin problemas."],["Antolatzaileen arabera, 5.000 pertsona inguru izan ziren.","Según los organizadores, asistieron unas 5.000 personas."],["Ministroak adierazi du ez dagoela arazorik.","El ministro ha declarado que no hay problemas."],["Langabezia %3 jaitsi da.","El paro ha bajado un 3 %."],["Iturri ofizialek baieztatu dutenez, bilera bihar izango da.","Según han confirmado fuentes oficiales, la reunión será mañana."]],"dialog":{"title":"Una noticia breve","lines":[["Izenburua","Milaka lagun euskararen alde Donostian","Miles de personas a favor del euskera en San Sebastián"],["Albistea","Milaka lagun bildu ziren atzo Donostian, euskararen alde.","Miles de personas se reunieron ayer en San Sebastián a favor del euskera."],["Albistea","Antolatzaileen arabera, 5.000 pertsona inguru izan ziren.","Según los organizadores, asistieron unas 5.000 personas."],["Albistea","Udalak jakinarazi duenez, ekitaldia arazorik gabe amaitu zen.","Según ha informado el ayuntamiento, el acto terminó sin incidentes."],["Albistea","Antolatzaileek adierazi dutenez, datorren urtean ere antolatuko dute.","Según han declarado los organizadores, lo organizarán también el año que viene."],["Albistea","Euskaltegiek ikasle berrien igoera nabarmendu dute.","Los euskaltegis han destacado el aumento de nuevos alumnos."]]},"exercises":[{"type":"gap","q":"Antolatzaileen ___, 5.000 pertsona izan ziren.","es":"Según los organizadores, asistieron 5.000 personas.","a":["arabera"],"hint":"según = -ren arabera."},{"type":"gap","q":"Udalak jakinarazi ___, ekitaldia ondo amaitu zen.","es":"Según ha informado el ayuntamiento, el acto terminó bien.","a":["duenez"],"hint":"según ha informado = jakinarazi duenez."},{"type":"gap","q":"Ministroak ___ du ez dagoela arazorik.","es":"El ministro ha declarado que no hay problemas.","a":["adierazi"],"hint":"declarar = adierazi."},{"type":"gap","q":"Iturri ofizialek baieztatu ___, bilera bihar izango da.","es":"Según han confirmado fuentes oficiales…","a":["dutenez"],"hint":"Sujeto plural: baieztatu dutenez."},{"type":"gap","q":"Langabezia %3 ___ da.","es":"El paro ha bajado un 3 %.","a":["jaitsi"],"hint":"bajar = jaitsi."},{"type":"gap","q":"Euskaltegiek ikasleen igoera ___ dute.","es":"Los euskaltegis han destacado el aumento de alumnos.","a":["nabarmendu"],"hint":"destacar = nabarmendu."},{"type":"choice","q":"Titular típico:","options":["Gobernuak zerga berria onartu","Gobernuak zerga berria onartu du eta gainera…","Zerga berria onartzen ari da gobernua, uste dut"],"a":0,"why":"Los titulares omiten el auxiliar y son breves."},{"type":"choice","q":"«Según ha informado el ayuntamiento»","options":["udalak jakinarazi duenez","udalak jakinarazi duela","udalaren jakinarazi"],"a":0,"why":"Atribución: -(e)nez."},{"type":"choice","q":"«Unas 5.000 personas»","options":["5.000 pertsona inguru","inguru 5.000 pertsona","5.000 pertsonak inguruan"],"a":0,"why":"inguru va detrás."},{"type":"choice","q":"El primer párrafo de una noticia responde a…","options":["nor, zer, non, noiz, zergatik","la opinión del periodista","el final de la historia"],"a":0,"why":"Quién, qué, dónde, cuándo, por qué."},{"type":"choice","q":"«Ha declarado que no hay problemas»","options":["adierazi du ez dagoela arazorik","adierazi du ez dago arazorik","adierazi du ez dagoen arazorik"],"a":0,"why":"Completiva con -la."},{"type":"order","words":["ziren","izan","pertsona","5.000","arabera","Antolatzaileen"],"a":["Antolatzaileen arabera 5.000 pertsona izan ziren"],"es":"Según los organizadores, asistieron 5.000 personas.","hint":"Fuente + cifra + verbo."},{"type":"order","words":["duenez","jakinarazi","Udalak"],"a":["Udalak jakinarazi duenez"],"es":"Según ha informado el ayuntamiento.","hint":"Sujeto + jakinarazi duenez."},{"type":"order","words":["da","jaitsi","Langabezia"],"a":["Langabezia jaitsi da"],"es":"El paro ha bajado.","hint":"Sujeto + participio + da."},{"type":"match","pairs":[["albistea","la noticia"],["izenburua","el titular"],["iturria","la fuente"],["-ren arabera","según"],["jakinarazi","informar"],["adierazi","declarar"]]}],"create":{"prompt":"Escribe una noticia breve (6 a 8 frases) sobre un acontecimiento real o inventado de tu ciudad: un titular sin auxiliar, un primer párrafo con nor, zer, non, noiz y zergatik, y al menos dos fuentes atribuidas. Añade dos frases comentándola.","focus":"titulares, atribución de fuentes (-ren arabera, jakinarazi duenez, adierazi du … -la), estructur
