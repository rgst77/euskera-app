 Miren! ¿Adónde vas?"],["Miren","Kaixo! Lanera noa. Eta zu?","¡Hola! Voy al trabajo. ¿Y tú?"],["Iker","Ni etxera noa. Eskolatik nator.","Yo voy a casa. Vengo de la escuela."],["Miren","Bihar Gasteizera goaz.","Mañana vamos a Vitoria-Gasteiz."],["Iker","Ni ere bihar Gasteizera noa!","¡Yo también voy mañana a Vitoria-Gasteiz!"],["Miren","Primeran! Gero arte!","¡Estupendo! ¡Hasta luego!"]]},"exercises":[{"type":"gap","q":"Etxe___ noa.","es":"Voy a casa.","a":["ra"],"hint":"NORA: -ra tras vocal, -era tras consonante."},{"type":"gap","q":"Nora ___?","es":"¿Adónde vas?","a":["zoaz"],"hint":"joan: noa, zoaz, doa, goaz, zoazte, doaz."},{"type":"gap","q":"Lanetik ___.","es":"Vengo del trabajo.","a":["nator"],"hint":"etorri: nator, zatoz, dator, gatoz, zatozte, datoz."},{"type":"gap","q":"Mikel Bilbora ___.","es":"Mikel va a Bilbao.","a":["doa"],"hint":"joan: noa, zoaz, doa, goaz, zoazte, doaz."},{"type":"gap","q":"Gu mendira ___.","es":"Vamos al monte.","a":["goaz"],"hint":"joan, nosotros: goaz."},{"type":"gap","q":"Haiek hondartzatik ___.","es":"Ellos vienen de la playa.","a":["datoz"],"hint":"etorri, ellos: datoz."},{"type":"choice","q":"«Voy a Vitoria-Gasteiz»","options":["Gasteizera noa.","Gasteizra noa.","Gasteizen noa."],"a":0,"why":"Tras consonante, -era. Gasteizen es «en Gasteiz»."},{"type":"choice","q":"«Vengo de casa»","options":["Etxetik nator.","Etxera nator.","Etxean nator."],"a":0,"why":"Procedencia: -tik."},{"type":"choice","q":"«¿Adónde vais?»","options":["Nora zoazte?","Non zoazte?","Nondik zoazte?"],"a":0,"why":"nora = adónde; non = dónde; nondik = de dónde."},{"type":"choice","q":"«Voy a la playa»","options":["Hondartzara noa.","Hondartzan noa.","Hondartzatik noa."],"a":0,"why":"Con movimiento hacia un lugar: NORA (-ra)."},{"type":"order","words":["goaz","mendira","Gu"],"a":["Gu mendira goaz"],"es":"Nosotros vamos al monte.","hint":"Sujeto + lugar + verbo."},{"type":"order","words":["zatoz","Nondik","zu"],"a":["Nondik zatoz zu","Zu nondik zatoz"],"es":"¿De dónde vienes tú?","hint":"La interrogativa va justo antes del verbo."},{"type":"order","words":["Bilbotik","datoz","Haiek"],"a":["Haiek Bilbotik datoz"],"es":"Ellos vienen de Bilbao.","hint":"Sujeto + lugar + verbo."},{"type":"match","pairs":[["noa","voy"],["zoaz","vas"],["doa","va"],["nator","vengo"],["zatoz","vienes"],["dator","viene"]]}],"create":{"prompt":"Escribe adónde vas hoy, adónde vas mañana y de dónde vienes ahora. Añade una pregunta para un amigo (Nora zoaz…? / Nondik zatoz?).","focus":"joan y etorri en presente, NORA (-ra/-era) y NONDIK (-tik/-etik)"},"links":{"verbs":["syn-pres-1"],"cases":["adl","abl"],"themes":["hiria","bidaiak"]}},"a1-09":{"id":"a1-09","lvl":"A1","n":9,"title":"Nire familia","es":"Posesivos y genitivo -en","goal":"Hablar de tu familia y decir de quién es algo.","explain":[{"h":"Antes de empezar","p":"Hoy aprendes a decir «mi, tu, nuestro…» y «de Mikel, del chico…». Con eso ya puedes presentar a tu familia. Hay una sorpresa: en euskera, la palabra para «hermano» depende de si lo dice un hombre o una mujer."},{"h":"Los posesivos","p":"Van **delante** del nombre, y el nombre **mantiene el artículo**: **nire etxea** (mi casa), literalmente «de mí la casa». En plural: **nire lagunak** (mis amigos).","table":{"head":["Euskera","Español"],"rows":[["nire","mi, mis"],["zure","tu, tus"],["bere","su (de él / ella)"],["gure","nuestro, nuestra"],["zuen","vuestro, vuestra"],["haien","su (de ellos)"]]}},{"h":"«De Mikel»: el genitivo -en","p":"Para decir de quién es algo, el poseedor va **delante** y lleva **-en**: **Mikelen etxea** (la casa de Mikel). Si el nombre acaba en vocal, **-ren**: **Aneren ama** (la madre de Ane). Con nombres comunes y artículo: **-aren** en singular (**mutilaren liburua**, el libro del chico) y **-en** en plural (**lagunen etxea**, la casa de los amigos)."},{"h":"-ko o -en","p":"Las dos se traducen por «de», pero no son iguales: **-ko** es de un **lugar** (**etxeko giltza**, la llave de casa) y **-en** es de una **persona** o poseedor (**Mikelen giltza**, la llave de Mikel)."},{"h":"Los hermanos","p":"El euskera distingue quién habla. Un hombre dice **anaia** (hermano) y **arreba** (hermana). Una mujer dice **neba** (hermano) y **ahizpa** (hermana). Para «hermanos» en general: **anai-arrebak** (de un hombre) o **neba-ahizpak** (de una mujer). Y otro bloque útil: **Bi anaia ditut** (tengo dos hermanos)."},{"h":"Paso a paso: «la madre de mi amigo»","p":"1) El poseedor: **nire laguna** (mi amigo). 2) Añade -en: lagun**aren** → **nire lagunaren**. 3) Lo poseído detrás: **ama**. 4) **Nire lagunaren ama**. El orden es el contrario al español: primero el dueño, luego la cosa."},{"h":"Errores típicos","p":"*nire etxe* → **nire etxea** (el nombre conserva el artículo). *ama Mikelen* → **Mikelen ama** (el poseedor va delante). *Mikelko ama* → **Mikelen ama** (-ko es para lugares). Una mujer que dice *nire anaia* → lo normal es **nire neba**."},{"h":"Resumen","p":"**nire, zure, bere, gure, zuen, haien** + nombre con artículo. Poseedor + **-en / -ren / -aren**, delante de lo poseído. **-ko** lugar, **-en** persona. **anaia/arreba** (dicho por un hombre), **neba/ahizpa** (dicho por una mujer)."}],"examples":[["Nire ama Ane da.","Mi madre es Ane."],["Zure aita irakaslea da?","¿Tu padre es profesor?"],["Gure etxea txikia da.","Nuestra casa es pequeña."],["Mikelen arreba Bilbon bizi da.","La hermana de Mikel vive en Bilbao."],["Mutilaren liburua.","El libro del chico."],["Haien seme-alabak ikasleak dira.","Sus hijos son estudiantes."]],"dialog":{"title":"Mirando una foto","lines":[["Iker","Hau zure familia da?","¿Esta es tu familia?"],["Ane","Bai! Hau nire ama da, eta hau nire aita.","¡Sí! Esta es mi madre, y este mi padre."],["Iker","Eta mutil hau?","¿Y este chico?"],["Ane","Hori nire neba da, Jon. Hamabost urte ditu.","Ese es mi hermano, Jon. Tiene quince años."],["Iker","Eta neska hau zure ahizpa da?","¿Y esta chica es tu hermana?"],["Ane","Ez, hori Jonen laguna da.","No, esa es la amiga de Jon."]]},"exercises":[{"type":"gap","q":"___ ama Ane da.","es":"Mi madre es Ane.","a":["nire"],"hint":"nire mi · zure tu · gure nuestro."},{"type":"gap","q":"Hau ___ etxea da?","es":"¿Esta es tu casa?","a":["zure"],"hint":"nire mi · zure tu · gure nuestro."},{"type":"gap","q":"___ etxea txikia da.","es":"Nuestra casa es pequeña.","a":["gure"],"hint":"nire mi · zure tu · gure nuestro."},{"type":"gap","q":"Mikel___ arreba Bilbon bizi da.","es":"La hermana de Mikel vive en Bilbao.","a":["en"],"hint":"Nombre acabado en consonante: -en. En vocal: -ren."},{"type":"gap","q":"Ane___ aita irakaslea da.","es":"El padre de Ane es profesor.","a":["ren"],"hint":"Nombre acabado en vocal: -ren."},{"type":"gap","q":"Mutil___ liburua.","es":"El libro del chico.","a":["aren"],"hint":"Nombre común con artículo, singular: -aren."},{"type":"choice","q":"«Mi casa»","options":["nire etxea","nire etxe","etxea nire"],"a":0,"why":"El posesivo va delante y el nombre conserva el artículo."},{"type":"choice","q":"«La madre de Mikel»","options":["Mikelen ama","ama Mikelen","Mikelko ama"],"a":0,"why":"Poseedor + -en delante. -ko es para lugares."},{"type":"choice","q":"Una mujer habla de su hermano:","options":["neba","anaia","arreba"],"a":0,"why":"Una mujer dice neba (hermano) y ahizpa (hermana)."},{"type":"choice","q":"Un hombre habla de su hermana:","options":["arreba","ahizpa","neba"],"a":0,"why":"Un hombre dice anaia (hermano) y arreba (hermana)."},{"type":"choice","q":"«Vuestro»","options":["zuen","zure","gure"],"a":0,"why":"zuen = vuestro; zure = tu; gure = nuestro."},{"type":"order","words":["ama","da","Nire","Ane"],"a":["Nire ama Ane da"],"es":"Mi madre es Ane.","hint":"Posesivo + nombre, luego lo que dices y el verbo al final."},{"type":"order","words":["Bilbon","Mikelen","bizi","arreba","da"],"a":["Mikelen arreba Bilbon bizi da"],"es":"La hermana de Mikel vive en Bilbao.","hint":"Poseedor delante (Mikelen arreba), lugar y bizi da al final."},{"type":"match","pairs":[["nire","mi"],["zure","tu"],["gure","nuestro"],["zuen","vuestro"],["haien","su (de ellos)"],["bere","su (de él / ella)"]]}],"create":{"prompt":"Presenta a tu familia en 4 o 5 frases: quién es quién, cómo se llaman, dónde viven o cuántos años tienen («Nire ama Maite da. Bilbon bizi da.»).","focus":"posesivos con artículo, genitivo -en/-ren/-aren, vocabulario de la familia"},"links":{"verbs":["nor-pres"],"cases":["gen"],"themes":["familia","pertsonak"]}},"a1-10":{"id":"a1-10","lvl":"A1","n":10,"title":"Zer daukazu?","es":"El verbo tener y describir cosas","goal":"Decir qué tienes y describir cosas y personas.","explain":[{"h":"Antes de empezar","p":"Hoy aprendes **eduki** (tener) y, con él, la pieza más característica del euskera: el sujeto que lleva **-k**. En español, «yo» es igual en «yo voy» y en «yo tengo». En euskera no: cuando el verbo tiene un objeto (algo que se tiene, se ve, se come…), el sujeto lleva una marca especial."},{"h":"eduki en presente","p":"Es sintético, como egon. Si lo que tienes es una cosa, se usa la primera columna; si son varias, se añade **-zk-**:","table":{"head":["NORK","Una cosa","Varias cosas"],"rows":[["{nork:nik}","{nork:daukat}","{nork:dauzkat}"],["{nork:zuk}","{nork:daukazu}","{nork:dauzkazu}"],["{nork:hark}","{nork:dauka}","{nork:dauzka}"],["{nork:guk}","{nork:daukagu}","{nork:dauzkagu}"],["{nork:zuek}","{nork:daukazue}","{nork:dauzkazue}"],["{nork:haiek}","{nork:daukate}","{nork:dauzkate}"]]}},{"h":"El sujeto con -k (NORK)","p":"Fíjate en los pronombres: **ni → nik**, **zu → zuk**, **hura → hark**, **gu → guk**. Con nombres pasa lo mismo: **Mikelek** (Mikel), **Anek** (Ane), **amak** (la madre). Es el caso {nork:NORK}, el sujeto de los verbos con objeto. Te acompañará siempre: con eduki, con ukan (dut) y con todos los verbos transitivos."},{"h":"eduki o ukan","p":"Para «tener» también es correcto usar **ukan**: **Kotxe bat dut** = **Kotxe bat daukat** (tengo un coche). Las dos formas son batua. En esta lección practicas eduki, y ukan ya lo viste en la edad (**… urte ditut**)."},{"h":"Describir","p":"El adjetivo va detrás del nombre y **bat** al final: **etxe handi bat** (una casa grande). Para describir personas: **Ile beltza dauka** (tiene el pelo negro), **Begi urdinak dauzka** (tiene los ojos azules; como begiak es plural, dauzka)."},{"h":"Paso a paso: «Ane tiene un perro negro»","p":"1) El sujeto con -k: **Anek**. 2) Lo que tiene: nombre + adjetivo + bat → **txakur beltz bat**. 3) El verbo: una cosa, «ella» → **dauka**. 4) **Anek txakur beltz bat dauka**."},{"h":"Errores típicos","p":"*Ane txakur bat dauka* → **Anek** txakur bat dauka (falta la -k). *Begi urdinak dauka* → **dauzka** (son varios ojos). *Etxe bat handi* → **etxe handi bat**. *Ni kotxe bat daukat* → **Nik** kotxe bat daukat."},{"h":"Resumen","p":"**daukat, daukazu, dauka, daukagu, daukazue, daukate**; con varias cosas, **dauzk-**. El sujeto lleva **-k**: nik, zuk, hark, guk, Mikelek. Descripción: nombre + adjetivo + bat."}],"examples":[["Kotxe bat daukat.","Tengo un coche."],["Zuk txakur bat daukazu?","¿Tienes un perro?"],["Anek begi urdinak dauzka.","Ane tiene los ojos azules."],["Guk etxe txiki bat daukagu.","Tenemos una casa pequeña."],["Mikelek ile beltza dauka.","Mikel tiene el pelo negro."],["Haiek bi seme dauzkate.","Ellos tienen dos hijos."]],"dialog":{"title":"El piso nuevo","lines":[["Jon","Etxe berria daukazu?","¿Tienes casa nueva?"],["Miren","Bai! Pisu txiki bat daukat, Donostian.","¡Sí! Tengo un piso pequeño, en San Sebastián."],["Jon","Zenbat gela dauzka?","¿Cuántas habitaciones tiene?"],["Miren","Bi logela dauzka eta sukalde handi bat.","Tiene dos dormitorios y una cocina grande."],["Jon","Eta lorategia daukazu?","¿Y tienes jardín?"],["Miren","Ez, baina balkoi polit bat daukat.","No, pero tengo un balcón bonito."]]},"exercises":[{"type":"gap","q":"Kotxe bat ___.","es":"Tengo un coche.","a":["daukat"],"hint":"Una cosa: daukat, daukazu, dauka, daukagu, daukazue, daukate."},{"type":"gap","q":"Zuk txakur bat ___?","es":"¿Tienes un perro?","a":["daukazu"],"hint":"Una cosa: daukat, daukazu, dauka, daukagu, daukazue, daukate."},{"type":"gap","q":"Anek begi urdinak ___.","es":"Ane tiene los ojos azules.","a":["dauzka"],"hint":"Varias cosas (begiak): dauzk-."},{"type":"gap","q":"Guk etxe txiki bat ___.","es":"Tenemos una casa pequeña.","a":["daukagu"],"hint":"Nosotros, una cosa: daukagu."},{"type":"gap","q":"Mikel___ ile beltza dauka.","es":"Mikel tiene el pelo negro.","a":["ek"],"hint":"Sujeto de un verbo con objeto: -k (tras consonante, -ek)."},{"type":"gap","q":"Haiek bi seme ___.","es":"Ellos tienen dos hijos.","a":["dauzkate"],"hint":"Ellos, varias cosas: dauzkate."},{"type":"choice","q":"«Tengo una casa grande»","options":["Etxe handi bat daukat.","Etxe bat handi daukat.","Handi etxe bat daukat."],"a":0,"why":"Nombre + adjetivo + bat."},{"type":"choice","q":"«Ane tiene los ojos azules»","options":["Anek begi urdinak dauzka.","Ane begi urdinak dauzka.","Anek begi urdinak dauka."],"a":0,"why":"Sujeto con -k (Anek) y verbo en plural (dauzka) porque son varios ojos."},{"type":"choice","q":"«¿Qué tienes?»","options":["Zer daukazu?","Zer zaude?","Zer da zu?"],"a":0,"why":"tener = eduki; tú = daukazu."},{"type":"choice","q":"«Tienen dos hijos»","options":["Bi seme dauzkate.","Bi seme daukate.","Bi semeak dauzkate."],"a":0,"why":"Dos hijos = varias cosas (dauzk-), y el nombre tras número va sin artículo."},{"type":"order","words":["bat","daukat","Kotxe"],"a":["Kotxe bat daukat"],"es":"Tengo un coche.","hint":"Nombre + bat + verbo."},{"type":"order","words":["urdinak","Anek","dauzka","begi"],"a":["Anek begi urdinak dauzka"],"es":"Ane tiene los ojos azules.","hint":"Sujeto con -k, nombre + adjetivo, verbo al final."},{"type":"order","words":["handi","Etxe","daukagu","bat"],"a":["Etxe handi bat daukagu"],"es":"Tenemos una casa grande.","hint":"Nombre + adjetivo + bat + verbo."},{"type":"match","pairs":[["daukat","tengo (una cosa)"],["daukazu","tienes"],["dauka","tiene"],["daukagu","tenemos"],["dauzkat","tengo (varias)"],["dauzka","tiene (varias)"]]}],"create":{"prompt":"Describe en 4 o 5 frases qué tienes (casa, mascota, objetos) y cómo es alguien de tu entorno (ile, begi…). Recuerda la -k del sujeto.","focus":"eduki (daukat / dauzkat), sujeto con -k, nombre + adjetivo + bat"},"links":{"verbs":["syn-pres-2"],"cases":["erg"],"themes":["etxea","koloreak","adjektiboak"]}},"a1-11":{"id":"a1-11","lvl":"A1","n":11,"title":"Egunerokoa","es":"Presente habitual: -tzen naiz / dut","goal":"Contar tu rutina: qué haces cada día y cuándo.","explain":[{"h":"Antes de empezar","p":"Esta es una de las lecciones más importantes del A1. Hasta ahora has usado verbos que se conjugan solos (nago, noa, daukat). Pero la mayoría de los verbos vascos funcionan con **dos piezas**: el verbo principal, que casi no cambia, y un **auxiliar** que indica la persona. Una vez entiendes este sistema, puedes usar cientos de verbos."},{"h":"Las dos piezas","p":"Para hablar de lo que haces habitualmente: verbo en **-tzen / -ten** + auxiliar. **Kafea edaten dut** (bebo café). **Lanera joaten naiz** (voy al trabajo, habitualmente). El verbo va casi al final y el auxiliar, justo después."},{"h":"¿naiz o dut?","p":"Depende de si el verbo tiene objeto. **Sin objeto** (ir, venir, levantarse, vivir): auxiliar **izan** → **naiz, zara, da…** (**Zazpietan jaikitzen naiz**). **Con objeto** (beber algo, ver algo, hacer algo): auxiliar **ukan** → **dut, duzu, du…** y el sujeto con **-k** (**Nik kafea edaten dut**). Truco: si puedes preguntar «¿qué?» (¿qué bebes?), es dut."},{"h":"Cómo se forma -tzen","p":"A partir del verbo de diccionario:","table":{"head":["Si el verbo acaba en…","Se forma con…","Ejemplos"],"rows":[["-tu / -du","-tzen","bukatu → bukatzen · lagundu → laguntzen"],["-i (casi siempre)","-tzen","jaiki → jaikitzen · irakurri → irakurtzen · etorri → etortzen"],["-si, -tzi, -zi","-ten (y tz → z)","ikasi → ikasten · idatzi → idazten · hasi → hasten"],["-n","-ten","egin → egiten · jan → jaten · edan → edaten · joan → joaten"]]}},{"h":"Expresiones de tiempo","p":"**egunero** (todos los días), **goizean** (por la mañana), **eguerdian** (al mediodía), **arratsaldean** (por la tarde), **gauean** (por la noche), **asteburuan** (el fin de semana), **batzuetan** (a veces), **beti** (siempre). Para la hora, de momento como bloque: **zazpietan** (a las siete), **zortzietan** (a las ocho)."},{"h":"Negar y preguntar","p":"Como en la lección 5: **ez + auxiliar** delante y el verbo al final: **Ez dut telebista ikusten** (no veo la tele). Para preguntar: **Zer egiten duzu?** (¿qué haces?), **Noiz jaikitzen zara?** (¿cuándo te levantas?)."},{"h":"Paso a paso: «Leo el periódico por la tarde»","p":"1) Verbo: **irakurri** → acaba en -i → **irakurtzen**. 2) ¿Tiene objeto? Sí, el periódico → auxiliar **dut**. 3) Orden: tiempo + objeto + verbo + auxiliar → **Arratsaldean egunkaria irakurtzen dut**."},{"h":"Errores típicos","p":"*Kafea edaten naiz* → **dut** (beber tiene objeto). *Lanera joaten dut* → **naiz** (ir no tiene objeto). *Ez telebista ikusten dut* → **Ez dut telebista ikusten**. *Lanera noa* para «voy (siempre) al trabajo» → **joaten naiz** (noa es «voy ahora»)."},{"h":"Resumen","p":"Habitual = verbo **-tzen / -ten** + auxiliar. Sin objeto → **naiz, zara, da…**; con objeto → **dut, duzu, du…** (sujeto con -k). Negación: **ez + auxiliar … verbo**."}],"examples":[["Egunero lanera joaten naiz.","Todos los días voy al trabajo."],["Goizean kafea edaten dut.","Por la mañana bebo café."],["Zazpietan jaikitzen naiz.","Me levanto a las siete."],["Arratsaldean euskara ikasten dut.","Por la tarde estudio euskera."],["Ez dut telebista ikusten.","No veo la tele."],["Zer egiten duzu asteburuan?","¿Qué haces el fin de semana?"]],"dialog":{"title":"La rutina","lines":[["Ane","Zer egiten duzu egunero?","¿Qué haces todos los días?"],["Iker","Zazpietan jaikitzen naiz eta kafea edaten dut.","Me levanto a las siete y bebo café."],["Ane","Lanera autobusez joaten zara?","¿Vas al trabajo en autobús?"],["Iker","Ez, oinez joaten naiz. Eta zu?","No, voy a pie. ¿Y tú?"],["Ane","Nik etxean lan egiten dut. Arratsaldean euskara ikasten dut.","Yo trabajo en casa. Por la tarde estudio euskera."],["Iker","Oso ondo!","¡Muy bien!"]]},"exercises":[{"type":"gap","q":"Zazpietan jaiki___ naiz.","es":"Me levanto a las siete.","a":["tzen"],"hint":"Verbo acabado en -i: -tzen."},{"type":"gap","q":"Goizean kafea edaten ___.","es":"Por la mañana bebo café.","a":["dut"],"hint":"¿Qué bebes? Tiene objeto → dut."},{"type":"gap","q":"Egunero lanera joaten ___.","es":"Todos los días voy al trabajo.","a":["naiz"],"hint":"Ir no tiene objeto → naiz."},{"type":"gap","q":"Zer egiten ___?","es":"¿Qué haces?","a":["duzu"],"hint":"Hacer tiene objeto (zer); tú → duzu."},{"type":"gap","q":"Arratsaldean euskara ikas___ dut.","es":"Por la tarde estudio euskera.","a":["ten"],"hint":"ikasi acaba en -si: -ten."},{"type":"gap","q":"Ez ___ telebista ikusten.","es":"No veo la tele.","a":["dut"],"hint":"Ver tiene objeto → dut, y en negativa va detrás de ez."},{"type":"choice","q":"«Bebo café» (habitualmente)","options":["Kafea edaten dut.","Kafea edaten naiz.","Kafea edan dut."],"a":0,"why":"Tiene objeto → dut. Edan dut significa «he bebido»."},{"type":"choice","q":"«Voy al trabajo» (todos los días)","options":["Lanera joaten naiz.","Lanera joaten dut.","Lanera noa."],"a":0,"why":"Ir no tiene objeto → naiz. Lanera noa es «voy ahora»."},{"type":"choice","q":"«No veo la tele»","options":["Ez dut telebista ikusten.","Ez telebista ikusten dut.","Telebista ez ikusten dut."],"a":0,"why":"ez + auxiliar delante, el verbo al final."},{"type":"choice","q":"Forma habitual de egin (hacer):","options":["egiten","egintzen","egitzen"],"a":0,"why":"Verbos en -n: -ten."},{"type":"choice","q":"Forma habitual de ikasi (estudiar):","options":["ikasten","ikasitzen","ikastzen"],"a":0,"why":"Verbos en -si: -ten."},{"type":"order","words":["naiz","Egunero","joaten","lanera"],"a":["Egunero lanera joaten naiz","Lanera egunero joaten naiz"],"es":"Todos los días voy al trabajo.","hint":"Tiempo y lugar delante; verbo + auxiliar al final."},{"type":"order","words":["dut","Ez","ikusten","telebista"],"a":["Ez dut telebista ikusten"],"es":"No veo la tele.","hint":"ez + auxiliar, objeto, verbo al final."},{"type":"match","pairs":[["jaiki","jaikitzen"],["edan","edaten"],["ikusi","ikusten"],["egin","egiten"],["joan","joaten"],["irakurri","irakurtzen"]]}],"create":{"prompt":"Cuenta tu rutina en 5 frases: a qué hora te levantas, qué desayunas, adónde vas, qué haces por la tarde y algo que no haces nunca o casi nunca.","focus":"presente habitual: -tzen/-ten + naiz (sin objeto) o dut (con objeto); negación ez + auxiliar"},"links":{"verbs":["nor-pres","nn-pres-3"],"cases":[],"themes":["denbora","aditzak"]}},"a1-12":{"id":"a1-12","lvl":"A1","n":12,"title":"Gustuak","es":"gustatu zait / zaizkit","goal":"Decir qué te gusta y qué no, y preguntar por los gustos de otros.","explain":[{"h":"Antes de empezar","p":"Buenas noticias: «gustar» funciona en euskera casi igual que en español. Decimos «**me** gusta el café», no «yo gusto el café». En euskera también: la persona a quien le gusta va como «a mí, a ti…», y lo que gusta es el sujeto."},{"h":"La estructura","p":"Lo que gusta ({nor:NOR}) + **gustatzen** + auxiliar que indica a quién ({nori:NORI}): **Kafea gustatzen zait** (me gusta el café). Si lo que gusta es plural, el auxiliar cambia: **Liburuak gustatzen zaizkit** (me gustan los libros).","table":{"head":["NORI","Una cosa","Varias cosas"],"rows":[["(niri) a mí","{nori:zait}","{nori:zaizkit}"],["(zuri) a ti","{nori:zaizu}","{nori:zaizkizu}"],["(hari) a él / ella","{nori:zaio}","{nori:zaizkio}"],["(guri) a nosotros","{nori:zaigu}","{nori:zaizkigu}"],["(zuei) a vosotros","{nori:zaizue}","{nori:zaizkizue}"],["(haiei) a ellos","{nori:zaie}","{nori:zaizkie}"]]}},{"h":"«A Mikel le gusta»","p":"La persona lleva la terminación de «a» (dativo): **niri, zuri, hari, guri, zuei, haiei**. Con nombres: **-i** tras consonante (**Mikeli**) y **-ri** tras vocal (**Aneri**): **Mikeli kafea gustatzen zaio**. Ojo: aquí no se usa la -k de NORK."},{"h":"Gustar hacer algo","p":"Para «me gusta leer», el verbo toma la forma **-tzea**: **Irakurtzea gustatzen zait** (me gusta leer), **Dantzatzea gustatzen zaigu** (nos gusta bailar). Se forma como -tzen, cambiando la n final por **-a**: irakurtzen → irakurtzea, ikasten → ikastea."},{"h":"Negar, preguntar, matizar","p":"**Ez zait futbola gustatzen** (no me gusta el fútbol). **Zer gustatzen zaizu?** (¿qué te gusta?). **Asko** (mucho): **Musika asko gustatzen zait**. Para responder «a mí también / a mí no»: **Niri ere bai / Niri ez**."},{"h":"Paso a paso: «A nosotros nos gustan los perros»","p":"1) A quién: **guri**. 2) Qué: **txakurrak** (plural). 3) gustatzen + auxiliar de «nosotros» en plural: **zaizkigu**. 4) **Guri txakurrak gustatzen zaizkigu**."},{"h":"Errores típicos","p":"*Kafea gustatzen dut* → **zait** (gustar usa NOR-NORI). *Txakurrak gustatzen zait* → **zaizkit** (lo que gusta es plural). *Mikelek kafea gustatzen zaio* → **Mikeli** (dativo, no -k). *Nik ere bai* tras gustatu → **Niri ere bai**."},{"h":"Resumen","p":"Lo que gusta + **gustatzen** + **zait, zaizu, zaio, zaigu, zaizue, zaie**; en plural, **zaizki-**. Persona: **niri, zuri, hari…, Mikeli, Aneri**. Actividades: **-tzea gustatzen zait**."}],"examples":[["Kafea gustatzen zait.","Me gusta el café."],["Liburuak gustatzen zaizkit.","Me gustan los libros."],["Zer gustatzen zaizu?","¿Qué te gusta?"],["Ez zait futbola gustatzen.","No me gusta el fútbol."],["Aneri musika asko gustatzen zaio.","A Ane le gusta mucho la música."],["Irakurtzea gustatzen zait.","Me gusta leer."],["Guri mendia gustatzen zaigu.","A nosotros nos gusta el monte."]],"dialog":{"title":"Conociéndose","lines":[["Jon","Zer gustatzen zaizu?","¿Qué te gusta?"],["Nerea","Musika asko gustatzen zait, eta irakurtzea ere bai.","Me gusta mucho la música, y leer también."],["Jon","Futbola gustatzen zaizu?","¿Te gusta el fútbol?"],["Nerea","Ez, ez zait futbola gustatzen. Eta zuri?","No, no me gusta el fútbol. ¿Y a ti?"],["Jon","Niri bai! Baina mendia gehiago gustatzen zait.","¡A mí sí! Pero me gusta más el monte."],["Nerea","Niri ere bai!","¡A mí también!"]]},"exercises":[{"type":"gap","q":"Kafea gustatzen ___.","es":"Me gusta el café.","a":["zait"],"hint":"A mí, una cosa: zait."},{"type":"gap","q":"Liburuak gustatzen ___.","es":"Me gustan los libros.","a":["zaizkit"],"hint":"A mí, varias cosas: zaizkit."},{"type":"gap","q":"Zer gustatzen ___?","es":"¿Qué te gusta?","a":["zaizu"],"hint":"A ti, una cosa: zaizu."},{"type":"gap","q":"Ez ___ futbola gustatzen.","es":"No me gusta el fútbol.","a":["zait"],"hint":"En negativa el auxiliar va detrás de ez: ez zait…"},{"type":"gap","q":"Aneri musika gustatzen ___.","es":"A Ane le gusta la música.","a":["zaio"],"hint":"A él / ella, una cosa: zaio."},{"type":"gap","q":"Guri mendia gustatzen ___.","es":"A nosotros nos gusta el monte.","a":["zaigu"],"hint":"A nosotros, una cosa: zaigu."},{"type":"choice","q":"«Me gustan los perros»","options":["Txakurrak gustatzen zaizkit.","Txakurrak gustatzen zait.","Txakurrak gustatzen dut."],"a":0,"why":"Lo que gusta es plural → zaizkit."},{"type":"choice","q":"«A Mikel le gusta el café»","options":["Mikeli kafea gustatzen zaio.","Mikelek kafea gustatzen zaio.","Mikel kafea gustatzen da."],"a":0,"why":"La persona va en dativo (-i), no con -k."},{"type":"choice","q":"«No me gusta»","options":["Ez zait gustatzen.","Ez gustatzen zait.","Gustatzen ez zait."],"a":0,"why":"ez + auxiliar delante, gustatzen al final."},{"type":"choice","q":"«A mí también» (respondiendo sobre gustos)","options":["Niri ere bai.","Ni ere bai.","Nik ere bai."],"a":0,"why":"Con gustatu, la persona va en dativo: niri."},{"type":"choice","q":"«Me gusta leer»","options":["Irakurtzea gustatzen zait.","Irakurri gustatzen zait.","Irakurtzen gustatzen zait."],"a":0,"why":"Actividad que gusta: forma -tzea."},{"type":"order","words":["zait","Kafea","gustatzen"],"a":["Kafea gustatzen zait"],"es":"Me gusta el café.","hint":"Lo que gusta + gustatzen + auxiliar."},{"type":"order","words":["futbola","Ez","gustatzen","zait"],"a":["Ez zait futbola gustatzen"],"es":"No me gusta el fútbol.","hint":"ez + auxiliar, lo que gusta, gustatzen al final."},{"type":"match","pairs":[["zait","a mí"],["zaizu","a ti"],["zaio","a él / ella"],["zaigu","a nosotros"],["zaizue","a vosotros"],["zaie","a ellos"]]}],"create":{"prompt":"Escribe 5 frases sobre tus gustos: tres cosas que te gustan (una en plural), una que no te gusta, y qué le gusta a alguien de tu familia.","focus":"gustatzen + zait/zaizkit…, dativo (niri, Mikeli), -tzea para actividades"},"links":{"verbs":["nni-pres"],"cases":["dat"],"themes":["aisialdia","janaria"]}},"a1-13":{"id":"a1-13","lvl":"A1","n":13,"title":"Zer egin duzu?","es":"El pretérito perfecto: izan o ukan","goal":"Contar lo que has hecho hoy o recientemente.","explain":[{"h":"Antes de empezar","p":"En la lección 11 aprendiste el sistema de dos piezas (verbo + auxiliar) para hablar de hábitos. Hoy usas el mismo sistema para el pasado reciente: «he comido», «he ido». La gran ventaja es que el auxiliar ya lo conoces: es el mismo **naiz / dut** del presente. Solo cambia la primera pieza."},{"h":"La forma","p":"Verbo en su forma de diccionario (participio) + auxiliar en presente: **Kafea edan dut** (he bebido café), **Bilbora joan naiz** (he ido a Bilbao), **Zer egin duzu?** (¿qué has hecho?). Compara: **edaten dut** = bebo (hábito) · **edan dut** = he bebido."},{"h":"¿naiz o dut? La regla de siempre","p":"Sin objeto → **izan** (naiz, zara, da…). Con objeto → **ukan** (dut, duzu, du…) y el sujeto con **-k**. Si el objeto es plural, **ditut, dituzu…**","table":{"head":["Con izan (sin objeto)","Con ukan (con objeto)"],"rows":[["joan naiz (he ido)","egin dut (he hecho)"],["etorri naiz (he venido)","ikusi dut (he visto)"],["iritsi naiz (he llegado)","jan dut (he comido)"],["jaiki naiz (me he levantado)","erosi dut (he comprado)"],["geratu naiz (me he quedado)","irakurri dut (he leído)"],["jaio naiz (he nacido)","lan egin dut (he trabajado)"]]}},{"h":"Cuándo se usa","p":"Para lo ocurrido **hoy** o en un periodo que aún no ha terminado: **gaur** (hoy), **gaur goizean** (esta mañana), **aste honetan** (esta semana). Para ayer o antes se usa otro pasado, el de la lección 16."},{"h":"Negar y preguntar","p":"**ez + auxiliar** delante, el verbo al final: **Ez dut kafea edan**, **Ez naiz joan**. Con **ezer** (nada): **Ez dut ezer jan** (no he comido nada). Preguntas: **Zer egin duzu?**, **Nora joan zara?**"},{"h":"Paso a paso: «Esta mañana he comprado dos libros»","p":"1) Verbo: **erosi**. 2) ¿Objeto? Sí, dos libros, y es plural → **ditut**. 3) Orden: tiempo + objeto + verbo + auxiliar → **Gaur goizean bi liburu erosi ditut**."},{"h":"Errores típicos","p":"*Jan naiz* → **Jan dut** (comer tiene objeto). *Etorri dut* → **Etorri naiz**. *Ez filma ikusi dut* → **Ez dut filma ikusi**. *Bi liburu erosi dut* → **ditut** (objeto plural)."},{"h":"Resumen","p":"Perfecto = participio + **naiz / dut**. Sin objeto: joan naiz. Con objeto: ikusi dut (plural: ditut). Para hoy y periodos abiertos. Negación: **ez dut … ikusi**."}],"examples":[["Gaur goizean kafea edan dut.","Esta mañana he bebido café."],["Bilbora joan naiz.","He ido a Bilbao."],["Zer egin duzu?","¿Qué has hecho?"],["Liburu bat irakurri dut.","He leído un libro."],["Ane berandu iritsi da.","Ane ha llegado tarde."],["Ez dut ezer jan.","No he comido nada."],["Bi liburu erosi ditut.","He comprado dos libros."]],"dialog":{"title":"Al final del día","lines":[["Miren","Kaixo! Zer egin duzu gaur?","¡Hola! ¿Qué has hecho hoy?"],["Jon","Goizean lan egin dut, eta gero mendira joan naiz.","Por la mañana he trabajado, y luego he ido al monte."],["Miren","Oso ondo! Eta bazkaldu duzu?","¡Muy bien! ¿Y has comido?"],["Jon","Bai, ogitarteko bat jan dut mendian. Eta zuk?","Sí, me he comido un bocadillo en el monte. ¿Y tú?"],["Miren","Nik gaur ez dut lan egin. Etxean geratu naiz eta liburu bat irakurri dut.","Yo hoy no he trabajado. Me he quedado en casa y he leído un libro."]]},"exercises":[{"type":"gap","q":"Gaur kafea edan ___.","es":"Hoy he bebido café.","a":["dut"],"hint":"Beber tiene objeto → dut."},{"type":"gap","q":"Bilbora joan ___.","es":"He ido a Bilbao.","a":["naiz"],"hint":"Ir no tiene objeto → naiz."},{"type":"gap","q":"Zer egin ___?","es":"¿Qué has hecho?","a":["duzu"],"hint":"Hacer tiene objeto; tú → duzu."},{"type":"gap","q":"Ane berandu iritsi ___.","es":"Ane ha llegado tarde.","a":["da"],"hint":"Llegar no tiene objeto; ella → da."},{"type":"gap","q":"Bi liburu erosi ___.","es":"He comprado dos libros.","a":["ditut"],"hint":"Objeto plural, yo → ditut."},{"type":"gap","q":"Gu etxean geratu ___.","es":"Nos hemos quedado en casa.","a":["gara"],"hint":"Quedarse no tiene objeto; nosotros → gara."},{"type":"choice","q":"«He comido»","options":["Jan dut.","Jan naiz.","Jaten dut."],"a":0,"why":"Comer tiene objeto → dut. Jaten dut es «como» (hábito)."},{"type":"choice","q":"«Hemos venido»","options":["Etorri gara.","Etorri dugu.","Etortzen gara."],"a":0,"why":"Venir no tiene objeto → gara."},{"type":"choice","q":"«No he visto la película»","options":["Ez dut filma ikusi.","Ez filma ikusi dut.","Ez ikusi dut filma."],"a":0,"why":"ez + auxiliar, objeto, verbo al final."},{"type":"choice","q":"«¿Adónde has ido?»","options":["Nora joan zara?","Nora joan duzu?","Nora joaten zara?"],"a":0,"why":"Ir → izan (zara). Joaten zara es «vas» (hábito)."},{"type":"choice","q":"¿Cuál significa «he bebido café»?","options":["Kafea edan dut.","Kafea edaten dut.","Kafea edango dut."],"a":0,"why":"Participio (edan) + dut = he bebido."},{"type":"order","words":["dut","Gaur","kafea","edan"],"a":["Gaur kafea edan dut"],"es":"Hoy he bebido café.","hint":"Tiempo + objeto + verbo + auxiliar."},{"type":"order","words":["naiz","Mendira","joan"],"a":["Mendira joan naiz"],"es":"He ido al monte.","hint":"Lugar + verbo + auxiliar."},{"type":"order","words":["dut","Ez","ezer","jan"],"a":["Ez dut ezer jan"],"es":"No he comido nada.","hint":"ez + auxiliar delante, el verbo al final."},{"type":"match","pairs":[["joan naiz","he ido"],["etorri naiz","he venido"],["ikusi dut","he visto"],["egin dut","he hecho"],["jan dut","he comido"],["iritsi naiz","he llegado"]]}],"create":{"prompt":"Cuenta en 5 frases qué has hecho hoy: a qué hora te has levantado, qué has comido, adónde has ido y algo que no has hecho.","focus":"pretérito perfecto: participio + naiz (sin objeto) o dut/ditut (con objeto)"},"links":{"verbs":["nor-pres","nn-pres-3"],"cases":[],"themes":["aditzak","denbora"]}},"a1-14":{"id":"a1-14","lvl":"A1","n":14,"title":"Biharko planak","es":"El futuro con -ko / -go","goal":"Hablar de planes: qué harás mañana, el fin de semana o el año que viene.","explain":[{"h":"Antes de empezar","p":"Ya sabes el presente habitual (edaten dut) y el perfecto (edan dut). El futuro es el tercer miembro de la familia y se forma igual: una pieza que lleva el significado + el auxiliar de siempre. Con esto completas el sistema básico de tiempos con naiz y dut."},{"h":"La forma","p":"Participio + **-ko** + auxiliar en presente: **etorri → etorriko naiz** (vendré), **ikusi → ikusiko dut** (veré). Si el participio acaba en **-n**, se usa **-go**: **egin → egingo dut** (haré), **joan → joango naiz** (iré), **jan → jango dut** (comeré), **egon → egongo naiz** (estaré).","table":{"head":["Participio","Futuro","Español"],"rows":[["etorri","etorri**ko** naiz","vendré"],["ikusi","ikusi**ko** dut","veré"],["erosi","erosi**ko** dut","compraré"],["egin","egin**go** dut","haré"],["joan","joan**go** naiz","iré"],["jan","jan**go** dut","comeré"]]}},{"h":"Toda la familia junta","p":"**edaten dut** (bebo) · **edan dut** (he bebido) · **edango dut** (beberé). El auxiliar no cambia; solo cambia la forma del verbo principal. La elección entre naiz y dut sigue la regla de siempre: sin objeto, naiz; con objeto, dut."},{"h":"Expresiones de futuro","p":"**bihar** (mañana), **etzi** (pasado mañana), **gero** (luego), **gaur arratsaldean** (esta tarde), **datorren astean** (la semana que viene), **datorren urtean** (el año que viene)."},{"h":"Paso a paso: «No compraré nada»","p":"1) Verbo: **erosi** → **erosiko**. 2) ¿Objeto? Sí (ezer) → **dut**. 3) Negativa: **ez dut** delante, el verbo al final → **Ez dut ezer erosiko**."},{"h":"Errores típicos","p":"*eginko* → **egingo** (acaba en -n). *Bihar joango dut* → **naiz**. *Ez erosiko dut* → **Ez dut erosiko**. *Bihar joan naiz* significa «mañana he ido»: para el futuro, **joango naiz**."},{"h":"Resumen","p":"Futuro = participio + **-ko** (o **-go** tras -n) + naiz / dut. etorriko naiz, ikusiko dut, egingo dut, joango naiz. Negación: **ez dut … erosiko**."}],"examples":[["Bihar Bilbora joango naiz.","Mañana iré a Bilbao."],["Gero etxean egongo naiz.","Luego estaré en casa."],["Datorren astean etxe berria ikusiko dugu.","La semana que viene veremos la casa nueva."],["Bihar ez dut lan egingo.","Mañana no trabajaré."],["Zer egingo duzu asteburuan?","¿Qué harás el fin de semana?"],["Ane etzi etorriko da.","Ane vendrá pasado mañana."]],"dialog":{"title":"Planes para el fin de semana","lines":[["Iker","Zer egingo duzu asteburuan?","¿Qué harás el fin de semana?"],["Nerea","Larunbatean mendira joango naiz lagunekin.","El sábado iré al monte con los amigos."],["Iker","Eta igandean?","¿Y el domingo?"],["Nerea","Igandean etxean geratuko naiz. Liburu bat irakurriko dut.","El domingo me quedaré en casa. Leeré un libro."],["Iker","Ni ere mendira joango naiz larunbatean!","¡Yo también iré al monte el sábado!"],["Nerea","Primeran! Elkarrekin joango gara.","¡Estupendo! Iremos juntos."]]},"exercises":[{"type":"gap","q":"Bihar Bilbora joan___ naiz.","es":"Mañana iré a Bilbao.","a":["go"],"hint":"joan acaba en -n → -go."},{"type":"gap","q":"Etxe berria ikusi___ dugu.","es":"Veremos la casa nueva.","a":["ko"],"hint":"ikusi no acaba en -n → -ko."},{"type":"gap","q":"Ane etzi etorri___ da.","es":"Ane vendrá pasado mañana.","a":["ko"],"hint":"etorri → etorriko."},{"type":"gap","q":"Zer egingo ___?","es":"¿Qué harás?","a":["duzu"],"hint":"Hacer tiene objeto; tú → duzu."},{"type":"gap","q":"Bihar ez ___ lan egingo.","es":"Mañana no trabajaré.","a":["dut"],"hint":"lan egin usa ukan; yo → dut, detrás de ez."},{"type":"gap","q":"Larunbatean mendira joango ___.","es":"El sábado iremos al monte.","a":["gara"],"hint":"Ir → izan; nosotros → gara."},{"type":"choice","q":"Futuro de egin (hacer):","options":["egingo","eginko","egintzeko"],"a":0,"why":"Acaba en -n → -go."},{"type":"choice","q":"Futuro de ikusi (ver):","options":["ikusiko","ikusigo","ikustenko"],"a":0,"why":"No acaba en -n → -ko."},{"type":"choice","q":"«Iré mañana»","options":["Bihar joango naiz.","Bihar joango dut.","Bihar joan naiz."],"a":0,"why":"Ir → naiz. Joan naiz es «he ido»."},{"type":"choice","q":"«No compraré nada»","options":["Ez dut ezer erosiko.","Ez erosiko dut ezer.","Ez naiz ezer erosiko."],"a":0,"why":"Comprar → dut; ez + auxiliar delante."},{"type":"choice","q":"«¿Qué harás?»","options":["Zer egingo duzu?","Zer egin duzu?","Zer egiten duzu?"],"a":0,"why":"egingo = futuro. egin duzu = has hecho; egiten duzu = haces."},{"type":"order","words":["naiz","Bihar","joango","Bilbora"],"a":["Bihar Bilbora joango naiz"],"es":"Mañana iré a Bilbao.","hint":"Tiempo + lugar + verbo + auxiliar."},{"type":"order","words":["dut","Ez","erosiko","ezer"],"a":["Ez dut ezer erosiko"],"es":"No compraré nada.","hint":"ez + auxiliar delante, el verbo al final."},{"type":"order","words":["duzu","Zer","egingo"],"a":["Zer egingo duzu"],"es":"¿Qué harás?","hint":"Interrogativa + verbo + auxiliar."},{"type":"match","pairs":[["joango naiz","iré"],["etorriko naiz","vendré"],["ikusiko dut","veré"],["egingo dut","haré"],["jango dut","comeré"],["egongo naiz","estaré"]]}],"create":{"prompt":"Escribe tus planes para el próximo fin de semana en 5 frases: adónde irás, con quién, qué harás y algo que no harás.","focus":"futuro: participio + -ko/-go + naiz o dut"},"links":{"verbs":["nor-pres","nn-pres-3"],"cases":[],"themes":["denbora","aisialdia"]}},"a1-15":{"id":"a1-15","lvl":"A1","n":15,"title":"Erosketak","es":"De compras: precios, -rekin y -entzat","goal":"Comprar en una tienda o mercado, preguntar precios y decir para quién es algo.","explain":[{"h":"Antes de empezar","p":"Esta lección es muy práctica: con unas pocas frases hechas puedes comprar en cualquier tienda. Además aprendes dos terminaciones nuevas, «con» y «para», que se pegan al final de la palabra como ya sabes hacer."},{"h":"Pedir y preguntar","p":"**… nahi dut** (quiero…): **Ogi bat nahi dut** (quiero un pan). Más cortés: **… nahi nuke** (quisiera). **Zenbat da?** (¿cuánto es?) o **Zenbat balio du?** (¿cuánto cuesta?); si son varias cosas, **Zenbat balio dute?** En la tienda oirás **Zer nahi duzu?** (¿qué quieres?), **Besterik?** (¿algo más?) y **Hemen duzu** (aquí tienes). Para terminar: **Ez, besterik ez** (no, nada más)."},{"h":"Precios","p":"El número va delante y **euro** sin artículo: **bost euro** (cinco euros), **euro bat** (un euro). Respuesta: **Hiru euro dira** (son tres euros). Para «y medio»: **hiru euro eta erdi**. Cantidades: **kilo bat sagar** (un kilo de manzanas), **litro bat esne** (un litro de leche)."},{"h":"«Con»: -rekin","p":"Singular **-arekin**, plural **-ekin**: **lagunarekin** (con el amigo), **lagunekin** (con los amigos). Nombres propios: **Mikelekin**, **Anerekin**. Si la palabra acaba en -a, solo **-rekin**: **amarekin** (con la madre). Con cosas también: **kafea esnearekin** (café con leche)."},{"h":"«Para»: -rentzat","p":"Singular **-arentzat**, plural **-entzat**: **lagunarentzat** (para el amigo), **umeentzat** (para los niños). Nombres propios: **Mikelentzat**, **Anerentzat**. Acabados en -a: **amarentzat**. Pronombres: **niretzat** (para mí), **zuretzat** (para ti): **Hau zuretzat da!** (¡esto es para ti!)."},{"h":"Paso a paso: «Este regalo es para mi madre»","p":"1) **Opari hau** (este regalo). 2) Para quién: **nire ama** + -rentzat → **nire amarentzat**. 3) Verbo: **da**. 4) **Opari hau nire amarentzat da**."},{"h":"Errores típicos","p":"*Bost euroak dira* → **Bost euro dira** (tras número, sin artículo). *Kafe bat nahi naiz* → **nahi dut**. *Lagunarekin* para «con los amigos» → **lagunekin**. *Niri da* para «es para mí» → **niretzat da**."},{"h":"Resumen","p":"**… nahi dut / nahi nuke**, **Zenbat da? / Zenbat balio du?**, **Besterik?**. Precios: número + euro. **-arekin / -ekin** (con), **-arentzat / -entzat** (para), **niretzat, zuretzat**."}],"examples":[["Zenbat da?","¿Cuánto es?"],["Hiru euro dira.","Son tres euros."],["Ogi bat nahi dut, mesedez.","Quiero un pan, por favor."],["Kafea esnearekin.","Café con leche."],["Opari hau amarentzat da.","Este regalo es para la madre."],["Lagunarekin nator.","Vengo con el amigo."],["Hau zuretzat da!","¡Esto es para ti!"]],"dialog":{"title":"En el mercado","lines":[["Dendaria","Egun on! Zer nahi duzu?","¡Buenos días! ¿Qué quieres?"],["Ane","Egun on! Kilo bat sagar nahi dut, mesedez.","¡Buenos días! Quiero un kilo de manzanas, por favor."],["Dendaria","Hemen duzu. Besterik?","Aquí tienes. ¿Algo más?"],["Ane","Bai, ogi bat ere bai. Zenbat da?","Sí, también un pan. ¿Cuánto es?"],["Dendaria","Hiru euro eta erdi.","Tres euros y medio."],["Ane","Tori. Eskerrik asko!","Toma. ¡Muchas gracias!"],["Dendaria","Zuri! Agur!","¡A ti! ¡Adiós!"]]},"exercises":[{"type":"gap","q":"Ogi bat nahi ___.","es":"Quiero un pan.","a":["dut"],"hint":"Querer: nahi dut."},{"type":"gap","q":"Zenbat ___?","es":"¿Cuánto es?","a":["da"],"hint":"¿Cuánto es? = Zenbat da?"},{"type":"gap","q":"Kafea esne___.","es":"Café con leche.","a":["arekin"],"hint":"Con, singular: -arekin."},{"type":"gap","q":"Opari hau ama___ da.","es":"Este regalo es para la madre.","a":["rentzat"],"hint":"Acabado en -a: solo -rentzat."},{"type":"gap","q":"Mikel___ nator.","es":"Vengo con Mikel.","a":["ekin"],"hint":"Nombre propio en consonante: -ekin."},{"type":"gap","q":"Hau zu___ da!","es":"¡Esto es para ti!","a":["retzat"],"hint":"Para mí = niretzat; para ti = zuretzat."},{"type":"choice","q":"«¿Cuánto cuesta?»","options":["Zenbat balio du?","Zenbat da balio?","Zer balio du?"],"a":0,"why":"Pregunta fija: Zenbat balio du?"},{"type":"choice","q":"«Quiero un café»","options":["Kafe bat nahi dut.","Kafe bat nahi naiz.","Kafea bat nahi dut."],"a":0,"why":"nahi dut, y con bat el nombre va sin artículo."},{"type":"choice","q":"«Para mí»","options":["niretzat","nirekin","niri"],"a":0,"why":"-entzat = para. nirekin = conmigo; niri = a mí."},{"type":"choice","q":"«Con los amigos»","options":["lagunekin","lagunarekin","lagunentzat"],"a":0,"why":"Plural: -ekin. lagunarekin = con el amigo."},{"type":"choice","q":"«Son cinco euros»","options":["Bost euro dira.","Bost euroak dira.","Euro bost dira."],"a":0,"why":"Número delante y nombre sin artículo."},{"type":"order","words":["nahi","Ogi","dut","bat"],"a":["Ogi bat nahi dut"],"es":"Quiero un pan.","hint":"Lo que quieres + nahi dut."},{"type":"order","words":["da","Opari","amarentzat","hau"],"a":["Opari hau amarentzat da"],"es":"Este regalo es para la madre.","hint":"Opari hau + para quién + da."},{"type":"order","words":["balio","Zenbat","du"],"a":["Zenbat balio du"],"es":"¿Cuánto cuesta?","hint":"Zenbat + balio du."},{"type":"match","pairs":[["nahi dut","quiero"],["Zenbat da?","¿cuánto es?"],["Besterik?","¿algo más?"],["Hemen duzu","aquí tienes"],["merke","barato"],["garesti","caro"]]}],"create":{"prompt":"Escribe un pequeño diálogo en una tienda (5-6 líneas): saluda, pide dos cosas, pregunta el precio y di para quién es una de ellas.","focus":"nahi dut, Zenbat da?, precios, -arekin/-ekin, -arentzat/-entzat"},"links":{"verbs":[],"cases":["soz","des"],"themes":["erosketak","janaria"]}},"a1-16":{"id":"a1-16","lvl":"A1","n":16,"title":"Atzo","es":"El pasado: nintzen, nuen","goal":"Contar lo que hiciste ayer, el fin de semana pasado o el año pasado.","explain":[{"h":"Antes de empezar","p":"Última lección del A1. Ya sabes decir «he ido» (joan naiz) para hoy. Para ayer o antes, el euskera usa otro tiempo: el verbo principal no cambia, pero el auxiliar pasa a pasado. Lo bueno es que los auxiliares en pasado siguen las mismas pistas de siempre."},{"h":"La forma","p":"Participio + auxiliar en **pasado**. Sin objeto, **izan** en pasado. Con objeto, **ukan** en pasado (y el sujeto con -k).","table":{"head":["Persona","Sin objeto (izan)","Con objeto (ukan)","Objeto plural"],"rows":[["ni / nik","{nor:nintzen}","{nork:nuen}","{nork:nituen}"],["zu / zuk","{nor:zinen}","{nork:zenuen}","{nork:zenituen}"],["hura / hark","{nor:zen}","{nork:zuen}","{nork:zituen}"],["gu / guk","{nor:ginen}","{nork:genuen}","{nork:genituen}"],["zuek","{nor:zineten}","{nork:zenuten}","{nork:zenituzten}"],["haiek","{nor:ziren}","{nork:zuten}","{nork:zituzten}"]]}},{"h":"Las pistas","p":"Se mantienen las iniciales: **n-** yo, **z-** tú, **g-** nosotros. En pasado la 3.ª persona también empieza por **z-** (zen, zuen). Y casi todo termina en **-n**. **Atzo Bilbora joan nintzen** (ayer fui a Bilbao). **Atzo film bat ikusi nuen** (ayer vi una película)."},{"h":"Hoy o ayer","p":"**gaur** (hoy) → presente: **Gaur joan naiz** (hoy he ido). **atzo** (ayer) → pasado: **Atzo joan nintzen** (ayer fui). Otras expresiones del pasado: **joan den astean** (la semana pasada), **iaz** (el año pasado), **duela bi egun** (hace dos días)."},{"h":"Negar y preguntar","p":"Igual que siempre: **Ez nintzen joan** (no fui), **Ez nuen ikusi** (no lo vi). **Zer egin zenuen atzo?** (¿qué hiciste ayer?), **Nora joan zinen?** (¿adónde fuiste?)."},{"h":"Paso a paso: «La semana pasada vimos a nuestros amigos»","p":"1) Verbo: **ikusi**. 2) ¿Objeto? Sí, y plural (gure lagunak) → ukan pasado, «nosotros», plural → **genituen**. 3) **Joan den astean gure lagunak ikusi genituen**."},{"h":"Errores típicos","p":"*Atzo joan naiz* → **joan nintzen** (atzo pide pasado). *Atzo arraina jan nintzen* → **jan nuen** (comer tiene objeto). *Gurasoak ikusi nuen* → **nituen** (objeto plural). *Ez ikusi nuen* → **Ez nuen ikusi**."},{"h":"Resumen","p":"Pasado = participio + **nintzen, zinen, zen, ginen, zineten, ziren** (sin objeto) o **nuen, zenuen, zuen, genuen, zenuten, zuten** (con objeto; plural nituen…). Gaur → naiz/dut; atzo → nintzen/nuen. Con esto has completado el A1. Zorionak!"}],"examples":[["Atzo Bilbora joan nintzen.","Ayer fui a Bilbao."],["Atzo film bat ikusi nuen.","Ayer vi una película."],["Joan den astean Gasteizera joan ginen.","La semana pasada fuimos a Vitoria-Gasteiz."],["Anek liburu bat erosi zuen.","Ane compró un libro."],["Ez nuen ezer jan.","No comí nada."],["Zer egin zenuen atzo?","¿Qué hiciste ayer?"],["Haiek berandu iritsi ziren.","Ellos llegaron tarde."]],"dialog":{"title":"El lunes, en el trabajo","lines":[["Jon","Zer egin zenuen asteburuan?","¿Qué hiciste el fin de semana?"],["Ane","Larunbatean mendira joan nintzen lagunekin.","El sábado fui al monte con los amigos."],["Jon","Eta igandean?","¿Y el domingo?"],["Ane","Igandean etxean geratu nintzen eta film bat ikusi nuen. Eta zuk?","El domingo me quedé en casa y vi una película. ¿Y tú?"],["Jon","Ni Bilbora joan nintzen. Gurasoak ikusi nituen.","Yo fui a Bilbao. Vi a mis padres."],["Ane","Oso ondo!","¡Muy bien!"]]},"exercises":[{"type":"gap","q":"Atzo Bilbora joan ___.","es":"Ayer fui a Bilbao.","a":["nintzen"],"hint":"Ir → izan; pasado, yo → nintzen."},{"type":"gap","q":"Atzo film bat ikusi ___.","es":"Ayer vi una película.","a":["nuen"],"hint":"Ver → ukan; pasado, yo → nuen."},{"type":"gap","q":"Zer egin ___ atzo?","es":"¿Qué hiciste ayer?","a":["zenuen"],"hint":"Hacer → ukan; pasado, tú → zenuen."},{"type":"gap","q":"Haiek berandu iritsi ___.","es":"Ellos llegaron tarde.","a":["ziren"],"hint":"Llegar → izan; pasado, ellos → ziren."},{"type":"gap","q":"Gurasoak ikusi ___.","es":"Vi a mis padres.","a":["nituen"],"hint":"Objeto plural, yo → nituen."},{"type":"gap","q":"Anek liburu bat erosi ___.","es":"Ane compró un libro.","a":["zuen"],"hint":"Comprar → ukan; pasado, ella → zuen."},{"type":"choice","q":"«Ayer comí pescado»","options":["Atzo arraina jan nuen.","Atzo arraina jan dut.","Atzo arraina jan nintzen."],"a":0,"why":"atzo pide pasado; comer tiene objeto → nuen."},{"type":"choice","q":"«Hoy he ido»","options":["Gaur joan naiz.","Gaur joan nintzen.","Gaur joan nuen."],"a":0,"why":"gaur pide el perfecto con presente."},{"type":"choice","q":"«Vinimos tarde»","options":["Berandu etorri ginen.","Berandu etorri genuen.","Berandu etorri gara."],"a":0,"why":"Venir → izan; nosotros, pasado → ginen. Etorri gara es «hemos venido»."},{"type":"choice","q":"«No lo vi»","options":["Ez nuen ikusi.","Ez nintzen ikusi.","Ez ikusi nuen."],"a":0,"why":"Ver → ukan (nuen); ez + auxiliar delante."},{"type":"choice","q":"«La semana pasada»","options":["joan den astean","datorren astean","aste honetan"],"a":0,"why":"datorren astean = la semana que viene; aste honetan = esta semana."},{"type":"order","words":["nintzen","Atzo","joan","Bilbora"],"a":["Atzo Bilbora joan nintzen"],"es":"Ayer fui a Bilbao.","hint":"Tiempo + lugar + verbo + auxiliar."},{"type":"order","words":["nuen","Ez","ikusi"],"a":["Ez nuen ikusi"],"es":"No lo vi.","hint":"ez + auxiliar + verbo."},{"type":"order","words":["zenuen","Zer","atzo","egin"],"a":["Zer egin zenuen atzo","Atzo zer egin zenuen"],"es":"¿Qué hiciste ayer?","hint":"La interrogativa va justo antes del verbo."},{"type":"match","pairs":[["nintzen","yo (sin objeto)"],["nuen","yo (con objeto)"],["zen","él/ella (sin objeto)"],["zuen","él/ella (con objeto)"],["ginen","nosotros (sin objeto)"],["genuen","nosotros (con objeto)"]]}],"create":{"prompt":"Cuenta en 5 o 6 frases qué hiciste el fin de semana pasado: adónde fuiste, con quién, qué comiste, qué viste y algo que no hiciste.","focus":"pasado: participio + nintzen/zinen/zen… o nuen/zenuen/zuen… (plural nituen…)"},"links":{"verbs":["nor-past","nn-past-3"],"cases":[],"themes":["denbora","aditzak"]}},"a2-01":{"id":"a2-01","lvl":"A2","n":1,"title":"Ordutegiak","es":"Horas y rutina: zer ordutan?","goal":"Decir a qué hora haces las cosas, con qué frecuencia y de qué hora a qué hora.","explain":[{"h":"Antes de empezar","p":"Bienvenido al A2. En el A1 aprendiste a decir qué hora es (**hirurak dira**). Ahora vas a decir **a qué hora** pasa algo (a las tres), con qué frecuencia y en qué horario. Todo se construye con los casos de lugar que ya conoces: el tiempo, en euskera, se trata como un lugar."},{"h":"«A las…»: la hora con -etan","p":"Se toma la hora y se añade la terminación de «en» en plural, **-etan**: **zazpiak → zazpietan** (a las siete). La una es singular: **ordu bata → ordu batean** (a la una). La pregunta es **Zer ordutan?** (¿a qué hora?).","table":{"head":["Qué hora es","A qué hora"],"rows":[["ordu bata","ordu bat**ean**"],["biak","bi**etan**"],["hirurak","hirur**etan**"],["laurak","laur**etan**"],["bostak","bost**etan**"],["hamarrak","hamarr**etan**"],["hamabiak","hamabi**etan**"]]}},{"h":"Y media, y cuarto, menos cuarto","p":"**zazpi eta erdietan** (a las siete y media), **zortzi eta laurdenetan** (a las ocho y cuarto), **bederatziak laurden gutxitan** (a las nueve menos cuarto). Para concretar la parte del día: **goizeko zazpietan** (a las siete de la mañana), **arratsaldeko bostetan** (a las cinco de la tarde), **gaueko hamarretan** (a las diez de la noche)."},{"h":"De… a…","p":"Con los casos NONDIK y NORA: **zortzietatik hiruretara** (de ocho a tres), **astelehenetik ostiralera** (de lunes a viernes). **Zortzietatik hiruretara lan egiten dut** (trabajo de ocho a tres)."},{"h":"Los días: una vez o siempre","p":"**astelehenean** (el lunes, una vez) frente a **astelehenetan** (los lunes, cada semana). Frecuencia: **egunero** (cada día), **astean behin** (una vez a la semana), **astean bitan** (dos veces a la semana), **hilean behin** (una vez al mes), **gutxitan** (pocas veces)."},{"h":"Paso a paso: «Los martes voy a la piscina a las siete de la tarde»","p":"1) Cuándo: **asteartetan** (los martes). 2) A qué hora: **arratsaldeko zazpietan**. 3) Adónde: **igerilekura**. 4) Verbo habitual: **joaten naiz**. → **Asteartetan arratsaldeko zazpietan igerilekura joaten naiz**."},{"h":"Errores típicos","p":"*Zazpiak jaikitzen naiz* → **zazpietan** (para «a las» hace falta -etan). *Ordu bietan* para «a la una» → **ordu batean**. *Astelehenean* para «los lunes» (cada semana) → **astelehenetan**. *Zortzietatik hirura* → **hiruretara**."},{"h":"Resumen","p":"**Zer ordutan?** → hora + **-etan** (ordu batean, zazpietan). **eta erdietan**, **eta laurdenetan**, **laurden gutxitan**. **-etatik … -etara** (de… a…). **astelehenean** (una vez) / **astelehenetan** (siempre). **astean behin / bitan**."}],"examples":[["Zer ordutan jaikitzen zara?","¿A qué hora te levantas?"],["Zazpietan jaikitzen naiz.","Me levanto a las siete."],["Ordu batean bazkaltzen dut.","Como a la una."],["Zortzietatik hiruretara lan egiten dut.","Trabajo de ocho a tres."],["Astelehenetan igerilekura joaten naiz.","Los lunes voy a la piscina."],["Astean bitan euskara ikasten dut.","Estudio euskera dos veces a la semana."],["Gaueko hamarretan afaltzen dugu.","Cenamos a las diez de la noche."]],"dialog":{"title":"Horarios","lines":[["Ane","Zer ordutan hasten zara lanean?","¿A qué hora empiezas a trabajar?"],["Mikel","Zortzietan. Zortzietatik hiruretara lan egiten dut.","A las ocho. Trabajo de ocho a tres."],["Ane","Eta arratsaldean?","¿Y por la tarde?"],["Mikel","Asteartetan eta ostegunetan igerilekura joaten naiz, sei eta erdietan.","Los martes y los jueves voy a la piscina, a las seis y media."],["Ane","Ni astean behin bakarrik joaten naiz, larunbatetan.","Yo solo voy una vez a la semana, los sábados."],["Mikel","Larunbat honetan elkarrekin joango gara?","¿Iremos juntos este sábado?"]]},"exercises":[{"type":"gap","q":"Zazpi___ jaikitzen naiz.","es":"Me levanto a las siete.","a":["etan"],"hint":"«A las…»: hora + -etan."},{"type":"gap","q":"Ordu bat___ bazkaltzen dut.","es":"Como a la una.","a":["ean"],"hint":"La una es singular: ordu batean."},{"type":"gap","q":"Zer ___ jaikitzen zara?","es":"¿A qué hora te levantas?","a":["ordutan"],"hint":"¿A qué hora? = Zer ordutan?"},{"type":"gap","q":"Zortzietatik hirur___ lan egiten dut.","es":"Trabajo de ocho a tres.","a":["etara"],"hint":"«hasta / a» con horas: -etara."},{"type":"gap","q":"Astean ___ euskara ikasten dut.","es":"Estudio euskera dos veces a la semana.","a":["bitan"],"hint":"una vez = behin · dos veces = bitan."},{"type":"choice","q":"«A las tres y media»","options":["hiru eta erdietan","hirurak eta erdi","hiruretan eta erdi"],"a":0,"why":"Hora + eta erdi + -etan. Hirurak eta erdi es «son las tres y media»."},{"type":"choice","q":"«Los lunes» (cada semana)","options":["astelehenetan","astelehenean","astelehenera"],"a":0,"why":"Plural -etan para lo que se repite; astelehenean es «el lunes»."},{"type":"choice","q":"«A las diez de la noche»","options":["gaueko hamarretan","gauean hamarrak","hamarretan gaua"],"a":0,"why":"Parte del día con -ko delante: gaueko hamarretan."},{"type":"choice","q":"«De lunes a viernes»","options":["astelehenetik ostiralera","astelehenean ostiralean","astelehenera ostiraletik"],"a":0,"why":"Desde = -tik; hasta = -ra."},{"type":"choice","q":"«Una vez al mes»","options":["hilean behin","hilabete bat","hilean bitan"],"a":0,"why":"behin = una vez; bitan = dos veces."},{"type":"order","words":["jaikitzen","Zazpietan","naiz"],"a":["Zazpietan jaikitzen naiz"],"es":"Me levanto a las siete.","hint":"Hora + verbo + auxiliar."},{"type":"order","words":["egiten","Zortzietatik","dut","lan","hiruretara"],"a":["Zortzietatik hiruretara lan egiten dut"],"es":"Trabajo de ocho a tres.","hint":"Desde + hasta + lan egiten dut."},{"type":"order","words":["joaten","Astelehenetan","naiz","igerilekura"],"a":["Astelehenetan igerilekura joaten naiz","Igerilekura astelehenetan joaten naiz"],"es":"Los lunes voy a la piscina.","hint":"Cuándo y adónde delante, verbo + auxiliar al final."},{"type":"match","pairs":[["egunero","cada día"],["astean behin","una vez a la semana"],["astean bitan","dos veces a la semana"],["hilean behin","una vez al mes"],["gutxitan","pocas veces"],["beti","siempre"]]}],"create":{"prompt":"Describe tu semana tipo en 5 o 6 frases, con horas concretas y frecuencias: a qué hora te levantas, tu horario de trabajo o estudio, qué haces ciertos días y cada cuánto.","focus":"hora + -etan, -etatik … -etara, días con -etan, frecuencia (astean behin…)"},"links":{"verbs":["nor-pres","nn-pres-3"],"cases":["ine","abl","adl"],"themes":["denbora","zenbakiak"]}},"a2-02":{"id":"a2-02","lvl":"A2","n":2,"title":"Ba al duzu?","es":"El partitivo -rik y las preguntas con al","goal":"Decir que no tienes o no hay algo, y preguntar si hay o si tienes algo.","explain":[{"h":"Antes de empezar","p":"En español decimos «no tengo dinero» o «¿hay pan?» sin artículo. El euskera tiene una terminación especial para estos casos: **-rik**, el partitivo. Aparece sobre todo en frases negativas y en preguntas. Es pequeña, pero muy frecuente: si la dominas, sonarás mucho más natural."},{"h":"Cuándo se usa -rik","p":"Sustituye al artículo (**-a / -ak**) en: 1) **frases negativas**: **Ez daukat dirurik** (no tengo dinero), **Ez dago ogirik** (no hay pan); 2) **preguntas** de sí o no sobre existencia o posesión: **Ba al dago ogirik?** (¿hay pan?). Compara: **Dirua daukat** (tengo dinero) / **Ez daukat dirurik** (no tengo dinero)."},{"h":"La forma","p":"**-rik** tras vocal y **-ik** tras consonante. Es igual en singular y plural.","table":{"head":["Palabra","Afirmativa","Negativa con partitivo"],"rows":[["diru (dinero)","dirua daukat","ez daukat diru**rik**"],["ogi (pan)","ogia dago","ez dago ogi**rik**"],["lan (trabajo)","lana daukat","ez daukat lan**ik**"],["arazo (problema)","arazo bat dago","ez dago arazo**rik**"],["denbora (tiempo)","denbora daukat","ez daukat denbora**rik**"]]}},{"h":"Preguntar con al","p":"En las preguntas de sí o no se puede añadir la partícula **al** delante del verbo, junto con **ba-**: **Ba al dago ogirik?** (¿hay pan?), **Ba al daukazu dirurik?** (¿tienes dinero?), **Etorriko al zara?** (¿vendrás?). Sin al, solo con la entonación, también es correcto: **Ogirik ba dago?**"},{"h":"Responder «sí» con ba-","p":"Para responder afirmativamente con el verbo solo, se le pega **ba-**: **Bai, badago** (sí, hay), **Bai, badaukat** (sí, tengo), **Badakit** (lo sé). Y la respuesta negativa: **Ez, ez dago** (no, no hay)."},{"h":"Paso a paso: «No tenemos tiempo»","p":"1) Afirmativa: **Denbora daukagu**. 2) Negativa: **ez + verbo** delante → **Ez daukagu**. 3) El nombre pierde el artículo y toma -rik: denbora → **denborarik**. 4) **Ez daukagu denborarik**."},{"h":"Errores típicos","p":"*Ez daukat dirua* → **Ez daukat dirurik**. *Ez dago ogia* → **Ez dago ogirik**. *lanrik* → **lanik** (tras consonante, -ik). *Bai, dago* como respuesta sola → **Bai, badago**."},{"h":"Resumen","p":"Negativas y preguntas de existencia: **-rik** (vocal) / **-ik** (consonante) en lugar del artículo. **Ba al dago …-rik?**, **Ba al daukazu …-rik?**. Respuesta afirmativa corta: **badago, badaukat, badakit**."}],"examples":[["Ez daukat dirurik.","No tengo dinero."],["Ez dago ogirik.","No hay pan."],["Ba al dago ogirik?","¿Hay pan?"],["Bai, badago.","Sí, hay."],["Ez dago arazorik.","No hay problema."],["Ba al daukazu denborarik?","¿Tienes tiempo?"],["Gaur ez daukat lanik.","Hoy no tengo trabajo."]],"dialog":{"title":"En la panadería","lines":[["Iker","Egun on! Ba al dago ogirik?","¡Buenos días! ¿Hay pan?"],["Dendaria","Bai, badago. Zenbat nahi duzu?","Sí, hay. ¿Cuánto quieres?"],["Iker","Bi barra, mesedez. Eta ba al dago esnerik?","Dos barras, por favor. ¿Y hay leche?"],["Dendaria","Ez, gaur ez dago esnerik. Barkatu.","No, hoy no hay leche. Perdona."],["Iker","Ez dago arazorik. Txartelez ordaindu nahi dut.","No hay problema. Quiero pagar con tarjeta."],["Dendaria","Ados, noski.","De acuerdo, claro."]]},"exercises":[{"type":"gap","q":"Ez daukat diru___.","es":"No tengo dinero.","a":["rik"],"hint":"Tras vocal: -rik."},{"type":"gap","q":"Gaur ez daukat lan___.","es":"Hoy no tengo trabajo.","a":["ik"],"hint":"Tras consonante: -ik."},{"type":"gap","q":"Ba ___ dago ogirik?","es":"¿Hay pan?","a":["al"],"hint":"Partícula de pregunta: ba + al."},{"type":"gap","q":"Bai, ___dago.","es":"Sí, hay.","a":["ba"],"hint":"Respuesta afirmativa con el verbo solo: ba- + verbo."},{"type":"gap","q":"Ez dago arazo___.","es":"No hay problema.","a":["rik"],"hint":"arazo acaba en vocal: -rik."},{"type":"choice","q":"«No hay pan»","options":["Ez dago ogirik.","Ez dago ogia.","Ez da ogirik."],"a":0,"why":"Negativa de existencia: dago + partitivo."},{"type":"choice","q":"«¿Tienes tiempo?»","options":["Ba al daukazu denborarik?","Ba al daukazu denbora?","Al daukazu denboraik?"],"a":0,"why":"Pregunta de posesión: ba al + verbo, y -rik tras vocal."},{"type":"choice","q":"«Sí, lo sé»","options":["Bai, badakit.","Bai, dakit.","Bai, ba dakit al."],"a":0,"why":"Respuesta afirmativa corta: ba- pegado al verbo."},{"type":"choice","q":"«Tengo dinero»","options":["Dirua daukat.","Dirurik daukat.","Ez daukat dirua."],"a":0,"why":"En afirmativa se usa el artículo, no el partitivo."},{"type":"choice","q":"Partitivo de lan (trabajo):","options":["lanik","lanrik","lanerik"],"a":0,"why":"Tras consonante: -ik."},{"type":"order","words":["daukat","Ez","dirurik"],"a":["Ez daukat dirurik"],"es":"No tengo dinero.","hint":"ez + verbo delante, el nombre con -rik detrás."},{"type":"order","words":["dago","Ba","ogirik","al"],"a":["Ba al dago ogirik"],"es":"¿Hay pan?","hint":"Ba al + verbo + nombre con -rik."},{"type":"order","words":["daukagu","Ez","denborarik"],"a":["Ez daukagu denborarik"],"es":"No tenemos tiempo.","hint":"ez + verbo + nombre con -rik."},{"type":"match","pairs":[["dirurik","dinero (en negativa)"],["ogirik","pan (en negativa)"],["lanik","trabajo (en negativa)"],["badago","sí hay"],["badakit","sí lo sé"],["Ba al dago?","¿hay?"]]}],"create":{"prompt":"Imagina que revisas tu cocina: escribe 5 frases sobre qué hay y qué no hay, y dos preguntas para tu compañero de piso (Ba al dago …-rik?).","focus":"partitivo -rik/-ik en negativas y preguntas, ba al, respuestas con ba-"},"links":{"verbs":["syn-pres-1","syn-pres-2"],"cases":[],"themes":["janaria","erosketak"]}},"a2-03":{"id":"a2-03","lvl":"A2","n":3,"title":"Nirekin, zuretzat","es":"Los pronombres declinados","goal":"Usar «conmigo, para ti, a ella, de nosotros…» con soltura.","explain":[{"h":"Antes de empezar","p":"Ya has ido viendo los pronombres con distintas terminaciones: **nik** (yo, con -k), **niri** (a mí), **nire** (mi), **niretzat** (para mí)… En esta lección los ordenas todos en una tabla. No hay nada nuevo que inventar: son los mismos casos que usas con los nombres, aplicados a ni, zu, hura, gu, zuek y haiek."},{"h":"La tabla completa","table":{"head":["","ni","zu","hura","gu","zuek","haiek"],"rows":[["NOR (sujeto sin objeto)","ni","zu","hura","gu","zuek","haiek"],["NORK (sujeto con objeto)","nik","zuk","hark","guk","zuek","haiek"],["NORI (a…)","niri","zuri","hari","guri","zuei","haiei"],["NOREN (de…)","nire","zure","haren","gure","zuen","haien"],["NOREKIN (con…)","nirekin","zurekin","harekin","gurekin","zuekin","haiekin"],["NORENTZAT (para…)","niretzat","zuretzat","harentzat","guretzat","zuentzat","haientzat"]]}},{"h":"El truco: todo sale de nire, zure…","p":"Fíjate en que **-rekin** y **-entzat** se construyen sobre el posesivo: **nire → nirekin, niretzat**; **zure → zurekin, zuretzat**; **gure → gurekin, guretzat**. Si recuerdas los posesivos, tienes media tabla hecha."},{"h":"hura y haren","p":"La tercera persona cambia de raíz: **hura** (él/ella, aquel) → **hark, hari, haren, harekin, harentzat**. En plural, **haiek → haiei, haien, haiekin, haientzat**. Recuerda también que, para «su» referido al sujeto de la frase, se usa **bere**: **Mikelek bere etxea saldu du** (Mikel ha vendido su propia casa)."},{"h":"Paso a paso: «¿Vienes conmigo?»","p":"1) «conmigo» = con + yo → **nirekin**. 2) venir, tú → **zatoz**. 3) La pregunta: **Nirekin zatoz?** O, más amable: **Nirekin etorriko zara?** (¿vendrás conmigo?)."},{"h":"Errores típicos","p":"*nikekin* o *nirekin* para «yo con objeto» → el sujeto es **nik**; «conmigo» es **nirekin**. *Ni gustatzen zait* → **Niri gustatzen zait**. *hurarekin* → **harekin**. *Zuek* para «a vosotros» → **zuei**."},{"h":"Resumen","p":"Seis casos × seis personas. -rekin y -entzat salen del posesivo (nirekin, niretzat). La 3.ª persona usa la raíz **har-** (hark, hari, harekin) y en plural **haie-** (haiei, haiekin)."}],"examples":[["Nirekin etorriko zara?","¿Vendrás conmigo?"],["Opari hau zuretzat da.","Este regalo es para ti."],["Hari ez zaio gustatzen.","A él no le gusta."],["Gurekin bizi da.","Vive con nosotros."],["Haien etxea handia da.","Su casa es grande."],["Liburua harentzat da.","El libro es para él."],["Zuei gustatzen zaizue?","¿Os gusta a vosotros?"]],"dialog":{"title":"Una invitación","lines":[["Nerea","Gaur zinemara noa. Nirekin etorriko zara?","Hoy voy al cine. ¿Vendrás conmigo?"],["Jon","Bai, pozik! Ane ere gurekin etorriko da?","¡Sí, encantado! ¿Ane también vendrá con nosotros?"],["Nerea","Ez dakit. Harekin hitz egingo dut.","No lo sé. Hablaré con ella."],["Jon","Eta sarrerak? Nik erosiko ditut.","¿Y las entradas? Yo las compraré."],["Nerea","Ez, ez! Nik erosi ditut dagoeneko. Hau zuretzat da.","¡No, no! Yo ya las he comprado. Esta es para ti."],["Jon","Eskerrik asko!","¡Muchas gracias!"]]},"exercises":[{"type":"gap","q":"___ etorriko zara?","es":"¿Vendrás conmigo?","a":["nirekin"],"hint":"con + yo: nire + -kin."},{"type":"gap","q":"Opari hau ___ da.","es":"Este regalo es para ti.","a":["zuretzat"],"hint":"para + tú: zure + -tzat."},{"type":"gap","q":"___ ez zaio gustatzen.","es":"A él no le gusta.","a":["hari"],"hint":"a él / ella: hari."},{"type":"gap","q":"___ bizi da.","es":"Vive con nosotros.","a":["gurekin"],"hint":"con + nosotros: gure + -kin."},{"type":"gap","q":"___ etxea handia da.","es":"Su casa (de ellos) es grande.","a":["haien"],"hint":"de ellos: haien."},{"type":"gap","q":"Liburua ___ da.","es":"El libro es para él.","a":["harentzat"],"hint":"para + él: haren + -tzat."},{"type":"choice","q":"«Conmigo»","options":["nirekin","nikekin","niriekin"],"a":0,"why":"-rekin se construye sobre el posesivo nire."},{"type":"choice","q":"«Con él»","options":["harekin","hurarekin","harirekin"],"a":0,"why":"3.ª persona: raíz har-."},{"type":"choice","q":"«A vosotros»","options":["zuei","zuek","zuen"],"a":0,"why":"zuei = a vosotros; zuek = vosotros (sujeto); zuen = vuestro."},{"type":"choice","q":"«Para nosotros»","options":["guretzat","gurekin","guri"],"a":0,"why":"-entzat = para."},{"type":"choice","q":"«Yo lo compraré» (sujeto)","options":["Nik erosiko dut.","Niri erosiko dut.","Ni erosiko dut."],"a":0,"why":"Sujeto de un verbo con objeto: nik."},{"type":"order","words":["zara","Nirekin","etorriko"],"a":["Nirekin etorriko zara"],"es":"¿Vendrás conmigo?","hint":"Con quién + verbo + auxiliar."},{"type":"order","words":["da","Hau","zuretzat"],"a":["Hau zuretzat da"],"es":"Esto es para ti.","hint":"Hau + para quién + da."},{"type":"match","pairs":[["nirekin","conmigo"],["zuretzat","para ti"],["hari","a él / ella"],["gure","nuestro"],["haiekin","con ellos"],["zuei","a vosotros"]]}],"create":{"prompt":"Escribe una invitación a un amigo en 4 o 5 frases: adónde vais, quién viene con vosotros, para quién es algo y a quién se lo vas a decir.","focus":"pronombres declinados: nirekin, zuretzat, hari, gurekin, haientzat…"},"links":{"verbs":["nn-pres-3"],"cases":["soz","des","dat","gen"],"themes":["lokailuak","aisialdia"]}},"a2-04":{"id":"a2-04","lvl":"A2","n":4,"title":"Iritziak","es":"NOR-NORI: iruditu, ahaztu, gertatu…","goal":"Decir qué te parece algo, qué se te ha olvidado, qué te ha pasado o qué te falta.","explain":[{"h":"Antes de empezar","p":"En la lección 12 del A1 aprendiste **gustatu** (gustar). Hay un grupo de verbos muy frecuentes que funcionan exactamente igual: la persona va como «a mí, a ti…» y lo que pasa es el sujeto. Con ellos puedes dar tu opinión, disculparte por un olvido o contar un problema."},{"h":"Los verbos del grupo","table":{"head":["Verbo","Ejemplo","Español"],"rows":[["iruditu (parecer)","Ondo iruditzen zait.","Me parece bien."],["ahaztu (olvidarse)","Giltzak ahaztu zaizkit.","Se me han olvidado las llaves."],["gertatu (pasar, ocurrir)","Zer gertatu zaizu?","¿Qué te ha pasado?"],["interesatu (interesar)","Historia interesatzen zait.","Me interesa la historia."],["falta izan (faltar)","Ogia falta zait.","Me falta pan."],["axola izan (importar)","Ez zait axola.","No me importa."]]}},{"h":"Los mismos auxiliares","p":"Recuerda: **zait, zaizu, zaio, zaigu, zaizue, zaie**, y si el sujeto es plural, **zaizkit, zaizkizu, zaizkio…** Y en todos los tiempos que ya conoces: **iruditzen zait** (me parece), **ahaztu zait** (se me ha olvidado), **gertatuko zaizu** (te pasará)."},{"h":"Dar tu opinión","p":"**Ondo iruditzen zait** (me parece bien), **Gaizki iruditzen zait** (me parece mal), **Interesgarria iruditzen zait** (me parece interesante), **Zer iruditzen zaizu?** (¿qué te parece?). Otra forma muy común es **Nire ustez…** (en mi opinión…), que verás a fondo en B1."},{"h":"Paso a paso: «Se le han olvidado los libros a Ane»","p":"1) A quién: **Aneri**. 2) Qué: **liburuak** (plural). 3) Verbo en perfecto: **ahaztu**. 4) Auxiliar: a ella, sujeto plural → **zaizkio**. → **Aneri liburuak ahaztu zaizkio**."},{"h":"Errores típicos","p":"*Giltzak ahaztu ditut* → aunque existe «ahaztu dut» (he olvidado algo, con objeto), lo más natural para un olvido es **Giltzak ahaztu zaizkit**. *Zer gertatu duzu?* → **Zer gertatu zaizu?** *Ni ondo iruditzen zait* → **Niri**. *Ez dit axola* → **Ez zait axola**."},{"h":"Resumen","p":"iruditu, ahaztu, gertatu, interesatu, falta izan, axola izan: igual que gustatu. Persona en dativo (**niri, Aneri**) + **zait…** (plural **zaizkit…**). **Zer iruditzen zaizu?** · **Ez zait axola**."}],"examples":[["Ondo iruditzen zait.","Me parece bien."],["Zer iruditzen zaizu?","¿Qué te parece?"],["Giltzak ahaztu zaizkit.","Se me han olvidado las llaves."],["Zer gertatu zaizu?","¿Qué te ha pasado?"],["Historia asko interesatzen zait.","Me interesa mucho la historia."],["Diru pixka bat falta zait.","Me falta un poco de dinero."],["Ez zait axola.","No me importa."]],"dialog":{"title":"Un mal día","lines":[["Ane","Zer gertatu zaizu? Triste zaude.","¿Qué te ha pasado? Estás triste."],["Iker","Giltzak ahaztu zaizkit, eta ezin naiz etxean sartu.","Se me han olvidado las llaves, y no puedo entrar en casa."],["Ane","Ene! Zure gurasoek ez dauzkate giltzak?","¡Vaya! ¿Tus padres no tienen llaves?"],["Iker","Bai, baina Gasteizen daude gaur.","Sí, pero hoy están en Vitoria-Gasteiz."],["Ane","Gaur nire etxean geratuko zara. Zer iruditzen zaizu?","Hoy te quedarás en mi casa. ¿Qué te parece?"],["Iker","Oso ondo iruditzen zait. Eskerrik asko!","Me parece muy bien. ¡Muchas gracias!"]]},"exercises":[{"type":"gap","q":"Ondo iruditzen ___.","es":"Me parece bien.","a":["zait"],"hint":"A mí, una cosa: zait."},{"type":"gap","q":"Giltzak ahaztu ___.","es":"Se me han olvidado las llaves.","a":["zaizkit"],"hint":"A mí, sujeto plural: zaizkit."},{"type":"gap","q":"Zer gertatu ___?","es":"¿Qué te ha pasado?","a":["zaizu"],"hint":"A ti: zaizu."},{"type":"gap","q":"Zer ___ zaizu?","es":"¿Qué te parece?","a":["iruditzen"],"hint":"parecer = iruditu → iruditzen."},{"type":"gap","q":"Ez zait ___.","es":"No me importa.","a":["axola"],"hint":"importar = axola izan."},{"type":"gap","q":"Aneri liburuak ahaztu ___.","es":"A Ane se le han olvidado los libros.","a":["zaizkio"],"hint":"A ella, sujeto plural: zaizkio."},{"type":"choice","q":"«¿Qué te ha pasado?»","options":["Zer gertatu zaizu?","Zer gertatu duzu?","Zer gertatzen zara?"],"a":0,"why":"gertatu es NOR-NORI: zaizu."},{"type":"choice","q":"«Me interesa la historia»","options":["Historia interesatzen zait.","Historia interesatzen dut.","Historiak interesatzen nau."],"a":0,"why":"interesatu funciona como gustatu."},{"type":"choice","q":"«Me falta pan»","options":["Ogia falta zait.","Ogia falta dut.","Ogirik falta naiz."],"a":0,"why":"falta izan: NOR-NORI."},{"type":"choice","q":"«A mí me parece mal»","options":["Niri gaizki iruditzen zait.","Nik gaizki iruditzen zait.","Ni gaizki iruditzen naiz."],"a":0,"why":"La persona en dativo: niri."},{"type":"order","words":["zaizkit","Giltzak","ahaztu"],"a":["Giltzak ahaztu zaizkit"],"es":"Se me han olvidado las llaves.","hint":"Sujeto + verbo + auxiliar."},{"type":"order","words":["iruditzen","Zer","zaizu"],"a":["Zer iruditzen zaizu"],"es":"¿Qué te parece?","hint":"Interrogativa + verbo + auxiliar."},{"type":"order","words":["axola","Ez","zait"],"a":["Ez zait axola"],"es":"No me importa.","hint":"ez + auxiliar + axola."},{"type":"match","pairs":[["iruditu","parecer"],["ahaztu","olvidarse"],["gertatu","pasar, ocurrir"],["interesatu","interesar"],["falta izan","faltar"],["axola izan","importar"]]}],"create":{"prompt":"Escribe 5 frases: tu opinión sobre dos cosas (… iruditzen zait), algo que se te olvidó alguna vez, algo que te interesa y algo que no te importa.","focus":"verbos NOR-NORI: iruditu, ahaztu, gertatu, interesatu, falta izan, axola izan"},"links":{"verbs":["nni-pres"],"cases":["dat"],"themes":["adjektiboak","lokailuak"]}},"a2-05":{"id":"a2-05","lvl":"A2","n":5,"title":"Lehen eta orain","es":"El pasado habitual","goal":"Contar cómo era tu vida antes: dónde vivías, qué hacías, qué te gustaba.","explain":[{"h":"Antes de empezar","p":"En el A1 aprendiste a contar algo que pasó una vez: **Atzo Bilbora joan nintzen** (ayer fui a Bilbao). Pero para hablar de costumbres del pasado («de pequeño iba a la playa», «antes vivía en Bilbao») hace falta otra forma, el equivalente del imperfecto español. La buena noticia: no hay piezas nuevas que aprender, solo una combinación nueva de piezas que ya conoces."},{"h":"La forma","p":"Verbo en **-tzen / -ten** (como en el presente habitual) + auxiliar en **pasado** (como en «atzo»): **joaten nintzen** (iba), **jokatzen nuen** (jugaba), **irakurtzen nituen** (leía, con objeto plural). Compara la familia completa: **joaten naiz** (voy), **joan nintzen** (fui), **joaten nintzen** (iba)."},{"h":"Una vez o muchas","p":"**joan nintzen** = fui (una vez, acción terminada) · **joaten nintzen** = iba (costumbre). **Atzo hondartzara joan nintzen** (ayer fui a la playa). **Txikitan hondartzara joaten nintzen** (de pequeño iba a la playa)."},{"h":"Verbos sintéticos en pasado","p":"Los verbos que se conjugan solos también tienen pasado. Fíjate en el patrón: inicial de persona + raíz + **-en**, y la 3.ª persona con **z-**.","table":{"head":["","egon (estaba)","joan (iba)","etorri (venía)","eduki (tenía)"],"rows":[["ni / nik","nengoen","nindoan","nentorren","neukan"],["zu / zuk","zeunden","zindoazen","zentozen","zeneukan"],["hura / hark","zegoen","zihoan","zetorren","zeukan"],["gu / guk","geunden","gindoazen","gentozen","geneukan"],["zuek","zeundeten","zindoazten","zentozten","zeneukaten"],["haiek","zeuden","zihoazen","zetozen","zeukaten"]]}},{"h":"Gustar en pasado","p":"El auxiliar de **gustatu** también tiene pasado: **zitzaidan** (a mí), **zitzaizun** (a ti), **zitzaion** (a él/ella)…; con lo que gusta en plural, **zitzaizkidan**… **Txikitan txokolatea asko gustatzen zitzaidan** (de pequeño me gustaba mucho el chocolate). **Pelikula gustatu zitzaidan** (me gustó la película)."},{"h":"Expresiones del pasado","p":"**lehen** (antes), **orain** (ahora), **txikitan** (de pequeño), **gaztetan** (de joven), **garai hartan** (en aquella época), **orduan** (entonces), **duela urte asko** (hace muchos años)."},{"h":"Paso a paso: «De joven leía muchos libros»","p":"1) Verbo: **irakurri → irakurtzen**. 2) ¿Objeto? Sí, y plural (liburu asko) → ukan pasado, yo, plural → **nituen**. 3) **Gaztetan liburu asko irakurtzen nituen**."},{"h":"Errores típicos","p":"*Txikitan hondartzara joan nintzen* para una costumbre → **joaten nintzen**. *Lehen kotxe bat daukat* → **neukan**. *Txokolatea gustatzen nuen* → **gustatzen zitzaidan**. *Atzo etxean nintzen* para «estaba en casa» → **nengoen** (estar es egon)."},{"h":"Resumen","p":"Pasado habitual = **-tzen + nintzen / nuen** (iba, jugaba). Sintéticos: **nengoen, nindoan, nentorren, neukan**. gustatu: **zitzaidan / zitzaizkidan**. Una vez → **joan nintzen**; costumbre → **joaten nintzen**."}],"examples":[["Lehen Bilbon bizi nintzen.","Antes vivía en Bilbao."],["Txikitan futbolean jokatzen nuen.","De pequeño jugaba al fútbol."],["Gaztetan liburu asko irakurtzen nituen.","De joven leía muchos libros."],["Lehen kotxe zahar bat neukan.","Antes tenía un coche viejo."],["Garai hartan txokolatea asko gustatzen zitzaidan.","En aquella época me gustaba mucho el chocolate."],["Atzo etxean nengoen.","Ayer estaba en casa."],["Orduan lanera oinez joaten ginen.","Entonces íbamos andando al trabajo."]],"dialog":{"title":"Fotos antiguas","lines":[["Miren","Begira argazki hau! Txikitan hemen bizi nintzen.","¡Mira esta foto! De pequeña vivía aquí."],["Jon","Benetan? Eta zer egiten zenuen?","¿De verdad? ¿Y qué hacías?"],["Miren","Egunero hondartzara joaten nintzen. Txakur bat neukan, Txuri.","Todos los días iba a la playa. Tenía un perro, Txuri."],["Jon","Nik ere txakur bat neukan! Asko gustatzen zitzaidan.","¡Yo también tenía un perro! Me gustaba mucho."],["Miren","Orain ez daukat txakurrik, baina katu bat daukat.","Ahora no tengo perro, pero tengo un gato."]]},"exercises":[{"type":"gap","q":"Lehen Bilbon bizi ___.","es":"Antes vivía en Bilbao.","a":["nintzen"],"hint":"bizi izan → izan; pasado, yo → nintzen."},{"type":"gap","q":"Txikitan futbolean jokatzen ___.","es":"De pequeño jugaba al fútbol.","a":["nuen"],"hint":"jugar → ukan; pasado, yo → nuen."},{"type":"gap","q":"Lehen kotxe zahar bat ___.","es":"Antes tenía un coche viejo.","a":["neukan"],"hint":"eduki en pasado, yo: neukan."},{"type":"gap","q":"Atzo etxean ___.","es":"Ayer estaba en casa.","a":["nengoen"],"hint":"egon en pasado, yo: nengoen."},{"type":"gap","q":"Txokolatea asko gustatzen ___.","es":"Me gustaba mucho el chocolate.","a":["zitzaidan"],"hint":"gustatu en pasado, a mí: zitzaidan."},{"type":"gap","q":"Lanera oinez joaten ___.","es":"Íbamos andando al trabajo.","a":["ginen"],"hint":"ir → izan; pasado, nosotros → ginen."},{"type":"choice","q":"«Iba a la playa» (costumbre)","options":["Hondartzara joaten nintzen.","Hondartzara joan nintzen.","Hondartzara joaten naiz."],"a":0,"why":"Costumbre en el pasado: -tzen + nintzen."},{"type":"choice","q":"«Fui a la playa» (una vez)","options":["Hondartzara joan nintzen.","Hondartzara joaten nintzen.","Hondartzara joaten naiz."],"a":0,"why":"Una vez: participio + nintzen."},{"type":"choice","q":"«Tenía dos perros»","options":["Bi txakur neuzkan.","Bi txakur neukan.","Bi txakur dauzkat."],"a":0,"why":"Varias cosas: neuzkan (pasado plural de eduki)."},{"type":"choice","q":"«Me gustaba»","options":["gustatzen zitzaidan","gustatzen nuen","gustatzen zait"],"a":0,"why":"gustatu usa NOR-NORI: zitzaidan en pasado."},{"type":"choice","q":"«Estabas cansado»","options":["Nekatuta zeunden.","Nekatuta zinen.","Nekatuta zaude."],"a":0,"why":"Estado → egon; pasado, tú → zeunden."},{"type":"order","words":["nintzen","Lehen","bizi","Bilbon"],"a":["Lehen Bilbon bizi nintzen"],"es":"Antes vivía en Bilbao.","hint":"Tiempo + lugar + bizi + auxiliar."},{"type":"order","words":["nuen","Txikitan","jokatzen","futbolean"],"a":["Txikitan futbolean jokatzen nuen"],"es":"De pequeño jugaba al fútbol.","hint":"Tiempo + futbolean + verbo + auxiliar."},{"type":"order","words":["zitzaidan","gustatzen","Txokolatea"],"a":["Txokolatea gustatzen zitzaidan"],"es":"Me gustaba el chocolate.","hint":"Lo que gusta + gustatzen + auxiliar."},{"type":"match","pairs":[["nengoen","estaba"],["nindoan","iba (en ese momento)"],["nentorren","venía"],["neukan","tenía"],["zitzaidan","me (gustaba…)"],["zegoen","él / ella estaba"]]}],"create"
