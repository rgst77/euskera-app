:{"prompt":"Compara tu vida de antes con la de ahora en 5 o 6 frases: dónde vivías, qué hacías, qué tenías y qué te gustaba, y qué ha cambiado.","focus":"pasado habitual (-tzen nintzen/nuen), sintéticos en pasado (nengoen, neukan…), gustatzen zitzaidan"},"links":{"verbs":["nor-past","nn-past-3","syn-past","nni-past"],"cases":[],"themes":["denbora","aisialdia"]}},"a2-06":{"id":"a2-06","lvl":"A2","n":6,"title":"Ari naiz","es":"La acción en curso","goal":"Decir lo que estás haciendo en este momento y lo que estabas haciendo.","explain":[{"h":"Antes de empezar","p":"En español distinguimos «leo» de «estoy leyendo». El euskera también, con una construcción muy sencilla: **ari izan**. Tiene una particularidad que sorprende al principio y que es la clave de la lección: **siempre lleva el auxiliar izan (naiz)**, aunque el verbo tenga objeto."},{"h":"La forma","p":"Verbo en **-tzen** + **ari** + auxiliar **izan**: **Euskara ikasten ari naiz** (estoy estudiando euskera). **Liburu bat irakurtzen ari naiz** (estoy leyendo un libro): aunque leer tiene objeto, es **naiz**, no *dut*. En pasado, el auxiliar en pasado: **Telebista ikusten ari nintzen** (estaba viendo la tele)."},{"h":"Habitual o en curso","p":"**Kafea edaten dut** = bebo café (en general, por costumbre). **Kafea edaten ari naiz** = estoy bebiendo café (ahora mismo). El primero usa dut (tiene objeto); el segundo, siempre naiz."},{"h":"Preguntar y usar con nombres","p":"La pregunta más útil: **Zertan ari zara?** (¿qué estás haciendo?). Con algunos nombres se usa NON en lugar del verbo: **lanean ari naiz** (estoy trabajando), **ikasten ari naiz** (estoy estudiando)."},{"h":"El tiempo meteorológico","p":"Excepción que conviene memorizar: para la lluvia y la nieve se dice **Euria ari du** (está lloviendo) y **Elurra ari du** (está nevando), con **du**. En pasado: **Euria ari zuen** (estaba lloviendo)."},{"h":"Paso a paso: «Estábamos preparando la cena»","p":"1) Verbo: **prestatu → prestatzen**. 2) **ari**. 3) Auxiliar izan, pasado, nosotros → **ginen**. 4) **Afaria prestatzen ari ginen**."},{"h":"Errores típicos","p":"*Liburu bat irakurtzen ari dut* → **ari naiz** (ari siempre con izan). *Zer ari duzu?* → **Zertan ari zara?** *Euria ari da* → **Euria ari du**. *Kafea edaten ari naiz* para «bebo café todos los días» → **Kafea edaten dut**."},{"h":"Resumen","p":"En curso = **-tzen ari naiz / zara / da…** (siempre izan). Pasado: **ari nintzen**. **Zertan ari zara?** · **lanean ari naiz**. Excepción: **euria / elurra ari du**."}],"examples":[["Euskara ikasten ari naiz.","Estoy estudiando euskera."],["Zertan ari zara?","¿Qué estás haciendo?"],["Liburu bat irakurtzen ari naiz.","Estoy leyendo un libro."],["Ane lanean ari da.","Ane está trabajando."],["Euria ari du.","Está lloviendo."],["Telebista ikusten ari ginen.","Estábamos viendo la tele."],["Ez naiz ezer egiten ari.","No estoy haciendo nada."]],"dialog":{"title":"Una llamada","lines":[["Iker","Kaixo! Zertan ari zara?","¡Hola! ¿Qué estás haciendo?"],["Ane","Afaria prestatzen ari naiz. Eta zu?","Estoy preparando la cena. ¿Y tú?"],["Iker","Ni lanean ari naiz oraindik. Hor euria ari du?","Yo todavía estoy trabajando. ¿Ahí está lloviendo?"],["Ane","Bai, asko! Eta mendian elurra ari du.","¡Sí, mucho! Y en el monte está nevando."],["Iker","Ene! Ondo da. Gero arte!","¡Vaya! Vale. ¡Hasta luego!"]]},"exercises":[{"type":"gap","q":"Euskara ikasten ari ___.","es":"Estoy estudiando euskera.","a":["naiz"],"hint":"ari siempre lleva izan: yo → naiz."},{"type":"gap","q":"Zertan ari ___?","es":"¿Qué estás haciendo?","a":["zara"],"hint":"ari + izan: tú → zara."},{"type":"gap","q":"Liburu bat irakurtzen ari ___.","es":"Estoy leyendo un libro.","a":["naiz"],"hint":"Aunque haya objeto, con ari va naiz."},{"type":"gap","q":"Euria ari ___.","es":"Está lloviendo.","a":["du"],"hint":"Excepción del tiempo: euria ari du."},{"type":"gap","q":"Telebista ikusten ari ___.","es":"Estábamos viendo la tele.","a":["ginen"],"hint":"izan en pasado, nosotros: ginen."},{"type":"gap","q":"Ane lan___ ari da.","es":"Ane está trabajando.","a":["ean"],"hint":"lan + NON: lanean."},{"type":"choice","q":"«Estoy leyendo un libro»","options":["Liburu bat irakurtzen ari naiz.","Liburu bat irakurtzen ari dut.","Liburu bat irakurtzen dut."],"a":0,"why":"ari siempre con izan. Irakurtzen dut es «leo» (costumbre)."},{"type":"choice","q":"«Está lloviendo»","options":["Euria ari du.","Euria ari da.","Euria dago."],"a":0,"why":"Expresión fija del tiempo: ari du."},{"type":"choice","q":"«¿Qué estás haciendo?»","options":["Zertan ari zara?","Zer ari duzu?","Zer egiten ari duzu?"],"a":0,"why":"Pregunta fija: Zertan ari zara?"},{"type":"choice","q":"«Bebo café» (en general)","options":["Kafea edaten dut.","Kafea edaten ari naiz.","Kafea edaten naiz."],"a":0,"why":"Costumbre: -tzen + dut. Con ari sería «estoy bebiendo»."},{"type":"choice","q":"«Estaba trabajando»","options":["Lanean ari nintzen.","Lanean ari nuen.","Lanean nago."],"a":0,"why":"ari + izan en pasado: nintzen."},{"type":"order","words":["ari","naiz","ikasten","Euskara"],"a":["Euskara ikasten ari naiz"],"es":"Estoy estudiando euskera.","hint":"Objeto + verbo -tzen + ari + auxiliar."},{"type":"order","words":["zara","Zertan","ari"],"a":["Zertan ari zara"],"es":"¿Qué estás haciendo?","hint":"Zertan + ari + zara."},{"type":"order","words":["ari","Ez","ezer","egiten","naiz"],"a":["Ez naiz ezer egiten ari"],"es":"No estoy haciendo nada.","hint":"ez + auxiliar delante; ari al final."},{"type":"match","pairs":[["ari naiz","estoy (haciendo)"],["ari zara","estás"],["ari da","está"],["ari gara","estamos"],["ari nintzen","estaba"],["euria ari du","está lloviendo"]]}],"create":{"prompt":"Escribe 5 frases sobre lo que está pasando ahora mismo: qué estás haciendo tú, qué hacen otras personas de tu casa o tu entorno y qué tiempo hace. Añade qué estabas haciendo ayer a esta hora.","focus":"-tzen ari naiz (siempre izan), ari nintzen, euria/elurra ari du"},"links":{"verbs":["nor-pres","nor-past"],"cases":[],"themes":["eguraldia","aditzak"]}},"a2-07":{"id":"a2-07","lvl":"A2","n":7,"title":"Konparazioak","es":"Comparar","goal":"Comparar personas, lugares y cosas: más que, el más, tan… como, demasiado.","explain":[{"h":"Antes de empezar","p":"Comparar es muy útil para elegir, opinar y describir. En euskera, otra vez, todo se hace con terminaciones pegadas al adjetivo: **-ago** (más), **-en** (el más) y **-egi** (demasiado). Una vez las conoces, sirven para cualquier adjetivo."},{"h":"Más… que: -ago y baino","p":"**handi → handiago** (más grande). El término de comparación va delante con **baino** («que»): **Bilbo Donostia baino handiagoa da** (Bilbao es más grande que San Sebastián). Fíjate en el orden: primero lo comparado, luego «Donostia baino», y el adjetivo con su artículo al final. Para «menos», **gutxiago**: **Hau hura baino gutxiago gustatzen zait**."},{"h":"El más: -en","p":"**handi → handiena** (el más grande), **polit → politena** (el más bonito): **Hau da etxe handiena** (esta es la casa más grande). También se dice con partitivo: **etxerik handiena**."},{"h":"Irregulares","table":{"head":["Adjetivo","Más","El más"],"rows":[["on (bueno)","hobe (mejor)","onena (el mejor)"],["asko (mucho)","gehiago (más)","gehien (lo que más)"],["gutxi (poco)","gutxiago (menos)","gutxien (lo que menos)"],["ondo (bien)","hobeto (mejor, adverbio)","ondoen (lo mejor)"]]}},{"h":"Tan… como y como","p":"**bezain** = tan… como: **Mikel Ane bezain altua da** (Mikel es tan alto como Ane). **bezala** = como (de la misma manera): **Zu bezala, ni ere Bilbokoa naiz** (como tú, yo también soy de Bilbao)."},{"h":"Demasiado: -egi","p":"**garesti → garestiegia** (demasiado caro), **txiki → txikiegia** (demasiado pequeño). Con verbos y cantidades, **gehiegi**: **Gehiegi jaten duzu** (comes demasiado)."},{"h":"Paso a paso: «Este piso es más caro que aquel»","p":"1) **Pisu hau** (este piso). 2) Término de comparación + baino: **hura baino**. 3) Adjetivo + -ago + artículo: **garestiagoa**. 4) **Pisu hau hura baino garestiagoa da**."},{"h":"Errores típicos","p":"*Bilbo handiagoa Donostia baino da* → **Bilbo Donostia baino handiagoa da**. *onagoa* → **hobea**. *hobeena* → **onena**. *oso garestiago* para «demasiado caro» → **garestiegia**."},{"h":"Resumen","p":"**-ago** + **baino** (más… que) · **-en(a)** (el más) · **bezain** (tan… como) · **bezala** (como) · **-egi** (demasiado). Irregulares: **hobe / onena**, **gehiago / gehien**, **hobeto**."}],"examples":[["Bilbo Donostia baino handiagoa da.","Bilbao es más grande que San Sebastián."],["Ane Mikel baino altuagoa da.","Ane es más alta que Mikel."],["Hau da etxe handiena.","Esta es la casa más grande."],["Mikel Ane bezain altua da.","Mikel es tan alto como Ane."],["Kafe hau hobea da.","Este café es mejor."],["Pisu hau garestiegia da.","Este piso es demasiado caro."],["Nik zuk baino gehiago irakurtzen dut.","Yo leo más que tú."]],"dialog":{"title":"Buscando piso","lines":[["Nerea","Zer iruditzen zaizu pisu hau?","¿Qué te parece este piso?"],["Jon","Polita da, baina beste hura baino txikiagoa da.","Es bonito, pero es más pequeño que aquel otro."],["Nerea","Bai, baina merkeagoa da.","Sí, pero es más barato."],["Jon","Egia. Hura garestiegia da.","Es verdad. Aquel es demasiado caro."],["Nerea","Eta hau hondartzatik hurbilago dago.","Y este está más cerca de la playa."],["Jon","Orduan, hau da onena!","¡Entonces este es el mejor!"]]},"exercises":[{"type":"gap","q":"Bilbo Donostia ___ handiagoa da.","es":"Bilbao es más grande que San Sebastián.","a":["baino"],"hint":"«que» en la comparación = baino."},{"type":"gap","q":"Ane Mikel baino altu___ da.","es":"Ane es más alta que Mikel.","a":["agoa"],"hint":"-ago (más) + -a (artículo)."},{"type":"gap","q":"Mikel Ane ___ altua da.","es":"Mikel es tan alto como Ane.","a":["bezain"],"hint":"tan… como = bezain."},{"type":"gap","q":"Hau da etxe handi___.","es":"Esta es la casa más grande.","a":["ena"],"hint":"el más = -en + artículo."},{"type":"gap","q":"Pisu hau garesti___ da.","es":"Este piso es demasiado caro.","a":["egia"],"hint":"demasiado = -egi + artículo."},{"type":"gap","q":"Kafe hau ___ da.","es":"Este café es mejor.","a":["hobea"],"hint":"on → hobe (irregular) + artículo."},{"type":"choice","q":"«Más grande que Bilbao»","options":["Bilbo baino handiagoa","Bilbo handiago baino","Bilboa baino handia"],"a":0,"why":"Término + baino, y el adjetivo con -ago al final."},{"type":"choice","q":"«Mejor»","options":["hobea","onagoa","onago"],"a":0,"why":"on es irregular: hobe."},{"type":"choice","q":"«El mejor»","options":["onena","hobeena","onagoena"],"a":0,"why":"El superlativo de on es onena."},{"type":"choice","q":"«Tan alto como Ane»","options":["Ane bezain altua","Ane baino altua","altua Ane bezala"],"a":0,"why":"tan… como = bezain."},{"type":"choice","q":"«Demasiado caro»","options":["garestiegia","oso garestiagoa","garestiena"],"a":0,"why":"demasiado = -egi."},{"type":"order","words":["baino","Bilbo","da","Donostia","handiagoa"],"a":["Bilbo Donostia baino handiagoa da"],"es":"Bilbao es más grande que San Sebastián.","hint":"Lo comparado + término + baino + adjetivo + da."},{"type":"order","words":["bezain","Mikel","altua","da","Ane"],"a":["Mikel Ane bezain altua da"],"es":"Mikel es tan alto como Ane.","hint":"Lo comparado + término + bezain + adjetivo + da."},{"type":"order","words":["garestiegia","Pisu","da","hau"],"a":["Pisu hau garestiegia da"],"es":"Este piso es demasiado caro.","hint":"Pisu hau + adjetivo con -egi + da."},{"type":"match","pairs":[["handiago","más grande"],["handiena","el más grande"],["hobe","mejor"],["onena","el mejor"],["gehiago","más"],["gutxiago","menos"]]}],"create":{"prompt":"Compara dos ciudades, dos personas o dos cosas que conozcas en 5 frases: usa más que, el más, tan… como y demasiado.","focus":"-ago + baino, -en(a), bezain, bezala, -egi, irregulares hobe/onena"},"links":{"verbs":[],"cases":[],"themes":["adjektiboak","pertsonak"]}},"a2-08":{"id":"a2-08","lvl":"A2","n":8,"title":"Nahi, behar, ahal","es":"Querer, deber, poder y saber","goal":"Decir lo que quieres, lo que tienes que hacer, lo que puedes o no puedes hacer y lo que sabes hacer.","explain":[{"h":"Antes de empezar","p":"Con cuatro palabras muy pequeñas (**nahi, behar, ahal, ezin**) multiplicas lo que puedes decir: «quiero ir», «tengo que trabajar», «no puedo venir». Funcionan todas igual, así que aprenderlas juntas es fácil. Además verás el verbo **jakin** (saber) completo."},{"h":"La forma","p":"Participio + **nahi / behar / ahal** + auxiliar **ukan** (dut, duzu…): **Etxera joan nahi dut** (quiero ir a casa), **Lan egin behar dut** (tengo que trabajar), **Leihoa ireki ahal dut?** (¿puedo abrir la ventana?). Lo más habitual en batua es usar **dut** incluso con verbos sin objeto como joan o etorri."},{"h":"No poder: ezin","p":"**ezin** sustituye a «no + poder» y va delante del auxiliar: **Gaur ezin dut etorri** (hoy no puedo venir), **Ezin dut lo egin** (no puedo dormir). No se dice *ez ahal*."},{"h":"Con nombres y en otros tiempos","p":"También con nombres: **Laguntza behar dut** (necesito ayuda), **Kafe bat nahi dut** (quiero un café). Y en otros tiempos cambia solo el auxiliar: **joan nahi nuen** (quería ir), **joan beharko dut** (tendré que ir)."},{"h":"jakin (saber) en presente","p":"Es sintético y funciona como dut. Para «saber hacer algo», va con el verbo en -tzen: **Igeri egiten dakit** (sé nadar). En respuestas cortas afirmativas, con ba-: **Badakit** (lo sé).","table":{"head":["NORK","jakin","Español"],"rows":[["nik","{nork:dakit}","sé"],["zuk","{nork:dakizu}","sabes"],["hark","{nork:daki}","sabe"],["guk","{nork:dakigu}","sabemos"],["zuek","{nork:dakizue}","sabéis"],["haiek","{nork:dakite}","saben"]]}},{"h":"Paso a paso: «Mañana tendremos que ir a Bilbao»","p":"1) Verbo: **joan**. 2) «tener que» = **behar**, en futuro **beharko**. 3) Auxiliar ukan, nosotros → **dugu**. 4) **Bihar Bilbora joan beharko dugu**."},{"h":"Errores típicos","p":"*Lan egiten behar dut* → **Lan egin behar dut** (participio, no -tzen). *Ez ahal dut etorri* → **Ezin dut etorri**. *Igeri egin dakit* → **Igeri egiten dakit**. *Hark badakit* → **Hark badaki**."},{"h":"Resumen","p":"Participio + **nahi / behar / ahal** + **dut**. No poder: **ezin dut + participio**. Futuro: **beharko dut**; pasado: **nahi nuen**. **jakin**: dakit, dakizu, daki, dakigu, dakizue, dakite; saber hacer = **-tzen dakit**."}],"examples":[["Etxera joan nahi dut.","Quiero ir a casa."],["Bihar lan egin behar dut.","Mañana tengo que trabajar."],["Leihoa ireki ahal dut?","¿Puedo abrir la ventana?"],["Gaur ezin dut etorri.","Hoy no puedo venir."],["Laguntza behar dut.","Necesito ayuda."],["Igeri egiten badakit.","Sé nadar."],["Euskaraz hitz egiten dakizu?","¿Sabes hablar euskera?"]],"dialog":{"title":"¿Vamos al cine?","lines":[["Ane","Gaur zinemara joan nahi duzu?","¿Quieres ir al cine hoy?"],["Iker","Ezin dut. Lan asko egin behar dut.","No puedo. Tengo que trabajar mucho."],["Ane","Eta bihar?","¿Y mañana?"],["Iker","Bihar bai, joan ahal dut. Zer pelikula ikusi nahi duzu?","Mañana sí, puedo ir. ¿Qué película quieres ver?"],["Ane","Ez dakit. Euskarazko pelikula bat?","No sé. ¿Una película en euskera?"],["Iker","Ados! Horrela euskara ikasiko dugu.","¡De acuerdo! Así aprenderemos euskera."]]},"exercises":[{"type":"gap","q":"Etxera joan nahi ___.","es":"Quiero ir a casa.","a":["dut"],"hint":"nahi va con ukan: dut."},{"type":"gap","q":"Bihar lan egin ___ dut.","es":"Mañana tengo que trabajar.","a":["behar"],"hint":"tener que = behar."},{"type":"gap","q":"Gaur ___ dut etorri.","es":"Hoy no puedo venir.","a":["ezin"],"hint":"no poder = ezin."},{"type":"gap","q":"Leihoa ireki ___ dut?","es":"¿Puedo abrir la ventana?","a":["ahal"],"hint":"poder = ahal."},{"type":"gap","q":"Igeri egiten ba___.","es":"Sé nadar.","a":["dakit"],"hint":"jakin, yo: dakit (con ba- en afirmativa)."},{"type":"gap","q":"Euskaraz hitz egiten ___?","es":"¿Sabes hablar euskera?","a":["dakizu"],"hint":"jakin, tú: dakizu."},{"type":"choice","q":"«Quiero ir a casa»","options":["Etxera joan nahi dut.","Etxera joan nahi da.","Etxera joatea nahi naiz."],"a":0,"why":"Participio + nahi + dut."},{"type":"choice","q":"«Tengo que trabajar»","options":["Lan egin behar dut.","Lan egin behar naiz.","Lan egiten behar dut."],"a":0,"why":"Participio (egin) + behar + dut."},{"type":"choice","q":"«No puedo venir»","options":["Ezin dut etorri.","Ez ahal dut etorri.","Ezin etorri dut."],"a":0,"why":"ezin + auxiliar + participio."},{"type":"choice","q":"«¿Sabes nadar?»","options":["Igeri egiten dakizu?","Igeri egin dakizu?","Igeri egiten daukazu?"],"a":0,"why":"Saber hacer: -tzen + dakizu."},{"type":"choice","q":"«Él lo sabe»","options":["Hark badaki.","Hark badakit.","Hura badaki."],"a":0,"why":"Sujeto con -k (hark) y forma daki."},{"type":"order","words":["nahi","joan","Etxera","dut"],"a":["Etxera joan nahi dut"],"es":"Quiero ir a casa.","hint":"Lugar + participio + nahi + dut."},{"type":"order","words":["dut","Gaur","etorri","ezin"],"a":["Gaur ezin dut etorri"],"es":"Hoy no puedo venir.","hint":"Tiempo + ezin + dut + participio."},{"type":"order","words":["behar","egin","dut","lan","Bihar"],"a":["Bihar lan egin behar dut"],"es":"Mañana tengo que trabajar.","hint":"Tiempo + lan egin + behar + dut."},{"type":"match","pairs":[["nahi dut","quiero"],["behar dut","necesito / tengo que"],["ahal dut","puedo"],["ezin dut","no puedo"],["badakit","lo sé"],["ez dakit","no lo sé"]]}],"create":{"prompt":"Escribe 6 frases sobre esta semana: dos cosas que quieres hacer, dos que tienes que hacer, una que no puedes hacer y una que sabes hacer bien.","focus":"participio + nahi/behar/ahal + dut, ezin dut + participio, jakin (dakit… / -tzen dakit)"},"links":{"verbs":["syn-pres-2","nn-pres-3"],"cases":[],"themes":["aditzak"]}},"a2-09":{"id":"a2-09","lvl":"A2","n":9,"title":"Aginduak","es":"Órdenes, instrucciones y direcciones","goal":"Dar y entender instrucciones sencillas y direcciones para llegar a un sitio.","explain":[{"h":"Antes de empezar","p":"Para pedir algo o indicar el camino necesitas el imperativo. El euskera tiene formas imperativas completas (las verás en B2), pero en la vida diaria se usa muchísimo una forma muy fácil: **el participio solo**. Con lo que ya sabes, puedes dar instrucciones desde hoy."},{"h":"El imperativo fácil: el participio","p":"El verbo en su forma de diccionario funciona como orden: **Etorri hona!** (¡ven aquí!), **Itxi atea!** (¡cierra la puerta!), **Hartu lehen kalea!** (¡coge la primera calle!). Para suavizar, **mesedez**: **Itxi leihoa, mesedez**. En carteles e instrucciones, la negación se hace con **ez** delante: **Ez erre** (no fumar)."},{"h":"Verbos sintéticos como orden","p":"Algunas formas que ya conoces sirven también como imperativo: **Zatoz!** (¡ven!), **Zoaz!** (¡ve!, ¡vete!), **Zaude lasai!** (¡tranquilo!, literalmente «estate tranquilo»), y en plural **Zatozte!** (¡venid!)."},{"h":"Indicar el camino","p":"**zuzen** (recto), **ezkerrera** (a la izquierda), **eskuinera** (a la derecha), **gurutzatu** (cruzar), **jarraitu** (seguir), **igo** (subir), **jaitsi** (bajar). Dos terminaciones nuevas: **-raino** (hasta): **plazaraino** (hasta la plaza), **Bilboraino**; y **-rantz** (hacia): **itsasorantz** (hacia el mar), **mendirantz**. Tras consonante, **-eraino** y **-erantz**."},{"h":"Medio de transporte: -z","p":"Para decir cómo vas, se añade **-z** (o **-ez** tras consonante), sin artículo: **trenez** (en tren), **autoz** (en coche), **bizikletaz** (en bici), **autobusez** (en autobús), **oinez** (a pie). Es el mismo caso de **euskaraz** (en euskera). Ojo: **autobusean** es «dentro del autobús»."},{"h":"Paso a paso: «Sigue recto hasta el puente y luego a la izquierda»","p":"1) Seguir: **jarraitu**. 2) Recto: **zuzen**. 3) Hasta el puente: **zubi + -raino → zubiraino**. 4) Luego a la izquierda: **eta gero ezkerrera**. → **Jarraitu zuzen zubiraino, eta gero ezkerrera**."},{"h":"Errores típicos","p":"*Itxi leihora* → **Itxi leihoa** (el objeto lleva artículo, no NORA). *autobusean noa* para «voy en autobús» → **autobusez noa**. *plazara* para «hasta la plaza» → **plazaraino** (plazara es «a la plaza»)."},{"h":"Resumen","p":"Orden fácil = participio (**Etorri! Itxi atea!**) + **mesedez**. Sintéticos: **Zatoz! Zoaz! Zaude lasai!**. Direcciones: zuzen, ezkerrera, eskuinera; **-raino** (hasta), **-rantz** (hacia). Transporte: **-z** (trenez, oinez)."}],"examples":[["Etorri hona, mesedez!","¡Ven aquí, por favor!"],["Itxi atea!","¡Cierra la puerta!"],["Hartu lehen kalea eskuinera.","Coge la primera calle a la derecha."],["Zuzen joan plazaraino.","Ve recto hasta la plaza."],["Zatoz nirekin!","¡Ven conmigo!"],["Bilbora trenez noa.","Voy a Bilbao en tren."],["Joan itsasorantz.","Ve hacia el mar."]],"dialog":{"title":"¿Dónde está la estación?","lines":[["Ane","Barkatu, non dago geltokia?","Perdone, ¿dónde está la estación?"],["Gizona","Hartu kale hau eta joan zuzen plazaraino.","Coja esta calle y vaya recto hasta la plaza."],["Ane","Eta gero?","¿Y luego?"],["Gizona","Plazan, eskuinera. Geltokia ibaiaren ondoan dago.","En la plaza, a la derecha. La estación está al lado del río."],["Ane","Urrun dago? Oinez joan ahal dut?","¿Está lejos? ¿Puedo ir andando?"],["Gizona","Bai, hurbil dago: hamar minutu oinez.","Sí, está cerca: diez minutos a pie."]]},"exercises":[{"type":"gap","q":"___ hona, mesedez!","es":"¡Ven aquí, por favor!","a":["etorri","zatoz"],"hint":"Participio de venir, o la forma sintética de «tú vienes»."},{"type":"gap","q":"Itxi ___!","es":"¡Cierra la puerta!","a":["atea"],"hint":"El objeto lleva artículo: ate → atea."},{"type":"gap","q":"Zuzen joan plaza___.","es":"Ve recto hasta la plaza.","a":["raino"],"hint":"hasta = -raino."},{"type":"gap","q":"Bilbora tren___ noa.","es":"Voy a Bilbao en tren.","a":["ez"],"hint":"Transporte: -z, y tras consonante -ez."},{"type":"gap","q":"Hartu lehen kalea eskuin___.","es":"Coge la primera calle a la derecha.","a":["era"],"hint":"A la derecha = eskuinera."},{"type":"gap","q":"Joan itsaso___.","es":"Ve hacia el mar.","a":["rantz"],"hint":"hacia = -rantz."},{"type":"choice","q":"«Cierra la ventana»","options":["Itxi leihoa!","Itxi leihora!","Leihoa itxi duzu!"],"a":0,"why":"Participio + objeto con artículo."},{"type":"choice","q":"«En autobús»","options":["autobusez","autobusean","autobusera"],"a":0,"why":"Medio de transporte: -ez. Autobusean es «dentro del autobús»."},{"type":"choice","q":"«Hasta la plaza»","options":["plazaraino","plazara","plazatik"],"a":0,"why":"-raino = hasta; -ra = a; -tik = desde."},{"type":"choice","q":"«¡Ven conmigo!»","options":["Zatoz nirekin!","Zoaz nirekin!","Nirekin zara!"],"a":0,"why":"zatoz = ven; zoaz = ve, vete."},{"type":"choice","q":"«No fumar» (cartel)","options":["Ez erre.","Ez erretzen.","Erre ez."],"a":0,"why":"Instrucción negativa: ez + participio."},{"type":"order","words":["hona","Etorri","mesedez"],"a":["Etorri hona mesedez","Mesedez etorri hona"],"es":"Ven aquí, por favor.","hint":"Participio + hona (+ mesedez)."},{"type":"order","words":["plazaraino","joan","Zuzen"],"a":["Zuzen joan plazaraino"],"es":"Ve recto hasta la plaza.","hint":"Zuzen + joan + hasta dónde."},{"type":"order","words":["trenez","Bilbora","noa"],"a":["Bilbora trenez noa","Trenez Bilbora noa"],"es":"Voy a Bilbao en tren.","hint":"Lugar y transporte delante; noa al final."},{"type":"match","pairs":[["ezkerrera","a la izquierda"],["eskuinera","a la derecha"],["zuzen","recto"],["trenez","en tren"],["oinez","a pie"],["plazaraino","hasta la plaza"]]}],"create":{"prompt":"Explica a un amigo cómo llegar desde tu casa a un sitio que conozcas (la estación, una plaza, un bar) en 4 o 5 instrucciones. Di también cómo se puede ir (oinez, autobusez…).","focus":"imperativo con participio, direcciones, -raino, -rantz, transporte con -z"},"links":{"verbs":["syn-pres-1"],"cases":["ins","ter"],"themes":["norabideak","bidaiak","hiria"]}},"a2-10":{"id":"a2-10","lvl":"A2","n":10,"title":"Ikusten zaitut","es":"NOR-NORK con personas","goal":"Decir «te quiero», «me ves», «nos conocen»: acciones entre personas.","explain":[{"h":"Antes de empezar","p":"Hasta ahora, con **dut** el objeto siempre era una cosa: **liburua ikusi dut** (he visto el libro). ¿Y si lo que ves es una persona: me, te, nos, os? Entonces el auxiliar cambia de forma. La más famosa la conoces seguro: **Maite zaitut** (te quiero)."},{"h":"La lógica","p":"En estas formas, **el principio indica a quién** ({nor:NOR}) y **el final indica quién lo hace** ({nork:NORK}). Las terminaciones de NORK son las de siempre: **-t** yo, **-zu** tú, nada para él/ella, **-gu** nosotros, **-zue** vosotros, **-te** ellos.","table":{"head":["NOR (a quién)","Inicio","Ejemplos"],"rows":[["ni (me)","{nor:n-au-}","nau (él me), nauzu (tú me), naute (ellos me)"],["zu (te)","{nor:zaitu-}","zaitut (yo te), zaitu (él te), zaitugu (nosotros te)"],["gu (nos)","{nor:gaitu-}","gaitu (él nos), gaituzu (tú nos), gaituzte (ellos nos)"],["zuek (os)","{nor:zaituzte-}","zaituztet (yo os), zaituzte (él os), zaituztegu (nosotros os)"]]}},{"h":"Las formas más útiles","p":"**Maite zaitut** (te quiero) · **Ulertzen nauzu?** (¿me entiendes?) · **Entzuten nauzu?** (¿me oyes?) · **Ezagutzen zaitut** (te conozco) · **Lagunduko zaitut** (te ayudaré) · **Gonbidatu gaituzte** (nos han invitado). Como siempre con este auxiliar, el sujeto lleva **-k**: **Mikelek ikusi nau** (Mikel me ha visto)."},{"h":"Combinaciones que no existen","p":"No hay forma para «yo me» o «nosotros nos»: las acciones reflexivas se dicen de otra manera (lo verás más adelante). Por eso en las tablas de Taulak esas casillas aparecen rayadas."},{"h":"Paso a paso: «Nuestros amigos nos han invitado»","p":"1) Sujeto con -k: **gure lagunek**. 2) Verbo: **gonbidatu**. 3) Auxiliar: a quién = nosotros (**gaitu-**), quién = ellos (**-zte**) → **gaituzte**. 4) **Gure lagunek gonbidatu gaituzte**."},{"h":"Errores típicos","p":"*Maite dut zu* → **Maite zaitut**. *Lagundu duzu ni* → **Lagundu nauzu**. *Mikel ikusten nau* → **Mikelek** (falta la -k). *Ulertzen zaitut?* para «¿me entiendes?» → **Ulertzen nauzu?** (zaitut es «te entiendo»)."},{"h":"Resumen","p":"Inicio = a quién (**nau-** me, **zaitu-** te, **gaitu-** nos, **zaituzte-** os); final = quién (-t, -zu, -gu, -zue, -te). **Maite zaitut**, **Ulertzen nauzu?**, **Lagunduko zaitut**."}],"examples":[["Maite zaitut.","Te quiero."],["Ulertzen nauzu?","¿Me entiendes?"],["Mikelek ikusi nau.","Mikel me ha visto."],["Ezagutzen zaitut.","Te conozco."],["Gure lagunek gonbidatu gaituzte.","Nuestros amigos nos han invitado."],["Kalean ikusi zaituztet.","Os he visto en la calle."],["Lagunduko zaitut.","Te ayudaré."]],"dialog":{"title":"Un reencuentro","lines":[["Ane","Kaixo! Ezagutzen nauzu?","¡Hola! ¿Me conoces?"],["Mikel","Bai! Ane zara, ezta? Eskolan askotan ikusten zaitut.","¡Sí! Eres Ane, ¿verdad? Te veo a menudo en la escuela."],["Ane","Bai! Eta zu Mikel zara. Nire lagunek ezagutzen zaituzte.","¡Sí! Y tú eres Mikel. Mis amigos te conocen."],["Mikel","Larunbatean festa bat egingo dugu. Gonbidatzen zaitut!","El sábado haremos una fiesta. ¡Te invito!"],["Ane","Eskerrik asko! Festa prestatzen lagunduko zaitut.","¡Muchas gracias! Te ayudaré a preparar la fiesta."]]},"exercises":[{"type":"gap","q":"Maite ___.","es":"Te quiero.","a":["zaitut"],"hint":"a quién = te (zaitu-), quién = yo (-t)."},{"type":"gap","q":"Ulertzen ___?","es":"¿Me entiendes?","a":["nauzu"],"hint":"a quién = me (nau-), quién = tú (-zu)."},{"type":"gap","q":"Mikelek ikusi ___.","es":"Mikel me ha visto.","a":["nau"],"hint":"a quién = me, quién = él → nau."},{"type":"gap","q":"Gure lagunek gonbidatu ___.","es":"Nuestros amigos nos han invitado.","a":["gaituzte"],"hint":"a quién = nos (gaitu-), quién = ellos (-zte)."},{"type":"gap","q":"Lagunduko ___.","es":"Te ayudaré.","a":["zaitut"],"hint":"a quién = te, quién = yo → zaitut."},{"type":"gap","q":"Kalean ikusi ___.","es":"Os he visto en la calle.","a":["zaituztet"],"hint":"a quién = os (zaituzte-), quién = yo (-t)."},{"type":"choice","q":"«Te quiero»","options":["Maite zaitut.","Maite dut zu.","Maite nauzu."],"a":0,"why":"Objeto «te»: zaitut. Maite nauzu es «me quieres»."},{"type":"choice","q":"«Me has ayudado»","options":["Lagundu nauzu.","Lagundu zaitut.","Lagundu duzu."],"a":0,"why":"a quién = me, quién = tú → nauzu."},{"type":"choice","q":"«Nos conocen»","options":["Ezagutzen gaituzte.","Ezagutzen dituzte.","Ezagutzen gara."],"a":0,"why":"a quién = nos, quién = ellos → gaituzte."},{"type":"choice","q":"«Mikel me ve»","options":["Mikelek ikusten nau.","Mikel ikusten nau.","Mikelek ikusten naiz."],"a":0,"why":"Sujeto con -k y auxiliar nau."},{"type":"choice","q":"«¿Me oyes?»","options":["Entzuten nauzu?","Entzuten zaitut?","Entzuten duzu ni?"],"a":0,"why":"Entzuten zaitut es «te oigo»."},{"type":"order","words":["nau","Mikelek","ikusi"],"a":["Mikelek ikusi nau"],"es":"Mikel me ha visto.","hint":"Sujeto con -k + verbo + auxiliar."},{"type":"order","words":["gaituzte","lagunek","Gure","gonbidatu"],"a":["Gure lagunek gonbidatu gaituzte"],"es":"Nuestros amigos nos han invitado.","hint":"Gure lagunek + verbo + auxiliar."},{"type":"order","words":["zaitut","Bihar","lagunduko"],"a":["Bihar lagunduko zaitut"],"es":"Mañana te ayudaré.","hint":"Tiempo + verbo + auxiliar."},{"type":"match","pairs":[["nau","(él) me"],["nauzu","(tú) me"],["zaitut","(yo) te"],["gaitu","(él) nos"],["zaituztet","(yo) os"],["naute","(ellos) me"]]}],"create":{"prompt":"Escribe 5 frases sobre las personas de tu vida usando estas formas: quién te quiere, a quién conoces, quién te ayuda, a quién verás pronto y quién os ha invitado alguna vez.","focus":"NOR-NORK con objeto personal: nau, zaitut, gaitu, zaituztet…"},"links":{"verbs":["nn-pres-x"],"cases":["erg"],"themes":["aditzak","pertsonak"]}},"a2-11":{"id":"a2-11","lvl":"A2","n":11,"title":"Zer eman diozu?","es":"NOR-NORI-NORK en presente","goal":"Decir qué das, dices, envías o enseñas a alguien.","explain":[{"h":"Antes de empezar","p":"Esta es la lección más exigente del A2, y la más satisfactoria: cuando la domines, podrás decir «se lo he dado», «me lo ha dicho» o «te lo enviaré» con una sola palabra. Tres protagonistas caben dentro del auxiliar: quién da ({nork:NORK}), qué da ({nor:NOR}) y a quién ({nori:NORI})."},{"h":"La estructura","p":"**di-** + marca de **a quién** + marca de **quién**: di-**zu**-**t** = (yo) te lo; di-**o**-**t** = (yo) se lo (a él); di-**t** = (él) me lo. Marcas de NORI en el medio: **-da-** o **-t** (a mí), **-zu-** (a ti), **-o-** (a él/ella), **-gu-** (a nosotros), **-zue-** (a vosotros), **-e-** (a ellos). La marca de NORK al final es la de siempre (-t, -zu, nada, -gu, -zue, -te)."},{"h":"Las formas más frecuentes","table":{"head":["NORK ↓ / NORI →","a mí","a ti","a él / ella","a nosotros","a ellos"],"rows":[["nik (yo)","—","{nori:dizut}","{nori:diot}","—","{nori:diet}"],["zuk (tú)","{nori:didazu}","—","{nori:diozu}","{nori:diguzu}","{nori:diezu}"],["hark (él)","{nori:dit}","{nori:dizu}","{nori:dio}","{nori:digu}","{nori:die}"],["guk","—","{nori:dizugu}","{nori:diogu}","—","{nori:diegu}"],["haiek","{nori:didate}","{nori:dizute}","{nori:diote}","{nori:digute}","{nori:diete}"]]}},{"h":"Si lo que das es plural: -zki-","p":"Se añade **-zki-** después de di-: **diot → dizkiot** (se los he dado a él), **dizut → dizkizut**, **dit → dizkit**. **Loreak eman dizkiot** (le he dado las flores)."},{"h":"Los verbos de este grupo","p":"**eman** (dar), **esan** (decir), **bidali** (enviar), **erakutsi** (enseñar, mostrar), **ekarri** (traer), **galdetu** (preguntar), **oparitu** (regalar), **azaldu** (explicar), **deitu** (llamar por teléfono: **deituko dizut**, te llamaré), **utzi** (prestar, dejar). La persona que recibe va en dativo: **niri, Mikeli, amari**."},{"h":"Paso a paso: «Mañana te enseñaré las fotos»","p":"1) Verbo en futuro: **erakutsiko**. 2) A quién: te → **-zu-**. 3) Quién: yo → **-t**. 4) Qué: las fotos, plural → **-zki-**. 5) di + zki + zu + t → **dizkizut**. → **Bihar argazkiak erakutsiko dizkizut**."},{"h":"Errores típicos","p":"*Liburua eman dut Mikeli* → **eman diot** (hay a quién: hace falta NORI en el auxiliar). *Esan diot* para «me lo ha dicho» → **Esan dit**. *Loreak eman diot* → **dizkiot**. *Mikel eman dio* → **Mikelek** (sujeto con -k)."},{"h":"Resumen","p":"**di- + NORI + NORK**: dizut, diot, dit, didazu, diogu, digute… Plural: **dizki-**. Verbos: eman, esan, bidali, erakutsi, ekarri, galdetu, oparitu, deitu. Receptor en dativo (niri, Mikeli)."}],"examples":[["Liburua eman diot.","Le he dado el libro."],["Amari esan diogu.","Se lo hemos dicho a la madre."],["Zer esan dizu?","¿Qué te ha dicho?"],["Mezu bat bidali didazu?","¿Me has enviado un mensaje?"],["Argazkiak erakutsiko dizkizut.","Te enseñaré las fotos."],["Mikelek opari bat ekarri dit.","Mikel me ha traído un regalo."],["Loreak eman dizkiot.","Le he dado las flores."]],"dialog":{"title":"El cumpleaños de Ane","lines":[["Jon","Zer oparituko diozu Aneri?","¿Qué le regalarás a Ane?"],["Miren","Liburu bat erosi dut. Bihar emango diot.","He comprado un libro. Se lo daré mañana."],["Jon","Ondo! Nik lore batzuk bidaliko dizkiot.","¡Bien! Yo le enviaré unas flores."],["Miren","Aneri loreak asko gustatzen zaizkio.","A Ane le gustan mucho las flores."],["Jon","Badakit! Berak esan dit.","¡Lo sé! Me lo ha dicho ella."]]},"exercises":[{"type":"gap","q":"Liburua eman ___.","es":"Le he dado el libro (a él).","a":["diot"],"hint":"yo → a él: di-o-t."},{"type":"gap","q":"Zer esan ___?","es":"¿Qué te ha dicho (él)?","a":["dizu"],"hint":"él → a ti: di-zu."},{"type":"gap","q":"Mezu bat bidali ___?","es":"¿Me has enviado un mensaje?","a":["didazu"],"hint":"tú → a mí: di-da-zu."},{"type":"gap","q":"Argazkiak erakutsiko ___.","es":"Te enseñaré las fotos.","a":["dizkizut"],"hint":"yo → a ti, objeto plural: di-zki-zu-t."},{"type":"gap","q":"Amari esan ___.","es":"Se lo hemos dicho a la madre.","a":["diogu"],"hint":"nosotros → a ella: di-o-gu."},{"type":"gap","q":"Mikelek opari bat ekarri ___.","es":"Mikel me ha traído un regalo.","a":["dit"],"hint":"él → a mí: di-t."},{"type":"choice","q":"«Se lo he dado (a él)»","options":["Eman diot.","Eman dut.","Eman dit."],"a":0,"why":"Hay receptor: diot. Eman dit es «me lo ha dado»."},{"type":"choice","q":"«Me lo ha dicho (él)»","options":["Esan dit.","Esan diot.","Esan dut."],"a":0,"why":"él → a mí: dit."},{"type":"choice","q":"«Te enseñaré las fotos»","options":["Argazkiak erakutsiko dizkizut.","Argazkiak erakutsiko dizut.","Argazkiak erakutsiko ditut."],"a":0,"why":"Objeto plural y receptor «ti»: dizkizut."},{"type":"choice","q":"«Les hemos escrito (a ellos)»","options":["Idatzi diegu.","Idatzi dugu.","Idatzi digute."],"a":0,"why":"nosotros → a ellos: di-e-gu. Digute es «ellos nos»."},{"type":"choice","q":"«¿Qué le has dicho a Mikel?»","options":["Zer esan diozu Mikeli?","Zer esan duzu Mikel?","Zer esan dizu Mikeli?"],"a":0,"why":"tú → a él: diozu, y Mikel en dativo."},{"type":"order","words":["diot","Liburua","eman"],"a":["Liburua eman diot"],"es":"Le he dado el libro.","hint":"Objeto + verbo + auxiliar."},{"type":"order","words":["dit","Mikelek","ekarri","opari","bat"],"a":["Mikelek opari bat ekarri dit"],"es":"Mikel me ha traído un regalo.","hint":"Sujeto con -k + objeto + verbo + auxiliar."},{"type":"order","words":["dizkizut","Argazkiak","erakutsiko"],"a":["Argazkiak erakutsiko dizkizut"],"es":"Te enseñaré las fotos.","hint":"Objeto + verbo + auxiliar."},{"type":"match","pairs":[["diot","yo → a él"],["dizut","yo → a ti"],["dit","él → a mí"],["didazu","tú → a mí"],["diogu","nosotros → a él"],["digute","ellos → a nosotros"]]}],"create":{"prompt":"Escribe 5 frases sobre regalos y mensajes: qué le regalaste o regalarás a alguien, qué te ha dicho alguien hoy, a quién enviarás un mensaje y qué te enseñaron tus amigos.","focus":"NOR-NORI-NORK presente (diot, dizut, dit…) y plural con -zki-"},"links":{"verbs":["nnn-pres","nnn-pres-pl"],"cases":["dat"],"themes":["aditzak"]}},"a2-12":{"id":"a2-12","lvl":"A2","n":12,"title":"Osasuna","es":"La salud","goal":"Explicar qué te duele y cómo te encuentras, y entender al médico.","explain":[{"h":"Antes de empezar","p":"Ir al médico en otro idioma da respeto, pero con muy pocas estructuras puedes explicarte bien. Además, esta lección te sirve de repaso del NOR-NORI-NORK de la lección anterior, porque en euskera **lo que duele «te da dolor»**."},{"h":"Dos maneras de decir que algo duele","p":"1) Con **eduki**: lugar + **-ko** + **mina** + **daukat**: **Buruko mina daukat** (tengo dolor de cabeza), **sabeleko mina** (de tripa), **hortzetako mina** (de muelas), **eztarriko mina** (de garganta). 2) Con **min eman** (dar dolor), que usa NOR-NORI-NORK: **Buruak min ematen dit** (me duele la cabeza, literalmente «la cabeza me da dolor»). Como la cabeza es quien «da», lleva **-k**. Si es plural: **Begiek min ematen didate** (me duelen los ojos)."},{"h":"Síntomas y estados","p":"**Gaixorik nago** (estoy enfermo), **Sukarra daukat** (tengo fiebre), **Eztula daukat** (tengo tos), **Hotzeria daukat** (estoy resfriado), **Zorabiatuta nago** (estoy mareado), **Nekatuta nago** (estoy cansado). Desde cuándo: **-tik**: **Atzotik** (desde ayer), **Astelehenetik** (desde el lunes)."},{"h":"En la consulta","p":"El médico pregunta **Zer duzu?** (¿qué te pasa?, literalmente «¿qué tienes?») y **Noiztik?** (¿desde cuándo?). Las indicaciones suelen ir en imperativo con participio: **Hartu pilula hau egunean hiru aldiz** (tome esta pastilla tres veces al día), **Edan ur asko** (beba mucha agua), **Atseden hartu** (descanse). Para despedirse: **Ondo sendatu!** (¡que te mejores!)."},{"h":"Paso a paso: «Me duelen los pies desde el lunes»","p":"1) Quién «da» el dolor: los pies, plural, con -k → **oinek**. 2) **min ematen**. 3) Auxiliar: ellos → a mí → **didate**. 4) Desde el lunes: **astelehenetik**. → **Astelehenetik oinek min ematen didate**."},{"h":"Errores típicos","p":"*Burua min ematen dit* → **Buruak** (lo que duele lleva -k). *Oinek min ematen dit* → **didate** (plural). *Gaixorik naiz* → lo natural es **Gaixorik nago**. *Sukarrik daukat* → **Sukarra daukat** (el partitivo es para negativas)."},{"h":"Resumen","p":"**…-ko mina daukat** o **…-k min ematen dit / didate**. Síntomas con eduki (**sukarra, eztula, hotzeria daukat**) o egon (**gaixorik, zorabiatuta nago**). **Zer duzu? Noiztik?** · **Hartu… / Edan… / Ondo sendatu!**"}],"examples":[["Buruko mina daukat.","Tengo dolor de cabeza."],["Buruak min ematen dit.","Me duele la cabeza."],["Begiek min ematen didate.","Me duelen los ojos."],["Sukarra daukat.","Tengo fiebre."],["Gaixorik nago.","Estoy enfermo."],["Atzotik eztula daukat.","Tengo tos desde ayer."],["Hartu pilula hau egunean hiru aldiz.","Tome esta pastilla tres veces al día."]],"dialog":{"title":"En el centro de salud","lines":[["Medikua","Egun on. Zer duzu?","Buenos días. ¿Qué le pasa?"],["Iker","Buruak min ematen dit, eta sukarra daukat.","Me duele la cabeza, y tengo fiebre."],["Medikua","Noiztik?","¿Desde cuándo?"],["Iker","Atzotik. Eztarriko mina ere badaukat.","Desde ayer. También tengo dolor de garganta."],["Medikua","Hotzeria da. Hartu pilula hau egunean hiru aldiz, eta edan ur asko.","Es un resfriado. Tome esta pastilla tres veces al día, y beba mucha agua."],["Iker","Eskerrik asko!","¡Muchas gracias!"],["Medikua","Ez horregatik. Ondo sendatu!","De nada. ¡Que se mejore!"]]},"exercises":[{"type":"gap","q":"Buruko mina ___.","es":"Tengo dolor de cabeza.","a":["daukat"],"hint":"eduki, yo: daukat."},{"type":"gap","q":"Buruak min ematen ___.","es":"Me duele la cabeza.","a":["dit"],"hint":"la cabeza (él) → a mí: dit."},{"type":"gap","q":"Begiek min ematen ___.","es":"Me duelen los ojos.","a":["didate"],"hint":"los ojos (ellos) → a mí: didate."},{"type":"gap","q":"Gaixorik ___.","es":"Estoy enfermo.","a":["nago"],"hint":"Estado: egon → nago."},{"type":"gap","q":"Atzo___ eztula daukat.","es":"Tengo tos desde ayer.","a":["tik"],"hint":"desde = -tik."},{"type":"gap","q":"Hanka___ min ematen dit.","es":"Me duele la pierna.","a":["k"],"hint":"Lo que duele lleva -k (hanka acaba en vocal)."},{"type":"choice","q":"«Me duele la cabeza»","options":["Buruak min ematen dit.","Burua min ematen dit.","Buruak min ematen dut."],"a":0,"why":"La cabeza «da» el dolor: lleva -k, y el auxiliar es dit."},{"type":"choice","q":"«Me duelen los pies»","options":["Oinek min ematen didate.","Oinak min ematen dit.","Oinek min ematen dit."],"a":0,"why":"Plural: oinek y didate."},{"type":"choice","q":"«Tengo fiebre»","options":["Sukarra daukat.","Sukarra nago.","Sukarrik daukat."],"a":0,"why":"eduki con artículo; el partitivo solo en negativa."},{"type":"choice","q":"«¿Desde cuándo?»","options":["Noiztik?","Noiz arte?","Nondik?"],"a":0,"why":"noiz + -tik = desde cuándo. Nondik es «de dónde»."},{"type":"choice","q":"«¡Que te mejores!»","options":["Ondo sendatu!","On egin!","Zorionak!"],"a":0,"why":"On egin = que aproveche; Zorionak = felicidades."},{"type":"order","words":["daukat","Buruko","mina"],"a":["Buruko mina daukat"],"es":"Tengo dolor de cabeza.","hint":"Buruko mina + daukat."},{"type":"order","words":["dit","Buruak","min","ematen"],"a":["Buruak min ematen dit"],"es":"Me duele la cabeza.","hint":"Buruak + min ematen + dit."},{"type":"order","words":["eztula","Atzotik","daukat"],"a":["Atzotik eztula daukat","Eztula daukat atzotik"],"es":"Tengo tos desde ayer.","hint":"Desde cuándo + síntoma + daukat."},{"type":"match","pairs":[["buruko mina","dolor de cabeza"],["sukarra","fiebre"],["eztula","tos"],["hotzeria","resfriado"],["gaixorik","enfermo"],["zorabiatuta","mareado"]]}],"create":{"prompt":"Escribe un diálogo breve en la consulta del médico (6 líneas): explica qué te duele, desde cuándo y cómo te encuentras, y escribe lo que te recomienda el médico.","focus":"…-ko mina daukat, …-k min ematen dit/didate, síntomas, -tik (desde), imperativo con participio"},"links":{"verbs":["nnn-pres"],"cases":["erg","abl"],"themes":["osasuna","gorputza"]}},"a2-13":{"id":"a2-13","lvl":"A2","n":13,"title":"Erosi dudan liburua","es":"Oraciones de relativo","goal":"Decir «el libro que he comprado», «el amigo que vive en Bilbao», «lo que quieras».","explain":[{"h":"Antes de empezar","p":"Empiezan las oraciones subordinadas, el paso que te permite construir frases largas y naturales. El euskera tiene una forma muy regular de hacerlas: pega una terminación al verbo de la oración subordinada. Hoy aprendes la primera y más usada, la del relativo («que»)."},{"h":"La forma: auxiliar + -(e)n","p":"El auxiliar de la oración subordinada toma **-n** (o **-en** tras consonante): **dut → dudan**, **da → den**. Y aquí viene lo importante: **la oración va delante del nombre**, justo al revés que en español. **Erosi dudan liburua** = el libro que he comprado (literalmente «comprado-he-que libro-el»).","table":{"head":["Forma","Relativo","Forma","Relativo"],"rows":[["dut","dudan","naiz","naizen"],["duzu","duzun","zara","zaren"],["du","duen","da","den"],["dugu","dugun","gara","garen"],["duzue","duzuen","zarete","zareten"],["dute","duten","dira","diren"],["dago","dagoen","zait","zaidan"],["daukat","daukadan","ditut","ditudan"]]}},{"h":"Fíjate en los cambios","p":"La **-t** final se convierte en **-d-**: dut → **dudan**, daukat → **daukadan**, zait → **zaidan**. Tras vocal se añade **-n** (duzu → **duzun**) y tras **u** o consonante, **-en** (du → **duen**, dago → **dagoen**). El artículo va al final del grupo: Bilbon bizi den lagun**a**."},{"h":"Sin nombre: «lo que…»","p":"Si no hay nombre detrás, el relativo lleva el artículo directamente: **Erosi dudana** (lo que he comprado), **Nahi duzuna** (lo que quieras), **Esan duena** (lo que ha dicho). **Egin nahi duzuna** = haz lo que quieras."},{"h":"Paso a paso: «La chica que está ahí es mi hermana»","p":"1) Oración subordinada: **hor dago** (está ahí). 2) Relativo: dago → **dagoen**. 3) Nombre detrás: **hor dagoen neska**. 4) Resto de la frase: **Hor dagoen neska nire ahizpa da**."},{"h":"Errores típicos","p":"*Liburua erosi dudan* → **Erosi dudan liburua** (la oración va delante). *dutan* → **dudan**. *Bilbon bizi da laguna* → **Bilbon bizi den laguna**. *Nahi duzun* para «lo que quieras» sin nombre → **Nahi duzuna**."},{"h":"Resumen","p":"Relativo = auxiliar + **-(e)n** (dudan, den, dagoen, zaidan…), **oración delante del nombre**: erosi dudan liburua. Sin nombre: **-na** (nahi duzuna, lo que quieras)."}],"examples":[["Erosi dudan liburua oso ona da.","El libro que he comprado es muy bueno."],["Bilbon bizi den laguna Mikel da.","El amigo que vive en Bilbao es Mikel."],["Hor dagoen gizona nire aita da.","El hombre que está ahí es mi padre."],["Gustatzen zaidan musika.","La música que me gusta."],["Euskara ikasten duten ikasleak.","Los estudiantes que estudian euskera."],["Egin nahi duzuna.","Haz lo que quieras."],["Daukadan kotxea zaharra da.","El coche que tengo es viejo."]],"dialog":{"title":"Hablando de libros","lines":[["Nerea","Zein da irakurtzen ari zaren liburua?","¿Cuál es el libro que estás leyendo?"],["Iker","Amak erosi duen liburua da.","Es el libro que ha comprado mi madre."],["Nerea","Gustatzen zaizu?","¿Te gusta?"],["Iker","Bai! Irakurri dudan libururik onena da.","¡Sí! Es el mejor libro que he leído."],["Nerea","Utziko didazu?","¿Me lo prestarás?"],["Iker","Bai, noski. Bihar ekarriko dizut.","Sí, claro. Te lo traeré mañana."]]},"exercises":[{"type":"gap","q":"Erosi ___ liburua oso ona da.","es":"El libro que he comprado es muy bueno.","a":["dudan"],"hint":"dut + -n → dudan (la -t pasa a -d-)."},{"type":"gap","q":"Bilbon bizi ___ laguna Mikel da.","es":"El amigo que vive en Bilbao es Mikel.","a":["den"],"hint":"da + -en → den."},{"type":"gap","q":"Hor ___ gizona nire aita da.","es":"El hombre que está ahí es mi padre.","a":["dagoen"],"hint":"dago + -en → dagoen."},{"type":"gap","q":"Gustatzen ___ musika.","es":"La música que me gusta.","a":["zaidan"],"hint":"zait + -n → zaidan."},{"type":"gap","q":"Euskara ikasten ___ ikasleak.","es":"Los estudiantes que estudian euskera.","a":["duten"],"hint":"dute + -n → duten."},{"type":"gap","q":"Egin nahi ___.","es":"Haz lo que quieras.","a":["duzuna"],"hint":"Sin nombre detrás: duzu + -n + -a."},{"type":"choice","q":"«El libro que he comprado»","options":["erosi dudan liburua","liburua erosi dudan","erosi dut liburua"],"a":0,"why":"La oración de relativo va delante del nombre."},{"type":"choice","q":"«El amigo que vive en Bilbao»","options":["Bilbon bizi den laguna","laguna Bilbon bizi den","Bilbon bizi da laguna"],"a":0,"why":"Oración con -(e)n + nombre."},{"type":"choice","q":"Relativo de dute:","options":["duten","duteen","duden"],"a":0,"why":"Tras vocal se añade -n: duten."},{"type":"choice","q":"«Lo que quieras»","options":["nahi duzuna","nahi duzun","nahi duzu"],"a":0,"why":"Sin nombre, el relativo lleva artículo: -na."},{"type":"choice","q":"«La música que me gusta»","options":["gustatzen zaidan musika","gustatzen zait musika","musika gustatzen zaidan"],"a":0,"why":"zait → zaidan, delante del nombre."},{"type":"order","words":["dudan","Erosi","liburua"],"a":["Erosi dudan liburua"],"es":"El libro que he comprado.","hint":"Verbo + relativo + nombre."},{"type":"order","words":["den","Bilbon","laguna","bizi"],"a":["Bilbon bizi den laguna"],"es":"El amigo que vive en Bilbao.","hint":"Lugar + bizi + den + nombre."},{"type":"order","words":["dagoen","gizona","Hor"],"a":["Hor dagoen gizona"],"es":"El hombre que está ahí.","hint":"Hor + dagoen + nombre."},{"type":"match","pairs":[["dudan","que (yo) he / tengo"],["duen","que (él) ha / tiene"],["naizen","que (yo) soy"],["den","que es / ha"],["dagoen","que está"],["zaidan","que me (gusta…)"]]}],"create":{"prompt":"Describe 5 cosas o personas de tu vida con oraciones de relativo: «el libro que estoy leyendo…», «el amigo que vive en…», «la música que me gusta…», «el coche que tengo…».","focus":"relativo -(e)n (dudan, den, dagoen, zaidan…) delante del nombre; -na sin nombre"},"links":{"verbs":["nn-pres-3","nor-pres"],"cases":[],"themes":["lokailuak"]}},"a2-14":{"id":"a2-14","lvl":"A2","n":14,"title":"Etorriko dela esan du","es":"Oraciones con -(e)la","goal":"Contar lo que alguien dice, lo que crees y lo que sabes: «dice que…», «creo que…».","explain":[{"h":"Antes de empezar","p":"Segunda terminación de subordinada, igual de regular que la anterior. Con ella reproduces lo que dicen otros y das tu opinión: «ha dicho que vendrá», «creo que tienes razón», «sé que es difícil». En lugar de -n, el auxiliar toma **-la**."},{"h":"La forma: auxiliar + -(e)la","p":"**da → dela**, **dut → dudala**, **dago → dagoela**. Los cambios son los mismos que en el relativo (-t → -d-, y -e- tras u o consonante): **dut → dudala**, **du → duela**, **naiz → naizela**, **zara → zarela**, **dira → direla**, **dute → dutela**."},{"h":"Con qué verbos","p":"**esan** (decir): **Etorriko dela esan du** (ha dicho que vendrá). **uste izan** (creer): **Uste dut arrazoia duzula** (creo que tienes razón). **jakin** (saber): **Badakit zaila dela** (sé que es difícil). **entzun** (oír): **Entzun dut Bilbon bizi zarela** (he oído que vives en Bilbao). La subordinada puede ir delante o detrás: **Ane etxean dagoela uste dut** = **Uste dut Ane etxean dagoela**."},{"h":"esan como verbo sintético","p":"Para «dice» o «digo» en presente se usa a menudo la forma sintética de esan: **diot** (digo), **diozu** (dices), **dio** (dice), **diogu**, **diozue**, **diote** (dicen). Son las mismas formas que viste en NOR-NORI-NORK, pero aquí significan «decir»: **Mikelek dio nekatuta dagoela** (Mikel dice que está cansado)."},{"h":"Un aviso para B1","p":"Con «no creo que…» la terminación cambia a **-nik**: *Ez dut uste etorriko denik*. Lo verás en B1; de momento usa -la con verbos afirmativos."},{"h":"Paso a paso: «Creo que Ane está en casa»","p":"1) La idea: **Ane etxean dago**. 2) Subordinada: dago → **dagoela**. 3) Verbo principal: **uste dut**. 4) **Uste dut Ane etxean dagoela** (o **Ane etxean dagoela uste dut**)."},{"h":"Errores típicos","p":"*Etorriko da esan du* → **Etorriko dela esan du**. *Uste dut arrazoia duzu* → **duzula**. *Badakit zaila den* → **dela** (-n es para relativos e interrogativas). *dutela* bien; *duteela* → **dutela**."},{"h":"Resumen","p":"«que» completivo = auxiliar + **-(e)la** (dela, dudala, duela, dagoela, zarela…). Con esan, uste izan, jakin, entzun, pentsatu. esan sintético: **diot, dio, diote**."}],"examples":[["Etorriko dela esan du.","Ha dicho que vendrá."],["Uste dut Ane etxean dagoela.","Creo que Ane está en casa."],["Badakit euskara zaila dela.","Sé que el euskera es difícil."],["Mikelek dio nekatuta dagoela.","Mikel dice que está cansado."],["Entzun dut Bilbon bizi zarela.","He oído que vives en Bilbao."],["Uste dut arrazoia duzula.","Creo que tienes razón."],["Anek dio ez duela denborarik.","Ane dice que no tiene tiempo."]],"dialog":{"title":"¿Quién viene a la fiesta?","lines":[["Miren","Mikel festara etorriko da?","¿Mikel vendrá a la fiesta?"],["Jon","Bai, etorriko dela esan du. Baina berandu iritsiko dela dio.","Sí, ha dicho que vendrá. Pero dice que llegará tarde."],["Miren","Eta Ane?","¿Y Ane?"],["Jon","Uste dut gaixorik dagoela.","Creo que está enferma."],["Miren","Ene! Deituko diot.","¡Vaya! La llamaré."],["Jon","Ondo iruditzen zait.","Me parece bien."]]},"exercises":[{"type":"gap","q":"Etorriko ___ esan du.","es":"Ha dicho que vendrá.","a":["dela"],"hint":"da + -la → dela."},{"type":"gap","q":"Uste dut Ane etxean ___.","es":"Creo que Ane está en casa.","a":["dagoela"],"hint":"dago + -ela → dagoela."},{"type":"gap","q":"Badakit euskara zaila ___.","es":"Sé que el euskera es difícil.","a":["dela"],"hint":"da + -la → dela."},{"type":"gap","q":"Mikelek ___ nekatuta dagoela.","es":"Mikel dice que está cansado.","a":["dio"],"hint":"esan sintético, él: dio."},{"type":"gap","q":"Entzun dut Bilbon bizi ___.","es":"He oído que vives en Bilbao.","a":["zarela"],"hint":"zara + -la → zarela."},{"type":"gap","q":"Uste dut arrazoia ___.","es":"Creo que tienes razón.","a":["duzula"],"hint":"duzu + -la → duzula."},{"type":"choice","q":"«Ha dicho que vendrá»","options":["Etorriko dela esan du.","Etorriko da esan du.","Etorriko den esan du."],"a":0,"why":"Completiva: -(e)la."},{"type":"choice","q":"«Creo que tienes razón»","options":["Uste dut arrazoia duzula.","Uste dut arrazoia duzu.","Uste dut arrazoia duzun."],"a":0,"why":"Después de uste dut, la subordinada con -la."},{"type":"choice","q":"«Mikel dice que está cansado»","options":["Mikelek dio nekatuta dagoela.","Mikel dio nekatuta dago.","Mikelek esan nekatuta dagoela."],"a":0,"why":"Mikelek (con -k) + dio + subordinada con -la."},{"type":"choice","q":"«Sé que es difícil»","options":["Badakit zaila dela.","Badakit zaila da.","Badakit zaila den."],"a":0,"why":"Saber que…: -la."},{"type":"choice","q":"Forma con -la de dute:","options":["dutela","duteela","dutena"],"a":0,"why":"Tras vocal, solo -la."},{"type":"order","words":["dela","esan","Etorriko","du"],"a":["Etorriko dela esan du"],"es":"Ha dicho que vendrá.","hint":"Subordinada + esan du."},{"type":"order","words":["dagoela","Uste","dut","etxean","Ane"],"a":["Uste dut Ane etxean dagoela","Ane etxean dagoela uste dut"],"es":"Creo que Ane está en casa.","hint":"Uste dut + subordinada (o al revés)."},{"type":"order","words":["zaila","Badakit","dela","euskara"],"a":["Badakit euskara zaila dela","Euskara zaila dela badakit"],"es":"Sé que el euskera es difícil.","hint":"Badakit + subordinada (o al revés)."},{"type":"match","pairs":[["dela","que es"],["naizela","que soy"],["dudala","que (yo) he / tengo"],["duela","que (él) ha / tiene"],["dagoela","que está"],["dio","dice"]]}],"create":{"prompt":"Escribe 5 frases: dos cosas que te han dicho hoy (… esan dit / … dio), dos opiniones (Uste dut …-la) y algo que sabes (Badakit …-la).","focus":"completivas -(e)la con esan, uste izan, jakin, entzun; esan sintético (dio, diot)"},"links":{"verbs":["syn-pres-2","nor-pres","nn-pres-3"],"cases":[],"themes":["lokailuak","aditzak"]}},"a2-15":{"id":"a2-15","lvl":"A2","n":15,"title":"Etortzen naizenean","es":"Oraciones con -nean","goal":"Decir cuándo pasa algo: «cuando llego a casa», «cuando era pequeño», «cuando vengas».","explain":[{"h":"Antes de empezar","p":"Tercera terminación de subordinada. Con el relativo aprendiste a añadir **-(e)n** al auxiliar; para decir «cuando», solo tienes que añadir encima **-ean**, la terminación de «en» que conoces desde el A1. Literalmente: «en el (momento) que llego»."},{"h":"La forma: relativo + -ean","p":"**naizen → naizenean**, **dudan → dudanean**, **den → denean**, **dagoen → dagoenean**. **Etxera iristen naizenean, afaltzen dut** (cuando llego a casa, ceno). Lo normal es poner la oración con -nean delante, como en español «cuando…, …».","table":{"head":["Relativo","Cuando…","Relativo","Cuando…"],"rows":[["naizen","naizenean","dudan","dudanean"],["zaren","zarenean","duzun","duzunean"],["den","denean","duen","duenean"],["garen","garenean","dugun","dugunean"],["diren","direnean","duten","dutenean"],["nagoen","nagoenean","nintzen","nintzenean"]]}},{"h":"Para el futuro: forma habitual","p":"Atención, porque es distinto del español: para «cuando vengas» (futuro) el euskera usa la forma **habitual** en la subordinada: **Etortzen zarenean, afalduko dugu** (cuando vengas, cenaremos). **Bilbora joaten naizenean, deituko dizut** (cuando vaya a Bilbao, te llamaré)."},{"h":"En pasado","p":"Las formas de pasado ya acaban en -n, así que solo se añade **-ean**: **nintzen → nintzenean**, **nuen → nuenean**. **Txikia nintzenean, Bilbon bizi nintzen** (cuando era pequeño, vivía en Bilbao)."},{"h":"Paso a paso: «Cuando estoy cansado, escucho música»","p":"1) Subordinada: **nekatuta nago**. 2) Relativo: nago → **nagoen**; + -ean → **nagoenean**. 3) Principal: **musika entzuten dut**. → **Nekatuta nagoenean, musika entzuten dut**."},{"h":"Errores típicos","p":"*Etxera iristen naizen, afaltzen dut* → **naizenean**. *Etorriko zarenean* para «cuando vengas» → la forma más recomendada es **etortzen zarenean**. *Txikia naizenean* para «cuando era pequeño» → **nintzenean**. *dutean* → **dutenean**."},{"h":"Resumen","p":"«cuando» = relativo + **-ean**: naizenean, dudanean, denean, nagoenean, nintzenean. Futuro: forma habitual en la subordinada (**etortzen zarenean, afalduko dugu**)."}],"examples":[["Etxera iristen naizenean, afaltzen dut.","Cuando llego a casa, ceno."],["Txikia nintzenean, Bilbon bizi nintzen.","Cuando era pequeño, vivía en Bilbao."],["Euria ari duenean, etxean geratzen naiz.","Cuando llueve, me quedo en casa."],["Bilbora joaten naizenean, deituko dizut.","Cuando vaya a Bilbao, te llamaré."],["Nekatuta nagoenean, musika entzuten dut.","Cuando estoy cansado, escucho música."],["Lana bukatzen dudanean, mendira joango naiz.","Cuando termine el trabajo, iré al monte."]],"dialog":{"title":"Costumbres","lines":[["Ane","Zer egiten duzu lanetik ateratzen zarenean?","¿Qué haces cuando sales del trabajo?"],["Iker","Etxera iristen naizenean, korrika egiten dut parkean.","Cuando llego a casa, corro en el parque."],["Ane","Eta euria ari duenean?","¿Y cuando llueve?"],["Iker","Euria ari duenean, liburu bat irakurtzen dut.","Cuando llueve, leo un libro."],["Ane","Txikia nintzenean, euria asko gustatzen zitzaidan!","¡Cuando era pequeña, me gustaba mucho la lluvia!"],["Iker","Niri ere bai!","¡A mí también!"]]},"exercises":[{"type":"gap","q":"Etxera iristen ___, afaltzen dut.","es":"Cuando llego a casa, ceno.","a":["naizenean"],"hint":"naiz → naizen → naizenean."},{"type":"gap","q":"Txikia ___, Bilbon bizi nintzen.","es":"Cuando era pequeño, vivía en Bilbao.","a":["nintzenean"],"hint":"Pasado: nintzen + -ean."},{"type":"gap","q":"Euria ari ___, etxean geratzen naiz.","es":"Cuando llueve, me quedo en casa.","a":["duenean"],"hint":"du → duen → duenean."},{"type":"gap","q":"Nekatuta ___, musika entzuten dut.","es":"Cuando estoy cansado, escucho música.","a":["nagoenean"],"hint":"nago → nagoen → nagoenean."},{"type":"gap","q":"Lana bukatzen ___, mendira joango naiz.","es":"Cuando termine el trabajo, iré al monte.","a":["dudanean"],"hint":"dut → dudan → dudanean."},{"type":"gap","q":"Zu etortzen ___, afalduko dugu.","es":"Cuando vengas, cenaremos.","a":["zarenean"],"hint":"zara → zaren → zarenean."},{"type":"choice","q":"«Cuando llego a casa»","options":["etxera iristen naizenean","etxera iristen naizen","etxera iristen naizela"],"a":0,"why":"«cuando» = -nean."},{"type":"choice","q":"«Cuando era pequeño»","options":["txikia nintzenean","txikia naizenean","txikia nintzen"],"a":0,"why":"Pasado + -ean."},{"type":"choice","q":"«Cuando vengas, cenaremos»","options":["Etortzen zarenean, afalduko dugu.","Etortzen zara, afalduko dugu.","Etortzen zarela, afalduko dugu."],"a":0,"why":"Forma habitual + -nean en la subordinada."},{"type":"choice","q":"«Cuando» con dute:","options":["dutenean","duteenean","dutean"],"a":0,"why":"dute → duten → dutenean."},{"type":"choice","q":"«Cuando llueve»","options":["euria ari duenean","euria ari denean","euria ari duela"],"a":0,"why":"euria ari du → duenean."},{"type":"order","words":["naizenean","Etxera","iristen"],"a":["Etxera iristen naizenean"],"es":"Cuando llego a casa.","hint":"Lugar + verbo + auxiliar con -nean."},{"type":"order","words":["dut","musika","entzuten","nagoenean","Nekatuta"],"a":["Nekatuta nagoenean musika entzuten dut","Musika entzuten dut nekatuta nagoenean"],"es":"Cuando estoy cansado, escucho música.","hint":"Subordinada con -nean + principal."},{"type":"order","words":["duenean","Euria","ari"],"a":["Euria ari duenean"],"es":"Cuando llueve.","hint":"Euria ari + duenean."},{"type":"match","pairs":[["naizenean","cuando (yo) soy / estoy (izan)"],["dudanean","cuando (yo)… (ukan)"],["denean","cuando es"],["duenean","cuando (él)… (ukan)"],["nintzenean","cuando (yo) era"],["nagoenean","cuando estoy"]]}],"create":{"prompt":"Escribe 5 frases con «cuando»: una costumbre actual, un recuerdo de cuando eras pequeño, qué haces cuando llueve, cómo te sientes cuando estás de vacaciones y un plan (cuando termine…, …).","focus":"-nean: relativo + -ean (naizenean, dudanean, nagoenean, nintzenean); forma habitual para el futuro"},"links":{"verbs":["nor-pres","nn-pres-3"],"cases":[],"themes":["denbora"]}},"a2-16":{"id":"a2-16","lvl":"A2","n":16,"title":"Nekatuta nagoelako","es":"Oraciones causales con -lako","goal":"Explicar por qué: «porque estoy cansado», «porque me gusta».","explain":[{"h":"Antes de empezar","p":"Última lección del A2. Para explicar el porqué, el euskera parte de la forma con **-la** que aprendiste hace dos lecciones y le añade **-ko**. Si recuerdas **dagoela** (que está), ya tienes **dagoelako** (porque está)."},{"h":"La forma: -(e)la + ko","p":"**dela → delako**, **dudala → dudalako**, **dagoela → dagoelako**, **zaidala → zaidalako**. **Ez naiz joango, nekatuta nagoelako** (no iré, porque estoy cansado). En pasado ocurre lo mismo: **zuen → zuela → zuelako** (porque tenía/había), **nengoen → nengoela → nengoelako** (porque estaba).","table":{"head":["-(e)la","porque…","-(e)la","porque…"],"rows":[["naizela","naizelako","dudala","dudalako"],["zarela","zarelako","duzula","duzulako"],["dela","delako","duela","duelako"],["garela","garelako","dutela","dutelako"],["nagoela","nagoelako","zaidala","zaidalako"]]}},{"h":"Responder a «zergatik?»","p":"La oración con -lako puede ir sola como respuesta: **Zergatik zaude pozik? — Oporretan nagoelako** (¿por qué estás contento? — porque estoy de vacaciones). Puede ir delante o detrás de la principal: **Gaixorik dagoelako, Mikel ez da etorri** = **Mikel ez da etorri, gaixorik dagoelako**."},{"h":"Otras formas de expresar la causa","p":"Para unir dos frases sin subordinar: **eta horregatik** (y por eso): **Nekatuta nago, eta horregatik ez naiz joango**. Verás más formas de causa (*-enez*, *bait-*) en B2."},{"h":"Paso a paso: «Estudio euskera porque me gusta»","p":"1) Principal: **euskara ikasten dut**. 2) Causa: **gustatzen zait**. 3) zait → zaidala → **zaidalako**. 4) **Euskara ikasten dut, gustatzen zaidalako**."},{"h":"Errores típicos","p":"*nekatuta nago lako* → **nagoelako** (va todo junto). *Gustatzen zait lako* → **zaidalako**. *berandu iritsi duelako* para alguien que llega → **delako** (iritsi va con izan). *nekatuta nagoela* para «porque» → **nagoelako**."},{"h":"Resumen","p":"«porque» = forma con -(e)la + **-ko**: delako, naizelako, dudalako, duelako, nagoelako, zaidalako. Respuesta a **Zergatik?**: solo la oración con -lako. Alternativa: **eta horregatik**. Con esta lección has completado el A2. Zorionak!"}],"examples":[["Ez naiz joango, nekatuta nagoelako.","No iré, porque estoy cansado."],["Euskara ikasten dut, gustatzen zaidalako.","Estudio euskera porque me gusta."],["Zergatik zaude pozik? Oporretan nagoelako.","¿Por qué estás contento? Porque estoy de vacaciones."],["Berandu iritsi da, autobusa galdu duelako.","Ha llegado tarde porque ha perdido el autobús."],["Etxean geratu ginen, euria ari zuelako.","Nos quedamos en casa porque llovía."],["Mikel ez da etorri, gaixorik dagoelako.","Mikel no ha venido porque está enfermo."]],"dialog":{"title":"La fiesta de ayer","lines":[["Nerea","Zergatik ez zinen atzo festara etorri?","¿Por qué no viniste ayer a la fiesta?"],["Jon","Ez nintzen joan, oso nekatuta nengoelako.","No fui porque estaba muy cansado."],["Nerea","Ene! Asko lan egin zenuen?","¡Vaya! ¿Trabajaste mucho?"],["Jon","Bai, eta gainera gaixorik nengoen.","Sí, y además estaba enfermo."],["Nerea","Eta orain ondo zaude?","¿Y ahora estás bien?"],["Jon","Bai, ondo nago, gaur lo asko egin dudalako.","Sí, estoy bien, porque hoy he dormido mucho."]]},"exercises":[{"type":"gap","q":"Ez naiz joango, nekatuta ___.","es":"No iré, porque estoy cansado.","a":["nagoelako"],"hint":"nago → nagoela → nagoelako."},{"type":"gap","q":"Euskara ikasten dut, gustatzen ___.","es":"Estudio euskera porque me gusta.","a":["zaidalako"],"hint":"zait → zaidala → zaidalako."},{"type":"gap","q":"Berandu iritsi da, autobusa galdu ___.","es":"Ha llegado tarde porque ha perdido el autobús.","a":["duelako"],"hint":"du → duela → duelako."},{"type":"gap","q":"Mikel ez da etorri, gaixorik ___.","es":"Mikel no ha venido porque está enfermo.","a":["dagoelako"],"hint":"dago → dagoela → dagoelako."},{"type":"gap","q":"Pozik gaude, oporretan ___.","es":"Estamos contentos porque estamos de vacaciones.","a":["gaudelako"],"hint":"gaude → gaudela → gaudelako."},{"type":"gap","q":"Etxean geratu ginen, euria ari ___.","es":"Nos quedamos en casa porque llovía.","a":["zuelako"],"hint":"Pasado: zuen → zuela → zuelako."},{"type":"choice","q":"«Porque estoy cansado»","options":["nekatuta nagoelako","nekatuta nagoela","nekatuta nago lako"],"a":0,"why":"-(e)la + ko, todo junto."},{"type":"choice","q":"«Porque ha llegado tarde»","options":["berandu iritsi delako","berandu iritsi dela","berandu iritsi duelako"],"a":0,"why":"iritsi va con izan: da → delako."},{"type":"choice","q":"«¿Por qué? — Porque me gusta»","options":["Gustatzen zaidalako.","Gustatzen zait lako.","Gustatzen zaidala."],"a":0,"why":"zait → zaidalako."},{"type":"choice","q":"«Porque» con dute:","options":["dutelako","duteelako","dutenlako"],"a":0,"why":"dute → dutela → dutelako."},{"type":"choice","q":"«Y por eso»","options":["eta horregatik","eta zergatik","eta -lako"],"a":0,"why":"horregatik = por eso; zergatik = por qué."},{"type":"order","words":["joango","naiz","Ez","nekatuta","nagoelako"],"a":["Ez naiz joango nekatuta nagoelako","Nekatuta nagoelako ez naiz joango"],"es":"No iré porque estoy cansado.","hint":"Principal + causa con -lako (o al revés)."},{"type":"order","words":["zaidalako","ikasten","Euskara","dut","gustatzen"],"a":["Euskara ikasten dut gustatzen zaidalako","Gustatzen zaidalako euskara ikasten dut"],"es":"Estudio euskera porque me gusta.","hint":"Principal + causa con -lako (o al revés)."},{"type":"order","words":["etorri","Mikel","ez","da","gaixorik","dagoelako"],"a":["Mikel ez da etorri gaixorik dagoelako","Gaixorik dagoelako Mikel ez da etorri"],"es":"Mikel no ha venido porque está enfermo.","hint":"Principal negativa + causa (o al revés)."},{"type":"match","pairs":[["naizelako","porque soy"],["nagoelako","porque estoy"],["dudalako","porque (yo)… (ukan)"],["duelako","porque (él)… (ukan)"],["zaidalako","porque me (gusta…)"],["delako","porque es / ha"]]}],"create":{"prompt":"Explica en 5 frases por qué estudias euskera, por qué te gusta (o no) tu ciudad, y por qué hiciste o no hiciste algo la semana pasada. Usa -lako y una vez «eta horregatik».","focus":"causales -lako (delako, dudalako, nagoelako, zaidalako…), eta horregatik"},"links":{"verbs":["nor-pres","nn-pres-3"],"cases":[],"themes":["lokailuak"]}},"b1-01":{"id":"b1-01","lvl":"B1","n":1,"title":"Iragana osoa","es":"NOR-NORK en pasado con personas","goal":"Contar en pasado acciones entre personas: «te vi», «me ayudó», «nos invitaron».","explain":[{"h":"Antes de empezar","p":"Bienvenido al B1. En el A2 aprendiste el NOR-NORK con personas en presente (**ikusi zaitut**, te he visto). Ahora completas ese paradigma con el pasado (**ikusi zintudan**, te vi). Con esto tendrás el sistema de ukan completo en indicativo."},{"h":"La lógica","p":"Igual que en presente, **el principio indica a quién** ({nor:NOR}) y **el final indica quién lo hace** ({nork:NORK}), y todo termina en **-n**, como los demás pasados. Inicios de NOR: **nind-** (me), **zint-** (te), **gint-** (nos), **zintuzte-** (os). Finales de NORK: **-da-n** (yo, porque la -t pasa a -d-), **-zu-n** (tú), **-en** (él), **-gu-n** (nosotros), **-zue-n** (vosotros), **-te-n** (ellos)."},{"h":"La tabla","table":{"head":["A quién ↓ / quién →","nik (yo)","zuk (tú)","hark (él)","guk","zuek","haiek"],"rows":[["ni (me)","—","{nor:ninduzun}","{nor:ninduen}","—","{nor:ninduzuen}","{nor:ninduten}"],["zu (te)","{nor:zintudan}","—","{nor:zintuen}","{nor:zintugun}","—","{nor:zintuzten}"],["gu (nos)","—","{nor:gintuzun}","{nor:gintuen}","—","{nor:gintuzuen}","{nor:gintuzten}"],["zuek (os)","{nor:zintuztedan}","—","{nor:zintuzten}","{nor:zintuztegun}","—","{nor:zintuzteten}"]]}},{"h":"Una coincidencia","p":"**zintuzten** significa tanto «ellos te…» como «él os…». El contexto, o el sujeto con -k (**haiek** o **hark**), deja claro cuál es."},{"h":"Paso a paso: «Tus amigos te invitaron»","p":"1) Sujeto con -k: **zure lagunek**. 2) Verbo: **gonbidatu**. 3) Auxiliar: a quién = te (**zint-**), quién = ellos (**-te-n**) → **zintuzten**. 4) **Zure lagunek gonbidatu zintuzten**."},{"h":"Errores típicos","p":"*Atzo ikusi zaitut* → **ikusi zintudan** (atzo pide pasado). *Lagundu ninduzu* → **ninduzun** (falta la -n final del pasado). *zintutan* → **zintudan**. *Mikel lagundu ninduen* → **Mikelek**."},{"h":"Resumen","p":"Pasado con persona: inicio de NOR (**nind-, zint-, gint-, zintuzte-**) + final de NORK + **-n**: ninduen, zintudan, gintuzten, zintuztedan… Ya tienes todo el indicativo de ukan."}],"examples":[["Atzo kalean ikusi zintudan.","Ayer te vi en la calle."],["Mikelek lagundu ninduen.","Mikel me ayudó."],["Gure gurasoek bisitatu gintuzten.","Nuestros padres nos visitaron."],["Ez ninduzun ezagutu?","¿No me reconociste?"],["Zure lagunek gonbidatu zintuzten?","¿Tus amigos te invitaron?"],["Irakasleak zuzendu gintuen.","El profesor nos corrigió."]],"dialog":{"title":"Un encuentro que no fue","lines":[["Ane","Atzo kalean ikusi zintudan, baina zuk ez ninduzun ikusi.","Ayer te vi en la calle, pero tú no me viste."],["Iker","Benetan? Barkatu! Lagun batzuekin nengoen.","¿De verdad? ¡Perdona! Estaba con unos amigos."],["Ane","Bai, zure lagunek ikusi ninduten. Agurtu ninduten!","Sí, tus amigos me vieron. ¡Me saludaron!"],["Iker","Eta zergatik ez zinen gurekin etorri?","¿Y por qué no viniste con nosotros?"],["Ane","Lanera nindoan, presaka.","Iba al trabajo, con prisa."],["Iker","Hurrengoan gonbidatuko zaitugu!","¡La próxima vez te invitaremos!"]]},"exercises":[{"type":"gap","q":"Atzo kalean ikusi ___.","es":"Ayer te vi en la calle.","a":["zintudan"],"hint":"a quién = te (zint-), quién = yo (-da-n)."},{"type":"gap","q":"Mikelek lagundu ___.","es":"Mikel me ayudó.","a":["ninduen"],"hint":"a quién = me (nind-), quién = él (-en)."},{"type":"gap","q":"Gure gurasoek bisitatu ___.","es":"Nuestros padres nos visitaron.","a":["gintuzten"],"hint":"a quién = nos (gint-), quién = ellos (-zte-n)."},{"type":"gap","q":"Ez ___ ezagutu?","es":"¿No me reconociste?","a":["ninduzun"],"hint":"a quién = me, quién = tú → nind-u-zu-n."},{"type":"gap","q":"Zure lagunek gonbidatu ___?","es":"¿Tus amigos te invitaron?","a":["zintuzten"],"hint":"a quién = te, quién = ellos → zintuzten."},{"type":"gap","q":"Irakasleak zuzendu ___.","es":"El profesor nos corrigió.","a":["gintuen"],"hint":"a quién = nos, quién = él → gintuen."},{"type":"choice","q":"«Te vi»","options":["Ikusi zintudan.","Ikusi zaitut.","Ikusi ninduzun."],"a":0,"why":"Pasado: zintudan. Ikusi zaitut = te he visto; ikusi ninduzun = me viste."},{"type":"choice","q":"«Él me ayudó»","options":["Lagundu ninduen.","Lagundu nau.","Lagundu zuen."],"a":0,"why":"a quién = me, quién = él, pasado → ninduen."},{"type":"choice","q":"«Nos invitaron»","options":["Gonbidatu gintuzten.","Gonbidatu gaituzte.","Gonbidatu genituen."],"a":0,"why":"Pasado, nos + ellos → gintuzten. Gaituzte es presente."},{"type":"choice","q":"«¿No me reconociste?»","options":["Ez ninduzun ezagutu?","Ez zintudan ezagutu?","Ez ninduten ezagutu?"],"a":0,"why":"a quién = me, quién = tú → ninduzun."},{"type":"choice","q":"«Os vi» (yo)","options":["Ikusi zintuztedan.","Ikusi zintuzten.","Ikusi zaituztet."],"a":0,"why":"a quién = os, quién = yo, pasado → zintuztedan."},{"type":"order","words":["zintudan","Atzo","ikusi"],"a":["Atzo ikusi zintudan"],"es":"Ayer te vi.","hint":"Tiempo + verbo + auxiliar."},{"type":"order","words":["ninduen","Mikelek","lagundu"],"a":["Mikelek lagundu ninduen"],"es":"Mikel me ayudó.","hint":"Sujeto con -k + verbo + auxiliar."},{"type":"order","words":["gintuzten","gurasoek","Gure","bisitatu"],"a":["Gure gurasoek bisitatu gintuzten"],"es":"Nuestros padres nos visitaron.","hint":"Gure gurasoek + verbo + auxiliar."},{"type":"match","pairs":[["ninduzun","(tú) me…"],["ninduen","(él) me…"],["zintudan","(yo) te…"],["zintuen","(él) te…"],["gintuen","(él) nos…"],["gintuzten","(ellos) nos…"]]}],"create":{"prompt":"Cuenta en 5 frases un día del pasado en el que pasaron cosas entre personas: quién te vio, quién te ayudó, a quién viste tú, quién os invitó y quién te sorprendió.","focus":"NOR-NORK pasado con persona: ninduen, zintudan, gintuzten, zintuztedan…"},"links":{"verbs":["nn-past-x"],"cases":["erg"],"themes":["aditzak"]}},"b1-02":{"id":"b1-02","lvl":"B1","n":2,"title":"Baldintzak I","es":"El condicional real","goal":"Expresar condiciones posibles: «si llueve, me quedaré en casa», «si quieres, te ayudo».","explain":[{"h":"Antes de empezar","p":"Para decir «si…» en euskera no hace falta ninguna palabra aparte: basta con pegar **ba-** al principio del auxiliar o del verbo de la condición. Es una de las estructuras más útiles y más fáciles del B1."},{"h":"La forma","p":"**ba-** + auxiliar (o verbo sintético) de la condición: **badu** (si ha / si tiene), **bazara** (si eres / si estás), **badago** (si hay / si está). **Euria ari badu, etxean geratuko naiz** (si llueve, me quedaré en casa). **Nahi baduzu, lagunduko zaitut** (si quieres, te ayudaré). Lo normal es poner la condición delante.","table":{"head":["Forma","Condición","Forma","Condición"],"rows":[["naiz","banaiz","dut","badut"],["zara","bazara","duzu","baduzu"],["da","bada","du","badu"],["gara","bagara","dugu","badugu"],["dira","badira","dute","badute"],["nago","banago","daukazu","badaukazu"]]}},{"h":"Qué tiempo usar en la condición","p":"Para condiciones sobre el futuro, **forma habitual**, como con -nean: **Etortzen bazara, afalduko dugu** (si vienes, cenaremos). Para algo ya hecho, **perfecto**: **Liburua irakurri baduzu…** (si has leído el libro…). Con verbos sintéticos, presente: **Nekatuta bazaude, atseden hartu** (si estás cansado, descansa)."},{"h":"Negación","p":"**ez** va delante del auxiliar con ba-: **Ez baduzu dirurik, nik ordainduko dut** (si no tienes dinero, pago yo). También se oye con el verbo delante: **Etortzen ez bazara…** (si no vienes…). Y para «si no, de lo contrario»: **bestela**."},{"h":"Dos ba- diferentes","p":"Ya conocías el **ba-** de afirmación (**Badago** = sí, hay). Se escriben igual, pero el de condición forma parte de una oración subordinada, normalmente seguida de una coma: **Ogirik badago, erosiko dut** (si hay pan, lo compraré)."},{"h":"Paso a paso: «Si llegamos a tiempo, veremos la película entera»","p":"1) Condición: **garaiz iristen gara** (habitual, porque es futuro). 2) ba-: **garaiz iristen bagara**. 3) Principal en futuro: **filma osoa ikusiko dugu**. → **Garaiz iristen bagara, filma osoa ikusiko dugu**."},{"h":"Errores típicos","p":"*Nahi duzu ba* → **Nahi baduzu**. *Euria ari bada* → **badu** (euria ari du). *Ez duzu dirurik ba* → **Ez baduzu dirurik**. Confundir con «cuando»: **etortzen zarenean** (cuando vengas, seguro) frente a **etortzen bazara** (si vienes, quizá)."},{"h":"Resumen","p":"«si» = **ba-** + auxiliar: banaiz, bada, badut, baduzu, badago… Futuro: forma habitual en la condición. Negación: **ez baduzu…**. **bestela** = si no."}],"examples":[["Euria ari badu, etxean geratuko naiz.","Si llueve, me quedaré en casa."],["Nahi baduzu, lagunduko zaitut.","Si quieres, te ayudaré."],["Etortzen bazara, afalduko dugu.","Si vienes, cenaremos."],["Nekatuta bazaude, atseden hartu.","Si estás cansado, descansa."],["Ez baduzu dirurik, nik ordainduko dut.","Si no tienes dinero, pagaré yo."],["Ogirik badago, erosiko dut.","Si hay pan, lo compraré."],["Garaiz iristen bagara, filma osoa ikusiko dugu.","Si llegamos a tiempo, veremos la película entera."]],"dialog":{"title":"Planes para el monte","lines":[["Iker","Bihar mendira joango gara?","¿Iremos mañana al monte?"],["Nerea","Eguraldi ona badago, bai. Euria ari badu, etxean geratuko naiz.","Si hace buen tiempo, sí. Si llueve, me quedaré en casa."],["Iker","Ados. Goiz jaikitzen bagara, gailurrera iritsiko gara.","De acuerdo. Si nos levantamos temprano, llegaremos a la cima."],["Nerea","Zu goiz jaikitzen bazara, ni ere bai!","¡Si tú te levantas temprano, yo también!"],["Iker","Nahi baduzu, zure etxera joango naiz autoz.","Si quieres, iré a tu casa en coche."],["Nerea","Primeran! Bestela, autobusez joango naiz.","¡Estupendo! Si no, iré en autobús."]]},"exercises":[{"type":"gap","q":"Euria ari ___, etxean geratuko naiz.","es":"Si llueve, me quedaré en casa.","a":["badu"],"hint":"euria ari du → ba- + du."},{"type":"gap","q":"Nahi ___, lagunduko zaitut.","es":"Si quieres, te ayudaré.","a":["baduzu"],"hint":"nahi duzu → ba- + duzu."},{"type":"gap","q":"Etortzen ___, afalduko dugu.","es":"Si vienes, cenaremos.","a":["bazara"],"hint":"etortzen zara → ba- + zara."},{"type":"gap","q":"Nekatuta ___, atseden hartu.","es":"Si estás cansado, descansa.","a":["bazaude"],"hint":"nekatuta zaude → ba- + zaude."},{"type":"gap","q":"Ez ___ dirurik, nik ordainduko dut.","es":"Si no tienes dinero, pagaré yo.","a":["baduzu"],"hint":"ez + ba- + duzu."},{"type":"gap","q":"Goiz jaikitzen ___, gailurrera iritsiko gara.","es":"Si nos levantamos temprano, llegaremos a la cima.","a":["bagara"],"hint":"jaikitzen gara → ba- + gara."},{"type":"choice","q":"«Si quieres»","options":["nahi baduzu","nahi duzu ba","ba nahi duzu"],"a":0,"why":"ba- va pegado al auxiliar."},{"type":"choice","q":"«Si vienes, cenaremos»","options":["Etortzen bazara, afalduko dugu.","Etortzen zara ba, afalduko dugu.","Etortzen zarela, afalduko dugu."],"a":0,"why":"Condición: forma habitual + ba-."},{"type":"choice","q":"«Si no tienes dinero»","options":["Ez baduzu dirurik","Ez duzu dirurik ba","Ba ez duzu dirurik"],"a":0,"why":"ez + ba- + auxiliar, y partitivo por la negación."},{"type":"choice","q":"«Si hay pan, lo compraré»","options":["Ogirik badago, erosiko dut.","Ogirik dago ba, erosiko dut.","Ogirik badago, erosi dut."],"a":0,"why":"Condición con ba- y principal en futuro."},{"type":"choice","q":"«Si no, de lo contrario»","options":["bestela","beraz","gainera"],"a":0,"why":"beraz = así que; gainera = además."},{"type":"order","words":["badu","Euria","ari"],"a":["Euria ari badu"],"es":"Si llueve.","hint":"Euria ari + badu."},{"type":"order","words":["baduzu","Nahi","zaitut","lagunduko"],"a":["Nahi baduzu lagunduko zaitut","Lagunduko zaitut nahi baduzu"],"es":"Si quieres, te ayudaré.","hint":"Condición + principal (o al revés)."},{"type":"order","words":["bazara","Etortzen","dugu","afalduko"],"a":["Etortzen bazara afalduko dugu","Afalduko dugu etortzen bazara"],"es":"Si vienes, cenaremos.","hint":"Condición + principal (o al revés)."},{"type":"match","pairs":[["badut","si (yo) tengo / he"],["baduzu","si (tú) tienes / has"],["bada","si es"],["bazara","si eres / si (tú)…"],["badago","si hay / si está"],["bestela","si no"]]}],"create":{"prompt":"Escribe 5 frases con condiciones sobre tus planes del fin de semana: qué harás si hace buen tiempo, si llueve, si tienes tiempo, si viene alguien y qué pasará si no…","focus":"condicional real: ba- + auxiliar (badu, bazara, badago…), forma habitual para el futuro, bestela"},"links":{"verbs":["nor-pres","nn-pres-3"],"cases":[],"themes":["eguraldia","aisialdia"]}},"b1-03":{"id":"b1-03","lvl":"B1","n":3,"title":"Baldintzak II","es":"Hipótesis: si tuviera…, haría…","goal":"Hablar de situaciones imaginarias y pedir con cortesía: «si fuera rico, viajaría», «me gustaría…».","explain":[{"h":"Antes de empezar","p":"En la lección anterior viste las condiciones posibles (si llueve…). Hoy pasas a las imaginarias: «si tuviera dinero…», «si yo fuera tú…». Aparece un modo verbal nuevo, el **condicional**, que además es la base de la cortesía: **nahi nuke** (quisiera), que ya usabas como frase hecha desde el A1."},{"h":"La condición imaginaria: ba- + formas hipotéticas","p":"Con **izan**: **banintz** (si yo fuera), **bazina** (si tú fueras), **balitz** (si él fuera), **bagina**, **bazinete**, **balira**. Con **ukan** (tener / auxiliar): **banu** (si yo tuviera), **bazenu**, **balu**, **bagenu**, **bazenute**, **balute**.
