Con otros verbos, futuro en -ko + esas formas: **Mikel etorriko balitz** (si Mikel viniera)."},{"h":"La consecuencia: el condicional","table":{"head":["Persona","Con izan (sin objeto)","Con ukan (con objeto)"],"rows":[["ni / nik","{nor:nintzateke}","{nork:nuke}"],["zu / zuk","{nor:zinateke}","{nork:zenuke}"],["hura / hark","{nor:litzateke}","{nork:luke}"],["gu / guk","{nor:ginateke}","{nork:genuke}"],["zuek","{nor:zinatekete}","{nork:zenukete}"],["haiek","{nor:lirateke}","{nork:lukete}"]]},"p":"Se usa con el verbo en futuro (-ko): **joango nintzateke** (iría), **erosiko nuke** (compraría), **egongo nintzateke** (estaría). Fíjate en la **l-** de la 3.ª persona (**luke, litzateke**)."},{"h":"La frase completa","p":"**Diru asko banu, mundu osoa ezagutuko nuke** (si tuviera mucho dinero, conocería el mundo entero). **Ni zu banintz, ez nuke hori egingo** (si yo fuera tú, no haría eso). **Denbora bagenu, mendira joango ginateke** (si tuviéramos tiempo, iríamos al monte)."},{"h":"Cortesía y deseos","p":"**nahi nuke** (quisiera): **Kafe bat nahi nuke**. **Gustatuko litzaidake** (me gustaría), con el auxiliar NOR-NORI en condicional: **litzaidake** (a mí), **litzaizuke** (a ti), **litzaioke** (a él): **Gustatuko litzaidake Japonia ezagutzea**. Y **Polita litzateke** (sería bonito)."},{"h":"Paso a paso: «Si viniera Mikel, estaría contento»","p":"1) Condición: **etorri → etorriko** + izan hipotético de él → **Mikel etorriko balitz**. 2) Consecuencia: egon → **egongo** + izan condicional de yo → **pozik egongo nintzateke**. 3) **Mikel etorriko balitz, pozik egongo nintzateke**."},{"h":"Errores típicos","p":"*Diru asko badut, ezagutuko nuke* → **banu** (es imaginario). *Erosi nuke* → **erosiko nuke** (con -ko). *Pozik egongo nuke* → **nintzateke** (egon va con izan). *Gustatuko nuke* → **Gustatuko litzaidake**."},{"h":"Resumen","p":"Condición imaginaria: **banintz, balitz, banu, balu…** (+ participio en -ko con otros verbos). Consecuencia: **-ko + nuke / nintzateke** (luke, litzateke…). Cortesía: **nahi nuke**, **gustatuko litzaidake**, **polita litzateke**."}],"examples":[["Diru asko banu, mundu osoa ezagutuko nuke.","Si tuviera mucho dinero, conocería el mundo entero."],["Aberatsa banintz, ez nuke lan egingo.","Si fuera rico, no trabajaría."],["Mikel etorriko balitz, pozik egongo nintzateke.","Si Mikel viniera, estaría contento."],["Ni zu banintz, ez nuke hori egingo.","Si yo fuera tú, no haría eso."],["Kafe bat nahi nuke.","Quisiera un café."],["Gustatuko litzaidake Japonia ezagutzea.","Me gustaría conocer Japón."],["Denbora bagenu, mendira joango ginateke.","Si tuviéramos tiempo, iríamos al monte."]],"dialog":{"title":"Soñar despiertos","lines":[["Ane","Zer egingo zenuke diru asko bazenu?","¿Qué harías si tuvieras mucho dinero?"],["Jon","Diru asko banu, mundu osoa ezagutuko nuke. Eta zuk?","Si tuviera mucho dinero, conocería el mundo entero. ¿Y tú?"],["Ane","Nik etxe bat erosiko nuke itsasoaren ondoan.","Yo compraría una casa al lado del mar."],["Jon","Polita litzateke! Ni zu banintz, txakur bat ere erosiko nuke.","¡Sería bonito! Si yo fuera tú, también compraría un perro."],["Ane","Bai! Asko gustatuko litzaidake.","¡Sí! Me gustaría mucho."]]},"exercises":[{"type":"gap","q":"Diru asko ___, mundua ezagutuko nuke.","es":"Si tuviera mucho dinero, conocería el mundo.","a":["banu"],"hint":"si yo tuviera = banu."},{"type":"gap","q":"Aberatsa ___, ez nuke lan egingo.","es":"Si fuera rico, no trabajaría.","a":["banintz"],"hint":"si yo fuera = banintz."},{"type":"gap","q":"Mikel etorriko ___, pozik egongo nintzateke.","es":"Si Mikel viniera, estaría contento.","a":["balitz"],"hint":"si él… (izan) = balitz."},{"type":"gap","q":"Kafe bat nahi ___.","es":"Quisiera un café.","a":["nuke"],"hint":"Condicional de ukan, yo: nuke."},{"type":"gap","q":"Gustatuko ___ Japonia ezagutzea.","es":"Me gustaría conocer Japón.","a":["litzaidake"],"hint":"NOR-NORI en condicional, a mí: litzaidake."},{"type":"gap","q":"Denbora bagenu, mendira joango ___.","es":"Si tuviéramos tiempo, iríamos al monte.","a":["ginateke"],"hint":"Condicional de izan, nosotros: ginateke."},{"type":"choice","q":"«Si yo fuera tú»","options":["Ni zu banintz","Ni zu banaiz","Ni zu nintzen"],"a":0,"why":"Hipótesis: banintz. Banaiz es condición real."},{"type":"choice","q":"«Lo compraría»","options":["Erosiko nuke.","Erosi nuke.","Erosiko dut."],"a":0,"why":"Futuro en -ko + condicional nuke."},{"type":"choice","q":"«Estaría contento»","options":["Pozik egongo nintzateke.","Pozik egongo nuke.","Pozik nengoen."],"a":0,"why":"egon va con izan: nintzateke."},{"type":"choice","q":"«Si tuviéramos tiempo»","options":["Denbora bagenu","Denbora badugu","Denbora genuen"],"a":0,"why":"Hipótesis: bagenu. Badugu es condición real."},{"type":"choice","q":"«Me gustaría»","options":["Gustatuko litzaidake","Gustatuko nuke","Gustatzen zait"],"a":0,"why":"gustatu es NOR-NORI: litzaidake."},{"type":"order","words":["nuke","Kafe","bat","nahi"],"a":["Kafe bat nahi nuke"],"es":"Quisiera un café.","hint":"Lo que quieres + nahi nuke."},{"type":"order","words":["nintzateke","egongo","Pozik"],"a":["Pozik egongo nintzateke"],"es":"Estaría contento.","hint":"Pozik + egongo + nintzateke."},{"type":"order","words":["banintz","zu","Ni"],"a":["Ni zu banintz"],"es":"Si yo fuera tú.","hint":"Ni zu + banintz."},{"type":"match","pairs":[["banu","si yo tuviera"],["banintz","si yo fuera"],["balitz","si él fuera / si…"],["nuke","(yo) …-ría (con objeto)"],["nintzateke","(yo) …-ría (sin objeto)"],["litzaidake","me …-ría (gustaría)"]]}],"create":{"prompt":"Escribe 5 frases imaginando: qué harías con mucho dinero, dónde vivirías si pudieras elegir, qué harías si fueras otra persona, y dos cosas que te gustaría hacer este año.","focus":"banu/banintz/balitz + -ko nuke/nintzateke; nahi nuke; gustatuko litzaidake"},"links":{"verbs":[],"cases":[],"themes":["aisialdia","bidaiak"]}},"b1-04":{"id":"b1-04","lvl":"B1","n":4,"title":"Ahal izatea","es":"El potencial","goal":"Decir lo que puedes hacer, pedir permiso y expresar lo que se puede o no se puede hacer.","explain":[{"h":"Antes de empezar","p":"En el A2 aprendiste a decir «poder» con **ahal**: **joan ahal dut**. Es correcto y muy habitual al hablar, pero el euskera tiene además un modo verbal propio para la posibilidad: el **potencial**. Es el que encontrarás en textos, carteles y en el habla cuidada, así que necesitas reconocerlo y usarlo."},{"h":"La forma","p":"Participio + auxiliar en potencial. Como siempre, **sin objeto → izan** y **con objeto → ukan**.","table":{"head":["Persona","Sin objeto (izan)","Con objeto (ukan)","Objeto plural"],"rows":[["ni / nik","{nor:naiteke}","{nork:dezaket}","{nork:ditzaket}"],["zu / zuk","{nor:zaitezke}","{nork:dezakezu}","{nork:ditzakezu}"],["hura / hark","{nor:daiteke}","{nork:dezake}","{nork:ditzake}"],["gu / guk","{nor:gaitezke}","{nork:dezakegu}","{nork:ditzakegu}"],["zuek","{nor:zaitezkete}","{nork:dezakezue}","{nork:ditzakezue}"],["haiek","{nor:daitezke}","{nork:dezakete}","{nork:ditzakete}"]]}},{"h":"Usos","p":"Capacidad: **Bihar etorri naiteke** (mañana puedo venir), **Egin dezaket** (puedo hacerlo). Permiso: **Sartu naiteke?** (¿puedo entrar?), **Leihoa ireki dezaket?** (¿puedo abrir la ventana?). Lo que se puede hacer en general, con **daiteke**: **Hemen erre daiteke?** (¿se puede fumar aquí?). En textos más cuidados verás a veces la raíz del verbo en lugar del participio (*etor naiteke*); significa lo mismo."},{"h":"«No poder»: ezin","p":"Para la negación se usa **ezin** con el auxiliar normal (indicativo): **Gaur ezin naiz etorri** (hoy no puedo venir), **Ezin dut egin** (no puedo hacerlo), **Hemen ezin da erre** (aquí no se puede fumar)."},{"h":"Paso a paso: «¿Puedo llevarme estos libros?»","p":"1) Verbo: **eraman** (llevar). 2) ¿Objeto? Sí, y plural → ukan potencial, yo, plural → **ditzaket**. 3) **Liburu hauek eraman ditzaket?**"},{"h":"Errores típicos","p":"*Etorri dezaket* → **Etorri naiteke** (venir va con izan). *Egin naiteke* → **Egin dezaket**. *Liburu hauek eraman dezaket* → **ditzaket** (plural). *Ez dezaket* → lo normal es **Ezin dut**."},{"h":"Resumen","p":"Potencial: participio + **naiteke, zaitezke, daiteke…** (sin objeto) o **dezaket, dezakezu, dezake…** (con objeto; plural **ditzaket…**). Permiso: **Sartu naiteke?** General: **daiteke**. Negación: **ezin + auxiliar normal**."}],"examples":[["Bihar etorri naiteke.","Mañana puedo venir."],["Egin dezaket.","Puedo hacerlo."],["Leihoa ireki dezaket?","¿Puedo abrir la ventana?"],["Hemen erre daiteke?","¿Se puede fumar aquí?"],["Gaur ezin naiz etorri.","Hoy no puedo venir."],["Liburu hauek eraman ditzaket?","¿Puedo llevarme estos libros?"],["Euskaraz hitz egin dezakegu.","Podemos hablar en euskera."]],"dialog":{"title":"En la biblioteca","lines":[["Iker","Barkatu, sartu naiteke?","Perdone, ¿puedo entrar?"],["Liburuzaina","Bai, noski. Zer behar duzu?","Sí, claro. ¿Qué necesita?"],["Iker","Liburu hauek etxera eraman ditzaket?","¿Puedo llevarme estos libros a casa?"],["Liburuzaina","Bai, bi astez eduki ditzakezu. Baina hiztegia ezin duzu eraman.","Sí, puede tenerlos dos semanas. Pero el diccionario no se lo puede llevar."],["Iker","Eta hemen kafea edan daiteke?","¿Y aquí se puede tomar café?"],["Liburuzaina","Ez, hemen ezin da jan edo edan.","No, aquí no se puede comer ni beber."]]},"exercises":[{"type":"gap","q":"Bihar etorri ___.","es":"Mañana puedo venir.","a":["naiteke"],"hint":"Venir → izan; potencial, yo: naiteke."},{"type":"gap","q":"Egin ___.","es":"Puedo hacerlo.","a":["dezaket"],"hint":"Hacer → ukan; potencial, yo: dezaket."},{"type":"gap","q":"Leihoa ireki ___?","es":"¿Puedo abrir la ventana?","a":["dezaket"],"hint":"Abrir algo → ukan: dezaket."},{"type":"gap","q":"Hemen erre ___?","es":"¿Se puede fumar aquí?","a":["daiteke"],"hint":"Lo que se puede en general: daiteke."},{"type":"gap","q":"Liburu hauek eraman ___?","es":"¿Puedo llevarme estos libros?","a":["ditzaket"],"hint":"Objeto plural, yo: ditzaket."},{"type":"gap","q":"Euskaraz hitz egin ___.","es":"Podemos hablar en euskera.","a":["dezakegu"],"hint":"hitz egin → ukan; nosotros: dezakegu."},{"type":"choice","q":"«Puedo venir»","options":["Etorri naiteke.","Etorri dezaket.","Etorri naiz."],"a":0,"why":"Venir no tiene objeto → naiteke."},{"type":"choice","q":"«Puedo hacerlo»","options":["Egin dezaket.","Egin naiteke.","Egin dezake."],"a":0,"why":"Con objeto, yo → dezaket. Dezake es «él puede»."},{"type":"choice","q":"«Hoy no puedo venir»","options":["Gaur ezin naiz etorri.","Gaur ez etorri naiteke.","Gaur ezin etorri naiz."],"a":0,"why":"ezin + auxiliar normal + participio."},{"type":"choice","q":"«¿Se puede fumar aquí?»","options":["Hemen erre daiteke?","Hemen erre da?","Hemen erretzen daiteke?"],"a":0,"why":"Participio + daiteke."},{"type":"choice","q":"«¿Puedo llevarme estos libros?»","options":["Liburu hauek eraman ditzaket?","Liburu hauek eraman dezaket?","Liburu hauek eraman daitezke?"],"a":0,"why":"Objeto plural, yo → ditzaket."},{"type":"order","words":["naiteke","Bihar","etorri"],"a":["Bihar etorri naiteke"],"es":"Mañana puedo venir.","hint":"Tiempo + participio + potencial."},{"type":"order","words":["dezaket","Leihoa","ireki"],"a":["Leihoa ireki dezaket"],"es":"Puedo abrir la ventana.","hint":"Objeto + participio + potencial."},{"type":"order","words":["da","Hemen","ezin","jan"],"a":["Hemen ezin da jan"],"es":"Aquí no se puede comer.","hint":"Lugar + ezin + da + participio."},{"type":"match","pairs":[["naiteke","puedo (sin objeto)"],["dezaket","puedo (con objeto)"],["daiteke","se puede / puede"],["dezake","él puede (con objeto)"],["ditzaket","puedo (objeto plural)"],["gaitezke","podemos (sin objeto)"]]}],"create":{"prompt":"Escribe las normas de un lugar que conozcas (tu casa, tu trabajo, una biblioteca) en 5 frases: qué se puede y qué no se puede hacer, y dos cosas que puedes hacer tú allí.","focus":"potencial (naiteke, dezaket, daiteke, ditzaket…), permiso, ezin + auxiliar normal"},"links":{"verbs":[],"cases":[],"themes":["aditzak","hiria"]}},"b1-05":{"id":"b1-05","lvl":"B1","n":5,"title":"Zertarako?","es":"La finalidad: -tzeko y el subjuntivo","goal":"Decir para qué haces algo: «para aprender», «para que lo entiendas», «me ha dicho que venga».","explain":[{"h":"Antes de empezar","p":"Para expresar finalidad, el euskera distingue dos casos según quién hace la acción. Si es la misma persona («estudio para aprender»), basta con una terminación muy sencilla, **-tzeko**. Si es otra persona («te lo explico para que lo entiendas»), aparece un modo nuevo, el **subjuntivo**."},{"h":"Mismo sujeto: -tzeko","p":"Se forma desde el habitual cambiando **-tzen** por **-tzeko**: **egiten → egiteko**, **ikasten → ikasteko**. **Euskara ikasten dut, Euskal Herrian lan egiteko** (estudio euskera para trabajar en Euskal Herria). También con nombres: **idazteko papera** (papel para escribir)."},{"h":"Distinto sujeto: el subjuntivo","p":"Raíz del verbo + **dadin** (sin objeto) o **dezan** (con objeto), que cambian según la persona: **Hau esaten dizut, uler dezazun** (te digo esto para que lo entiendas). **Leihoa ireki dut, airea sar dadin** (he abierto la ventana para que entre aire).","table":{"head":["Para que…","Sin objeto (izan)","Con objeto (ukan)"],"rows":[["(yo)","{nor:nadin}","{nork:dezadan}"],["(tú)","{nor:zaitezen}","{nork:dezazun}"],["(él / ella)","{nor:dadin}","{nork:dezan}"],["(nosotros)","{nor:gaitezen}","{nork:dezagun}"],["(vosotros)","{nor:zaitezten}","{nork:dezazuen}"],["(ellos)","{nor:daitezen}","{nork:dezaten}"]]}},{"h":"La raíz del verbo","p":"El subjuntivo usa la **raíz**, que se saca del participio: verbos en **-tu** lo pierden (**prestatu → presta**, **ulertu → uler**); verbos en **-ri, -si, -tzi** pierden la **-i** (**etorri → etor**, **ikusi → ikus**, **idatzi → idatz**, **ekarri → ekar**); el resto se queda igual (**egin**, **jan**, **joan**, **ireki**). En el habla también oirás el participio entero (*ikusi dezan*)."},{"h":"«Decir / pedir que…»: -tzeko","p":"Para transmitir una petición u orden se usa **-tzeko**: **Esan dit etortzeko** (me ha dicho que venga), **Eskatu diot laguntzeko** (le he pedido que ayude). Compara con la lección A2-14: **Esan dit etorriko dela** = me ha dicho que (él) vendrá (información, no petición)."},{"h":"Paso a paso: «Te he llamado para que vengas a la reunión»","p":"1) ¿Mismo sujeto? No (yo llamo, tú vienes) → subjuntivo. 2) Raíz de etorri → **etor**. 3) Sin objeto, «tú» → **zaitezen**. 4) **Deitu dizut, bilerara etor zaitezen**."},{"h":"Errores típicos","p":"*Hau esaten dizut, ulertzeko* (si quien entiende eres tú) → **uler dezazun**. *Etorri zaitezen* → la forma recomendada es **etor zaitezen**. *Esan dit etorriko* para «me ha dicho que venga» → **Esan dit etortzeko**. *Lan egin dezan* para «para trabajar (yo)» → **lan egiteko**."},{"h":"Resumen","p":"Mismo sujeto: **-tzeko** (ikasteko, egiteko). Distinto sujeto: raíz + **dadin / dezan** (etor zaitezen, uler dezazun, sar dadin). Peticiones: **esan / eskatu … -tzeko**."}],"examples":[["Euskara ikasten dut, Euskal Herrian lan egiteko.","Estudio euskera para trabajar en Euskal Herria."],["Dirua aurrezten ari naiz, etxe bat erosteko.","Estoy ahorrando dinero para comprar una casa."],["Hau esaten dizut, uler dezazun.","Te digo esto para que lo entiendas."],["Deitu dizut, bilerara etor zaitezen.","Te he llamado para que vengas a la reunión."],["Esan dit etortzeko.","Me ha dicho que venga."],["Leihoa ireki dut, airea sar dadin.","He abierto la ventana para que entre aire."],["Idazteko papera behar dut.","Necesito papel para escribir."]],"dialog":{"title":"¿Para qué aprendes euskera?","lines":[["Miren","Zergatik ikasten duzu euskara?","¿Por qué estudias euskera?"],["Iker","Nire seme-alabekin euskaraz hitz egiteko. Eta zuk?","Para hablar en euskera con mis hijos. ¿Y tú?"],["Miren","Nik Donostian lan egiteko. Nire nagusiak esan dit ikasteko.","Yo, para trabajar en San Sebastián. Mi jefe me ha dicho que lo aprenda."],["Iker","Nik lagunduko zaitut, azkarrago ikas dezazun.","Yo te ayudaré, para que aprendas más rápido."],["Miren","Eskerrik asko! Liburu hau ekarri dut, elkarrekin irakur dezagun.","¡Gracias! He traído este libro, para que lo leamos juntos."]]},"exercises":[{"type":"gap","q":"Euskara ikasten dut, Euskal Herrian lan egi___.","es":"Estudio euskera para trabajar en Euskal Herria.","a":["teko"],"hint":"Mismo sujeto: egiten → egiteko."},{"type":"gap","q":"Hau esaten dizut, uler ___.","es":"Te digo esto para que lo entiendas.","a":["dezazun"],"hint":"Distinto sujeto, con objeto, tú: dezazun."},{"type":"gap","q":"Deitu dizut, bilerara etor ___.","es":"Te he llamado para que vengas a la reunión.","a":["zaitezen"],"hint":"Distinto sujeto, sin objeto, tú: zaitezen."},{"type":"gap","q":"Esan dit etor___.","es":"Me ha dicho que venga.","a":["tzeko"],"hint":"Petición: -tzeko."},{"type":"gap","q":"Leihoa ireki dut, airea sar ___.","es":"He abierto la ventana para que entre aire.","a":["dadin"],"hint":"Sin objeto, él (el aire): dadin."},{"type":"gap","q":"Liburua ekarri dut, elkarrekin irakur ___.","es":"He traído el libro para que lo leamos juntos.","a":["dezagun"],"hint":"Con objeto, nosotros: dezagun."},{"type":"choice","q":"«Para trabajar» (yo mismo)","options":["lan egiteko","lan egitera","lan egin dezan"],"a":0,"why":"Mismo sujeto: -tzeko."},{"type":"choice","q":"«Para que lo entiendas»","options":["uler dezazun","ulertzeko","uler dezan"],"a":0,"why":"Distinto sujeto (tú): subjuntivo, dezazun."},{"type":"choice","q":"«Me ha dicho que venga»","options":["Esan dit etortzeko.","Esan dit etorriko dela.","Esan dit etortzen."],"a":0,"why":"Petición: -tzeko. Etorriko dela = que (él) vendrá."},{"type":"choice","q":"Raíz de ikusi:","options":["ikus","ikusi","ikust"],"a":0,"why":"Verbos en -si pierden la -i."},{"type":"choice","q":"«Para que venga (él)»","options":["etor dadin","etor dezan","etortzeko"],"a":0,"why":"Venir no tiene objeto → dadin."},{"type":"order","words":["dut","papera","behar","Idazteko"],"a":["Idazteko papera behar dut"],"es":"Necesito papel para escribir.","hint":"Idazteko papera + behar dut."},{"type":"order","words":["dadin","sar","airea"],"a":["Airea sar dadin"],"es":"Para que entre aire.","hint":"Sujeto + raíz + dadin."},{"type":"order","words":["dit","Esan","etortzeko"],"a":["Esan dit etortzeko","Etortzeko esan dit"],"es":"Me ha dicho que venga.","hint":"Esan dit + -tzeko."},{"type":"match","pairs":[["-tzeko","para (mismo sujeto)"],["dadin","para que (él) … (sin objeto)"],["dezan","para que (él) … (con objeto)"],["zaitezen","para que (tú) … (sin objeto)"],["dezazun","para que (tú) … (con objeto)"],["etor","raíz de etorri"]]}],"create":{"prompt":"Escribe 5 frases sobre tus objetivos: para qué estudias euskera, para qué ahorras o trabajas, qué haces para que otros estén bien, y algo que alguien te ha pedido que hagas.","focus":"-tzeko (mismo sujeto), raíz + dadin/dezan (distinto sujeto), esan/eskatu … -tzeko"},"links":{"verbs":[],"cases":[],"themes":["aditzak","ikasketak"]}},"b1-06":{"id":"b1-06","lvl":"B1","n":6,"title":"Erlatiboak II","es":"Relativos en pasado y con casos","goal":"Construir relativos más ricos: «la película que vi», «en el pueblo donde vivo», «con lo que has dicho».","explain":[{"h":"Antes de empezar","p":"En la lección A2-13 aprendiste el relativo en presente (**erosi dudan liburua**). Hoy lo amplías en tres direcciones: el pasado, los casos (en, con, a…) y los auxiliares de tres protagonistas. La regla de fondo no cambia: la oración va delante del nombre."},{"h":"Relativo en pasado","p":"Las formas de pasado ya terminan en **-n**, así que no se añade nada: **Atzo ikusi nuen pelikula** (la película que vi ayer), **Etorri zen gizona** (el hombre que vino). Lo que te indica que es un relativo es que la oración va justo delante de un nombre."},{"h":"Relativo con caso","p":"El caso se pega al final del grupo entero (oración + nombre), como si fuera un nombre normal: **Bizi naizen herrian** (en el pueblo en el que vivo), **Lan egiten dudan enpresara** (a la empresa en la que trabajo), **Ezagutu nuen neskarekin** (con la chica que conocí). En español cambiamos «que» por «en el que», «con la que»…; en euskera, el caso va al final."},{"h":"Con NOR-NORI-NORK","p":"Funciona igual: auxiliar + -(e)n. **dizut → dizudan**, **diot → diodan**, **didazu → didazun**: **Eman didazun liburua** (el libro que me has dado), **Bidali diodan mezua** (el mensaje que le he enviado)."},{"h":"«Lo que» con caso","p":"El relativo sin nombre (-na) también admite casos: **Esan duzunarekin ados nago** (estoy de acuerdo con lo que has dicho), **Behar duzuna** (lo que necesites), **Ikusi dudanagatik**… (por lo que he visto, verás -gatik en la lección 11)."},{"h":"Paso a paso: «Estoy de acuerdo con lo que dijo Mikel»","p":"1) Oración: **Mikelek esan zuen** (pasado, ya acaba en -n). 2) Sin nombre: + **-a** → **Mikelek esan zuena**. 3) Caso «con»: + **-rekin** → **Mikelek esan zuenarekin**. 4) **Mikelek esan zuenarekin ados nago**."},{"h":"Errores típicos","p":"*Herrian bizi naizen* → **Bizi naizen herrian** (oración delante, caso al final). *Ezagutu nuen neska rekin* → **neskarekin**, todo junto. *Eman duzun liburua* para «el libro que me has dado» → **didazun**. *Esan duzunekin* → **Esan duzunarekin**."},{"h":"Resumen","p":"Pasado: la forma ya acaba en -n (**ikusi nuen pelikula**). Caso al final del grupo (**bizi naizen herrian**). NOR-NORI-NORK: **didazun, diodan**. Sin nombre y con caso: **esan duzunarekin**."}],"examples":[["Atzo ikusi nuen pelikula oso ona zen.","La película que vi ayer era muy buena."],["Etorri zen gizona nire osaba da.","El hombre que vino es mi tío."],["Bizi naizen herrian ez dago zinemarik.","En el pueblo donde vivo no hay cine."],["Ezagutu nuen neskarekin hitz egin dut.","He hablado con la chica que conocí."],["Eman didazun liburua irakurri dut.","He leído el libro que me has dado."],["Esan duzunarekin ados nago.","Estoy de acuerdo con lo que has dicho."],["Lan egiten dudan enpresan jende asko dago.","En la empresa en la que trabajo hay mucha gente."]],"dialog":{"title":"Una casualidad","lines":[["Ane","Atzo ikusi nuen pelikula oso ona zen.","La película que vi ayer era muy buena."],["Jon","Zein? Liburutegian hartu zenuen hura?","¿Cuál? ¿Aquella que cogiste en la biblioteca?"],["Ane","Bai! Eta pelikulan agertzen den aktorea ezagutzen dut.","¡Sí! Y conozco al actor que sale en la película."],["Jon","Benetan? Nondik?","¿De verdad? ¿De qué?"],["Ane","Bizi naizen herrian bizi da. Askotan ikusten dut kalean.","Vive en el pueblo donde vivo yo. Lo veo a menudo por la calle."],["Jon","Zer kasualitatea!","¡Qué casualidad!"]]},"exercises":[{"type":"gap","q":"Atzo ikusi ___ pelikula oso ona zen.","es":"La película que vi ayer era muy buena.","a":["nuen"],"hint":"Pasado: la forma ya acaba en -n."},{"type":"gap","q":"Etorri ___ gizona nire osaba da.","es":"El hombre que vino es mi tío.","a":["zen"],"hint":"Pasado de izan, él: zen."},{"type":"gap","q":"Bizi naizen herri___ ez dago zinemarik.","es":"En el pueblo donde vivo no hay cine.","a":["an"],"hint":"El caso NON va al final del grupo: herrian."},{"type":"gap","q":"Ezagutu nuen neska___ hitz egin dut.","es":"He hablado con la chica que conocí.","a":["rekin"],"hint":"«con», palabra acabada en -a: -rekin."},{"type":"gap","q":"Eman ___ liburua irakurri dut.","es":"He leído el libro que me has dado.","a":["didazun"],"hint":"didazu + -n."},{"type":"gap","q":"Esan duzuna___ ados nago.","es":"Estoy de acuerdo con lo que has dicho.","a":["rekin"],"hint":"Relativo sin nombre (-na) + «con»."},{"type":"choice","q":"«La película que vi ayer»","options":["atzo ikusi nuen pelikula","pelikula atzo ikusi nuen","atzo ikusi nuena pelikula"],"a":0,"why":"Oración en pasado delante del nombre."},{"type":"choice","q":"«En el pueblo donde vivo»","options":["bizi naizen herrian","bizi naizen herria","herrian bizi naizen"],"a":0,"why":"Oración + nombre + caso al final."},{"type":"choice","q":"«El libro que me has dado»","options":["eman didazun liburua","eman duzun liburua","eman didazu liburua"],"a":0,"why":"Hay «me»: didazun. Eman duzun = que has dado (sin «me»)."},{"type":"choice","q":"«Con lo que has dicho»","options":["esan duzunarekin","esan duzun rekin","esan duzunekin"],"a":0,"why":"-na + -rekin, todo junto."},{"type":"choice","q":"«El hombre que vino»","options":["etorri zen gizona","etorri zuen gizona","gizona etorri zen"],"a":0,"why":"Venir → izan (zen), delante del nombre."},{"type":"order","words":["nuen","pelikula","ikusi","Atzo"],"a":["Atzo ikusi nuen pelikula"],"es":"La película que vi ayer.","hint":"Oración en pasado + nombre."},{"type":"order","words":["herrian","naizen","Bizi"],"a":["Bizi naizen herrian"],"es":"En el pueblo donde vivo.","hint":"Oración + nombre con caso."},{"type":"order","words":["liburua","didazun","Eman"],"a":["Eman didazun liburua"],"es":"El libro que me has dado.","hint":"Verbo + relativo + nombre."},{"type":"match","pairs":[["ikusi nuen pelikula","la película que vi"],["etorri zen gizona","el hombre que vino"],["bizi naizen herrian","en el pueblo donde vivo"],["eman didazun liburua","el libro que me has dado"],["esan duzunarekin","con lo que has dicho"],["behar duzuna","lo que necesites"]]}],"create":{"prompt":"Escribe 5 frases con relativos ricos: un lugar donde viviste o trabajas, una persona que conociste, un regalo que te dieron, una película que viste y algo con lo que estás de acuerdo.","focus":"relativo en pasado, relativo con caso (bizi naizen herrian), didazun, -narekin"},"links":{"verbs":["nn-past-3","nnn-pres"],"cases":["ine","soz"],"themes":["lokailuak"]}},"b1-07":{"id":"b1-07","lvl":"B1","n":7,"title":"Ez dakit non dagoen","es":"Interrogativas indirectas y -nik","goal":"Preguntar y contar de forma indirecta: «no sé dónde está», «le he preguntado si vendrá», «no creo que venga».","explain":[{"h":"Antes de empezar","p":"Muchas veces no preguntamos directamente: «¿sabes qué hora es?», «no sé dónde está». En euskera, estas preguntas incrustadas en otra frase usan la misma terminación que el relativo, **-(e)n**. Ya conoces todas las formas; solo cambia el uso."},{"h":"Con palabra interrogativa","p":"Interrogativa + verbo + auxiliar con **-(e)n**: **Non dago?** (¿dónde está?) → **Ez dakit non dagoen** (no sé dónde está). **Zer ordu da?** → **Badakizu zer ordu den?** (¿sabes qué hora es?). **Noiz etorriko da?** → **Ez dakit noiz etorriko den**. La regla de oro sigue valiendo: la interrogativa, justo delante del verbo."},{"h":"Preguntas de sí o no: ea","p":"Para «si» en preguntas indirectas se usa **ea** delante: **Etorriko da?** → **Galdetu diot ea etorriko den** (le he preguntado si vendrá). No confundir con el **ba-** de condición: *Galdetu diot etorriko bada* es incorrecto."},{"h":"«No creo que…»: -nik","p":"Cuando el verbo principal es negativo (no creo, no he dicho, no sé), la subordinada toma **-nik** en lugar de -la: **Uste dut etorriko dela** (creo que vendrá) → **Ez dut uste etorriko denik** (no creo que venga). Se forma desde el relativo: **den → denik**, **duen → duenik**, **dagoen → dagoenik**, **dudan → dudanik**."},{"h":"Paso a paso: «No sé por qué está enfadada»","p":"1) Pregunta directa: **Zergatik dago haserre?** 2) Indirecta: dago → **dagoen**. 3) Verbo principal: **Ez dakit**. 4) **Ez dakit zergatik dagoen haserre**."},{"h":"Errores típicos","p":"*Ez dakit non dago* → **non dagoen**. *Galdetu diot etorriko dela* (para «si vendrá») → **ea etorriko den**. *Ez dut uste etorriko dela* → en batua cuidado, **etorriko denik**. *dagonik* → **dagoenik**."},{"h":"Resumen","p":"Indirecta = interrogativa + verbo + **-(e)n** (non dagoen, zer den, noiz etorriko den). Sí/no: **ea … -(e)n**. Tras negación: **-nik** (ez dut uste etorriko denik)."}],"examples":[["Ez dakit non dagoen.","No sé dónde está."],["Badakizu zer ordu den?","¿Sabes qué hora es?"],["Ez dakit noiz etorriko den.","No sé cuándo vendrá."],["Galdetu diot ea etorriko den.","Le he preguntado si vendrá."],["Ez dut uste etorriko denik.","No creo que venga."],["Ez dakit zergatik dagoen haserre.","No sé por qué está enfadada."],["Jakin nahi dut zenbat balio duen.","Quiero saber cuánto cuesta."]],"dialog":{"title":"Las llaves, otra vez","lines":[["Iker","Badakizu non dauden nire giltzak?","¿Sabes dónde están mis llaves?"],["Nerea","Ez dakit non dauden. Aneri galdetu diozu?","No sé dónde están. ¿Le has preguntado a Ane?"],["Iker","Bai, eta ez daki. Ez dut uste hark hartu dituenik.","Sí, y no lo sabe. No creo que las haya cogido ella."],["Nerea","Begiratu duzu jakan?","¿Has mirado en la chaqueta?"],["Iker","Ez… Itxaron. Hemen daude!","No… Espera. ¡Aquí están!"],["Nerea","Ikusten? Ez dakit zergatik kezkatzen zaren beti!","¿Ves? ¡No sé por qué te preocupas siempre!"]]},"exercises":[{"type":"gap","q":"Ez dakit non ___.","es":"No sé dónde está.","a":["dagoen"],"hint":"dago + -en."},{"type":"gap","q":"Badakizu zer ordu ___?","es":"¿Sabes qué hora es?","a":["den"],"hint":"da + -en."},{"type":"gap","q":"Ez dakit noiz etorriko ___.","es":"No sé cuándo vendrá.","a":["den"],"hint":"etorriko da → etorriko den."},{"type":"gap","q":"Galdetu diot ___ etorriko den.","es":"Le he preguntado si vendrá.","a":["ea"],"hint":"«si» en preguntas indirectas: ea."},{"type":"gap","q":"Ez dut uste etorriko ___.","es":"No creo que venga.","a":["denik"],"hint":"Tras negación: -nik."},{"type":"gap","q":"Jakin nahi dut zenbat balio ___.","es":"Quiero saber cuánto cuesta.","a":["duen"],"hint":"du + -en."},{"type":"choice","q":"«No sé dónde está»","options":["Ez dakit non dagoen.","Ez dakit non dago.","Ez dakit non dagoela."],"a":0,"why":"Interrogativa indirecta: -(e)n."},{"type":"choice","q":"«Le he preguntado si vendrá»","options":["Galdetu diot ea etorriko den.","Galdetu diot etorriko dela.","Galdetu diot etorriko bada."],"a":0,"why":"Sí/no indirecta: ea + -(e)n."},{"type":"choice","q":"«No creo que venga»","options":["Ez dut uste etorriko denik.","Ez dut uste etorriko den.","Ez dut uste etorriko da."],"a":0,"why":"Tras «no creo»: -nik."},{"type":"choice","q":"«¿Sabes qué hora es?»","options":["Badakizu zer ordu den?","Badakizu zer ordu da?","Badakizu zer ordu dela?"],"a":0,"why":"Indirecta: den."},{"type":"choice","q":"-nik de dago:","options":["dagoenik","dagonik","dagoelanik"],"a":0,"why":"Desde el relativo: dagoen + -ik."},{"type":"order","words":["dagoen","non","dakit","Ez"],"a":["Ez dakit non dagoen"],"es":"No sé dónde está.","hint":"Ez dakit + interrogativa + verbo con -en."},{"type":"order","words":["den","etorriko","ea","diot","Galdetu"],"a":["Galdetu diot ea etorriko den"],"es":"Le he preguntado si vendrá.","hint":"Galdetu diot + ea + verbo + den."},{"type":"order","words":["denik","uste","Ez","dut","etorriko"],"a":["Ez dut uste etorriko denik"],"es":"No creo que venga.","hint":"Ez dut uste + verbo + denik."},{"type":"match","pairs":[["non dagoen","dónde está"],["zer den","qué es"],["noiz etorriko den","cuándo vendrá"],["ea etorriko den","si vendrá"],["etorriko denik","que venga (tras negación)"],["zenbat balio duen","cuánto cuesta"]]}],"create":{"prompt":"Escribe 5 frases: tres cosas que no sabes (Ez dakit non / zer / noiz…), una pregunta que le harías a alguien de forma indirecta (Galdetuko diot ea…) y una cosa que no crees (Ez dut uste …-nik).","focus":"interrogativas indirectas -(e)n, ea … -(e)n, -nik tras negación"},"links":{"verbs":["syn-pres-2"],"cases":[],"themes":["galderak","lokailuak"]}},"b1-08":{"id":"b1-08","lvl":"B1","n":8,"title":"Eman nion","es":"NOR-NORI-NORK en pasado","goal":"Contar en pasado lo que diste, dijiste o enviaste a alguien: «se lo di», «me lo dijo».","explain":[{"h":"Antes de empezar","p":"Con esta lección completas el último gran paradigma del indicativo. En el A2 aprendiste **diot** (se lo he…); ahora aprendes **nion** (se lo…, en pasado). La lógica es la del resto de pasados: la persona que hace la acción pasa al principio y todo termina en **-n**."},{"h":"La estructura","p":"Inicio de {nork:NORK} (**n-** yo, **zen-** tú, **z-** él, **gen-** nosotros, **zen-…-te** vosotros, **z-…-te** ellos) + **i** + marca de {nori:NORI} (**-da-** a mí, **-zu-** a ti, **-o-** a él, **-gu-** a nosotros, **-zue-** a vosotros, **-e-** a ellos) + **-n**: n-i-o-n = **nion** (se lo… yo a él), z-i-da-n = **zidan** (me lo… él)."},{"h":"La tabla","table":{"head":["NORK ↓ / NORI →","a mí","a ti","a él / ella","a nosotros","a ellos"],"rows":[["nik","—","{nori:nizun}","{nori:nion}","—","{nori:nien}"],["zuk","{nori:zenidan}","—","{nori:zenion}","{nori:zenigun}","{nori:zenien}"],["hark","{nori:zidan}","{nori:zizun}","{nori:zion}","{nori:zigun}","{nori:zien}"],["guk","—","{nori:genizun}","{nori:genion}","—","{nori:genien}"],["haiek","{nori:zidaten}","{nori:zizuten}","{nori:zioten}","{nori:ziguten}","{nori:zieten}"]]}},{"h":"Objeto plural: -zki-","p":"Igual que en presente, se añade **-zki-** después de la i: **nion → nizkion** (se los di), **zidan → zizkidan** (me los dio). **Argazkiak erakutsi zizkidan** (me enseñó las fotos). **Zorionak eman nizkion** (lo felicité, literalmente «le di las felicitaciones»)."},{"h":"Paso a paso: «Ellos no nos dijeron nada»","p":"1) Quién: ellos → **z-…-te**. 2) A quién: nosotros → **-gu-**. 3) z + i + gu + te + n → **ziguten**. 4) Negativa: **Haiek ez ziguten ezer esan**."},{"h":"Errores típicos","p":"*Atzo eman diot* → **eman nion** (atzo pide pasado). *Esan nion* para «me lo dijo» → **Esan zidan**. *Argazkiak erakutsi zidan* → **zizkidan** (plural). *Zuk esan zidan* → **Zuk esan zenidan**."},{"h":"Resumen","p":"NOR-NORI-NORK pasado: inicio de NORK + **i** + NORI + **-n**: nion, nizun, zidan, zenidan, genion, zioten… Plural: **nizkion, zizkidan**. Con esto tienes todo el indicativo de los cuatro auxiliares."}],"examples":[["Atzo opari bat eman nion.","Ayer le di un regalo."],["Zer esan zizun?","¿Qué te dijo?"],["Amak gutun bat bidali zidan.","Mi madre me envió una carta."],["Argazkiak erakutsi zizkidan.","Me enseñó las fotos."],["Zuk esan zenidan!","¡Tú me lo dijiste!"],["Guk egia esan genion.","Nosotros le dijimos la verdad."],["Haiek ez ziguten ezer esan.","Ellos no nos dijeron nada."]],"dialog":{"title":"Noticias de Mikel","lines":[["Ane","Zer esan zizun Mikelek atzo?","¿Qué te dijo Mikel ayer?"],["Jon","Berri ona eman zidan: Bilbon lan berri bat aurkitu duela.","Me dio una buena noticia: que ha encontrado un trabajo nuevo en Bilbao."],["Ane","Benetan? Eta zuk zer esan zenion?","¿De verdad? ¿Y tú qué le dijiste?"],["Jon","Zorionak eman nizkion, noski!","¡Lo felicité, claro!"],["Ane","Niri ez zidan ezer esan…","A mí no me dijo nada…"],["Jon","Agian ez zuen denborarik izan.","Quizás no tuvo tiempo."]]},"exercises":[{"type":"gap","q":"Atzo opari bat eman ___.","es":"Ayer le di un regalo.","a":["nion"],"hint":"yo → a él, pasado: n-i-o-n."},{"type":"gap","q":"Zer esan ___?","es":"¿Qué te dijo (él)?","a":["zizun"],"hint":"él → a ti, pasado: z-i-zu-n."},{"type":"gap","q":"Amak gutun bat bidali ___.","es":"Mi madre me envió una carta.","a":["zidan"],"hint":"ella → a mí, pasado: z-i-da-n."},{"type":"gap","q":"Argazkiak erakutsi ___.","es":"Me enseñó las fotos.","a":["zizkidan"],"hint":"él → a mí, objeto plural: z-i-zki-da-n."},{"type":"gap","q":"Zuk esan ___!","es":"¡Tú me lo dijiste!","a":["zenidan"],"hint":"tú → a mí: zen-i-da-n."},{"type":"gap","q":"Haiek ez ___ ezer esan.","es":"Ellos no nos dijeron nada.","a":["ziguten"],"hint":"ellos → a nosotros: z-i-gu-te-n."},{"type":"choice","q":"«Se lo di (a él)»","options":["Eman nion.","Eman diot.","Eman zidan."],"a":0,"why":"Pasado, yo → a él: nion. Eman diot = se lo he dado."},{"type":"choice","q":"«Me lo dijo (él)»","options":["Esan zidan.","Esan dit.","Esan nion."],"a":0,"why":"Pasado, él → a mí: zidan."},{"type":"choice","q":"«Me enseñó las fotos»","options":["Argazkiak erakutsi zizkidan.","Argazkiak erakutsi zidan.","Argazkiak erakutsi dizkit."],"a":0,"why":"Pasado y objeto plural: zizkidan."},{"type":"choice","q":"«Le dijimos la verdad»","options":["Egia esan genion.","Egia esan diogu.","Egia esan zigun."],"a":0,"why":"Pasado, nosotros → a él: genion."},{"type":"choice","q":"«Tú me lo dijiste»","options":["Zuk esan zenidan.","Zuk esan didazu.","Zuk esan zenion."],"a":0,"why":"Pasado, tú → a mí: zenidan."},{"type":"order","words":["nion","Atzo","bat","eman","opari"],"a":["Atzo opari bat eman nion"],"es":"Ayer le di un regalo.","hint":"Tiempo + objeto + verbo + auxiliar."},{"type":"order","words":["zidan","Amak","bidali","gutun","bat"],"a":["Amak gutun bat bidali zidan"],"es":"Mi madre me envió una carta.","hint":"Sujeto con -k + objeto + verbo + auxiliar."},{"type":"order","words":["ziguten","ezer","ez","Haiek","esan"],"a":["Haiek ez ziguten ezer esan"],"es":"Ellos no nos dijeron nada.","hint":"Haiek + ez + auxiliar + ezer + verbo."},{"type":"match","pairs":[["nion","yo → a él"],["nizun","yo → a ti"],["zidan","él → a mí"],["zenidan","tú → a mí"],["genion","nosotros → a él"],["zioten","ellos → a él"]]}],"create":{"prompt":"Cuenta en 5 frases una celebración pasada (un cumpleaños, una boda, una cena): qué regalaste y a quién, qué te regalaron, qué te dijeron y qué les dijiste tú.","focus":"NOR-NORI-NORK pasado (nion, zidan, zenidan, genion…), plural nizkion/zizkidan"},"links":{"verbs":["nnn-past"],"cases":["dat"],"themes":["aditzak"]}},"b1-09":{"id":"b1-09","lvl":"B1","n":9,"title":"Ikastea gustatzen zait","es":"La nominalización: -tzea, -tzen, -tzeko","goal":"Usar verbos como si fueran nombres: «me gusta leer», «al llegar», «voy a nadar», «he aprendido a conducir».","explain":[{"h":"Antes de empezar","p":"En español usamos mucho el infinitivo: «leer es bueno», «al llegar», «voy a nadar». El euskera lo hace convirtiendo el verbo en un nombre con **-tzea**, y como es un nombre, puede llevar cualquier caso. Ya conoces dos piezas sueltas (**irakurtzea gustatzen zait** y **-tzeko**); hoy las ordenas en un sistema."},{"h":"-tzea: el verbo como nombre","p":"Se forma igual que -tzen, cambiando la **n** por **a**: **irakurtzen → irakurtzea**, **ikasten → ikastea**, **egiten → egitea**. Funciona como sujeto u objeto: **Euskara ikastea ez da erraza** (aprender euskera no es fácil), **Erretzea debekatuta dago** (está prohibido fumar), **Irakurtzea gustatzen zait** (me gusta leer)."},{"h":"-tzea con casos","table":{"head":["Forma","Significado","Ejemplo"],"rows":[["-tzean (NON)","al + infinitivo","**Etxera iristean**, afaria prestatu nuen (al llegar a casa…)"],["-tzera (NORA)","a + infinitivo (con movimiento)","Hondartzara noa **igeri egitera** (voy a la playa a nadar)"],["-tzeko","para / de","**Ulertzeko erraza** da (es fácil de entender)"],["-tzeak (NORK)","sujeto de verbo con objeto","**Kirola egiteak** osasuna hobetzen du"],["-tzeari (NORI)","con utzi: dejar de","**Erretzeari utzi diot** (he dejado de fumar)"],["-tzeaz","sobre, de","**Bidaiatzeaz** hitz egin dugu"]]}},{"h":"-tzen con ciertos verbos","p":"Algunos verbos piden el verbo en **-tzen**: **hasi** (empezar a): **Euskara ikasten hasi naiz**; **ikasi** (aprender a): **Gidatzen ikasi dut**; **jakin** (saber): **Igeri egiten dakit**; **ari** (estar…-ndo). Y con **-tzeko**: **prest egon** (estar listo para): **Prest nago joateko**; **gogoa izan** (tener ganas de): **Gogoa daukat zu ikusteko**."},{"h":"Paso a paso: «Al terminar el trabajo, iré a correr»","p":"1) «al terminar»: bukatu → bukatzen → **bukatzean**: **lana bukatzean**. 2) «a correr» (con movimiento): korrika egin → **korrika egitera**. 3) **Lana bukatzean, korrika egitera joango naiz**."},{"h":"Errores típicos","p":"*Irakurtzen gustatzen zait* → **Irakurtzea**. *Etxera iristen, afaldu nuen* → **iristean**. *Euskara ikastea hasi naiz* → **ikasten hasi naiz**. *Erretzea utzi dut* → **Erretzeari utzi diot**."},{"h":"Resumen","p":"**-tzea** = el verbo como nombre (irakurtzea, ikastea). Con casos: **-tzean** (al…), **-tzera** (a… con movimiento), **-tzeko** (para / de), **-tzeari utzi** (dejar de). **-tzen** con hasi, ikasi, jakin, ari."}],"examples":[["Irakurtzea gustatzen zait.","Me gusta leer."],["Euskara ikastea ez da erraza.","Aprender euskera no es fácil."],["Etxera iristean, afaria prestatu nuen.","Al llegar a casa, preparé la cena."],["Hondartzara noa igeri egitera.","Voy a la playa a nadar."],["Gidatzen ikasi dut.","He aprendido a conducir."],["Liburu hau ulertzeko erraza da.","Este libro es fácil de entender."],["Erretzeari utzi diot.","He dejado de fumar."]],"dialog":{"title":"Aficiones","lines":[["Ane","Zer egitea gustatzen zaizu asteburuetan?","¿Qué te gusta hacer los fines de semana?"],["Jon","Mendira joatea gustatzen zait, eta lagunekin afaltzea.","Me gusta ir al monte, y cenar con los amigos."],["Ane","Nik sukaldatzen ikasi nahi dut.","Yo quiero aprender a cocinar."],["Jon","Erraza da hasteko! Etxera iristean, errezeta bat bidaliko dizut.","¡Es fácil para empezar! Al llegar a casa, te enviaré una receta."],["Ane","Primeran! Gogo handia daukat ikasteko.","¡Estupendo! Tengo muchas ganas de aprender."]]},"exercises":[{"type":"gap","q":"Irakur___ gustatzen zait.","es":"Me gusta leer.","a":["tzea"],"hint":"El verbo como nombre: -tzea."},{"type":"gap","q":"Euskara ikas___ ez da erraza.","es":"Aprender euskera no es fácil.","a":["tea"],"hint":"ikasten → ikastea."},{"type":"gap","q":"Etxera iris___, afaria prestatu nuen.","es":"Al llegar a casa, preparé la cena.","a":["tean"],"hint":"«al + infinitivo» = -tzean."},{"type":"gap","q":"Hondartzara noa igeri egi___.","es":"Voy a la playa a nadar.","a":["tera"],"hint":"Con movimiento: -tzera."},{"type":"gap","q":"Gidatzen ___ dut.","es":"He aprendido a conducir.","a":["ikasi"],"hint":"aprender a = -tzen + ikasi."},{"type":"gap","q":"Erretzea___ utzi diot.","es":"He dejado de fumar.","a":["ri"],"hint":"dejar de = -tzeari utzi."},{"type":"choice","q":"«Me gusta leer»","options":["Irakurtzea gustatzen zait.","Irakurtzen gustatzen zait.","Irakurri gustatzen zait."],"a":0,"why":"El verbo como nombre: -tzea."},{"type":"choice","q":"«Al llegar a casa»","options":["Etxera iristean","Etxera iristen","Etxera iristeko"],"a":0,"why":"-tzean = al + infinitivo."},{"type":"choice","q":"«He empezado a aprender euskera»","options":["Euskara ikasten hasi naiz.","Euskara ikastea hasi naiz.","Euskara ikasteko hasi dut."],"a":0,"why":"hasi pide -tzen."},{"type":"choice","q":"«Fácil de entender»","options":["ulertzeko erraza","ulertzen erraza","ulertu erraza"],"a":0,"why":"«de» tras adjetivo: -tzeko."},{"type":"choice","q":"«Voy a la playa a nadar»","options":["Hondartzara noa igeri egitera.","Hondartzara noa igeri egitea.","Hondartzara noa igeri egiten."],"a":0,"why":"Con movimiento: -tzera."},{"type":"order","words":["gustatzen","zait","Irakurtzea"],"a":["Irakurtzea gustatzen zait"],"es":"Me gusta leer.","hint":"Actividad + gustatzen zait."},{"type":"order","words":["da","erraza","ez","ikastea","Euskara"],"a":["Euskara ikastea ez da erraza"],"es":"Aprender euskera no es fácil.","hint":"Euskara ikastea + ez da + erraza."},{"type":"order","words":["hasi","naiz","ikasten","Euskara"],"a":["Euskara ikasten hasi naiz"],"es":"He empezado a aprender euskera.","hint":"Objeto + -tzen + hasi naiz."},{"type":"match","pairs":[["irakurtzea","leer (el hecho de)"],["iristean","al llegar"],["igeri egitera","a nadar (con movimiento)"],["ulertzeko","para / de entender"],["ikasten hasi","empezar a aprender"],["erretzeari utzi","dejar de fumar"]]}],"create":{"prompt":"Escribe 5 frases: qué te gusta hacer, algo que es difícil para ti, qué haces al llegar a casa, algo que has aprendido a hacer y algo que has dejado (o quieres dejar) de hacer.","focus":"-tzea y sus casos (-tzean, -tzera, -tzeko, -tzeari utzi), -tzen con hasi/ikasi"},"links":{"verbs":[],"cases":[],"themes":["aditzak","aisialdia"]}},"b1-10":{"id":"b1-10","lvl":"B1","n":10,"title":"Denbora-perpausak","es":"Más oraciones temporales","goal":"Ordenar acciones en el tiempo: antes de, después de, hasta que, mientras, en cuanto.","explain":[{"h":"Antes de empezar","p":"En el A2 aprendiste «cuando» (**-nean**). Para contar historias o dar instrucciones necesitas más precisión: antes de, después de, hasta que, mientras. La mayoría se construyen con el **participio** más una palabra, así que son más fáciles de lo que parecen."},{"h":"Con el participio","table":{"head":["Estructura","Significado","Ejemplo"],"rows":[["participio + **baino lehen**","antes de","**Afaldu baino lehen**, eskuak garbitu."],["participio + **eta gero**","después de","**Lana bukatu eta gero**, mendira joango gara."],["participio + **ondoren**","después de (más formal)","**Bazkaldu ondoren**, atseden hartzen dut."],["participio + **arte**","hasta (que)","**Zu etorri arte** itxarongo dut."],["participio + **-takoan**","en cuanto, al (terminar…)","**Etxera iritsitakoan**, deituko dizut."]]}},{"h":"Mientras: -n bitartean","p":"Con el verbo conjugado en relativo + **bitartean**: **Zu lanean zauden bitartean, ni umeekin egongo naiz** (mientras tú estás trabajando, yo estaré con los niños). **Telebista ikusten dudan bitartean** (mientras veo la tele). Sin oración, como adverbio: **bitartean** (mientras tanto)."},{"h":"El tiempo de la principal manda","p":"Las formas con participio no cambian según el tiempo: el tiempo lo indica la oración principal. **Lana bukatu eta gero, mendira joan nintzen** (después de terminar, fui) / **joango naiz** (iré). Un detalle de forma: si el participio acaba en **-n**, se usa **-dakoan**: **egin → egindakoan**, **irten → irtendakoan** (en cuanto salga)."},{"h":"Paso a paso: «Esperaré hasta que llegues, pero no cenes antes de que llegue yo»","p":"1) «hasta que llegues»: **zu iritsi arte** → **Zu iritsi arte itxarongo dizut**. 2) «no cenes»: **ez afaldu**. 3) «antes de que llegue yo»: **ni iritsi baino lehen**. → **Ez afaldu ni iritsi baino lehen!**"},{"h":"Errores típicos","p":"*Afaltzen baino lehen* → **Afaldu baino lehen** (participio). *Bukatu gero* → **bukatu eta gero**. *Lanean zaude bitartean* → **zauden bitartean** (relativo). *iristetakoan* → **iritsitakoan**."},{"h":"Resumen","p":"Participio + **baino lehen** (antes), **eta gero / ondoren** (después), **arte** (hasta que), **-takoan** (en cuanto). Relativo + **bitartean** (mientras). El tiempo lo marca la principal."}],"examples":[["Afaldu baino lehen, eskuak garbitu.","Antes de cenar, lávate las manos."],["Lana bukatu eta gero, mendira joango gara.","Después de terminar el trabajo, iremos al monte."],["Zu etorri arte itxarongo dut.","Esperaré hasta que vengas."],["Zu lanean zauden bitartean, ni umeekin egongo naiz.","Mientras estás trabajando, yo estaré con los niños."],["Etxera iritsitakoan, deituko dizut.","En cuanto llegue a casa, te llamaré."],["Bazkaldu ondoren, atseden hartzen dut.","Después de comer, descanso."]],"dialog":{"title":"Organizar la tarde","lines":[["Nerea","Noiz joango gara?","¿Cuándo iremos?"],["Iker","Lana bukatu eta gero. Zortzietan bukatuko dut.","Después de terminar el trabajo. Terminaré a las ocho."],["Nerea","Ondo. Zu lanean zauden bitartean, nik afaria prestatuko dut.","Bien. Mientras estás trabajando, yo prepararé la cena."],["Iker","Primeran! Lantegitik irtendakoan, deituko dizut.","¡Estupendo! En cuanto salga de la fábrica, te llamaré."],["Nerea","Zu iritsi arte itxarongo dizut.","Te esperaré hasta que llegues."],["Iker","Baina ez afaldu ni iritsi baino lehen!","¡Pero no cenes antes de que llegue yo!"]]},"exercises":[{"type":"gap","q":"Afaldu baino ___, eskuak garbitu.","es":"Antes de cenar, lávate las manos.","a":["lehen"],"hint":"antes de = baino lehen."},{"type":"gap","q":"Lana bukatu eta ___, mendira joango gara.","es":"Después de terminar el trabajo, iremos al monte.","a":["gero"],"hint":"después de = eta gero."},{"type":"gap","q":"Zu etorri ___ itxarongo dut.","es":"Esperaré hasta que vengas.","a":["arte"],"hint":"hasta (que) = arte."},{"type":"gap","q":"Zu lanean zauden ___, ni umeekin egongo naiz.","es":"Mientras trabajas, yo estaré con los niños.","a":["bitartean"],"hint":"mientras = relativo + bitartean."},{"type":"gap","q":"Etxera iritsi___, deituko dizut.","es":"En cuanto llegue a casa, te llamaré.","a":["takoan"],"hint":"en cuanto = participio + -takoan."},{"type":"gap","q":"Bazkaldu ___, atseden hartzen dut.","es":"Después de comer, descanso.","a":["ondoren"],"hint":"después de (formal) = ondoren."},{"type":"choice","q":"«Antes de cenar»","options":["afaldu baino lehen","afaltzen baino lehen","afaldu lehen baino"],"a":0,"why":"Participio + baino lehen."},{"type":"choice","q":"«Después de terminar»","options":["bukatu eta gero","bukatzen eta gero","bukatu gero eta"],"a":0,"why":"Participio + eta gero."},{"type":"choice","q":"«Hasta que vengas»","options":["zu etorri arte","zu etortzen arte","zu etorri artean"],"a":0,"why":"Participio + arte."},{"type":"choice","q":"«Mientras trabajas»","options":["lanean zauden bitartean","lanean zaude bitartean","lanean zaudela bitartean"],"a":0,"why":"Relativo (zauden) + bitartean."},{"type":"choice","q":"«En cuanto llegue a casa»","options":["etxera iritsitakoan","etxera iristetakoan","etxera iritsitzean"],"a":0,"why":"Participio (iritsi) + -takoan."},{"type":"order","words":["lehen","baino","Afaldu"],"a":["Afaldu baino lehen"],"es":"Antes de cenar.","hint":"Participio + baino lehen."},{"type":"order","words":["gero","eta","bukatu","Lana"],"a":["Lana bukatu eta gero"],"es":"Después de terminar el trabajo.","hint":"Objeto + participio + eta gero."},{"type":"order","words":["dut","arte","etorri","itxarongo","Zu"],"a":["Zu etorri arte itxarongo dut","Itxarongo dut zu etorri arte"],"es":"Esperaré hasta que vengas.","hint":"Subordinada con arte + principal."},{"type":"match","pairs":[["baino lehen","antes de"],["eta gero","después de"],["ondoren","después de (formal)"],["arte","hasta (que)"],["bitartean","mientras"],["-takoan","en cuanto, al…"]]}],"create":{"prompt":"Describe tu rutina de un día laborable en 5 frases que encadenen acciones: antes de…, después de…, mientras…, hasta que…, en cuanto…","focus":"baino lehen, eta gero, ondoren, arte, -takoan (con participio); -n bitartean"},"links":{"verbs":[],"cases":[],"themes":["denbora","aditzak"]}},"b1-11":{"id":"b1-11","lvl":"B1","n":11,"title":"Nahiz eta","es":"Las oraciones concesivas","goal":"Expresar contraste: «aunque estaba cansado», «aunque llueva», «por ti», «sin embargo».","explain":[{"h":"Antes de empezar","p":"Las concesivas sirven para decir que algo ocurre a pesar de otra cosa: «aunque estaba cansado, fui». Son imprescindibles para argumentar y matizar. El euskera tiene varias maneras de decirlo; aprenderás las tres más frecuentes y la diferencia entre «aunque es» y «aunque sea»."},{"h":"-n arren: aunque (hecho real)","p":"Relativo + **arren**: **Euria ari zuen arren, hondartzara joan ginen** (aunque llovía, fuimos a la playa). También con el participio: **Nekatuta egon arren, lanera joan nintzen** (aunque estaba cansado, fui a trabajar)."},{"h":"nahiz eta: aunque","p":"**nahiz eta** + participio (forma muy cómoda, porque no hay que conjugar): **Nahiz eta garestia izan, erosiko dut** (aunque sea caro, lo compraré). **Nahiz eta nekatuta egon…** (aunque esté cansado…)."},{"h":"ba-… ere: aunque (hipótesis)","p":"Para «aunque + subjuntivo» con sentido de «incluso si»: la condición con **ba-** + **ere**: **Euria ari badu ere, mendira joango gara** (aunque llueva, iremos al monte). Compara: **Euria ari zuen arren** (aunque llovía, de hecho) / **Euria ari badu ere** (aunque llueva, por si acaso)."},{"h":"-gatik: por, a causa de","p":"**-(r)engatik** con personas y **-(a)gatik** con cosas: **Zuregatik egin dut** (lo he hecho por ti), **Euriagatik ez gara atera** (por la lluvia no hemos salido). Es la terminación de **horregatik** (por eso) y **zergatik** (por qué). Y para contrastar dos frases: **hala ere** (sin embargo)."},{"h":"Paso a paso: «Aunque no tengo tiempo, te ayudaré»","p":"1) Hecho real: **ez daukat denborarik**. 2) Relativo + arren: daukat → **daukadan** → **denborarik ez daukadan arren**. 3) **Denborarik ez daukadan arren, lagunduko zaitut**. (O con nahiz eta: **Nahiz eta denborarik ez eduki, lagunduko zaitut**.)"},{"h":"Errores típicos","p":"*Euria ari du arren* → **duen arren** (relativo). *Nahiz eta garestia da* → **nahiz eta garestia izan** (participio, en el registro más claro). *Euria ari badu, joango gara* para «aunque llueva» → falta **ere**. *Zuretzat egin dut* para «por ti» (a causa de ti) → **zuregatik**."},{"h":"Resumen","p":"Aunque (real): **-n arren**, **nahiz eta + participio**. Aunque (hipótesis): **ba-… ere**. Causa: **-gatik** (zuregatik, euriagatik). Contraste entre frases: **hala ere**."}],"examples":[["Nekatuta egon arren, lanera joan nintzen.","Aunque estaba cansado, fui a trabajar."],["Euria ari zuen arren, hondartzara joan ginen.","Aunque llovía, fuimos a la playa."],["Nahiz eta garestia izan, erosiko dut.","Aunque sea caro, lo compraré."],["Euria ari badu ere, mendira joango gara.","Aunque llueva, iremos al monte."],["Zuregatik egin dut.","Lo he hecho por ti."],["Euriagatik ez gara atera.","Por la lluvia no hemos salido."],["Zaila da; hala ere, ikasiko dut.","Es difícil; sin embargo, lo aprenderé."]],"dialog":{"title":"¿Vamos igualmente?","lines":[["Ane","Euria ari du. Hala ere joango gara mendira?","Está lloviendo. ¿Iremos igualmente al monte?"],["Mikel","Bai! Euria ari badu ere, joango gara.","¡Sí! Aunque llueva, iremos."],["Ane","Nahiz eta ni nekatuta egon?","¿Aunque yo esté cansada?"],["Mikel","Nekatuta egon arren, ondo pasatuko dugu. Gainera, zuregatik prestatu dut bazkaria!","Aunque estés cansada, lo pasaremos bien. ¡Además, he preparado la comida por ti!"],["Ane","Ados, ados. Zuregatik joango naiz.","Vale, vale. Iré por ti."]]},"exercises":[{"type":"gap","q":"Nekatuta egon ___, lanera joan nintzen.","es":"Aunque estaba cansado, fui a trabajar.","a":["arren"],"hint":"aunque = arren."},{"type":"gap","q":"Euria ari zuen ___, hondartzara joan ginen.","es":"Aunque llovía, fuimos a la playa.","a":["arren"],"hint":"Relativo + arren."},{"type":"gap","q":"___ eta garestia izan, erosiko dut.","es":"Aunque sea caro, lo compraré.","a":["nahiz"],"hint":"nahiz eta + participio."},{"type":"gap","q":"Euria ari badu ___, mendira joango gara.","es":"Aunque llueva, iremos al monte.","a":["ere"],"hint":"ba- … ere = aunque (hipótesis)."},{"type":"gap","q":"Zure___ egin dut.","es":"Lo he hecho por ti.","a":["gatik"],"hint":"por (causa) = -gatik."},{"type":"gap","q":"Zaila da; hala ___, ikasiko dut.","es":"Es difícil; sin embargo, lo aprenderé.","a":["ere"],"hint":"sin embargo = hala ere."},{"type":"choice","q":"«Aunque estaba cansado»","options":["nekatuta egon arren","nekatuta egongatik","nekatuta badago"],"a":0,"why":"Participio + arren."},{"type":"choice","q":"«Aunque llueva» (por si acaso)","options":["euria ari badu ere","euria ari badu","euria ari duen"],"a":0,"why":"Hipótesis: ba- … ere."},{"type":"choice","q":"«Por ti» (a causa de ti)","options":["zuregatik","zuretzat","zurekin"],"a":0,"why":"-gatik = por, a causa de. Zuretzat = para ti."},{"type":"choice","q":"«Sin embargo»","options":["hala ere","horregatik","beraz"],"a":0,"why":"horregatik = por eso; beraz = así que."},{"type":"choice","q":"«Aunque sea caro»","options":["nahiz eta garestia izan","nahiz garestia da","garestia izan eta"],"a":0,"why":"nahiz eta + participio."},{"type":"order","words":["arren","egon","Nekatuta"],"a":["Nekatuta egon arren"],"es":"Aunque estaba cansado.","hint":"Estado + participio + arren."},{"type":"order","words":["ere","badu","ari","Euria"],"a":["Euria ari badu ere"],"es":"Aunque llueva.","hint":"Condición con ba- + ere."},{"type":"order","words":["dut","egin","Zuregatik"],"a":["Zuregatik egin dut"],"es":"Lo he hecho por ti.","hint":"Causa + verbo + auxiliar."},{"type":"match","pairs":[["-n arren","aunque (hecho)"],["nahiz eta","aunque"],["ba-… ere","aunque (hipótesis)"],["-gatik","por, a causa de"],["hala ere","sin embargo"],["horregatik","por eso"]]}],"create":{"prompt":"Escribe 5 frases sobre algo que haces a pesar de las dificultades (estudiar euskera, hacer deporte…): usa -n arren, nahiz eta, ba-… ere, -gatik y hala ere.","focus":"concesivas: -n arren, nahiz eta + participio, ba-… ere, -gatik, hala ere"},"links":{"verbs":[],"cases":[],"themes":["lokailuak"]}},"b1-12":{"id":"b1-12","lvl":"B1","n":12,"title":"Esaten da","es":"La forma impersonal","goal":"Decir lo que «se» hace en general: «se dice», «se habla euskera», «se vende piso».","explain":[{"h":"Antes de empezar","p":"El «se» impersonal del español («aquí se habla euskera», «¿cómo se dice?») tiene en euskera una solución sencilla y muy frecuente: usar el verbo con el auxiliar **izan** en tercera persona, aunque el verbo normalmente tenga objeto. La pregunta **Nola esaten da?** probablemente ya la has usado."},{"h":"La forma","p":"Verbo + **da** (singular) o **dira** (plural), sin sujeto: **Nola esaten da «ventana» euskaraz?** (¿cómo se dice «ventana» en euskera?). **Hemen euskaraz hitz egiten da** (aquí se habla euskera). **Etxe hau saltzen da** (esta casa se vende). Si lo que «se» hace es plural, **dira**: **Pisuak alokatzen dira** (se alquilan pisos)."},{"h":"En otros tiempos y modos","p":"Cambia solo el auxiliar: pasado **zen / ziren**: **Lehen hemen arrantza egiten zen** (antes aquí se pescaba). Futuro: **Bihar erabakiko da** (se decidirá mañana). Potencial: **Hemen erre daiteke?** (¿se puede fumar aquí?), y negativo: **Hemen ezin da aparkatu** (aquí no se puede aparcar)."},{"h":"Otra opción: jendeak","p":"Para «la gente dice / se dice que…» también se usa **jendeak** como sujeto: **Jendeak dio hondartza hori oso polita dela** (dicen que esa playa es muy bonita)."},{"h":"Paso a paso: «Antes en este pueblo se hablaba más euskera»","p":"1) Verbo habitual: **hitz egiten**. 2) Impersonal en pasado: **zen**. 3) **Lehen herri honetan euskara gehiago hitz egiten zen**."},{"h":"Errores típicos","p":"*Nola esaten du?* → **Nola esaten da?** *Pisuak saltzen da* → **dira** (plural). *Hemen euskaraz hitz egiten dago* → **da**. *Jendea dio* → **Jendeak** (con -k)."},{"h":"Resumen","p":"Impersonal = verbo + **da / dira** (pasado **zen / ziren**): esaten da, saltzen dira, egiten zen. Potencial: **daiteke**; negativo: **ezin da**. Alternativa: **jendeak dio…**."}],"examples":[["Nola esaten da «ventana» euskaraz?","¿Cómo se dice «ventana» en euskera?"],["Hemen euskaraz hitz egiten da.","Aquí se habla euskera."],["Etxe hau saltzen da.","Esta casa se vende."],["Pisuak alokatzen dira.","Se alquilan pisos."],["Lehen hemen arrantza egiten zen.","Antes aquí se pescaba."],["Hemen ezin da aparkatu.","Aquí no se puede aparcar."],["Jendeak dio hondartza hori oso polita dela.","Dicen que esa playa es muy bonita."]],"dialog":{"title":"En un pueblo nuevo","lines":[["Nerea","Barkatu, nola esaten da «gracias» euskaraz?","Perdone, ¿cómo se dice «gracias» en euskera?"],["Gizona","«Eskerrik asko» esaten da.","Se dice «eskerrik asko»."],["Nerea","Eta herri honetan euskaraz hitz egiten da?","¿Y en este pueblo se habla euskera?"],["Gizona","Bai, asko. Lehen gutxiago egiten zen, baina orain gazteek euskara erabiltzen dute.","Sí, mucho. Antes se hablaba menos, pero ahora los jóvenes usan el euskera."],["Nerea","Eta non jaten da ondo hemen?","¿Y dónde se come bien aquí?"],["Gizona","Plazan dagoen jatetxean. Jendeak dio herriko onena dela.","En el restaurante que está en la plaza. Dicen que es el mejor del pueblo."]]},"exercises":[{"type":"gap","q":"Nola esaten ___ «leiho» gazteleraz?","es":"¿Cómo se dice «leiho» en castellano?","a":["da"],"hint":"Impersonal: da."},{"type":"gap","q":"Hemen euskaraz hitz egiten ___.","es":"Aquí se habla euskera.","a":["da"],"hint":"Impersonal: da."},{"type":"gap","q":"Etxe hau saltzen ___.","es":"Esta casa se vende.","a":["da"],"hint":"Una cosa: da."},{"type":"gap","q":"Pisuak alokatzen ___.","es":"Se alquilan pisos.","a":["dira"],"hint":"Varias cosas: dira."},{"type":"gap","q":"Lehen hemen arrantza egiten ___.","es":"Antes aquí se pescaba.","a":["zen"],"hint":"Impersonal en pasado: zen."},{"type":"gap","q":"Hemen ezin ___ aparkatu.","es":"Aquí no se puede aparcar.","a":["da"],"hint":"ezin + da."},{"type":"choice","q":"«Aquí se habla euskera»","options":["Hemen euskaraz hitz egiten da.","Hemen euskaraz hitz egiten du.","Hemen euskaraz hitz egiten dago."],"a":0,"why":"Impersonal: izan (da)."},{"type":"choice","q":"«Se venden pisos»","options":["Pisuak saltzen dira.","Pisuak saltzen da.","Pisuak saltzen ditu."],"a":0,"why":"Plural: dira."},{"type":"choice","q":"«¿Cómo se dice?»","options":["Nola esaten da?","Nola esaten du?","Nola da esaten?"],"a":0,"why":"Interrogativa + verbo + da."},{"type":"choice","q":"«Antes aquí se pescaba»","options":["Lehen hemen arrantza egiten zen.","Lehen hemen arrantza egiten zuen.","Lehen hemen arrantza egiten da."],"a":0,"why":"Pasado impersonal: zen."},{"type":"choice","q":"«Dicen que…» (la gente)","options":["Jendeak dio…","Jendea dio…","Jendeak esaten da…"],"a":0,"why":"jendeak (con -k) + dio."},{"type":"order","words":["da","esaten","Nola"],"a":["Nola esaten da"],"es":"¿Cómo se dice?","hint":"Nola + esaten + da."},{"type":"order","words":["da","saltzen","hau","Etxe"],"a":["Etxe hau saltzen da"],"es":"Esta casa se vende.","hint":"Etxe hau + saltzen da."},{"type":"order","words":["hitz","Hemen","da","egiten","euskaraz"],"a":["Hemen euskaraz hitz egiten da","Euskaraz hitz egiten da hemen"],"es":"Aquí se habla euskera.","hint":"Lugar + euskaraz + hitz egiten da."},{"type":"match","pairs":[["esaten da","se dice"],["saltzen da","se vende"],["saltzen dira","se venden"],["egiten zen","se hacía"],["ezin da","no se puede"],["jendeak dio","dicen (la gente dice)"]]}],"create":{"prompt":"Describe tu pueblo o ciudad en 5 frases impersonales: qué idiomas se hablan, qué se come, qué se puede hacer, qué no se puede hacer y qué se hacía antes.","focus":"impersonal con da/dira, zen/ziren, daiteke, ezin da; jendeak dio"},"links":{"verbs":[],"cases":[],"themes":["hiria","natura"]}},"b1-13":{"id":"b1-13","lvl":"B1","n":13,"title":"Lagunarengana","es":"Los casos de lugar con personas","goal":"Decir «voy al médico», «ven a mí», «lo he recibido de un amigo», «confío en ti».","explain":[{"h":"Antes de empezar","p":"Desde el A1 usas los casos de lugar con cosas: **etxean, etxera, etxetik**. Pero con personas y animales no se pueden usar esas terminaciones: no se dice *medikura noa* para «voy al médico». El euskera tiene una serie propia para seres vivos, construida con **-gan**. Es la última pieza del sistema de casos que te faltaba."},{"h":"La serie -gan","p":"Se forma sobre el genitivo (**-(r)en**) añadiendo **-gan**, **-gana** o **-gandik**:","table":{"head":["Caso","Con cosas","Con personas","Ejemplo"],"rows":[["NON (en)","-an","-(r)en**gan**","Zure**gan** konfiantza daukat (confío en ti)"],["NORA (a)","-ra","-(r)en**gana**","Medikuaren**gana** noa (voy al médico)"],["NONDIK (de)","-tik","-(r)en**gandik**","Lagunaren**gandik** jaso dut (lo he recibido de un amigo)"]]}},{"h":"Con nombres y pronombres","p":"Singular: **lagunarengana** (al amigo), **amarengandik** (de la madre). Plural: **gurasoengana** (a los padres). Nombres propios: **Mikelengana**, **Anerengandik**. Pronombres: con ellos se usa una forma más corta: **nigana** (a mí), **zugana** (a ti), **harengana** (a él), **gugana**, **zuengana**, **haiengana**; **nigan**, **zugandik**…"},{"h":"En el habla","p":"Para «ir a casa de alguien», lo más natural es decirlo tal cual: **Amaren etxera noa** (voy a casa de mi madre). Y «voy al médico» también se oye como **medikuarenera noa**. Pero en la escritura y en el habla cuidada, la serie -gan es la correcta."},{"h":"Paso a paso: «He aprendido mucho de mi profesora»","p":"1) De quién: **nire irakaslea** (persona) → NONDIK de persona: **nire irakaslearengandik**. 2) **asko ikasi dut**. → **Nire irakaslearengandik asko ikasi dut**."},{"h":"Errores típicos","p":"*Medikura noa* → **Medikuarengana noa**. *Zatoz nira* → **Zatoz nigana**. *Lagunetik jaso dut* → **Lagunarengandik**. *Zuan konfiantza* → **Zugan** (o **zuregan**) **konfiantza**."},{"h":"Resumen","p":"Con seres vivos: **-(r)engan** (en), **-(r)engana** (a), **-(r)engandik** (de, desde). Pronombres: **nigana, zugana, harengana…**. Ya conoces todos los casos de lugar del euskera."}],"examples":[["Medikuarengana noa.","Voy al médico."],["Zatoz nigana!","¡Ven a mí!"],["Lagunarengandik jaso dut mezua.","He recibido el mensaje de un amigo."],["Zugan konfiantza daukat.","Confío en ti."],["Amarengana joan da.","Ha ido a ver a su madre."],["Haurrak gurasoengana joan ziren.","Los niños fueron hacia sus padres."],["Mikelengandik asko ikasi dut.","He aprendido mucho de Mikel."]],"dialog":{"title":"Recados","lines":[["Jon","Nora zoaz?","¿Adónde vas?"],["Miren","Medikuarengana noa. Buruak min ematen dit.","Voy al médico. Me duele la cabeza."],["Jon","Ene! Eta gero?","¡Vaya! ¿Y luego?"],["Miren","Gero amonarengana joango naiz. Lagun batengandik jaso dudan opari bat daukat harentzat.","Luego iré a ver a mi abuela. Tengo para ella un regalo que he recibido de una amiga."],["Jon","Gero zatoz nigana, eta kafe bat hartuko dugu.","Luego ven a verme, y tomaremos un café."],["Miren","Ados!","¡De acuerdo!"]]},"exercises":[{"type":"gap","q":"Mediku___ noa.","es":"Voy al médico.","a":["arengana"],"hint":"A una persona: -arengana."},{"type":"gap","q":"Zatoz ___!","es":"¡Ven a mí!","a":["nigana"],"hint":"Pronombre: nigana."},{"type":"gap","q":"Lagunaren___ jaso dut mezua.","es":"He recibido el mensaje de un amigo.","a":["gandik"],"hint":"De una persona: -(r)engandik."},{"type":"gap","q":"Zu___ konfiantza daukat.","es":"Confío en ti.","a":["gan"],"hint":"En una persona: -gan."},{"type":"gap","q":"Ama___ joan da.","es":"Ha ido a ver a su madre.","a":["rengana"],"hint":"ama acaba en -a: -rengana."},{"type":"gap","q":"Mikel___ asko ikasi dut.","es":"He aprendido mucho de Mikel.","a":["engandik"],"hint":"Nombre propio en consonante: -engandik."},{"type":"choice","q":"«Voy al médico»","options":["Medikuarengana noa.","Medikura noa.","Medikuan noa."],"a":0,"why":"Con personas: -rengana."},{"type":"choice","q":"«Ven a mí»","options":["Zatoz nigana!","Zatoz nira!","Zatoz niri!"],"a":0,"why":"Pronombre de lugar: nigana."},{"type":"choice","q":"«Lo he recibido de un amigo»","options":["Lagun batengandik jaso dut.","Lagun batetik jaso dut.","Lagun bati jaso dut."],"a":0,"why":"Procedencia de una persona: -engandik."},{"type":"choice","q":"«Confío en ti»","options":["Zugan konfiantza daukat.","Zuan konfiantza daukat.","Zuri konfiantza daukat."],"a":0,"why":"En una persona: zugan."},{"type":"choice","q":"«Hacia los padres»","options":["gurasoengana","gurasoetara","gurasoei"],"a":0,"why":"Plural de persona: -engana."},{"type":"order","words":["da","joan","Amarengana"],"a":["Amarengana joan da"],"es":"Ha ido a ver a su madre.","hint":"A quién + joan da."},{"type":"order","words":["dut","jaso","Lagunarengandik","mezua"],"a":["Lagunarengandik jaso dut mezua","Mezua lagunarengandik jaso dut"],"es":"He recibido el mensaje de un amigo.","hint":"De quién + jaso dut (+ objeto)."},{"type":"order","words":["ikasi","dut","Mikelengandik"],"a":["Mikelengandik ikasi dut"],"es":"He aprendido de Mikel.","hint":"De quién + ikasi dut."},{"type":"match","pairs":[["-(r)engan","en (persona)"],["-(r)engana","a (persona)"],["-(r)engandik","de, desde (persona)"],["nigana","a mí"],["zugandik","de ti"],["harengana","a él / ella"]]}],"create":{"prompt":"Escribe 5 frases sobre tus visitas y relaciones: a quién vas a ver esta semana, de quién has recibido algo, de quién has aprendido mucho, en quién confías y quién viene a verte.","focus":"casos de lugar con personas: -(r)engan, -(r)engana, -(r)engandik; nigana, zugandik…"},"links":{"verbs":[],"cases":[],"themes":["familia","pertsonak"]}},"b1-14":{"id":"b1-14","lvl":"B1","n":14,"title":"Hitz berriak sortzen","es":"Formación de palabras","goal":"Entender y crear palabras nuevas con los sufijos más productivos del euskera.","explain":[{"h":"Antes de empezar","p":"El euskera construye su vocabulario como un juego de piezas: a partir de una raíz se crean nombres, adjetivos y profesiones con sufijos fijos. Si conoces los diez sufijos más frecuentes, podrás adivinar el significado de cientos de palabras que nunca has visto. Es una de las inversiones más rentables del B1."},{"h":"Nombres","table":{"head":["Sufijo","Significado","Ejemplos"],"rows":[["-tasun","cualidad (-dad, -eza)","aske → **askatasun** (libertad), eder → **edertasun** (belleza), berdin → **berdintasun** (igualdad)"],["-keta","acción (-ción, -eo)","garbitu → **garbiketa** (limpieza), aldatu → **aldaketa** (cambio), erosi → **erosketa** (compra)"],["-tegi / -degi","lugar","liburu → **liburutegi** (biblioteca), okin → **okindegi** (panadería), haragi → **harategi** (carnicería)"],["-le / -tzaile","quien hace (-dor)","idatzi → **idazle** (escritor), ikasi → **ikasle**, saldu → **saltzaile** (vendedor)"],["-lari","profesión, afición","kirol → **kirolari** (deportista), abestu → **abeslari** (cantante), dantza → **dantzari**"]]}},{"h":"Adjetivos","table":{"head":["Sufijo","Significado","Ejemplos"],"rows":[["-garri","que produce (-ble, -nte)","harritu → **harrigarri** (sorprendente), beldur → **beldurgarri** (que da miedo), jan → **jangarri** (comestible)"],["-tsu","que abunda en (-oso)","zorion → **zoriontsu** (feliz), mendi → **menditsu** (montañoso), osasun → **osasuntsu**"],["-dun","que tiene","bizar → **bizardun** (barbudo), diru → **dirudun** (adinerado), euskara → **euskaldun**"],["-gabe","sin","lotsa → **lotsagabe** (sinvergüenza), etxe → **etxegabe** (sin techo), lan → **langabe**"]]}},{"h":"Una palabra especial: euskaldun","p":"**euskaldun** significa literalmente «quien tiene euskera»: es decir, vascohablante. Por eso **Euskal Herria** es «el país del euskera». Y cuando termines este curso, podrás decir: **euskalduna naiz**."},{"h":"Paso a paso: «La belleza de este paisaje es sorprendente»","p":"1) «belleza» = eder + **-tasun** → **edertasuna**. 2) «sorprendente» = harritu + **-garri** → **harrigarria**. 3) «de este paisaje» = **paisaia honen**. → **Paisaia honen edertasuna harrigarria da**."},{"h":"Errores típicos","p":"*ederkeria* para «belleza» → **edertasun** (-keria es despectivo). *abestaile* → **abeslari**. *aldatasun* → **aldaketa**. *beldurtsu* para «que da miedo» → **beldurgarri** (beldurti es «miedoso»)."},{"h":"Resumen","p":"**-tasun** (cualidad), **-keta** (acción), **-tegi** (lugar), **-le / -tzaile / -lari** (quien hace), **-garri** (que produce), **-tsu** (que abunda), **-dun** (que tiene), **-gabe** (sin)."}],"examples":[["Askatasuna garrantzitsua da.","La libertad es importante."],["Pelikula harrigarria izan zen.","La película fue sorprendente."],["Idazle ezaguna da.","Es un escritor conocido."],["Etxeko garbiketa egin dut.","He hecho la limpieza de la casa."],["Okindegira noa ogia erostera.","Voy a la panadería a comprar pan."],["Euskalduna naiz!","¡Soy vascohablante!"],["Oso pertsona zoriontsua da.","Es una persona muy feliz."]],"dialog":{"title":"Una escritora","lines":[["Ane","Ezagutzen duzu Miren Agirre? Idazlea da.","¿Conoces a Miren Agirre? Es escritora."],["Iker","Bai! Bere azken liburua harrigarria da.","¡Sí! Su último libro es sorprendente."],["Ane","Eta euskalduna da, Bilbokoa.","Y es vascohablante, de Bilbao."],["Iker","Badakit. Askatasunari buruzko liburuak idazten ditu.","Lo sé. Escribe libros sobre la libertad."],["Ane","Bihar liburutegian egongo da, irakurleekin hitz egiten.","Mañana estará en la biblioteca, hablando con los lectores."],["Iker","Joango naiz! Oso interesgarria izango da.","¡Iré! Será muy interesante."]]},"exercises":[{"type":"gap","q":"Aske___ garrantzitsua da.","es":"La libertad es importante.","a":["tasuna"],"hint":"cualidad: -tasun (+ artículo)."},{"type":"gap","q":"Pelikula harri___ izan zen.","es":"La película fue sorprendente.","a":["garria"],"hint":"que produce: -garri (+ artículo)."},{"type":"gap","q":"Idaz___ ezaguna da.","es":"Es un escritor conocido.","a":["lea"],"hint":"quien escribe: idazle (+ artículo)."},{"type":"gap","q":"Etxeko garbi___ egin dut.","es":"He hecho la limpieza de la casa.","a":["keta"],"hint":"acción: -keta."},{"type":"gap","q":"Liburu___ra noa.","es":"Voy a la biblioteca.","a":["tegi"],"hint":"lugar: -tegi."},{"type":"gap","q":"Euskal___ naiz!","es":"¡Soy vascohablante!","a":["duna"],"hint":"que tiene: -dun (+ artículo)."},{"type":"choice","q":"«Belleza» (de eder)","options":["edertasun","ederkeria","edergarri"],"a":0,"why":"Cualidad: -tasun."},{"type":"choice","q":"«Cantante»","options":["abeslari","abestaile","abestasun"],"a":0,"why":"Profesión: -lari."},{"type":"choice","q":"«Cambio» (de aldatu)","options":["aldaketa","aldatasun","aldagarri"],"a":0,"why":"Acción: -keta."},{"type":"choice","q":"«Que da miedo»","options":["beldurgarria","beldurtasuna","beldurduna"],"a":0,"why":"Que produce: -garri."},{"type":"choice","q":"«Vascohablante»","options":["euskalduna","euskaltegia","euskaraketa"],"a":0,"why":"-dun = que tiene (euskera). Euskaltegia es la escuela."},{"type":"order","words":["garrantzitsua","Askatasuna","da"],"a":["Askatasuna garrantzitsua da"],"es":"La libertad es importante.","hint":"Sujeto + adjetivo + da."},{"type":"order","words":["zen","harrigarria","izan","Pelikula"],"a":["Pelikula harrigarria izan zen"],"es":"La película fue sorprendente.","hint":"Sujeto + adjetivo + izan zen."},{"type":"order","words":["ezaguna","da","Idazle"],"a":["Idazle ezaguna da"],"es":"Es un escritor conocido.","hint":"Nombre + adjetivo + da."},{"type":"match","pairs":[["-tasun","cualidad (edertasun)"],["-garri","que produce (harrigarri)"],["-le / -tzaile","quien hace (idazle, saltzaile)"],["-keta","acción (garbiketa)"],["-tegi","lugar (liburutegi)"],["-dun","que tiene (euskaldun)"]]}],"create":{"prompt":"Escribe 5 frases usando al menos 6 palabras derivadas: describe a una persona que admiras (su profesión, sus cualidades) y un lugar de tu ciudad.","focus":"sufijos -tasun, -keta, -tegi, -le/-tzaile/-lari, -garri, -tsu, -dun, -gabe"},"links":{"verbs":[],"cases":[],"themes":["lana","adjektiboak"]}},"b1-15":{"id":"b1-15","lvl":"B1","n":15,"title":"Nire ustez","es":"Dar y defender una opinión","goal":"Opinar, estar de acuerdo o en desacuerdo, matizar y argumentar en una conversación.","explain":[{"h":"Antes de empezar","p":"Ya tienes todas las piezas gramaticales para opinar: **-la** (uste dut … -la), **-nik** (ez dut uste … -nik), las concesivas y las causales. En esta lección reúnes las expresiones que usan los hablantes para debatir, de modo que puedas participar en una conversación de verdad, no solo responder preguntas."},{"h":"Opinar","p":"**Nire ustez…** (en mi opinión…): **Nire ustez, ideia ona da**. **Uste dut … -la** (creo que…). **Iruditzen zait … -la** (me parece que…): **Iruditzen zait arrazoia duzula**. Para preguntar: **Zure ustez?** (¿en tu opinión?), **Zer iruditzen zaizu?** (¿qué te parece?)."},{"h":"Acuerdo y desacuerdo","p":"**Ados nago** (estoy de acuerdo), **Ez nago ados** (no estoy de acuerdo), **Zurekin ados nago** (estoy de acuerdo contigo), **Arrazoia duzu** (tienes razón), **Ez dut uste … -nik** (no creo que…). Posición: **-ren alde egon** (estar a favor de): **Proposamenaren alde nago**; **-ren kontra egon** (estar en contra de)."},{"h":"Matizar y argumentar","p":"**Alde batetik…, bestetik…** (por un lado…, por otro…), **Egia da … -la, baina…** (es verdad que…, pero…), **Hala ere** (sin embargo), **Gainera** (además), **Beraz** (así que), **Dena den** (de todos modos), **-lako** (porque). Para proponer: **… beharko genuke** (deberíamos…), con el condicional que ya conoces."},{"h":"Paso a paso: «Es verdad que es caro, pero creo que merece la pena»","p":"1) «Es verdad que es caro»: **Egia da garestia dela**. 2) «pero creo que merece la pena»: **baina uste dut merezi duela**. → **Egia da garestia dela, baina uste dut merezi duela**."},{"h":"Errores típicos","p":"*Nire uste* → **Nire ustez**. *Iruditzen dut* → **Iruditzen zait** (NOR-NORI). *Kontra naiz* → **kontra nago**. *Ados naiz* → **Ados nago**."},{"h":"Resumen","p":"Opinar: **nire ustez, uste dut … -la, iruditzen zait … -la**. Acuerdo: **ados nago / ez nago ados, arrazoia duzu**. Posición: **-ren alde / kontra nago**. Matizar: **alde batetik… bestetik, egia da … baina, hala ere**."}],"examples":[["Nire ustez, euskara ikastea oso garrantzitsua da.","En mi opinión, aprender euskera es muy importante."],["Iruditzen zait arrazoia duzula.","Me parece que tienes razón."],["Ez nago ados zurekin.","No estoy de acuerdo contigo."],["Proposamen horren alde nago.","Estoy a favor de esa propuesta."],["Alde batetik merkea da; bestetik, urrun dago.","Por un lado es barato; por otro, está lejos."],["Egia da zaila dela, baina merezi du.","Es verdad que es difícil, pero merece la pena."],["Zure ustez, zer egin beharko genuke?","En tu opinión, ¿qué deberíamos hacer?"]],"dialog":{"title":"Un hotel nuevo en el pueblo","lines":[["Ane","Zer iruditzen zaizu herrian hotel berri bat egitea?","¿Qué te parece que se haga un hotel nuevo en el pueblo?"],["Jon","Nire ustez, ideia ona da. Turismoak lana ekartzen du.","En mi opinión, es una buena idea. El turismo trae trabajo."],["Ane","Ez nago ados. Alde batetik, lana ekarriko du; bestetik, etxeak garestiagoak izango dira.","No estoy de acuerdo. Por un lado, traerá trabajo; por otro, las casas serán más caras."],["Jon","Egia da, baina ez dut uste arazo handia denik.","Es verdad, pero no creo que sea un gran problema."],["Ane","Beno, ados ez gaudela onartu beharko dugu!","Bueno, ¡tendremos que aceptar que no estamos de acuerdo!"]]},"exercises":[{"type":"gap","q":"Nire ___, ideia ona da.","es":"En mi opinión, es una buena idea.","a":["ustez"],"hint":"en mi opinión = nire ustez."},{"type":"gap","q":"Iruditzen zait arrazoia ___.","es":"Me parece que tienes razón.","a":["duzula"],"hint":"duzu + -la."},{"type":"gap","q":"Ez nago ___ zurekin.","es":"No estoy de acuerdo contigo.","a":["ados"],"hint":"de acuerdo = ados."},{"type":"gap","q":"Proposamen horren ___ nago.","es":"Estoy a favor de esa propuesta.","a":["alde"],"hint":"a favor de = -ren alde."},{"type":"gap","q":"Alde batetik merkea da; ___, urrun dago.","es":"Por un lado es barato; por otro, está lejos.","a":["bestetik"],"hint":"por otro = bestetik."},{"type":"gap","q":"Ez dut uste arazo handia ___.","es":"No creo que sea un gran problema.","a":["denik"],"hint":"Tras «no creo»: -nik."},{"type":"choice","q":"«En mi opinión»","options":["Nire ustez","Nire uste","Nik ustez"],"a":0,"why":"Expresión fija: nire ustez."},{"type":"choice","q":"«Me parece que tienes razón»","options":["Iruditzen zait arrazoia duzula.","Iruditzen dut arrazoia duzula.","Iruditzen zait arrazoia duzu."],"a":0,"why":"iruditu es NOR-NORI + subordinada con -la."},{"type":"choice","q":"«Estoy en contra»","options":["Kontra nago.","Kontra naiz.","Kontra dut."],"a":0,"why":"Posición con egon: nago."},{"type":"choice","q":"«No creo que sea un problema»","options":["Ez dut uste arazoa denik.","Ez dut uste arazoa da.","Ez uste dut arazoa denik."],"a":0,"why":"Ez dut uste + -nik."},{"type":"choice","q":"«Por un lado… por otro…»","options":["alde batetik… bestetik…","batetik alde… beste…","alde bat… beste bat…"],"a":0,"why":"Expresión fija."},{"type":"order","words":["ados","Ez","nago"],"a":["Ez nago ados"],"es":"No estoy de acuerdo.","hint":"Ez + nago + ados."},{"type":"order","words":["alde","horren","nago","Proposamen"],"a":["Proposamen horren alde nago"],"es":"Estoy a favor de esa propuesta.","hint":"Proposamen horren + alde + nago."},{"type":"order","words":["duzula","arrazoia","zait","Iruditzen"],"a":["Iruditzen zait arrazoia duzula","Arrazoia duzula iruditzen zait"],"es":"Me parece que tienes razón.","hint":"Iruditzen zait + subordinada."},{"type":"match","pairs":[["nire ustez","en mi opinión"],["ados nago","estoy de acuerdo"],["-ren alde","a favor de"],["-ren kontra","en contra de"],["alde batetik","por un lado"],["bestetik","por otro"]]}],"create":{"prompt":"Elige un tema (el turismo, el teletrabajo, aprender idiomas con IA) y escribe tu opinión en 6 frases: tu postura, un argumento, un contraargumento con «egia da… baina», y una conclusión.","focus":"nire ustez, uste dut/iruditzen zait … -la, ez dut uste … -nik, a
