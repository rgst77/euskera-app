dos nago, -ren alde/kontra, alde batetik… bestetik"},"links":{"verbs":[],"cases":[],"themes":["lokailuak"]}},"b1-16":{"id":"b1-16","lvl":"B1","n":16,"title":"Kontakizunak","es":"Narrar en pasado","goal":"Contar una historia ordenada combinando los pasados y los conectores narrativos.","explain":[{"h":"Antes de empezar","p":"Última lección del B1. Vas a juntar todo lo que sabes sobre el pasado para contar historias: lo que pasó una vez, lo que solía pasar, lo que estaba pasando cuando ocurrió algo, y los conectores que dan ritmo a un relato. Es el examen práctico de todo el nivel."},{"h":"Los tres pasados juntos","table":{"head":["Para…","Forma","Ejemplo"],"rows":[["una acción terminada","participio + nintzen / nuen","Mendira **joan nintzen**."],["una costumbre","-tzen + nintzen / nuen","Udan herrira **joaten ginen**."],["una acción en curso","-tzen ari nintzen","Telebista **ikusten ari ginen**…"],["una situación o estado","sintético en pasado","Eguraldi ona **zegoen**."]]}},{"h":"«Mientras iba…»: -la","p":"Para una acción en curso que sirve de fondo, se añade **-la** a un verbo sintético en pasado: **Etxera nindoala, Mikel ikusi nuen** (mientras iba a casa, vi a Mikel). **Kalean nengoela, euria hasi zuen** (estando en la calle, empezó a llover)."},{"h":"Conectores narrativos","p":"**Egun batean** (un día), **behin** (una vez), **hasieran** (al principio), **lehenengo** (primero), **gero** (luego), **orduan** (entonces), **bat-batean** (de repente), **handik gutxira** (poco después), **bitartean** (mientras tanto), **azkenean** (al final). Y todas las oraciones temporales del nivel: **-nean**, **-takoan**, **eta gero**, **baino lehen**."},{"h":"Paso a paso: una historia en cuatro frases","p":"1) Marco: **Egun batean, mendira joan nintzen lagunekin.** 2) Situación: **Eguraldi ona zegoen eta pozik gindoazen.** 3) Acontecimiento: **Bat-batean, euria hasi zuen.** 4) Desenlace: **Azkenean, borda batean babestu ginen eta kartetan jolastu genuen.**"},{"h":"Errores típicos","p":"Contar todo con el pasado puntual: *Txikitan herrira joan ginen udan* → **joaten ginen** (costumbre). *Telebista ikusi genuen argia joan zenean* → **ikusten ari ginen** (acción interrumpida). *Etxera noala* → **nindoala** (pasado)."},{"h":"Resumen","p":"Puntual: **joan nintzen**. Costumbre: **joaten nintzen**. En curso: **ari nintzen**, **nindoala**. Estados: **zegoen, neukan**. Conectores: egun batean, hasieran, bat-batean, handik gutxira, azkenean. Con esta lección has completado el B1. Zorionak!"}],"examples":[["Egun batean, mendira joan nintzen.","Un día fui al monte."],["Txikia nintzenean, udan herrira joaten ginen.","Cuando era pequeño, en verano íbamos al pueblo."],["Etxera nindoala, Mikel ikusi nuen.","Mientras iba a casa, vi a Mikel."],["Bat-batean, euria hasi zuen.","De repente, empezó a llover."],["Telebista ikusten ari ginen, argia joan zenean.","Estábamos viendo la tele cuando se fue la luz."],["Handik gutxira, lagunak iritsi ziren.","Poco después, llegaron los amigos."],["Azkenean, garaiz iritsi ginen.","Al final, llegamos a tiempo."]],"dialog":{"title":"Un reencuentro","lines":[["Ane","Zer gertatu zitzaizun atzo?","¿Qué te pasó ayer?"],["Jon","Etxera nindoala, nire lagun zahar bat ikusi nuen.","Mientras iba a casa, vi a un viejo amigo."],["Ane","Benetan? Nor?","¿De verdad? ¿Quién?"],["Jon","Mikel! Txikiak ginenean, egunero jolasten genuen elkarrekin.","¡Mikel! Cuando éramos pequeños, jugábamos juntos todos los días."],["Ane","Eta zer esan zizun?","¿Y qué te dijo?"],["Jon","Hasieran ez ninduen ezagutu! Gero, kafe bat hartu genuen eta ordubete hitz egin genuen.","¡Al principio no me reconoció! Luego tomamos un café y hablamos una hora."]]},"exercises":[{"type":"gap","q":"___ batean, mendira joan nintzen.","es":"Un día fui al monte.","a":["egun"],"hint":"un día = egun batean."},{"type":"gap","q":"Txikia nintzenean, udan herrira joaten ___.","es":"Cuando era pequeño, en verano íbamos al pueblo.","a":["ginen"],"hint":"Costumbre: -tzen + ginen."},{"type":"gap","q":"Etxera ___, Mikel ikusi nuen.","es":"Mientras iba a casa, vi a Mikel.","a":["nindoala"],"hint":"joan en pasado (nindoan) + -la."},{"type":"gap","q":"Bat-___, euria hasi zuen.","es":"De repente, empezó a llover.","a":["batean"],"hint":"de repente = bat-batean."},{"type":"gap","q":"Telebista ikusten ari ___, argia joan zenean.","es":"Estábamos viendo la tele cuando se fue la luz.","a":["ginen"],"hint":"En curso: ari + ginen."},{"type":"gap","q":"Hasieran ez ___ ezagutu.","es":"Al principio no me reconoció.","a":["ninduen"],"hint":"él → a mí, pasado: ninduen."},{"type":"choice","q":"«De repente»","options":["bat-batean","batzuetan","behin"],"a":0,"why":"batzuetan = a veces; behin = una vez."},{"type":"choice","q":"«Al final»","options":["azkenean","hasieran","bitartean"],"a":0,"why":"hasieran = al principio; bitartean = mientras tanto."},{"type":"choice","q":"«Íbamos al pueblo (cada verano)»","options":["herrira joaten ginen","herrira joan ginen","herrira goaz"],"a":0,"why":"Costumbre en el pasado: -tzen + ginen."},{"type":"choice","q":"«Mientras iba a casa»","options":["etxera nindoala","etxera noala","etxera joan nintzenean"],"a":0,"why":"Sintético en pasado + -la."},{"type":"choice","q":"«Estábamos viendo la tele cuando…»","options":["Telebista ikusten ari ginen…","Telebista ikusi genuen…","Telebista ikusten dugu…"],"a":0,"why":"Acción interrumpida: ari + pasado."},{"type":"order","words":["nintzen","joan","mendira","batean","Egun"],"a":["Egun batean mendira joan nintzen"],"es":"Un día fui al monte.","hint":"Conector + lugar + verbo + auxiliar."},{"type":"order","words":["zuen","hasi","euria","Bat-batean"],"a":["Bat-batean euria hasi zuen"],"es":"De repente empezó a llover.","hint":"Conector + euria + hasi zuen."},{"type":"order","words":["ginen","iritsi","garaiz","Azkenean"],"a":["Azkenean garaiz iritsi ginen"],"es":"Al final llegamos a tiempo.","hint":"Conector + garaiz + verbo + auxiliar."},{"type":"match","pairs":[["egun batean","un día"],["hasieran","al principio"],["gero","luego"],["bat-batean","de repente"],["handik gutxira","poco después"],["azkenean","al final"]]}],"create":{"prompt":"Cuenta una anécdota real o inventada en 8 a 10 frases: el marco (cuándo, dónde), cómo era la situación, qué pasó de repente y cómo terminó. Usa los tres pasados y al menos cinco conectores.","focus":"narración: pasado puntual, habitual y en curso (ari nintzen, nindoala), sintéticos en pasado, conectores narrativos"},"links":{"verbs":["nor-past","nn-past-3","syn-past"],"cases":[],"themes":["denbora"]}},"b2-01":{"id":"b2-01","lvl":"B2","n":1,"title":"Trinko gehiago","es":"Más verbos sintéticos","goal":"Usar con soltura los verbos sintéticos frecuentes que faltaban: traer, llevar, andar, saber (en pasado) y parecer.","explain":[{"h":"Antes de empezar","p":"Bienvenido al B2. Ya conoces los sintéticos más básicos (egon, joan, etorri, eduki, jakin, esan). En la lengua real aparecen algunos más, sobre todo en el habla cuidada y en los textos. Esta lección completa ese grupo y te hace la lectura mucho más fluida."},{"h":"ekarri (traer) y eraman (llevar)","p":"Funcionan como dut: la terminación indica quién (-t, -zu, nada, -gu, -zue, -te). **Zer dakarzu?** (¿qué traes?), **Opari bat dakart** (traigo un regalo), **Zer daramazu poltsan?** (¿qué llevas en el bolso?). **eraman** también sirve para el tiempo transcurrido: **Bi urte daramatzat euskara ikasten** (llevo dos años estudiando euskera); con urte en plural la forma es daramatzat, que puedes aprender como bloque.","table":{"head":["NORK","ekarri (traer)","eraman (llevar)"],"rows":[["nik","{nork:dakart}","{nork:daramat}"],["zuk","{nork:dakarzu}","{nork:daramazu}"],["hark","{nork:dakar}","{nork:darama}"],["guk","{nork:dakargu}","{nork:daramagu}"],["zuek","{nork:dakarzue}","{nork:daramazue}"],["haiek","{nork:dakarte}","{nork:daramate}"]]}},{"h":"ibili y jakin en pasado","p":"**ibili** (andar, estar dedicado a algo) en pasado: **nenbilen, zenbiltzan, zebilen, genbiltzan, zenbiltzaten, zebiltzan**: **Lan bila nenbilen** (andaba buscando trabajo). **jakin** en pasado, muy frecuente en negativa: **nekien, zenekien, zekien, genekien, zenekiten, zekiten**: **Ez nekien!** (¡no lo sabía!), **Bazenekien?** (¿lo sabías?)."},{"h":"dirudi (parece)","p":"Forma sintética de **iruditu**, para decir cómo parece algo, sin persona: **Zaila dirudi** (parece difícil), **Nekatuta zaudela dirudi** (parece que estás cansado), en plural **dirudite** y en pasado **zirudien**: **Pozik zirudien** (parecía contento). Compara: **Zaila iruditzen zait** (me parece difícil, con persona)."},{"h":"Paso a paso: «¿Lo sabías? Llevo tres años viviendo aquí»","p":"1) «¿Lo sabías?»: jakin, pasado, tú → **zenekien**, con ba- en pregunta afirmativa → **Bazenekien?** 2) «Llevo tres años viviendo aquí»: **Hiru urte daramatzat hemen bizitzen**. (Con «urte» en plural, la forma es daramatzat; la aprenderás de oído como bloque.)"},{"h":"Errores típicos","p":"*Ez nuen jakin* para «no lo sabía» → lo natural es **Ez nekien**. *Zaila dirudit* → **Zaila dirudi** (sin persona). *Dakart zuk?* → **Dakarzu?** *Zaila iruditzen du* → **zaila iruditzen zait** o **zaila dirudi**."},{"h":"Resumen","p":"**dakart, dakarzu, dakar…** (traer) · **daramat, daramazu, darama…** (llevar; también tiempo) · **nenbilen…** (andaba) · **nekien, zenekien, zekien…** (sabía) · **dirudi / dirudite / zirudien** (parece / parecía)."}],"examples":[["Zer dakarzu?","¿Qué traes?"],["Opari bat dakart.","Traigo un regalo."],["Zer daramazu poltsan?","¿Qué llevas en el bolso?"],["Ez nekien!","¡No lo sabía!"],["Lan bila nenbilen.","Andaba buscando trabajo."],["Zaila dirudi.","Parece difícil."],["Pozik zirudien.","Parecía contento."]],"dialog":{"title":"La sorpresa","lines":[["Iker","Zer dakarzu hor?","¿Qué traes ahí?"],["Ane","Tarta bat dakart. Mikelen urtebetetzea da gaur.","Traigo una tarta. Hoy es el cumpleaños de Mikel."],["Iker","Benetan? Ez nekien!","¿De verdad? ¡No lo sabía!"],["Ane","Bai! Atzo triste zirudien, eta sorpresa bat egin nahi diogu.","¡Sí! Ayer parecía triste, y queremos darle una sorpresa."],["Iker","Ideia ona dirudi. Zer daramazu poltsan?","Parece buena idea. ¿Qué llevas en el bolso?"],["Ane","Opari bat. Aste osoan opari bila nenbilen!","Un regalo. ¡Toda la semana anduve buscando regalo!"]]},"exercises":[{"type":"gap","q":"Zer ___? (tú)","es":"¿Qué traes?","a":["dakarzu"],"hint":"ekarri, tú: dakarzu."},{"type":"gap","q":"Opari bat ___.","es":"Traigo un regalo.","a":["dakart"],"hint":"ekarri, yo: dakart."},{"type":"gap","q":"Zer ___ poltsan? (tú)","es":"¿Qué llevas en el bolso?","a":["daramazu"],"hint":"eraman, tú: daramazu."},{"type":"gap","q":"Ez ___!","es":"¡No lo sabía!","a":["nekien"],"hint":"jakin en pasado, yo: nekien."},{"type":"gap","q":"Lan bila ___.","es":"Andaba buscando trabajo.","a":["nenbilen"],"hint":"ibili en pasado, yo: nenbilen."},{"type":"gap","q":"Zaila ___.","es":"Parece difícil.","a":["dirudi"],"hint":"parecer (sin persona): dirudi."},{"type":"choice","q":"«No lo sabía»","options":["Ez nekien.","Ez dakit.","Ez nuen jakin."],"a":0,"why":"Lo natural es el sintético en pasado: nekien."},{"type":"choice","q":"«Parece difícil»","options":["Zaila dirudi.","Zaila dirudit.","Zaila iruditzen du."],"a":0,"why":"dirudi, sin persona."},{"type":"choice","q":"«¿Qué traes?»","options":["Zer dakarzu?","Zer daramazu?","Zer daukazu?"],"a":0,"why":"traer = ekarri (dakarzu); llevar = eraman."},{"type":"choice","q":"«Parecía contento»","options":["Pozik zirudien.","Pozik dirudi.","Pozik zegoen dirudi."],"a":0,"why":"Pasado de dirudi: zirudien."},{"type":"choice","q":"«¿Lo sabías?»","options":["Bazenekien?","Badakizu?","Bazenuen jakin?"],"a":0,"why":"jakin en pasado, tú: zenekien (con ba-)."},{"type":"order","words":["dakart","Opari","bat"],"a":["Opari bat dakart"],"es":"Traigo un regalo.","hint":"Objeto + verbo."},{"type":"order","words":["nekien","Ez"],"a":["Ez nekien"],"es":"No lo sabía.","hint":"Ez + verbo."},{"type":"order","words":["zirudien","Pozik"],"a":["Pozik zirudien"],"es":"Parecía contento.","hint":"Estado + zirudien."},{"type":"match","pairs":[["dakart","traigo"],["daramat","llevo"],["nenbilen","andaba"],["nekien","sabía"],["dirudi","parece"],["zirudien","parecía"]]}],"create":{"prompt":"Escribe 5 frases: qué llevas normalmente encima, qué traerías a una fiesta, algo que no sabías hasta hace poco, en qué andabas metido el año pasado y qué te parece algo (dirudi).","focus":"ekarri y eraman sintéticos, ibili y jakin en pasado, dirudi/zirudien"},"links":{"verbs":[],"cases":[],"themes":["aditzak"]}},"b2-02":{"id":"b2-02","lvl":"B2","n":2,"title":"Aginte osoa","es":"El imperativo completo","goal":"Dar órdenes y hacer peticiones con las formas imperativas plenas: siéntate, ábrela, dímelo, ayúdame.","explain":[{"h":"Antes de empezar","p":"Desde el A2 das órdenes con el participio (**Itxi atea!**). Es correcto y muy frecuente, pero el euskera tiene formas imperativas propias, que aparecen en textos, instrucciones formales y en el habla cuando se quiere ser preciso o enfático. Se construyen con la **raíz** del verbo (la que aprendiste con el subjuntivo) y un auxiliar imperativo."},{"h":"Las formas","table":{"head":["Tipo","Tú","Vosotros","Ejemplo"],"rows":[["Sin objeto (izan)","{nor:zaitez}","{nor:zaitezte}","**Eser zaitez** (siéntate), **Etor zaitezte** (venid)"],["Con objeto (ukan)","{nork:ezazu}","{nork:ezazue}","**Ireki ezazu** atea (abre la puerta)"],["Objeto plural","{nork:itzazu}","{nork:itzazue}","**Itxi itzazu** leihoak (cierra las ventanas)"],["Objeto «me»","{nork:nazazu}","{nork:nazazue}","**Lagun nazazu** (ayúdame)"],["A mí (NORI)","{nori:iezadazu}","—","**Ekar iezadazu** ura (tráeme agua)"],["A él / ella","{nori:iezaiozu}","—","**Esan iezaiozu** (díselo)"]]}},{"h":"Formas sintéticas imprescindibles","p":"Algunos imperativos son una sola palabra: **Zatoz!** (¡ven!), **Zoaz!** (¡ve!), **Emaidazu** (dame), **Esadazu** (dime): **Emaidazu ura, mesedez**, **Esadazu egia**."},{"h":"La negación","p":"**Ez** + auxiliar + verbo al final, como en todas las negativas: **Ez zaitez joan!** (¡no te vayas!), **Ez ezazu hori egin!** (¡no hagas eso!), **Ez iezaiozu esan!** (¡no se lo digas!)."},{"h":"¿Participio o forma plena?","p":"**Itxi atea!** y **Itxi ezazu atea!** significan lo mismo. La forma plena es más formal o más insistente, y es la que verás en instrucciones escritas («Bete ezazu inprimakia», rellene el formulario). Para «tú» de cortesía, añadir **mesedez** suele ser suficiente."},{"h":"Paso a paso: «Tráeme el libro, por favor»","p":"1) Raíz de ekarri → **ekar**. 2) A mí, tú → **iezadazu**. 3) **Ekar iezadazu liburua, mesedez**."},{"h":"Errores típicos","p":"*Eseri ezazu* → **Eser zaitez** (sentarse no tiene objeto). *Ireki zaitez atea* → **Ireki ezazu**. *Itxi ezazu leihoak* → **itzazu** (plural). *Ez joan zaitez* → **Ez zaitez joan**."},{"h":"Resumen","p":"Raíz + **zaitez** (sin objeto), **ezazu / itzazu** (con objeto), **nazazu** (me), **iezadazu / iezaiozu** (a mí / a él); plural con -te / -zue. Sintéticos: **Zatoz, Zoaz, Emaidazu, Esadazu**. Negación: **Ez zaitez joan**."}],"examples":[["Eser zaitez, mesedez.","Siéntate, por favor."],["Ireki ezazu leihoa.","Abre la ventana."],["Itxi itzazu ateak.","Cierra las puertas."],["Lagun nazazu!","¡Ayúdame!"],["Ekar iezadazu ura, mesedez.","Tráeme agua, por favor."],["Esadazu egia.","Dime la verdad."],["Ez zaitez joan!","¡No te vayas!"]],"dialog":{"title":"Preparando la casa","lines":[["Ama","Iker, lagun nazazu, mesedez!","Iker, ¡ayúdame, por favor!"],["Iker","Zer egin behar dut?","¿Qué tengo que hacer?"],["Ama","Ireki itzazu leihoak, eta ekar iezadazu ura sukaldetik.","Abre las ventanas, y tráeme agua de la cocina."],["Iker","Eta gero?","¿Y luego?"],["Ama","Deitu zure ahizpari eta esan iezaiozu zortzietan etortzeko.","Llama a tu hermana y dile que venga a las ocho."],["Iker","Ados. Baina lasai egon zaitez, ama!","Vale. ¡Pero estate tranquila, mamá!"]]},"exercises":[{"type":"gap","q":"___ zaitez, mesedez.","es":"Siéntate, por favor.","a":["eser"],"hint":"Raíz de eseri: eser."},{"type":"gap","q":"Ireki ___ leihoa.","es":"Abre la ventana.","a":["ezazu"],"hint":"Con objeto, tú: ezazu."},{"type":"gap","q":"Itxi ___ ateak.","es":"Cierra las puertas.","a":["itzazu"],"hint":"Objeto plural, tú: itzazu."},{"type":"gap","q":"Lagun ___!","es":"¡Ayúdame!","a":["nazazu"],"hint":"Objeto «me», tú: nazazu."},{"type":"gap","q":"Ekar ___ ura, mesedez.","es":"Tráeme agua, por favor.","a":["iezadazu"],"hint":"A mí, tú: iezadazu."},{"type":"gap","q":"Ez ___ joan!","es":"¡No te vayas!","a":["zaitez"],"hint":"Ez + zaitez + verbo."},{"type":"choice","q":"«Siéntate»","options":["Eser zaitez.","Eseri ezazu.","Eser ezazu."],"a":0,"why":"Sentarse no tiene objeto → zaitez."},{"type":"choice","q":"«Cierra las ventanas»","options":["Itxi itzazu leihoak.","Itxi ezazu leihoak.","Itxi zaitez leihoak."],"a":0,"why":"Objeto plural → itzazu."},{"type":"choice","q":"«Díselo (a él)»","options":["Esan iezaiozu.","Esan iezadazu.","Esan ezazu hari."],"a":0,"why":"A él, tú → iezaiozu. Iezadazu es «a mí»."},{"type":"choice","q":"«¡No hagas eso!»","options":["Ez ezazu hori egin!","Ez egin ezazu hori!","Ezazu ez hori egin!"],"a":0,"why":"Ez + auxiliar, el verbo al final."},{"type":"choice","q":"«Dame»","options":["Emaidazu","Eman zaitez","Emadazu"],"a":0,"why":"Forma sintética: emaidazu."},{"type":"order","words":["zaitez","Eser","mesedez"],"a":["Eser zaitez mesedez","Mesedez eser zaitez"],"es":"Siéntate, por favor.","hint":"Raíz + zaitez (+ mesedez)."},{"type":"order","words":["iezadazu","Ekar","ura"],"a":["Ekar iezadazu ura"],"es":"Tráeme agua.","hint":"Raíz + iezadazu + objeto."},{"type":"order","words":["joan","Ez","zaitez"],"a":["Ez zaitez joan"],"es":"No te vayas.","hint":"Ez + zaitez + verbo."},{"type":"match","pairs":[["zaitez","tú (sin objeto)"],["ezazu","tú (con objeto)"],["itzazu","tú (objeto plural)"],["nazazu","tú → me"],["iezadazu","tú → a mí (algo)"],["esadazu","dime"]]}],"create":{"prompt":"Escribe las instrucciones para preparar algo que sepas hacer (un café, una receta sencilla, una tarea de casa) en 6 pasos, usando formas imperativas plenas.","focus":"imperativo pleno: raíz + zaitez, ezazu, itzazu, nazazu, iezadazu, iezaiozu; emaidazu, esadazu; negación"},"links":{"verbs":[],"cases":[],"themes":["etxea","sukaldea"]}},"b2-03":{"id":"b2-03","lvl":"B2","n":3,"title":"Ahalera iraganean","es":"El potencial hipotético y pasado","goal":"Decir lo que podrías hacer, sugerir con suavidad y contar lo que podías hacer antes.","explain":[{"h":"Antes de empezar","p":"En B1 aprendiste el potencial en presente (**egin dezaket**, puedo hacerlo). Ahora le añades dos matices: el hipotético («**podría** hacerlo») y el pasado («**podía** hacerlo»). El primero es muy útil para ofrecer ayuda y sugerir sin imponer."},{"h":"Hipotético: podría","table":{"head":["Persona","Sin objeto (izan)","Con objeto (ukan)"],"rows":[["ni / nik","{nor:ninteke}","{nork:nezake}"],["zu / zuk","{nor:zintezke}","{nork:zenezake}"],["hura / hark","{nor:liteke}","{nork:lezake}"],["gu / guk","{nor:gintezke}","{nork:genezake}"],["zuek","{nor:zintezkete}","{nork:zenezakete}"],["haiek","{nor:litezke}","{nork:lezakete}"]]},"p":"**Lagundu nezake** (podría ayudar), **Bihar etorri ninteke** (mañana podría venir), **Hori egin zenezake** (podrías hacer eso), una forma muy amable de sugerir. **Liteke** sola significa «puede ser, es posible»: **Liteke euria egitea** (es posible que llueva)."},{"h":"Pasado: podía","p":"Se añade **-en** a las formas anteriores: **nezakeen** (podía hacer), **nintekeen** (podía ir / venir), **zezakeen** (él podía). **Lehen egunero korrika egin nezakeen** (antes podía correr todos los días). **Txikitan ordu askotan igeri egin nezakeen**. En negativa, lo más habitual sigue siendo **ezin** con el auxiliar normal: **Ezin nuen etorri** (no podía venir / no pude venir)."},{"h":"Paso a paso: «Podríamos ir al cine esta tarde»","p":"1) Verbo: **joan**, sin objeto → izan. 2) Hipotético, nosotros → **gintezke**. 3) **Gaur arratsaldean zinemara joan gintezke**."},{"h":"Errores típicos","p":"*Lagundu ninteke* → **nezake** (ayudar a alguien va con ukan). *Etorri nezake* → **ninteke**. *Lehen korrika egin nezake* para «antes podía» → **nezakeen**. *Ez nezakeen etorri* → lo habitual es **Ezin nintzen etorri**."},{"h":"Resumen","p":"Podría: **ninteke, liteke…** (sin objeto) / **nezake, lezake…** (con objeto). Podía: **nintekeen, nezakeen…**. **Liteke** = puede ser. Sugerencia amable: **… zenezake**."}],"examples":[["Lagundu nezake.","Podría ayudar."],["Bihar etorri ninteke.","Mañana podría venir."],["Hori egin zenezake.","Podrías hacer eso."],["Liteke euria egitea.","Es posible que llueva."],["Lehen egunero korrika egin nezakeen.","Antes podía correr todos los días."],["Ezin nintzen etorri.","No pude venir."],["Gaur arratsaldean zinemara joan gintezke.","Esta tarde podríamos ir al cine."]],"dialog":{"title":"Un problema con el ordenador","lines":[["Nerea","Ordenagailuak ez du funtzionatzen. Lagundu zenezake?","El ordenador no funciona. ¿Podrías ayudar?"],["Jon","Bai, begiratu nezake. Baina gaur ezin dut; bihar etorri ninteke.","Sí, podría mirarlo. Pero hoy no puedo; mañana podría venir."],["Nerea","Eskerrik asko. Lehen nik konpondu nezakeen, baina orain sistema berria da.","Gracias. Antes yo podía arreglarlo, pero ahora el sistema es nuevo."],["Jon","Liteke arazoa txikia izatea.","Puede que el problema sea pequeño."],["Nerea","Hala espero dut!","¡Eso espero!"]]},"exercises":[{"type":"gap","q":"Lagundu ___.","es":"Podría ayudar.","a":["nezake"],"hint":"Con objeto, yo, hipotético: nezake."},{"type":"gap","q":"Bihar etorri ___.","es":"Mañana podría venir.","a":["ninteke"],"hint":"Sin objeto, yo, hipotético: ninteke."},{"type":"gap","q":"Hori egin ___.","es":"Podrías hacer eso.","a":["zenezake"],"hint":"Con objeto, tú: zenezake."},{"type":"gap","q":"___ euria egitea.","es":"Es posible que llueva.","a":["liteke"],"hint":"puede ser = liteke."},{"type":"gap","q":"Lehen egunero korrika egin ___.","es":"Antes podía correr todos los días.","a":["nezakeen"],"hint":"Pasado: nezake + -en."},{"type":"gap","q":"Zinemara joan ___.","es":"Podríamos ir al cine.","a":["gintezke"],"hint":"Sin objeto, nosotros: gintezke."},{"type":"choice","q":"«Podría ayudarte»","options":["Lagundu nezake.","Lagundu ninteke.","Lagundu dezaket."],"a":0,"why":"Hipotético con objeto: nezake. Dezaket = puedo."},{"type":"choice","q":"«Mañana podría venir»","options":["Bihar etorri ninteke.","Bihar etorri nezake.","Bihar etorri naiteke."],"a":0,"why":"Sin objeto, hipotético: ninteke. Naiteke = puedo."},{"type":"choice","q":"«Antes podía correr»","options":["Lehen korrika egin nezakeen.","Lehen korrika egin nezake.","Lehen korrika egin dezaket."],"a":0,"why":"Pasado: nezakeen."},{"type":"choice","q":"«Es posible / puede ser»","options":["Liteke.","Daiteke.","Ninteke."],"a":0,"why":"liteke = puede ser (hipotético)."},{"type":"choice","q":"«No pude venir»","options":["Ezin nintzen etorri.","Ez nintekeen etorri.","Ezin ninteke etorri."],"a":0,"why":"Negación habitual: ezin + auxiliar normal."},{"type":"order","words":["nezake","Lagundu"],"a":["Lagundu nezake"],"es":"Podría ayudar.","hint":"Participio + nezake."},{"type":"order","words":["ninteke","etorri","Bihar"],"a":["Bihar etorri ninteke"],"es":"Mañana podría venir.","hint":"Tiempo + participio + ninteke."},{"type":"order","words":["nezakeen","egin","korrika","Lehen"],"a":["Lehen korrika egin nezakeen"],"es":"Antes podía correr.","hint":"Tiempo + korrika egin + nezakeen."},{"type":"match","pairs":[["nezake","podría (con objeto)"],["ninteke","podría (sin objeto)"],["zenezake","podrías (con objeto)"],["liteke","puede ser"],["nezakeen","podía (con objeto)"],["nintekeen","podía (sin objeto)"]]}],"create":{"prompt":"Escribe 5 frases: tres ofertas o sugerencias amables (… nezake, … zenezake, … gintezke), algo que podías hacer de joven y ya no, y algo que es posible que pase mañana (liteke).","focus":"potencial hipotético (nezake, ninteke, liteke) y pasado (nezakeen, nintekeen)"},"links":{"verbs":[],"cases":[],"themes":["aditzak"]}},"b2-04":{"id":"b2-04","lvl":"B2","n":4,"title":"Baldintza iraganean","es":"El condicional en pasado","goal":"Hablar de lo que habría pasado: «si hubiera sabido, habría venido».","explain":[{"h":"Antes de empezar","p":"En B1 aprendiste las hipótesis sobre el presente (**diru asko banu, bidaiatuko nuke**). Ahora das el último paso: las hipótesis sobre el pasado, que ya no pueden cambiar. «Si hubiera salido antes, no habría llegado tarde.» Es una estructura avanzada, pero muy regular."},{"h":"La condición: «si hubiera…»","p":"Participio + **izan** + las formas de hipótesis que ya conoces (**banu, bazenu, balu…** o **banintz, bazina, balitz…**): **Jakin izan banu** (si lo hubiera sabido), **Garaiz irten izan bagina** (si hubiéramos salido a tiempo). En el habla también se oye sin izan (**jakin banu**); la forma con izan deja más claro que es pasado."},{"h":"La consecuencia: «habría…»","table":{"head":["Persona","Sin objeto (izan)","Con objeto (ukan)"],"rows":[["ni / nik","{nor:nintzatekeen}","{nork:nukeen}"],["zu / zuk","{nor:zinatekeen}","{nork:zenukeen}"],["hura / hark","{nor:zatekeen}","{nork:zukeen}"],["gu / guk","{nor:ginatekeen}","{nork:genukeen}"],["zuek","{nor:zinateketen}","{nork:zenuketen}"],["haiek","{nor:ziratekeen}","{nork:zuketen}"]]},"p":"Con el verbo en futuro (-ko), como en el condicional de presente: **etorriko nintzatekeen** (habría venido), **erosiko nukeen** (lo habría comprado). Fíjate: son las formas del condicional (**nuke, nintzateke**) + **-en**, y la 3.ª persona cambia a **z-** (zukeen, zatekeen)."},{"h":"La frase completa","p":"**Jakin izan banu, etorriko nintzatekeen** (si lo hubiera sabido, habría venido). **Diru gehiago izan banu, etxe hori erosiko nukeen** (si hubiera tenido más dinero, habría comprado esa casa). **Garaiz irten izan bagina, ez ginatekeen berandu iritsiko** (si hubiéramos salido a tiempo, no habríamos llegado tarde)."},{"h":"Paso a paso: «Si hubieras estudiado más, habrías aprobado»","p":"1) Condición: ikasi + izan + hipótesis de ukan, tú → **Gehiago ikasi izan bazenu**. 2) Consecuencia: gainditu → **gaindituko** + habría, tú, con objeto → **zenukeen**. 3) **Gehiago ikasi izan bazenu, gaindituko zenukeen**."},{"h":"Errores típicos","p":"*Jakin banu, etorriko nintzateke* para el pasado → **nintzatekeen**. *Erosiko nuen* para «lo habría comprado» → **erosiko nukeen**. *Berandu iritsiko ginatekeen ez* → **ez ginatekeen berandu iritsiko** (negación delante)."},{"h":"Resumen","p":"Si hubiera…: participio + **izan** + **banu / banintz / balitz…**. Habría…: **-ko + nukeen / nintzatekeen** (zukeen, zatekeen…). **Jakin izan banu, etorriko nintzatekeen**."}],"examples":[["Jakin izan banu, etorriko nintzatekeen.","Si lo hubiera sabido, habría venido."],["Diru gehiago izan banu, etxe hori erosiko nukeen.","Si hubiera tenido más dinero, habría comprado esa casa."],["Garaiz irten izan bagina, ez ginatekeen berandu iritsiko.","Si hubiéramos salido a tiempo, no habríamos llegado tarde."],["Zu etorri izan bazina, pozik egongo nintzatekeen.","Si hubieras venido, habría estado contento."],["Mikelek ikasi izan balu, azterketa gaindituko zukeen.","Si Mikel hubiera estudiado, habría aprobado el examen."]],"dialog":{"title":"Lamentos","lines":[["Ane","Atzo kontzertu bikaina izan zen. Zergatik ez zinen etorri?","Ayer hubo un concierto estupendo. ¿Por qué no viniste?"],["Iker","Ez nekien! Jakin izan banu, etorriko nintzatekeen.","¡No lo sabía! Si lo hubiera sabido, habría venido."],["Ane","Mezu bat bidali nizun…","Te envié un mensaje…"],["Iker","Mugikorra etxean ahaztu nuen. Begiratu izan banu, ikusiko nukeen.","Me olvidé el móvil en casa. Si lo hubiera mirado, lo habría visto."],["Ane","Hurrengoan deituko dizut!","¡La próxima vez te llamaré!"]]},"exercises":[{"type":"gap","q":"Jakin izan ___, etorriko nintzatekeen.","es":"Si lo hubiera sabido, habría venido.","a":["banu"],"hint":"si yo hubiera (ukan) = izan banu."},{"type":"gap","q":"Jakin izan banu, etorriko ___.","es":"…habría venido.","a":["nintzatekeen"],"hint":"Venir → izan; habría, yo: nintzatekeen."},{"type":"gap","q":"Diru gehiago izan banu, etxe hori erosiko ___.","es":"…habría comprado esa casa.","a":["nukeen"],"hint":"Comprar → ukan; habría, yo: nukeen."},{"type":"gap","q":"Garaiz irten izan ___, ez ginatekeen berandu iritsiko.","es":"Si hubiéramos salido a tiempo…","a":["bagina"],"hint":"si nosotros (izan) = bagina."},{"type":"gap","q":"Mikelek ikasi izan balu, azterketa gaindituko ___.","es":"…habría aprobado el examen.","a":["zukeen"],"hint":"él, con objeto: zukeen."},{"type":"gap","q":"Zu etorri izan ___, pozik egongo nintzatekeen.","es":"Si hubieras venido, habría estado contento.","a":["bazina"],"hint":"si tú (izan) = bazina."},{"type":"choice","q":"«Si lo hubiera sabido»","options":["jakin izan banu","jakin badut","jakin nuen ba"],"a":0,"why":"Participio + izan + banu."},{"type":"choice","q":"«Habría venido»","options":["etorriko nintzatekeen","etorriko nintzateke","etorriko nintzen"],"a":0,"why":"Pasado del condicional: -en."},{"type":"choice","q":"«Lo habría comprado»","options":["erosiko nukeen","erosiko nuke","erosi nuen"],"a":0,"why":"nuke + -en = nukeen."},{"type":"choice","q":"«No habríamos llegado tarde»","options":["ez ginatekeen berandu iritsiko","berandu iritsiko ez ginatekeen","ez berandu iritsiko ginatekeen"],"a":0,"why":"Negación: ez + auxiliar delante."},{"type":"choice","q":"«Habría aprobado (él)»","options":["gaindituko zukeen","gaindituko luke","gainditu zuen"],"a":0,"why":"3.ª persona en pasado: z- (zukeen)."},{"type":"order","words":["banu","izan","Jakin"],"a":["Jakin izan banu"],"es":"Si lo hubiera sabido.","hint":"Participio + izan + banu."},{"type":"order","words":["nintzatekeen","etorriko"],"a":["Etorriko nintzatekeen"],"es":"Habría venido.","hint":"Futuro + nintzatekeen."},{"type":"order","words":["nukeen","erosiko","Etxea"],"a":["Etxea erosiko nukeen"],"es":"Habría comprado la casa.","hint":"Objeto + -ko + nukeen."},{"type":"match","pairs":[["izan banu","si hubiera (ukan)"],["izan banintz","si hubiera (izan)"],["nukeen","habría (con objeto)"],["nintzatekeen","habría (sin objeto)"],["zukeen","él habría (con objeto)"],["zatekeen","él habría (sin objeto)"]]}],"create":{"prompt":"Escribe 5 frases sobre decisiones del pasado: qué habría pasado si hubieras elegido otro camino (otros estudios, otra ciudad, otro trabajo).","focus":"condicional pasado: participio + izan + banu/banintz…, -ko + nukeen/nintzatekeen"},"links":{"verbs":[],"cases":[],"themes":["aditzak","lana"]}},"b2-05":{"id":"b2-05","lvl":"B2","n":5,"title":"Zehar-estiloa","es":"El estilo indirecto","goal":"Contar lo que otros dijeron, preguntaron u ordenaron, adaptando personas, tiempos y referencias.","explain":[{"h":"Antes de empezar","p":"Ya conoces las tres piezas del estilo indirecto por separado: **-la** (que…), **-n / ea … -n** (si…, dónde…) y **-tzeko** (que + orden). En esta lección las combinas para contar conversaciones completas, que es lo que hacemos constantemente al hablar: «me dijo que…», «me preguntó si…»."},{"h":"Afirmaciones: -la","p":"«Bihar etorriko naiz», esan zuen Mikelek → **Mikelek esan zuen hurrengo egunean etorriko zela**. Fíjate en tres cambios: la persona (**naiz → zela**, porque ahora hablamos de él), el tiempo (si el verbo principal está en pasado, la subordinada también: **nago → zegoela**) y las referencias (**bihar → hurrengo egunean**)."},{"h":"Preguntas: -n y ea","p":"Con palabra interrogativa: «Non bizi zara?», galdetu zidan → **Non bizi nintzen galdetu zidan**. De sí o no: «Etorriko zara?» → **Ea etorriko nintzen galdetu zidan**."},{"h":"Órdenes y peticiones: -tzeko","p":"«Etorri hona!», esan zidan → **Hara joateko esan zidan** (o **etortzeko esan zidan**). «Lagun nazazu», eskatu zidan → **Laguntzeko eskatu zidan**."},{"h":"Las referencias que cambian","table":{"head":["Estilo directo","Estilo indirecto"],"rows":[["gaur (hoy)","egun hartan (aquel día)"],["bihar (mañana)","hurrengo egunean (al día siguiente)"],["atzo (ayer)","aurreko egunean (el día anterior)"],["hemen (aquí)","han (allí)"],["orain (ahora)","orduan (entonces)"],["hau (esto)","hura (aquello)"]]}},{"h":"Paso a paso: «Me dijo que me llamaría al día siguiente»","p":"Directo: «Bihar deituko dizut». 1) Persona y tiempo: dizut (él → a ti, presente) → **zidan** (él → a mí, pasado) + -la → **zidala**. 2) bihar → **hurrengo egunean**. 3) **Hurrengo egunean deituko zidala esan zidan**."},{"h":"Errores típicos","p":"*Etorriko naizela esan zuen* (hablando de otro) → **etorriko zela**. *Non bizi zara galdetu zidan* → **Non bizi nintzen**. *Etorriko nintzela galdetu zidan* (pregunta) → **Ea etorriko nintzen**. *Bihar etorriko zela esan zuen* (contado días después) → **hurrengo egunean**."},{"h":"Resumen","p":"Afirmación → **-la** · Pregunta → **-n** (con **ea** si es de sí o no) · Orden → **-tzeko**. Adapta persona, tiempo y referencias (bihar → hurrengo egunean, hemen → han)."}],"examples":[["Etorriko zela esan zuen.","Dijo que vendría."],["Nekatuta zegoela esan zidan.","Me dijo que estaba cansado."],["Non bizi nintzen galdetu zidan.","Me preguntó dónde vivía."],["Ea etorriko nintzen galdetu zidan.","Me preguntó si vendría."],["Etortzeko esan zidan.","Me dijo que viniera."],["Hurrengo egunean deituko zidala esan zidan.","Me dijo que me llamaría al día siguiente."],["Han itxarongo zuela esan zuen.","Dijo que esperaría allí."]],"dialog":{"title":"Después de hablar con la jefa","lines":[["Ane","Zer esan zizun nagusiak?","¿Qué te dijo la jefa?"],["Iker","Lan ona egin nuela esan zidan, eta ea hurrengo hilean Bilbora joan nintekeen galdetu zidan.","Me dijo que había hecho un buen trabajo, y me preguntó si podría ir a Bilbao el mes siguiente."],["Ane","Eta zuk zer erantzun zenion?","¿Y tú qué le respondiste?"],["Iker","Pentsatuko nuela. Eta nire familiarekin hitz egiteko esan zidan.","Que lo pensaría. Y me dijo que hablara con mi familia."],["Ane","Ondo! Noizko erabaki behar duzu?","¡Bien! ¿Para cuándo tienes que decidirlo?"]]},"exercises":[{"type":"gap","q":"Mikelek esan zuen hurrengo egunean etorriko ___.","es":"Mikel dijo que vendría al día siguiente.","a":["zela"],"hint":"naiz → (él) zen → zela."},{"type":"gap","q":"Nekatuta ___ esan zidan.","es":"Me dijo que estaba cansado.","a":["zegoela"],"hint":"nago → (él, pasado) zegoen → zegoela."},{"type":"gap","q":"Non bizi ___ galdetu zidan.","es":"Me preguntó dónde vivía (yo).","a":["nintzen"],"hint":"zara → (yo, pasado) nintzen."},{"type":"gap","q":"___ etorriko nintzen galdetu zidan.","es":"Me preguntó si vendría.","a":["ea"],"hint":"Pregunta de sí o no: ea."},{"type":"gap","q":"Etor___ esan zidan.","es":"Me dijo que viniera.","a":["tzeko"],"hint":"Orden: -tzeko."},{"type":"gap","q":"«Bihar» → hurrengo ___","es":"«mañana» → al día siguiente","a":["egunean"],"hint":"bihar → hurrengo egunean."},{"type":"choice","q":"«Etorriko naiz», esan zuen →","options":["Etorriko zela esan zuen.","Etorriko naizela esan zuen.","Etorriko da esan zuen."],"a":0,"why":"Cambia la persona (él) y el tiempo (pasado): zela."},{"type":"choice","q":"«Non bizi zara?», galdetu zidan →","options":["Non bizi nintzen galdetu zidan.","Non bizi zara galdetu zidan.","Non bizi nintzela galdetu zidan."],"a":0,"why":"Pregunta indirecta: -n, y persona/tiempo adaptados."},{"type":"choice","q":"«Etorri!», esan zidan →","options":["Etortzeko esan zidan.","Etorriko nintzela esan zidan.","Etorri zela esan zidan."],"a":0,"why":"Orden: -tzeko."},{"type":"choice","q":"«hemen» en estilo indirecto:","options":["han","hor","hemen"],"a":0,"why":"hemen (aquí) → han (allí)."},{"type":"choice","q":"«Etorriko zara?», galdetu zidan →","options":["Ea etorriko nintzen galdetu zidan.","Etorriko nintzela galdetu zidan.","Etorriko banintz galdetu zidan."],"a":0,"why":"Sí/no: ea + -n."},{"type":"order","words":["zela","Etorriko","zuen","esan"],"a":["Etorriko zela esan zuen"],"es":"Dijo que vendría.","hint":"Subordinada con -la + esan zuen."},{"type":"order","words":["nintzen","Non","bizi","zidan","galdetu"],"a":["Non bizi nintzen galdetu zidan"],"es":"Me preguntó dónde vivía.","hint":"Interrogativa + verbo con -n + galdetu zidan."},{"type":"order","words":["esan","Etortzeko","zidan"],"a":["Etortzeko esan zidan"],"es":"Me dijo que viniera.","hint":"-tzeko + esan zidan."},{"type":"match","pairs":[["gaur","egun hartan"],["bihar","hurrengo egunean"],["atzo","aurreko egunean"],["hemen","han"],["orain","orduan"],["hau","hura"]]}],"create":{"prompt":"Reproduce en estilo indirecto una conversación reciente (real o inventada) en 6 frases: dos afirmaciones, dos preguntas y dos peticiones de la otra persona.","focus":"estilo indirecto: -la, -n / ea … -n, -tzeko; cambios de persona, tiempo y referencias"},"links":{"verbs":[],"cases":[],"themes":["lokailuak"]}},"b2-06":{"id":"b2-06","lvl":"B2","n":6,"title":"Moduak","es":"Oraciones y expresiones de modo","goal":"Decir cómo se hace algo: «como quieras», «corriendo», «llorando», «sentado», «escuchando música».","explain":[{"h":"Antes de empezar","p":"El español usa mucho el gerundio para el modo: «vino corriendo», «estaba llorando». El euskera no tiene una sola forma para eso: según el caso usa **-ka**, **-z**, **-ta** o **-la**. Además, aprenderás **bezala** para «como». Son expresiones muy frecuentes en la narración."},{"h":"Como: -n bezala","p":"Relativo + **bezala**: **Nahi duzun bezala** (como quieras), **Esan dudan bezala** (como he dicho), **Behar den bezala** (como es debido). Con nombres y pronombres, sin relativo: **zu bezala** (como tú)."},{"h":"Las formas de modo","table":{"head":["Forma","Uso","Ejemplos"],"rows":[["-ka","acción repetida o manera","**korrika** (corriendo), **oihuka** (gritando), **saltoka** (saltando)"],["-z","emoción o estado que acompaña","**negarrez** (llorando), **barrez** (riendo), **pozez** (de alegría), **oinez** (a pie)"],["-ta / -rik","postura o estado","**eserita** (sentado), **etzanda** (tumbado), **isilik** (en silencio), **zutik** (de pie)"],["-la","acción simultánea","**Musika entzuten nuela**, lo hartu nuen (escuchando música, me dormí)"]]}},{"h":"-la de simultaneidad","p":"Ya lo usaste en B1 con verbos sintéticos (**etxera nindoala**). Funciona con cualquier verbo conjugado: **Telebista ikusten genuela, afaldu genuen** (cenamos viendo la tele). **Euria ari zuela irten ginen** (salimos con lluvia, literalmente «lloviendo»)."},{"h":"Paso a paso: «Los niños entraron corriendo y gritando»","p":"1) «corriendo» = **korrika**; «gritando» = **oihuka**. 2) entrar, ellos, pasado → **sartu ziren**. 3) **Umeak korrika eta oihuka sartu ziren**."},{"h":"Errores típicos","p":"*Korritzen etorri zen* → **Korrika etorri zen**. *Negartzen zegoen* → **Negarrez zegoen**. *Eserita naiz* → **Eserita nago** (estado con egon). *Nahi duzu bezala* → **Nahi duzun bezala**."},{"h":"Resumen","p":"«como» = relativo + **bezala**. Modo: **-ka** (korrika, oihuka), **-z** (negarrez, barrez), **-ta / -rik** (eserita, isilik), **-la** (acción simultánea: musika entzuten nuela)."}],"examples":[["Nahi duzun bezala egin.","Hazlo como quieras."],["Esan dudan bezala, bilera bihar da.","Como he dicho, la reunión es mañana."],["Umeak korrika etorri ziren.","Los niños vinieron corriendo."],["Neska negarrez zegoen.","La chica estaba llorando."],["Denok barrez hasi ginen.","Todos empezamos a reír."],["Eserita nago.","Estoy sentado."],["Musika entzuten nuela, lo hartu nuen.","Escuchando música, me dormí."]],"dialog":{"title":"La fiesta sorpresa","lines":[["Jon","Zer gertatu zen festan?","¿Qué pasó en la fiesta?"],["Miren","Mikel oihuka sartu zen: «Zorionak!». Denok barrez hasi ginen.","Mikel entró gritando: «¡Felicidades!». Todos empezamos a reír."],["Jon","Eta Ane?","¿Y Ane?"],["Miren","Ane pozez negarrez zegoen. Ez zekien ezer!","Ane estaba llorando de alegría. ¡No sabía nada!"],["Jon","Nik esan nuen bezala, sorpresa ona izan zen.","Como dije yo, fue una buena sorpresa."],["Miren","Bai, dena behar zen bezala atera zen.","Sí, todo salió como debía."]]},"exercises":[{"type":"gap","q":"Nahi duzun ___ egin.","es":"Hazlo como quieras.","a":["bezala"],"hint":"como = -n bezala."},{"type":"gap","q":"Umeak korri___ etorri ziren.","es":"Los niños vinieron corriendo.","a":["ka"],"hint":"corriendo = korrika."},{"type":"gap","q":"Neska negarre___ zegoen.","es":"La chica estaba llorando.","a":["z"],"hint":"llorando = negarrez."},{"type":"gap","q":"Denok bar___ hasi ginen.","es":"Todos empezamos a reír.","a":["rez"],"hint":"riendo = barrez."},{"type":"gap","q":"Eseri___ nago.","es":"Estoy sentado.","a":["ta"],"hint":"postura: -ta."},{"type":"gap","q":"Musika entzuten ___, lo hartu nuen.","es":"Escuchando música, me dormí.","a":["nuela"],"hint":"Simultaneidad: nuen + -la."},{"type":"choice","q":"«Como quieras»","options":["nahi duzun bezala","nahi duzu bezala","nahi duzula bezala"],"a":0,"why":"Relativo + bezala."},{"type":"choice","q":"«Corriendo»","options":["korrika","korritzen","korrikaz"],"a":0,"why":"Forma fija: korrika."},{"type":"choice","q":"«Llorando»","options":["negarrez","negartzen","negarrik"],"a":0,"why":"Emoción que acompaña: -z."},{"type":"choice","q":"«Estoy sentado»","options":["Eserita nago.","Eserita naiz.","Esertzen nago."],"a":0,"why":"Estado: -ta + egon."},{"type":"choice","q":"«Escuchando música, me dormí»","options":["Musika entzuten nuela, lo hartu nuen.","Musika entzun nuen, lo hartu nuela.","Musika entzutea, lo hartu nuen."],"a":0,"why":"Acción simultánea: verbo conjugado + -la."},{"type":"order","words":["egin","bezala","duzun","Nahi"],"a":["Nahi duzun bezala egin"],"es":"Hazlo como quieras.","hint":"Relativo + bezala + verbo."},{"type":"order","words":["ziren","etorri","korrika","Umeak"],"a":["Umeak korrika etorri ziren"],"es":"Los niños vinieron corriendo.","hint":"Sujeto + modo + verbo + auxiliar."},{"type":"order","words":["zegoen","negarrez","Neska"],"a":["Neska negarrez zegoen"],"es":"La chica estaba llorando.","hint":"Sujeto + modo + zegoen."},{"type":"match","pairs":[["korrika","corriendo"],["oihuka","gritando"],["negarrez","llorando"],["barrez","riendo"],["eserita","sentado"],["zutik","de pie"]]}],"create":{"prompt":"Describe una escena (una fiesta, una boda, una tarde en el parque) en 5 o 6 frases, explicando cómo hacía cada persona lo que hacía.","focus":"-n bezala, -ka, -z, -ta/-rik, -la de simultaneidad"},"links":{"verbs":[],"cases":["ins"],"themes":["aditzak","pertsonak"]}},"b2-07":{"id":"b2-07","lvl":"B2","n":7,"title":"Aspektua","es":"Matices de aspecto","goal":"Expresar experiencia, costumbre, inminencia, intención y continuidad: «he ido muchas veces», «suelo», «está a punto de», «tengo previsto», «sigo…».","explain":[{"h":"Antes de empezar","p":"Con los tiempos verbales dices cuándo pasa algo. Con el **aspecto** dices cómo se ve esa acción: si es una experiencia repetida, una costumbre, algo a punto de ocurrir o algo que continúa. El euskera tiene recursos muy claros para cada matiz, y usarlos es una de las señales de un nivel avanzado."},{"h":"Experiencia y repetición: izan izan","p":"Participio + **izan** + auxiliar: **Askotan joan izan naiz Donostiara** (he ido muchas veces a San Sebastián), **Hori entzun izan dut** (eso lo he oído alguna vez). Expresa algo que ha ocurrido en varias ocasiones o como experiencia vital."},{"h":"Costumbre: ohi","p":"Participio + **ohi** + auxiliar = soler: **Goiz jaiki ohi naiz** (suelo levantarme temprano), **Udan herrira joan ohi ginen** (solíamos ir al pueblo en verano). Significa lo mismo que la forma habitual (jaikitzen naiz), con un tono algo más formal."},{"h":"Inminencia, intención y continuidad","table":{"head":["Forma","Significado","Ejemplo"],"rows":[["-tzear egon","estar a punto de","Trena **irtetear dago** (el tren está a punto de salir)"],["-tzekoa izan","tener previsto, ir a","Bihar Bilbora **joatekoa naiz** (tengo previsto ir a Bilbao mañana)"],["-tzen jarraitu","seguir haciendo","Euskara **ikasten jarraitzen dut** (sigo estudiando euskera)"],["-tzen hasi","empezar a","Euria **egiten hasi da** (ha empezado a llover)"],["-tzeari utzi","dejar de","**Erretzeari utzi** diot (he dejado de fumar)"]]}},{"h":"Paso a paso: «Estaba a punto de salir cuando llamaste»","p":"1) «a punto de salir»: irten → **irtetear**, y egon en pasado, yo → **irtetear nengoen**. 2) «cuando llamaste»: deitu + NOR-NORI-NORK pasado (tú → a mí) + -nean → **deitu zenidanean**. → **Irtetear nengoen deitu zenidanean**."},{"h":"Errores típicos","p":"*Goiz jaikitzen ohi naiz* → **Goiz jaiki ohi naiz** (participio). *Euria egiten ari da* para «a punto de llover» → **egitear dago**. *Ikasten jarraitzen naiz* → **jarraitzen dut**. *Askotan joan izan dut* → **naiz** (joan va con izan)."},{"h":"Resumen","p":"**-tu izan naiz / dut** (experiencia), **-tu ohi naiz** (soler), **-tzear egon** (a punto de), **-tzekoa izan** (tener previsto), **-tzen jarraitu** (seguir), **-tzen hasi** (empezar), **-tzeari utzi** (dejar de)."}],"examples":[["Askotan joan izan naiz Donostiara.","He ido muchas veces a San Sebastián."],["Goiz jaiki ohi naiz.","Suelo levantarme temprano."],["Udan herrira joan ohi ginen.","En verano solíamos ir al pueblo."],["Trena irtetear dago.","El tren está a punto de salir."],["Bihar Bilbora joatekoa naiz.","Mañana tengo previsto ir a Bilbao."],["Euskara ikasten jarraitzen dut.","Sigo estudiando euskera."],["Ez dut inoiz halakorik ikusi.","Nunca he visto nada parecido."]],"dialog":{"title":"Un viaje a Baiona","lines":[["Nerea","Inoiz Baionan egon zara?","¿Has estado alguna vez en Baiona?"],["Iker","Bai, askotan joan izan naiz. Txikitan, udan hara joan ohi ginen.","Sí, he ido muchas veces. De pequeño, en verano solíamos ir allí."],["Nerea","Ni datorren hilean joatekoa naiz.","Yo tengo previsto ir el mes que viene."],["Iker","Oso polita da! Gaur ere joan nahi nuen, baina trena irtetear dago eta ez naiz garaiz iritsiko.","¡Es muy bonita! Hoy también quería ir, pero el tren está a punto de salir y no llegaré a tiempo."],["Nerea","Ez kezkatu, beste egun batean joango gara elkarrekin.","No te preocupes, iremos juntos otro día."]]},"exercises":[{"type":"gap","q":"Askotan joan ___ naiz Donostiara.","es":"He ido muchas veces a San Sebastián.","a":["izan"],"hint":"Experiencia: participio + izan + auxiliar."},{"type":"gap","q":"Goiz jaiki ___ naiz.","es":"Suelo levantarme temprano.","a":["ohi"],"hint":"soler = participio + ohi."},{"type":"gap","q":"Trena irte___ dago.","es":"El tren está a punto de salir.","a":["tear"],"hint":"a punto de = -tzear egon."},{"type":"gap","q":"Bihar Bilbora joate___ naiz.","es":"Mañana tengo previsto ir a Bilbao.","a":["koa"],"hint":"tener previsto = -tzekoa izan."},{"type":"gap","q":"Euskara ikasten ___ dut.","es":"Sigo estudiando euskera.","a":["jarraitzen"],"hint":"seguir = -tzen jarraitu."},{"type":"gap","q":"Udan herrira joan ohi ___.","es":"En verano solíamos ir al pueblo.","a":["ginen"],"hint":"ohi + izan en pasado, nosotros."},{"type":"choice","q":"«Suelo levantarme temprano»","options":["Goiz jaiki ohi naiz.","Goiz jaikitzen ohi naiz.","Goiz ohi jaiki naiz."],"a":0,"why":"Participio + ohi + auxiliar."},{"type":"choice","q":"«Está a punto de llover»","options":["Euria egitear dago.","Euria egiteko dago.","Euria egiten ari da."],"a":0,"why":"-tzear egon. Ari da = está lloviendo."},{"type":"choice","q":"«Tengo previsto ir»","options":["Joatekoa naiz.","Joateko naiz.","Joango naizekoa."],"a":0,"why":"-tzekoa izan."},{"type":"choice","q":"«Sigo estudiando»","options":["Ikasten jarraitzen dut.","Ikastea jarraitzen dut.","Ikasten jarraitzen naiz."],"a":0,"why":"-tzen jarraitu, con dut."},{"type":"choice","q":"«He ido muchas veces»","options":["Askotan joan izan naiz.","Askotan joan izan dut.","Askotan joaten izan naiz."],"a":0,"why":"joan va con izan."},{"type":"order","words":["naiz","ohi","jaiki","Goiz"],"a":["Goiz jaiki ohi naiz"],"es":"Suelo levantarme temprano.","hint":"Goiz + participio + ohi + naiz."},{"type":"order","words":["dago","irtetear","Trena"],"a":["Trena irtetear dago"],"es":"El tren está a punto de salir.","hint":"Sujeto + -tzear + dago."},{"type":"order","words":["dut","jarraitzen","ikasten","Euskara"],"a":["Euskara ikasten jarraitzen dut"],"es":"Sigo estudiando euskera.","hint":"Objeto + -tzen + jarraitzen dut."},{"type":"match","pairs":[["joan izan naiz","he ido (alguna vez)"],["jaiki ohi naiz","suelo levantarme"],["irtetear dago","está a punto de salir"],["joatekoa naiz","tengo previsto ir"],["ikasten jarraitu","seguir estudiando"],["halakorik","nada parecido"]]}],"create":{"prompt":"Escribe 6 frases sobre ti: algo que has hecho muchas veces, una costumbre (ohi), algo que solías hacer de pequeño, algo que tienes previsto hacer, algo que sigues haciendo y algo que has dejado de hacer.","focus":"izan izan, ohi, -tzear egon, -tzekoa izan, -tzen jarraitu, -tzen hasi, -tzeari utzi"},"links":{"verbs":[],"cases":[],"themes":["aditzak","denbora"]}},"b2-08":{"id":"b2-08","lvl":"B2","n":8,"title":"Partizipioa","es":"Los usos del participio","goal":"Usar el participio como adjetivo y como estado: «la ventana está abierta», «el pan comprado ayer», «se fue sin cenar».","explain":[{"h":"Antes de empezar","p":"El participio (**ikusi, egin, erosi**) es la forma que más has usado en el curso, siempre junto a un auxiliar. Pero también funciona solo, con pequeñas terminaciones, para describir estados y cosas. Dominar estos usos te permite construir frases compactas y naturales, muy típicas del euskera escrito."},{"h":"-ta / -da: estado resultante","p":"Participio + **-ta** (o **-da** tras n y l) + egon: **Leihoa irekita dago** (la ventana está abierta), **Afalduta nago** (ya he cenado), **Dena eginda dago** (todo está hecho), **Mahaia jarrita dago** (la mesa está puesta). En registros más formales verás **-rik** con el mismo valor: **bizirik** (vivo), **ezkondurik** (casado)."},{"h":"-tako / -dako: participio adjetivo","p":"Delante de un nombre, el participio + **-tako** (o **-dako** tras n) funciona como un relativo corto: **atzo erositako ogia** (el pan comprado ayer = el pan que compré ayer), **galdutako giltzak** (las llaves perdidas), **egindako lana** (el trabajo hecho). Con artículo, sin nombre: **Ikasitakoa ez da ahazten** (lo aprendido no se olvida)."},{"h":"-tu gabe: sin + infinitivo","p":"Participio + **gabe**: **Afaldu gabe joan zen** (se fue sin cenar), **Ezer esan gabe** (sin decir nada), **Ikasi gabe gainditu zuen** (aprobó sin estudiar)."},{"h":"Paso a paso: «Las fotos hechas en el viaje están en el ordenador»","p":"1) «hechas en el viaje»: **bidaian ateratako** (ateratu → ateratako). 2) Nombre: **argazkiak**. 3) Resto: **ordenagailuan daude**. → **Bidaian ateratako argazkiak ordenagailuan daude**."},{"h":"Errores típicos","p":"*Leihoa ireki da* para «está abierta» → **irekita dago**. *Egitako lana* → **egindako lana** (-dako tras n). *Afaltzen gabe* → **Afaldu gabe**. *Giltzak galdutako* → **galdutako giltzak** (delante del nombre)."},{"h":"Resumen","p":"**-ta / -da + egon** (estado: irekita dago), **-tako / -dako** (adjetivo: erositako ogia; sin nombre: ikasitakoa), **-tu gabe** (sin: afaldu gabe)."}],"examples":[["Leihoa irekita dago.","La ventana está abierta."],["Afalduta nago.","Ya he cenado."],["Atzo erositako ogia gogorra dago.","El pan comprado ayer está duro."],["Galdutako giltzak aurkitu ditut.","He encontrado las llaves perdidas."],["Ezer esan gabe joan zen.","Se fue sin decir nada."],["Dena eginda dago.","Todo está hecho."],["Ikasitakoa ez da ahazten.","Lo aprendido no se olvida."]],"dialog":{"title":"Antes de la cena","lines":[["Jon","Afaria prestatuta dago?","¿Está preparada la cena?"],["Ane","Bai, dena eginda dago. Mahaia ere jarrita dago.","Sí, todo está hecho. La mesa también está puesta."],["Jon","Primeran! Atzo erositako ardoa ireki dezakegu.","¡Estupendo! Podemos abrir el vino comprado ayer."],["Ane","Ados. Baina itxaron: Mikel oraindik ez da iritsi. Ezer esan gabe joan zen goizean.","Vale. Pero espera: Mikel todavía no ha llegado. Se fue esta mañana sin decir nada."],["Jon","Ez kezkatu, deituko diot.","No te preocupes, lo llamaré."]]},"exercises":[{"type":"gap","q":"Leihoa ireki___ dago.","es":"La ventana está abierta.","a":["ta"],"hint":"Estado: participio + -ta."},{"type":"gap","q":"Afaldu___ nago.","es":"Ya he cenado.","a":["ta"],"hint":"Estado: afalduta."},{"type":"gap","q":"Atzo erosi___ ogia gogorra dago.","es":"El pan comprado ayer está duro.","a":["tako"],"hint":"Delante del nombre: -tako."},{"type":"gap","q":"Dena egin___ dago.","es":"Todo está hecho.","a":["da"],"hint":"Tras n: -da."},{"type":"gap","q":"Ezer esan ___ joan zen.","es":"Se fue sin decir nada.","a":["gabe"],"hint":"sin + infinitivo = participio + gabe."},{"type":"gap","q":"Ikasitako___ ez da ahazten.","es":"Lo aprendido no se olvida.","a":["a"],"hint":"Sin nombre: -tako + artículo."},{"type":"choice","q":"«La ventana está abierta»","options":["Leihoa irekita dago.","Leihoa ireki da.","Leihoa irekitzen dago."],"a":0,"why":"Estado resultante: -ta + egon."},{"type":"choice","q":"«El trabajo hecho»","options":["egindako lana","egitako lana","lana egindako"],"a":0,"why":"Tras n: -dako, delante del nombre."},{"type":"choice","q":"«Se fue sin cenar»","options":["Afaldu gabe joan zen.","Afaltzen gabe joan zen.","Afaldu ez joan zen."],"a":0,"why":"Participio + gabe."},{"type":"choice","q":"«Las llaves perdidas»","options":["galdutako giltzak","giltzak galdutako","galdu giltzak"],"a":0,"why":"-tako delante del nombre."},{"type":"choice","q":"«Lo aprendido»","options":["ikasitakoa","ikasitako","ikastea"],"a":0,"why":"Sin nombre: -tako + -a."},{"type":"order","words":["dago","irekita","Leihoa"],"a":["Leihoa irekita dago"],"es":"La ventana está abierta.","hint":"Sujeto + -ta + dago."},{"type":"order","words":["ogia","erositako","Atzo"],"a":["Atzo erositako ogia"],"es":"El pan comprado ayer.","hint":"Tiempo + -tako + nombre."},{"type":"order","words":["zen","joan","gabe","esan","Ezer"],"a":["Ezer esan gabe joan zen"],"es":"Se fue sin decir nada.","hint":"Ezer esan gabe + joan zen."},{"type":"match","pairs":[["irekita","abierto"],["eginda","hecho"],["afalduta","ya cenado"],["erositako","comprado (delante del nombre)"],["esan gabe","sin decir"],["ikasitakoa","lo aprendido"]]}],"create":{"prompt":"Describe en 5 frases cómo está tu casa en este momento (qué está abierto, cerrado, hecho o por hacer) y menciona dos cosas que compraste o hiciste recientemente usando -tako.","focus":"-ta/-da + egon, -tako/-dako, -tu gabe"},"links":{"verbs":[],"cases":[],"themes":["etxea","aditzak"]}},"b2-09":{"id":"b2-09","lvl":"B2","n":9,"title":"Perpaus luzeak","es":"Relativos largos y aposición","goal":"Describir personas y cosas con varias informaciones a la vez sin perder claridad.","explain":[{"h":"Antes de empezar","p":"En el habla y en la escritura de nivel alto aparecen frases con mucha información sobre un mismo nombre: «el escritor que conocí ayer y que vive en Bilbao». El relativo vasco (oración delante del nombre) puede volverse pesado si se alarga demasiado. En esta lección aprendes a encadenarlo bien y conoces las alternativas que usan los buenos escritores."},{"h":"Dos relativos para un nombre","p":"Se unen con **eta** delante del nombre: **Atzo ezagutu nuen eta Bilbon bizi den idazlea** (el escritor que conocí ayer y que vive en Bilbao). Cada oración lleva su -n."},{"h":"El relativo explicativo: detrás y entre comas","p":"Cuando la información es un añadido (en español, entre comas), el euskera pone el relativo **detrás del nombre**, con artículo y entre comas: **Idazlea, Bilbon bizi dena, gaur etorriko da** (el escritor, que vive en Bilbao, vendrá hoy). Si el nombre lleva caso, el añadido también: **Idazleari, Bilbon bizi denari, deitu diot**."},{"h":"La aposición","p":"Para explicar quién es alguien basta con poner otro nombre al lado, entre comas, con el mismo caso: **Mikel, nire laguna, medikua da** (Mikel, mi amigo, es médico). **Mikeli, nire lagunari, opari bat eman diot** (a Mikel, mi amigo, le he dado un regalo)."},{"h":"Consejos de estilo","p":"1) Si el relativo es muy largo, **divide en dos frases**: es lo más natural en euskera. 2) A veces una palabra con **-ko** sustituye a todo un relativo: **Bilboko idazlea** en lugar de *Bilbon bizi den idazlea*. 3) Evita el calco del castellano con **zein** (*idazlea, zeinak Bilbon bizi den…*): aunque aparece en algunos textos, se considera poco natural."},{"h":"Paso a paso: «Ane, mi prima, se casó con un chico que conocimos en Londres el año pasado»","p":"1) Aposición: **Ane, nire lehengusina,**. 2) Relativo en pasado delante del nombre: **iaz Londresen ezagutu genuen mutil batekin**. 3) Verbo: **ezkondu zen**. → **Ane, nire lehengusina, iaz Londresen ezagutu genuen mutil batekin ezkondu zen**."},{"h":"Errores típicos","p":"*Idazlea atzo ezagutu nuen eta Bilbon bizi da* → **Atzo ezagutu nuen eta Bilbon bizi den idazlea**. *Mikeli, nire laguna, …* → **nire lagunari** (mismo caso). *Mikel, Bilbon bizi den, …* → **bizi dena** (el explicativo lleva artículo)."},{"h":"Resumen","p":"Varios relativos: **… -n eta … -n + nombre**. Explicativo: **nombre, … -na,** (con el mismo caso). Aposición: **Mikel, nire laguna,**. Estilo: frases más cortas, **-ko** en lugar de relativos, evitar **zein**."}],"examples":[["Atzo ezagutu nuen eta Bilbon bizi den idazlea oso jatorra da.","El escritor que conocí ayer y que vive en Bilbao es muy majo."],["Mikel, nire lagunik onena, medikua da.","Mikel, mi mejor amigo, es médico."],["Mikeli, nire lagunari, opari bat eman diot.","A Mikel, mi amigo, le he dado un regalo."],["Idazlea, Bilbon bizi dena, gaur etorriko da.","El escritor, que vive en Bilbao, vendrá hoy."],["Gustatzen zaizkidan eta merkeak diren liburuak erosten ditut.","Compro los libros que me gustan y que son baratos."],["Hau da Euskal Herriko herririk politena.","Este es el pueblo más bonito de Euskal Herria."]],"dialog":{"title":"Una foto de familia","lines":[["Jon","Nor da argazkian dagoen neska hori?","¿Quién es esa chica que está en la foto?"],["Ane","Miren da, nire lehengusina. Iaz Londresen ezagutu genuen mutil batekin ezkondu zen.","Es Miren, mi prima. Se casó con un chico que conocimos en Londres el año pasado."],["Jon","Eta mutila, Londresen bizi zena, orain hemen bizi da?","¿Y el chico, que vivía en Londres, ahora vive aquí?"],["Ane","Bai, Donostian bizi dira biak, hondartzatik hurbil dagoen etxe txiki batean.","Sí, viven los dos en San Sebastián, en una casa pequeña que está cerca de la playa."]]},"exercises":[{"type":"gap","q":"Atzo ezagutu nuen ___ Bilbon bizi den idazlea.","es":"El escritor que conocí ayer y que vive en Bilbao.","a":["eta"],"hint":"Dos relativos se unen con eta."},{"type":"gap","q":"Mikel, nire lagunik ___, medikua da.","es":"Mikel, mi mejor amigo, es médico.","a":["onena"],"hint":"el mejor = onena."},{"type":"gap","q":"Mikeli, nire laguna___, opari bat eman diot.","es":"A Mikel, mi amigo, le he dado un regalo.","a":["ri"],"hint":"La aposición lleva el mismo caso: lagunari."},{"type":"gap","q":"Idazlea, Bilbon bizi ___, gaur etorriko da.","es":"El escritor, que vive en Bilbao, vendrá hoy.","a":["dena"],"hint":"Explicativo detrás del nombre: -n + -a."},{"type":"gap","q":"Hondartzatik hurbil ___ etxe txiki bat.","es":"Una casa pequeña que está cerca de la playa.","a":["dagoen"],"hint":"Relativo de dago."},{"type":"gap","q":"Gustatzen zaizkidan eta merkeak ___ liburuak.","es":"Los libros que me gustan y que son baratos.","a":["diren"],"hint":"Relativo de dira."},{"type":"choice","q":"«El escritor que conocí ayer y que vive en Bilbao»","options":["atzo ezagutu nuen eta Bilbon bizi den idazlea","idazlea atzo ezagutu nuen eta Bilbon bizi da","atzo ezagutu nuen idazlea eta Bilbon bizi den"],"a":0,"why":"Las dos oraciones van delante del nombre, unidas con eta."},{"type":"choice","q":"«A Mikel, mi amigo, …»","options":["Mikeli, nire lagunari,","Mikeli, nire laguna,","Mikel, nire lagunari,"],"a":0,"why":"La aposición repite el caso."},{"type":"choice","q":"«Mikel, que vive en Bilbao, …» (explicativo)","options":["Mikel, Bilbon bizi dena,","Mikel, Bilbon bizi den,","Mikel, zeinak Bilbon bizi den,"],"a":0,"why":"Explicativo: detrás, con artículo y entre comas."},{"type":"choice","q":"Con un relativo muy largo, lo más natural es…","options":["dividir en dos frases","usar siempre «zein»","poner el relativo detrás sin artículo"],"a":0,"why":"El euskera prefiere frases más cortas."},{"type":"choice","q":"«El pueblo más bonito»","options":["herririk politena","politena herria","herri politenik"],"a":0,"why":"Superlativo con partitivo: herririk politena."},{"type":"order","words":["da","medikua","Mikel","laguna","nire"],"a":["Mikel nire laguna medikua da"],"es":"Mikel, mi amigo, es médico.","hint":"Nombre + aposición + resto."},{"type":"order","words":["dagoen","hurbil","etxea","Hondartzatik"],"a":["Hondartzatik hurbil dagoen etxea"],"es":"La casa que está cerca de la playa.","hint":"Relativo + nombre."},{"type":"order","words":["dena","bizi","Bilbon","Idazlea"],"a":["Idazlea Bilbon bizi dena"],"es":"El escritor, que vive en Bilbao.","hint":"Nombre + explicativo con -na."},{"type":"match","pairs":[["Bilbon bizi den idazlea","el escritor que vive en Bilbao"],["Mikel, nire laguna","Mikel, mi amigo"],["Mikeli, nire lagunari","a Mikel, mi amigo"],["Bilbon bizi dena","que vive en Bilbao (explicativo)"],["herririk politena","el pueblo más bonito"],["bizi zena","que vivía"]]}],"create":{"prompt":"Describe a tres personas importantes de tu vida en una o dos frases cada una, usando aposición, relativos encadenados con eta y algún relativo explicativo.","focus":"relativos coordinados, relativo explicativo -na entre comas, aposición con caso, estilo"},"links":{"verbs":[],"cases":[],"themes":["familia","pertsonak"]}},"b2-10":{"id":"b2-10","lvl":"B2","n":10,"title":"Galdegaia","es":"El foco y el orden de palabras","goal":"Destacar la información importante colocando cada palabra en su sitio.","explain":[{"h":"Antes de empezar","p":"Desde la lección A1-04 sabes que la palabra interrogativa va justo delante del verbo. Esa regla es un caso particular de algo más general y muy característico del euskera: **lo que se destaca (el foco, galdegaia) va inmediatamente antes del verbo**. Entender esto cambia la forma en que lees y suenas."},{"h":"El foco: justo antes del verbo","p":"**Mikelek liburua erosi du** responde a «¿qué ha comprado Mikel?» (foco: el libro). **Liburua Mikelek erosi du** responde a «¿quién ha comprado el libro?» (foco: Mikel). La pregunta y la respuesta usan el mismo hueco: **Nork erosi du liburua? — Mikelek erosi du**. Lo demás (el tema conocido) puede ir delante o detrás."},{"h":"Cuando el foco es el verbo: egin","p":"Si lo que se destaca es la acción misma, se repite con **egin**: **Erosi egin dut, ez lapurtu** (lo he comprado, no robado). **Etorri egingo naiz!** (¡que sí vendré!). Con **egin** como verbo principal: **Egin egin du** (sí que lo ha hecho)."},{"h":"En negativas: baizik","p":"En negativas, el auxiliar va pegado a **ez** y el foco suele ir después: **Ez da gaur etorriko, bihar baizik** (no vendrá hoy, sino mañana). **baizik** = sino. También: **Gaur ez, bihar etorriko da**."},{"h":"El tema: al principio","p":"Lo que ya es conocido, el tema del que hablas (**mintzagaia**), suele ir al principio. En registro formal: **Proiektuari dagokionez, …** (en cuanto al proyecto, …). Partículas que acompañan al foco: **ere** (también), **bakarrik** (solo), **behintzat** (al menos): **Nik behintzat ez dut ulertu**."},{"h":"Paso a paso: «Fue Ane quien trajo la tarta (y la hizo ella)»","p":"1) Foco en quién: **Anek** justo antes del verbo → **Tarta Anek ekarri du**. 2) Foco en la acción «hacer» (no comprar): **egin egin du**. → **Tarta Anek ekarri du, eta egin egin du, ez erosi**."},{"h":"Errores típicos","p":"*Nork liburua erosi du?* → **Nork erosi du liburua?** (nada entre la interrogativa y el verbo). *Erosi du egin* → **Erosi egin du**. *Gaur ez, baina bihar* para «no hoy, sino mañana» → **gaur ez, bihar baizik**."},{"h":"Resumen","p":"Foco (**galdegaia**) = justo antes del verbo. Foco en el verbo: **participio + egin**. Negativa: **ez + auxiliar**, y **baizik** (sino). Tema (**mintzagaia**) al principio: **… dagokionez**."}],"examples":[["Mikelek erosi du liburua.","Ha sido Mikel quien ha comprado el libro."],["Liburua Mikelek erosi du.","El libro lo ha comprado Mikel."],["Nork erosi du liburua? Mikelek.","¿Quién ha comprado el libro? Mikel."],["Ez da gaur etorriko, bihar baizik.","No vendrá hoy, sino mañana."],["Erosi egin dut, ez lapurtu.","Lo he comprado, no robado."],["Etorri egingo naiz!","¡Que sí vendré!"],["Nik behintzat ez dut ulertu.","Yo, al menos, no lo he entendido."]],"dialog":{"title":"La tarta","lines":[["Iker","Nork ekarri du tarta hau?","¿Quién ha traído esta tarta?"],["Nerea","Anek ekarri du. Berak egin du, gainera.","La ha traído Ane. La ha hecho ella, además."],["Iker","Benetan? Erosi egin duela uste nuen!","¿De verdad? ¡Creía que la había comprado!"],["Nerea","Ez, ez du erosi; egin egin du. Oso sukaldari ona da.","No, no la ha comprado; la ha hecho. Es muy buena cocinera."],["Iker","Orduan, Aneri eskatuko diot errezeta.","Entonces le pediré la receta a Ane."]]},"exercises":[{"type":"gap","q":"Nork erosi du liburua? — Mikel___ erosi du.","es":"¿Quién ha comprado el libro? — Mikel.","a":["ek"],"hint":"Respuesta en el hueco del foco, con -k."},{"type":"gap","q":"Erosi ___ dut, ez lapurtu.","es":"Lo he comprado, no robado.","a":["egin"],"hint":"Foco en el verbo: participio + egin."},{"type":"gap","q":"Ez da gaur etorriko, bihar ___.","es":"No vendrá hoy, sino mañana.","a":["baizik"],"hint":"sino = baizik."},{"type":"gap","q":"Etorri ___ naiz!","es":"¡Que sí vendré!","a":["egingo"],"hint":"Foco en el verbo, futuro: egingo."},{"type":"gap","q":"___ erosi du liburua?","es":"¿Quién ha comprado el libro?","a":["nork"],"hint":"Sujeto con objeto: nork."},{"type":"gap","q":"Nik ___ ez dut ulertu.","es":"Yo, al menos, no lo he entendido.","a":["behintzat"],"hint":"al menos = behintzat."},{"type":"choice","q":"«Ha sido MIKEL quien ha comprado el libro»","options":["Liburua Mikelek erosi du.","Mikelek liburua erosi du.","Erosi du Mikelek liburua."],"a":0,"why":"El foco (Mikelek) va justo antes del verbo."},{"type":"choice","q":"Respuesta a «¿Quién ha traído la tarta?»","options":["Anek ekarri du.","Ekarri du Anek.","Ane ekarri du."],"a":0,"why":"Foco antes del verbo, con -k."},{"type":"choice","q":"«Lo ha COMPRADO (no robado)»","options":["Erosi egin du.","Erosi du egin.","Egin erosi du."],"a":0,"why":"Participio + egin + auxiliar."},{"type":"choice","q":"«No hoy, sino mañana»","options":["gaur ez, bihar baizik","gaur ez, baina bihar","gaur ez, bihar ere"],"a":0,"why":"sino = baizik."},{"type":"choice","q":"¿Dónde va el foco?","options":["justo antes del verbo","al final de la frase","siempre al principio"],"a":0,"why":"Regla del galdegaia."},{"type":"order","words":["erosi","du","Mikelek","Liburua"],"a":["Liburua Mikelek erosi du"],"es":"El libro lo ha comprado Mikel.","hint":"Tema + foco + verbo."},{"type":"order","words":["dut","egin","Erosi"],"a":["Erosi egin dut"],"es":"Lo he comprado (foco en la acción).","hint":"Participio + egin + auxiliar."},{"type":"order","words":["baizik","bihar","etorriko","gaur","ez","da"],"a":["Ez da gaur etorriko bihar baizik"],"es":"No vendrá hoy, sino mañana.","hint":"Ez da + foco negado + verbo + … baizik."},{"type":"match","pairs":[["galdegaia","foco"],["mintzagaia","tema"],["baizik","sino"],["erosi egin du","lo ha comprado (foco en la acción)"],["… dagokionez","en cuanto a…"],["behintzat","al menos"]]}],"create":{"prompt":"Escribe 5 pares de pregunta y respuesta sobre tu semana en los que el foco cambie (quién, qué, dónde, cuándo) y añade una frase con foco en el verbo (… egin …).","focus":"galdegaia antes del verbo, foco verbal con egin, baizik, mintzagaia"},"links":{"verbs":[],"cases":[],"themes":["galderak","lokailuak"]}},"b2-11":{"id":"b2-11","lvl":"B2","n":11,"title":"Kausa eta ondorioa","es":"Causa y consecuencia","goal":"Explicar causas y consecuencias con variedad: como, ya que, pues, así que, por lo tanto, tan… que.","explain":[{"h":"Antes de empezar","p":"Para explicar el porqué ya conoces **-lako** y **horregatik**. En textos y conversaciones de nivel alto se usan otras formas que aportan matices: **-(e)nez** para presentar una causa conocida, **bait-** para justificar en registro cuidado y varios conectores de consecuencia. Variar estas formas hace que tu euskera suene mucho más natural."},{"h":"-(e)nez: como, ya que","p":"Relativo + **-ez**. Presenta una causa que el oyente ya conoce o acepta, normalmente al principio: **Berandu denez, etxera noa** (como es tarde, me voy a casa). **Euria ari duenez, ez gara aterako** (como llueve, no saldremos)."},{"h":"bait-: pues, ya que (registro cuidado)","p":"Prefijo que se pega al auxiliar en la segunda oración, típico de la escritura: **Ez naiz joango, nekatuta bainago** (no iré, pues estoy cansado). Al unirse, el auxiliar cambia un poco: **bait + da → baita**, **bait + dut → baitut**, **bait + du → baitu**, **bait + nago → bainago**, **bait + gara → baikara**, **bait + daukat → baitaukat**, **bait + zen → baitzen**."},{"h":"Consecuencia","p":"**beraz** (así que, por lo tanto): **Lan asko daukat; beraz, ezin naiz etorri**. **ondorioz** (como consecuencia): **Euri asko egin du; ondorioz, ibaia gainezka dago**. **horregatik** (por eso). Para «tan… que»: **hain … non** + bait-: **Hain da garestia, non inork ez baitu erosten** (es tan caro que nadie lo compra)."},{"h":"Paso a paso: «Como el tren llevaba retraso, llegué tarde»","p":"1) Causa conocida: **trenak atzerapena zuen** → relativo **zuen** + -ez → **zuenez**. 2) Consecuencia: **berandu iritsi nintzen**. → **Trenak atzerapena zuenez, berandu iritsi nintzen**."},{"h":"Errores típicos","p":"*Berandu dela, etxera noa* → **denez**. *Lan asko daukatbait* → **lan asko baitaukat** (el prefijo va delante del auxiliar). *baitda* → **baita**. *Horregatik ez, naiz etorri* → **Horregatik ez naiz etorri**."},{"h":"Resumen","p":"Causa: **-lako** (porque), **-(e)nez** (como, ya que), **bait-** (pues; baita, baitut, bainago…). Consecuencia: **beraz, ondorioz, horregatik**, **hain … non … bait-**."}],"examples":[["Berandu denez, etxera noa.","Como es tarde, me voy a casa."],["Euria ari duenez, ez gara aterako.","Como llueve, no saldremos."],["Ez naiz joango, nekatuta bainago.","No iré, pues estoy cansado."],["Lan asko daukat; beraz, ezin naiz etorri.","Tengo mucho trabajo; así que no puedo venir."],["Euri asko egin du; ondorioz, ibaia gainezka dago.","Ha llovido mucho; como consecuencia, el río se ha desbordado."],["Hain da garestia, non inork ez baitu erosten.","Es tan caro que nadie lo compra."],["Gaixorik zegoelako ez zen etorri.","No vino porque estaba enfermo."]],"dialog":{"title":"Después de la reunión","lines":[["Ane","Zergatik ez zara bilerara etorri?","¿Por qué no has venido a la reunión?"],["Iker","Trenak atzerapena zuenez, berandu iritsi nintzen.","Como el tren llevaba retraso, llegué tarde."],["Ane","Ulertzen dut. Bilera garrantzitsua zen; beraz, laburpen bat bidaliko dizut.","Lo entiendo. La reunión era importante; así que te enviaré un resumen."],["Iker","Eskerrik asko. Gaur ezin dut irakurri, lan asko baitaukat.","Gracias. Hoy no puedo leerlo, pues tengo mucho trabajo."],["Ane","Ez dago presarik. Bihar irakur dezakezu.","No hay prisa. Puedes leerlo mañana."]]},"exercises":[{"type":"gap","q":"Berandu ___, etxera noa.","es":"Como es tarde, me voy a casa.","a":["denez"],"hint":"da → den → denez."},{"type":"gap","q":"Euria ari ___, ez gara aterako.","es":"Como llueve, no saldremos.","a":["duenez"],"hint":"du → duen → duenez."},{"type":"gap","q":"Ez naiz joango, nekatuta ___.","es":"No iré, pues estoy cansado.","a":["bainago"],"hint":"bait + nago → bainago."},{"type":"gap","q":"Lan asko daukat; ___, ezin naiz etorri.","es":"Tengo mucho trabajo; así que no puedo venir.","a":["beraz"],"hint":"así que = beraz."},{"type":"gap","q":"Euri asko egin du; ___, ibaia gainezka dago.","es":"Ha llovido mucho; como consecuencia, el río se ha desbordado.","a":["ondorioz"],"hint":"como consecuencia = ondorioz."},{"type":"gap","q":"Hain da garestia, non inork ez ___ erosten.","es":"Es tan caro que nadie lo compra.","a":["baitu"],"hint":"bait + du → baitu."},{"type":"choice","q":"«Como es tarde, me voy a casa»","options":["Berandu denez, etxera noa.","Berandu dela, etxera noa.","Berandu delako ez, etxera noa."],"a":0,"why":"Causa conocida: -(e)nez."},{"type":"choice","q":"«…pues tengo mucho trabajo»","options":["lan asko baitaukat","lan asko daukatbait","bait lan asko daukat"],"a":0,"why":"bait- va pegado delante del auxiliar."},{"type":"choice","q":"«Como consecuencia»","options":["ondorioz","arren","bitartean"],"a":0,"why":"arren = aunque; bitartean = mientras."},{"type":"choice","q":"bait- + da:","options":["baita","baitda","bada"],"a":0,"why":"bait + da → baita."},{"type":"choice","q":"«Así que no puedo venir»","options":["beraz, ezin naiz etorri","horregatik ez, naiz etorri","beraz ezin etorri naiz"],"a":0,"why":"Conector + ezin + auxiliar + participio."},{"type":"order","words":["noa","etxera","denez","Berandu"],"a":["Berandu denez etxera noa"],"es":"Como es tarde, me voy a casa.","hint":"Causa con -nez + principal."},{"type":"order","words":["bainago","nekatuta","joango","naiz","Ez"],"a":["Ez naiz joango nekatuta bainago"],"es":"No iré, pues estoy cansado.","hint":"Principal + causa con bait-."},{"type":"order","words":["etorri","naiz","ezin","Beraz"],"a":["Beraz ezin naiz etorri"],"es":"Así que no puedo venir.","hint":"Beraz + ezin naiz + participio."},{"type":"match","pairs":[["-lako","porque"],["-(e)nez","como, ya que"],["bait-","pues (registro cuidado)"],["beraz","así que"],["ondorioz","como consecuencia"],["hain … non","tan … que"]]}],"create":{"prompt":"Escribe un párrafo de 5 o 6 frases explicando una decisión reciente (un cambio de trabajo, un viaje, empezar a estudiar euskera): sus causas y sus consecuencias, con al menos cuatro formas distintas.","focus":"-lako, -(e)nez, bait-, beraz, ondorioz, horregatik, hain … non"},"links":{"verbs":[],"cases":[],"themes":["lokailuak"]}},"b2-12":{"id":"b2-12","lvl":"B2","n":12,"title":"Testu-antolatzaileak","es":"Conectores para escribir","goal":"Organizar un texto escrito con conectores de orden, adición, contraste, ejemplo, explicación y conclusión.","explain":[{"h":"Antes de empezar","p":"Escribir bien en euskera no depende solo de la gramática: un texto se entiende cuando sus ideas están conectadas. En esta lección reúnes los conectores (testu-antolatzaileak) que dan estructura a redacciones, correos y exámenes. Es la lección más directamente útil para las pruebas oficiales de B2."},{"h":"Los conectores por función","table":{"head":["Función","Conectores","Ejemplo"],"rows":[["Orden","lehenik, bigarrenik, azkenik","**Lehenik**, arazoa azalduko dut."],["Adición","gainera, horrez gain, baita… ere","**Gainera**, oso garestia da."],["Contraste","baina, hala ere, aldiz, ordea","Bilbo handia da; Getxo, **aldiz**, txikia."],["Ejemplo","adibidez, esaterako","Hizkuntza asko daki, **esaterako**, frantsesa."],["Explicación","hau da, alegia","Euskaldun berria da, **hau da**, helduaroan ikasi du."],["Consecuencia","beraz, ondorioz","**Beraz**, ezin naiz etorri."],["Conclusión","laburbilduz, azken batean","**Laburbilduz**, proiektua ona da."]]}},{"h":"Dónde se colocan","p":"La mayoría van al principio de la frase, seguidos de coma. Dos excepciones importantes: **aldiz** y **ordea** suelen ir **después del primer elemento**: **Getxo, aldiz, txikia da**; **Nik, ordea, ez dut horrela uste** (yo, sin embargo, no lo creo así). Y **baita… ere**: **Baita nik ere** (yo también)."},{"h":"Estructura de una redacción","p":"1) **Sarrera** (introducción): presenta el tema. 2) **Garapena** (desarrollo): un párrafo por idea, cada uno con su conector. 3) **Ondorioa** (conclusión): resume y da tu opinión. Para opinar, recuerda la lección B1-15 (**nire ustez**, **alde batetik… bestetik**)."},{"h":"Paso a paso: un párrafo de desarrollo","p":"**Lehenik, telelanak denbora aurrezten du: ez da lanera joan behar.** **Gainera, familiarekin denbora gehiago pasatzen da.** **Bestetik, ordea, bakarrik lan egiten da, eta hori gogorra izan daiteke.** Fíjate en cómo cada conector anuncia la función de la frase."},{"h":"Errores típicos","p":"Abusar de **eta** y **baina** en lugar de variar. *Ordea, nik ez dut uste* → **Nik, ordea, ez dut uste**. *Adibidez* y *esaterako* son intercambiables, pero *alegia* no significa «por ejemplo» sino «es decir». *Laburbilduz* al principio del texto → se usa en la conclusión."},{"h":"Resumen","p":"Orden: **lehenik, bigarrenik, azkenik** · Adición: **gainera, horrez gain** · Contraste: **hala ere, aldiz, ordea** · Ejemplo: **adibidez, esaterako** · Explicación: **hau da, alegia** · Conclusión: **laburbilduz, azken batean**."}],"examples":[["Lehenik, arazoa azalduko dut.","En primer lugar, explicaré el problema."],["Gainera, oso garestia da.","Además, es muy caro."],["Bilbo handia da; Getxo, aldiz, txikia.","Bilbao es grande; Getxo, en cambio, pequeño."],["Nik, ordea, ez dut horrela uste.","Yo, sin embargo, no lo creo así."],["Hainbat hizkuntza hitz egiten ditu, esaterako, frantsesa eta ingelesa.","Habla varios idiomas, por ejemplo, francés e inglés."],["Euskaldun berria da, hau da, helduaroan ikasi du euskara.","Es euskaldun berri, es decir, ha aprendido euskera de adulto."],["Laburbilduz, proiektua ona da.","En resumen, el proyecto es bueno."]],"dialog":{"title":"Preparando una redacción","lines":[["Nerea","Nola hasiko dugu idazlana?","¿Cómo empezaremos la redacción?"],["Jon","Lehenik, gaia aurkeztuko dugu: telelanaren abantailak eta desabantailak.","En primer lugar, presentaremos el tema: las ventajas y desventajas del teletrabajo."],["Nerea","Ados. Alde batetik, denbora aurrezten da; bestetik, ordea, bakarrik lan egiten da.","De acuerdo. Por un lado, se ahorra tiempo; por otro, sin embargo, se trabaja solo."],["Jon","Ondo. Gainera, adibide batzuk jarri behar ditugu, esaterako, gure gurasoen esperientzia.","Bien. Además, tenemos que poner algunos ejemplos, por ejemplo, la experiencia de nuestros padres."],["Nerea","Eta amaieran, laburbilduz, gure iritzia emango dugu.","Y al final, en resumen, daremos nuestra opinión."]]},"exercises":[{"type":"gap","q":"___, arazoa azalduko dut.","es":"En primer lugar, explicaré el problema.","a":["lehenik"],"hint":"en primer lugar = lehenik."},{"type":"gap","q":"___, oso garestia da.","es":"Además, es muy caro.","a":["gainera"],"hint":"además = gainera."},{"type":"gap","q":"Bilbo handia da; Getxo, ___, txikia.","es":"Bilbao es grande; Getxo, en cambio, pequeño.","a":["aldiz"],"hint":"en cambio = aldiz."},{"type":"gap","q":"Nik, ___, ez dut horrela uste.","es":"Yo, sin embargo, no lo creo así.","a":["ordea"],"hint":"sin embargo (tras el primer elemento) = ordea."},{"type":"gap","q":"___, proiektua ona da.","es":"En resumen, el proyecto es bueno.","a":["laburbilduz"],"hint":"en resumen = laburbilduz."},{"type":"gap","q":"Euskaldun berria da, ___ da, helduaroan ikasi du.","es":"Es euskaldun berri, es decir, lo ha aprendido de adulto.","a":["hau"],"hint":"es decir = hau da."},{"type":"choice","q":"«En cambio»","options":["aldiz","adibidez","azkenik"],"a":0,"why":"Contraste: aldiz."},{"type":"choice","q":"«Por ejemplo»","options":["esaterako","ordea","hau da"],"a":0,"why":"Ejemplo: esaterako (o adibidez)."},{"type":"choice","q":"«Es decir»","options":["alegia","gainera","beraz"],"a":0,"why":"Explicación: alegia (o hau da)."},{"type":"choice","q":"«En resumen»","options":["laburbilduz","lehenik","bestela"],"a":0,"why":"Conclusión: laburbilduz."},{"type":"choice","q":"¿Dónde suele ir «ordea»?","options":["tras el primer elemento","siempre al principio","siempre al final"],"a":0,"why":"Nik, ordea, …"},{"type":"order","words":["txikia","aldiz","Getxo"],"a":["Getxo aldiz txikia"],"es":"Getxo, en cambio, pequeño.","hint":"Primer elemento + aldiz + resto.
